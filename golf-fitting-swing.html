<!DOCTYPE html>

<head>

<meta name="description" content="Foresight Sports PEAK 프로그램 기반 Swing Fitting으로 발사각·스핀율·볼스피드부터 임팩트 데이터까지 정밀 분석해 장비를 최적화합니다.">

</head>

<div id="app"></div>
<script src="assets/core.js"></script>
<script>
const DOC_TITLE = { ko:`Swing Fitting | 3F 골프피팅 | BizHub Mir`, en:`Swing Fitting | 3F Golf Fitting | BizHub Mir` };

T.ko.fittingSwing = {
  pageEyebrow:`3F 골프피팅 · Swing Fitting`, pageTitle:`Foresight Sports PEAK 프로그램 기반 정밀 스윙 피팅`,
  pageDesc:`Foresight Sports의 PEAK(Performance Enhancement and Advanced Knowledge) 트레이닝 프로그램을 기반으로 하는 Swing Fitting(Data-Driven Fitting 또는 Ball Flight Fitting이라고도 불립니다)은, 정밀한 발사모니터 데이터를 활용해 선수 각자의 실제 특성에 맞게 장비를 최적화하는 것을 말합니다.`,
  backLink:`← 피팅 서비스 전체 보기`,

  metricsEyebrow:`1. Key Metrics`, metricsTitle:`PEAK Swing Fitting에서 분석하는 핵심 지표`,
  metricsDesc:`PEAK 공인 피터는 클럽이 골퍼의 스윙에서 어떻게 반응하는지 이해하기 위해 특정 데이터 포인트를 살펴봅니다. 피팅 과정은 일반적으로 세 가지 핵심 카테고리에 초점을 맞춥니다.`,

  aT:`A. 볼 플라이트 최적화 ("빅 3")`,
  a_li1:`발사각(Launch Angle) — 볼이 최적의 구간으로 날아갈 수 있는 로프트와 샤프트 플렉스 조합을 찾습니다.`,
  a_li2:`스핀율(Spin Rate) — 비거리와 컨트롤을 결정짓습니다. 스핀이 높으면 볼이 뜬 뒤 비거리를 잃고, 낮으면 조기에 떨어집니다. 피터는 클럽헤드의 무게중심(CG)과 샤프트 프로파일을 조정해 스핀을 정밀 조정합니다.`,
  a_li3:`볼 스피드(Ball Speed) — 에너지 전달의 궁극적인 지표입니다. 볼 스피드를 극대화하려면 클럽헤드 무게와 샤프트 길이의 "스윗스팟"을 찾아야 합니다.`,

  bT:`B. 클럽-볼 딜리버리 (임팩트)`,
  b_li1:`클럽 페이스 & 페이스 앵글 — PEAK는 페이스 앵글이 볼의 초기 방향을 결정한다고 강조합니다. 피팅에서는 다양한 무게와 라이 각도를 활용해 선수가 더 자연스럽게 페이스를 스퀘어로 맞출 수 있도록 돕습니다.`,
  b_li2:`어택 앵글(AoA) — 선수가 볼을 쓸어 치는지(양수) 찍어 치는지(음수)에 따라 필요한 최적 로프트가 달라집니다. 예를 들어 드라이버에서 다운 블로우(음수 AoA)라면 발사각을 최적화하기 위해 더 높은 로프트의 헤드가 필요합니다.`,
  b_li3:`임팩트 위치(스매시 팩터) — 클럽헤드 데이터를 활용해 피터는 선수가 페이스의 어느 지점에서 볼을 맞히는지 확인합니다. 토우나 힐 쪽으로 지속적으로 맞는다면, 샤프트 길이·무게·라이 각도를 바꿔 임팩트 지점을 즉시 중앙으로 되돌릴 수 있습니다.`,

  procEyebrow:`2. PEAK Process`, procTitle:`PEAK Swing Fitting 프로세스`,
  procDesc:`PEAK 가이드라인을 따르는 표준 피팅은 체계적이고 과학적인 워크플로우를 따릅니다.`,
  p1t:`베이스라인 테스트`, p1d:`선수가 현재 사용 중인 클럽으로 샷을 쳐서 데이터 베이스라인을 설정합니다. 피터는 "퍼포먼스 갭"(예: 스핀이 너무 높거나 분산이 너무 큰 경우)을 파악합니다.`,
  p2t:`변인 분리`, p2d:`피터는 한 번에 한 가지 요소만 변경합니다. 헤드는 발사각·스핀·시각적 신뢰감을 조정하기 위해, 샤프트는 타이밍·피드백·탄도·토크(임팩트 시 휘는 정도)를 최적화하기 위해 바꿉니다.`,
  p3t:`"갭" 분석`, p3d:`풀백 피팅에서 PEAK는 Distance Gapping을 강조합니다. 피터는 백 안의 모든 클럽 사이에 일관된 비거리 간격이 있는지 확인하여, 코스에서 추측이 없도록 합니다.`,
  p4t:`검증`, p4d:`피터는 새 클럽의 데이터를 베이스라인과 비교합니다. 더 좋은 분산, 최적화된 발사각/스핀 구간, 향상된 비거리 또는 정확도가 데이터로 확인되면 성공으로 판단합니다.`,

  garminEyebrow:`3. Real-World Data`, garminTitle:`Garmin R50를 활용한 실제 데이터 분석`,
  garminSub:`Garmin Approach® R50`,
  garminPh:`발사모니터 데이터 예시`,
  garminDesc:`Face to Path, Club Path, Attack Angle, Spin Rate 등 임팩트의 모든 순간을 정밀 측정하는 런치모니터로, 실제 세션에서는 이 데이터를 바탕으로 헤드·샤프트·로프트 조합을 그 자리에서 바로 비교해 드립니다.`,

  closingText:`실제 피팅 세션에서는 베이스라인부터 최종 스펙까지, 모든 변화를 발사모니터 데이터로 직접 비교해서 보여드립니다.`,
};
T.en.fittingSwing = {
  pageEyebrow:`3F Golf Fitting · Swing Fitting`, pageTitle:`Precision swing fitting built on the Foresight Sports PEAK program`,
  pageDesc:`Built on Foresight Sports' PEAK (Performance Enhancement and Advanced Knowledge) training program, Swing Fitting — also known as Data-Driven Fitting or Ball Flight Fitting — uses precise launch-monitor data to optimize equipment to each player's real, individual characteristics.`,
  backLink:`← View All Fitting Services`,

  metricsEyebrow:`1. Key Metrics`, metricsTitle:`Core Metrics Analyzed in PEAK Swing Fitting`,
  metricsDesc:`A PEAK-certified fitter looks at specific data points to understand how a club responds within a golfer's swing. The fitting process generally focuses on three core categories.`,

  aT:`A. Ball Flight Optimization (the "Big 3")`,
  a_li1:`Launch Angle — finds the loft and shaft flex combination that sends the ball into its optimal window.`,
  a_li2:`Spin Rate — determines distance and control. Too much spin costs distance after the ball peaks; too little and it drops early. Fitters fine-tune spin by adjusting clubhead center of gravity (CG) and shaft profile.`,
  a_li3:`Ball Speed — the ultimate indicator of energy transfer. Maximizing ball speed means finding the "sweet spot" of clubhead weight and shaft length.`,

  bT:`B. Club-to-Ball Delivery (Impact)`,
  b_li1:`Club Face & Face Angle — PEAK emphasizes that face angle determines the ball's initial direction. Fitting uses different weights and lie angles to help a player square the face more naturally.`,
  b_li2:`Angle of Attack (AoA) — the optimal loft needed shifts depending on whether a player sweeps the ball (positive) or hits down on it (negative). A downward-blow driver swing (negative AoA), for example, needs a higher-lofted head to optimize launch angle.`,
  b_li3:`Impact Location (Smash Factor) — clubhead data lets a fitter see exactly where on the face a player is striking the ball. Consistent toe or heel strikes can be corrected immediately by changing shaft length, weight, or lie angle to bring impact back to center.`,

  procEyebrow:`2. PEAK Process`, procTitle:`The PEAK Swing Fitting Process`,
  procDesc:`A standard fitting that follows PEAK guidelines runs through a systematic, scientific workflow.`,
  p1t:`Baseline Testing`, p1d:`The player hits shots with their current clubs to establish a data baseline. The fitter identifies "performance gaps" — spin too high, dispersion too wide, and so on.`,
  p2t:`Isolating Variables`, p2d:`The fitter changes only one element at a time — the head to adjust launch angle, spin, and visual confidence; the shaft to optimize timing, feedback, trajectory, and torque (how much it twists at impact).`,
  p3t:`"Gap" Analysis`, p3d:`In a full-bag fitting, PEAK emphasizes Distance Gapping — the fitter confirms consistent distance spacing across every club in the bag, so there's no guesswork on the course.`,
  p4t:`Verification`, p4d:`The fitter compares the new clubs' data against the baseline. Success is confirmed once the data shows tighter dispersion, an optimized launch/spin window, and improved distance or accuracy.`,

  garminEyebrow:`3. Real-World Data`, garminTitle:`Real Data Analysis with the Garmin R50`,
  garminSub:`Garmin Approach® R50`,
  garminPh:`Sample launch monitor data`,
  garminDesc:`A launch monitor that precisely measures every moment of impact — Face to Path, Club Path, Attack Angle, Spin Rate, and more — letting us compare head, shaft, and loft combinations side by side, live in the session.`,

  closingText:`In an actual fitting session, we show you every change — from baseline to final spec — compared directly through launch-monitor data.`,
};

function renderFittingSwing(lang){ const t = T[lang].fittingSwing; return `
${siteHeader('golf-fitting-swing', lang)}
${pageHero('golf-fitting-swing','green', lang, t.pageEyebrow, t.pageTitle, t.pageDesc)}
<section class="section">
  <div class="wrap">
    <a onclick="navigate('golf-fitting')" style="display:flex; width:fit-content; align-items:center; gap:6px; font-size:12.8px; font-weight:700; color:var(--ink-soft); cursor:pointer; margin-bottom:22px;">${t.backLink}</a>
    ${eyebrow(t.metricsEyebrow)}
    <h2 class="sec-h2">${t.metricsTitle}</h2>
    <p class="sec-desc" style="max-width:760px;">${t.metricsDesc}</p>

    <div class="grid-2">
      <div class="card">
        <h4>${t.aT}</h4>
        <ul style="margin:10px 0 0; padding-left:18px; display:flex; flex-direction:column; gap:10px;">
          <li style="font-size:12.6px; color:var(--ink-soft); line-height:1.7;">${t.a_li1}</li>
          <li style="font-size:12.6px; color:var(--ink-soft); line-height:1.7;">${t.a_li2}</li>
          <li style="font-size:12.6px; color:var(--ink-soft); line-height:1.7;">${t.a_li3}</li>
        </ul>
      </div>
      <div class="card">
        <h4>${t.bT}</h4>
        <ul style="margin:10px 0 0; padding-left:18px; display:flex; flex-direction:column; gap:10px;">
          <li style="font-size:12.6px; color:var(--ink-soft); line-height:1.7;">${t.b_li1}</li>
          <li style="font-size:12.6px; color:var(--ink-soft); line-height:1.7;">${t.b_li2}</li>
          <li style="font-size:12.6px; color:var(--ink-soft); line-height:1.7;">${t.b_li3}</li>
        </ul>
      </div>
    </div>
  </div>
</section>

<section class="section section-alt" style="background:var(--bg-soft); padding:44px 0;">
  <div class="wrap">
    ${eyebrow(t.procEyebrow)}
    <h2 class="sec-h2">${t.procTitle}</h2>
    <p class="sec-desc">${t.procDesc}</p>
    <div class="grid-4">
      <div class="card"><h4 style="font-size:14px;">${t.p1t}</h4><p style="font-size:12.4px;">${t.p1d}</p></div>
      <div class="card"><h4 style="font-size:14px;">${t.p2t}</h4><p style="font-size:12.4px;">${t.p2d}</p></div>
      <div class="card"><h4 style="font-size:14px;">${t.p3t}</h4><p style="font-size:12.4px;">${t.p3d}</p></div>
      <div class="card"><h4 style="font-size:14px;">${t.p4t}</h4><p style="font-size:12.4px;">${t.p4d}</p></div>
    </div>
  </div>
</section>

<section class="section">
  <div class="wrap" style="text-align:center;">
    ${eyebrow(t.garminEyebrow)}
    <h2 class="sec-h2">${t.garminTitle}</h2>
    <div style="max-width:640px; margin:0 auto;">
      <span class="badge green" style="margin-bottom:14px;">${t.garminSub}</span>
      ${ph(t.garminPh,'green')}
      <p class="sec-desc" style="margin:18px auto 0; text-align:left;">${t.garminDesc}</p>
    </div>
  </div>
</section>

<section class="section">
  <div class="wrap">
    <div class="diff-banner" style="background:var(--green);">
      <div class="ic">${icon('target',30)}</div>
      <div><p style="margin:0;">${t.closingText}</p></div>
    </div>
  </div>
</section>
${siteFooter(lang)}`; }

function renderCurrentPage(){
  document.documentElement.lang = currentLang;
  document.title = DOC_TITLE[currentLang] || DOC_TITLE.en;
  app.innerHTML = renderFittingSwing(currentLang) + fab(currentLang);
  window.scrollTo(0,0);
}
renderCurrentPage();
</script>
</body>
