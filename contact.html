<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>문의하기 | BizHub Mir</title>
<meta name="description" content="오피스 입주 상담, 골프 피팅 예약, 스크린 골프 예약까지 한 번에 문의할 수 있습니다.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/core.css">
</head>
<body>
<!-- Static fallback so Netlify's build-time bot can detect this JS-rendered form. Never shown; the real submission happens via fetch() from the rendered form below. -->
<form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="text" name="interest" />
  <input type="text" name="name" />
  <input type="text" name="contact_info" />
  <textarea name="message"></textarea>
  <input type="text" name="bot-field" />
</form>
<div id="app"></div>
<script src="assets/core.js"></script>
<script>
const DOC_TITLE = { ko:`문의하기 | BizHub Mir`, en:`Contact | BizHub Mir` };

T.ko.contact = {
  pageEyebrow:`Contact`, pageTitle:`무엇이든 편하게 문의하세요`, pageDesc:`오피스 입주 상담, 골프 피팅 예약, 스크린 골프 예약까지 한 번에 문의할 수 있습니다. BizHub는 멤버십으로 운영되는 비즈니스 공간입니다. 모두가 아닌 오직 당신에게만 특별한 서비스와 혜택을 드립니다.`,
  formInterest:`관심 서비스`, int1:`오피스 입주상담`, int2:`골프피팅 예약`, int3:`스크린골프 예약`, int4:`기타`,
  formName:`이름`, formNamePh:`홍길동`,
  formContact:`연락처`, formContactPh:`WhatsApp 번호 또는 이메일`,
  formMessage:`메시지`, formMessagePh:`문의하실 내용을 입력해 주세요.`,
  formSubmit:`문의 보내기`, formSending:`전송 중…`,
  formErrorMsg:`전송에 실패했습니다. 잠시 후 다시 시도하시거나 WhatsApp으로 문의해 주세요.`,
  successTitle:`문의가 접수되었습니다`, successDesc:`빠른 시일 내에 답변드리겠습니다. 급하신 경우 WhatsApp으로도 문의해 주세요.`,
  privacy:`수집된 개인정보(이름·연락처·문의내용)는 상담 목적으로만 사용되며 목적 달성 후 파기됩니다.`,
  waTitle:`WhatsApp으로 바로 묻기`, waDesc:`가장 빠른 답변은 WhatsApp 문의입니다.`, waBtn:`WhatsApp 열기`,
  addrLabel:`주소`, phoneLabel:`전화`, igLabel:`Instagram`,
};
T.en.contact = {
  pageEyebrow:`Contact`, pageTitle:`Reach out, anytime`, pageDesc:`Ask about an office move-in, a golf fitting reservation, or a screen golf booking, all in one place. BizHub is a business space run on membership — not for everyone, but with special service and benefits made just for you.`,
  formInterest:`Interested In`, int1:`Office move-in`, int2:`Golf fitting reservation`, int3:`Screen golf reservation`, int4:`Other`,
  formName:`Name`, formNamePh:`Jane Doe`,
  formContact:`Contact`, formContactPh:`WhatsApp number or email`,
  formMessage:`Message`, formMessagePh:`Tell us what you need.`,
  formSubmit:`Send Message`, formSending:`Sending…`,
  formErrorMsg:`Something went wrong. Please try again, or reach out via WhatsApp instead.`,
  successTitle:`Your message is in`, successDesc:`We'll get back to you shortly. For anything urgent, message us on WhatsApp too.`,
  privacy:`Personal information collected (name, contact, message) is used solely for consultation purposes and discarded afterward.`,
  waTitle:`Message us on WhatsApp`, waDesc:`WhatsApp gets you the fastest response.`, waBtn:`Open WhatsApp`,
  addrLabel:`Address`, phoneLabel:`Phone`, igLabel:`Instagram`,
};

function renderContact(lang){ const t = T[lang].contact; return `
${siteHeader('contact', lang)}
${pageHero('contact','', lang, t.pageEyebrow, t.pageTitle, t.pageDesc)}
<section class="section">
  <div class="wrap">
    <div class="grid-2">
      <div class="form-mock" id="contactFormWrap">
        <form id="contactForm" onsubmit="return submitContactForm(event)">
          <div class="f-row"><label>${t.formInterest}</label>
            <div class="f-chips">
              <button type="button" class="f-chip sel" data-value="${t.int1}" onclick="toggleInterestChip(this)">${icon('briefcase',13)} ${t.int1}</button>
              <button type="button" class="f-chip" data-value="${t.int2}" onclick="toggleInterestChip(this)">${icon('target',13)} ${t.int2}</button>
              <button type="button" class="f-chip" data-value="${t.int3}" onclick="toggleInterestChip(this)">${icon('monitor',13)} ${t.int3}</button>
              <button type="button" class="f-chip" data-value="${t.int4}" onclick="toggleInterestChip(this)">${icon('more',13)} ${t.int4}</button>
            </div>
          </div>
          <div class="f-row"><label for="cf-name">${t.formName}</label><input class="f-input" type="text" id="cf-name" name="name" placeholder="${t.formNamePh}" required></div>
          <div class="f-row"><label for="cf-contact">${t.formContact}</label><input class="f-input" type="text" id="cf-contact" name="contact_info" placeholder="${t.formContactPh}" required></div>
          <div class="f-row"><label for="cf-message">${t.formMessage}</label><textarea class="f-input area" id="cf-message" name="message" placeholder="${t.formMessagePh}" required></textarea></div>
          <input type="text" name="bot-field" style="position:absolute; left:-9999px;" tabindex="-1" autocomplete="off">
          <button type="submit" class="btn btn-navy btn-block" id="cf-submit-btn">${icon('chat',16)} <span id="cf-submit-label">${t.formSubmit}</span></button>
          <p class="form-error" id="cf-error" style="display:none;">${t.formErrorMsg}</p>
          <p style="font-size:11px; color:var(--ink-faint); margin-top:12px;">${t.privacy}</p>
        </form>
        <div class="form-success" id="cf-success" style="display:none;">
          <div class="ic">${icon('check',20)}</div>
          <div><h4>${t.successTitle}</h4><p>${t.successDesc}</p></div>
        </div>
      </div>
      <div>
        <div class="card" style="margin-bottom:16px;">
          <h4>${icon('chat',16)} ${t.waTitle}</h4>
          <p style="margin-bottom:14px;">${t.waDesc}</p>
          <a class="btn btn-green btn-block">${t.waBtn}</a>
        </div>
        <div class="contact-row"><div class="ic">${icon('mapPin',16)}</div><div><b>${t.addrLabel}</b><span>Ruko Hollywood Boulevard, Cikarang Utara</span></div></div>
        <div class="contact-row"><div class="ic">${icon('phone',16)}</div><div><b>${t.phoneLabel}</b><span>+62 8XX-XXXX-XXXX</span></div></div>
        <div class="contact-row"><div class="ic">${icon('camera',16)}</div><div><b>${t.igLabel}</b><span>@bizcafe.id</span></div></div>
      </div>
    </div>
  </div>
</section>
${siteFooter(lang)}`; }

function toggleInterestChip(el){
  el.classList.toggle('sel');
}

function submitContactForm(e){
  e.preventDefault();
  const form = e.target;
  const t = T[currentLang].contact;
  const errorEl = document.getElementById('cf-error');
  const submitBtn = document.getElementById('cf-submit-btn');
  const submitLabel = document.getElementById('cf-submit-label');
  errorEl.style.display = 'none';
  const interests = Array.from(form.querySelectorAll('.f-chip.sel')).map(c=>c.dataset.value).join(', ');
  const fd = new FormData(form);
  fd.set('form-name', 'contact');
  fd.set('interest', interests);
  submitBtn.disabled = true;
  submitLabel.textContent = t.formSending;
  fetch('/', { method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body:new URLSearchParams(fd).toString() })
    .then(res => {
      if(!res.ok) throw new Error('submit failed');
      form.style.display = 'none';
      document.getElementById('cf-success').style.display = 'flex';
    })
    .catch(() => {
      errorEl.style.display = 'block';
      submitBtn.disabled = false;
      submitLabel.textContent = t.formSubmit;
    });
  return false;
}

function renderCurrentPage(){
  document.documentElement.lang = currentLang;
  document.title = DOC_TITLE[currentLang] || DOC_TITLE.en;
  app.innerHTML = renderContact(currentLang) + fab(currentLang);
  window.scrollTo(0,0);
}
renderCurrentPage();
</script>
</body>
</html>
