T.en.consultingPT = {
  pageEyebrow:`2F Office · Incorporation Service`, pageTitle:`Everything you need to set up a PT. PMA, from first requirement to final approval`,
  pageDesc:`A complete guide to the core requirements, required documents, full process, and the paperwork you must receive from your Notary when incorporating a PT. PMA (Perseroan Terbatas Penanaman Modal Asing).`,
  backLink:`← Back to Startup Consulting`,

  reqEyebrow:`1. Requirements`, reqTitle:`Core Requirements to Incorporate a PT. PMA`,
  reqDesc:`Setting up a foreign-investment company in Indonesia means meeting these six requirements.`,
  req1t:`Shareholders`, req1d:`At least 2 shareholders (foreign individuals or foreign entities allowed).`,
  req2t:`Officers`, req2d:`At least 1 Director and 1 Commissioner (foreign nationals allowed).`,
  req3t:`Total Investment Plan`, req3d:`A business plan of at least IDR 10 billion per business line (KBLI code), excluding land and building value.`,
  req4t:`Paid-Up Capital`, req4d:`At least IDR 2.5 billion. This can start as a shareholder capital commitment letter, then be paid in immediately once the bank account is opened.`,
  req5t:`Foreign Ownership Check`, req5d:`Check the Positive Investment List in advance to confirm foreign-ownership limits for your business line (KBLI) — 100% foreign ownership, or a required local joint-venture partner.`,
  req6t:`Registered Business Address`, req6d:`A physical office, or — for eligible business lines only — a Virtual Office agreement.`,

  docEyebrow:`2. Documents`, docTitle:`Required Documents by Shareholder Type`,
  docDesc:`What you need to prepare differs depending on whether your shareholder is an individual or a corporate entity.`,
  doc1t:`2.1 Individual Shareholders & Officers`,
  doc1_li1:`Passport copy (valid for at least 6 more months)`,
  doc1_li2:`If resident in Indonesia / an existing shareholder: KTP (ID card) and NPWP (individual tax number)`,
  doc1_li3:`Detailed address, contact number, and email address in English`,
  doc2t:`2.2 Corporate Shareholders (e.g. a Korean parent company)`,
  doc2_li1:`Certificate of corporate registration (in English, apostilled/notarized)`,
  doc2_li2:`Articles of Association (in English, apostilled/notarized)`,
  doc2_li3:`Passport copy of the corporate representative`,
  doc2_li4:`Board resolution approving the investment and new-company incorporation in Indonesia`,
  doc3t:`2.3 Documents Required From Everyone`,
  doc3_li1:`3 proposed company names (each combining 3+ English words)`,
  doc3_li2:`A lease agreement for the business premises (1+ year) plus the landlord's ID / land certificate (PBB)`,
  doc3_li3:`Power of Attorney (if appointing a proxy)`,

  procEyebrow:`3. Process`, procTitle:`The Full Incorporation Process`,
  procDesc:`From initial review to bank account opening and follow-on licensing, the process runs in 5 stages.`,
  p1t:`Preliminary Review & Company Name Approval`, p1d:`Confirm investment eligibility (KBLI code and foreign-ownership limits), then pre-check and reserve the company name through AHU Online (Ministry of Law and Human Rights).`,
  p2t:`Deed of Establishment & Legal Entity Status`, p2d:`A local Notary drafts the Deed of Establishment (Akta Pendirian), and the Ministry of Law and Human Rights (Kemenkumham) issues its approval (SK Kemenkumham).`,
  p3t:`Tax & Business Registration`, p3d:`Obtain the corporate tax number (NPWP) from the relevant tax office and register with Coretax, then register the business through the risk-based online licensing system (OSS-RBA).`,
  p4t:`Business ID Number & Operating License`, p4d:`Obtain the Business Identification Number (NIB) through OSS, and get the operating license (Izin Usaha) approved based on your business's risk level (Low/Medium/High).`,
  p5t:`Bank Account & Follow-On Licensing`, p5d:`Open a corporate bank account and pay in capital; process visas/stay permits (KITAS/KITA) for officers and foreign staff; and set up a system for quarterly BKPM Investment Activity Report (LKPM) filings.`,

  notEyebrow:`4. From the Notary`, notTitle:`Documents You Must Receive From Your Notary`,
  notDesc:`Keep every original document safe, and prepare scanned (PDF) copies in advance — they'll come in handy when opening a corporate bank account or applying for a KITAS visa.`,
  n1t:`4.1 Core Corporate & Legal Documents (issued by the Notary)`,
  n1_li1:`Deed of Establishment (Akta Pendirian PT) — the original incorporation deed drafted by an Indonesian Notary.`,
  n1_li2:`Ministry approval letter (SK Kemenkumham) — proof that legal-entity status has been formally approved by the Ministry of Law and Human Rights. Together with the deed, this is the company's most essential form of "ID."`,
  n2t:`4.2 Tax Documents (issued by the tax office / your agent)`,
  n2_li1:`Corporate tax ID documents (SKT and NPWP Card) — the SKT (Surat Keterangan Terdaftar, registration certificate) and the card/document showing the 16-digit corporate tax number.`,
  n2_li2:`Coretax account credentials (ID, password, E-FIN, etc.) — the account details and certificate/passphrase needed for tax filing under Indonesia's next-generation Coretax system.`,
  n2_li3:`VAT taxpayer registration (PKP), if applicable — required if annual revenue exceeds IDR 4.8 billion or your business line must issue VAT (PPN) invoices.`,
  n3t:`4.3 Licensing & Business Registration Documents (issued via OSS RBA)`,
  n3_li1:`Business Identification Number (NIB) — issued through the OSS (Online Single Submission) system; it consolidates the former TDP (company registration), API (import license), and customs-access registration.`,
  n3_li2:`Standard Certificate (Sertifikat Standar) or Business License (Izin Usaha) — auto-issued via OSS or issued after government approval, depending on your business line's risk level (Low/Medium/High).`,
  n3_li3:`OSS account credentials (username, password) — must be handed over, since they're needed for quarterly LKPM filings and any future license changes or additions.`,
  n4t:`4.4 Business Address & Manpower Documents`,
  n4_li1:`Certificate of Business Domicile (SKDU) — a domicile certificate and lease agreement from your virtual-office provider or the physical office's landlord/building management.`,
  n4_li2:`Manpower Registration Certificate (WLKP) — a mandatory labor-office filing after incorporation, also required as a supporting document when foreign staff apply for a KITAS.`,

  closingText:`It's natural to feel overwhelmed the first time. Working through it step by step with a trusted partner nearby makes the process far less daunting than it looks — BizHub Mir handles every stage with you, directly.`,
  ctaTitle:`Book an Incorporation Consultation`, ctaDesc:`From requirement review to Notary, tax, and OSS registration, we'll guide you through it 1:1.`, ctaBtn:`Book a Consultation`,
};
