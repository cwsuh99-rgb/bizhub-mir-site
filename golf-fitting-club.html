  vsT:`C. 스윙 교정 vs. 클럽 피팅: 무엇이 더 중요할까?`,
  vsD1:`골프 퍼포먼스 세계에는 스윙이 결과의 80%를 좌우하고 장비가 20%를 차지한다는 통설이 있습니다. 수치상으로는 스윙이 더 큰 비중을 차지하지만, 이 둘은 서로 경쟁하는 것이 아니라 완전한 공생 관계로 작동합니다.`,
  vsD2:`뿌리 깊은 스윙 습관을 위한 해법 — 골프 스윙을 교과서적으로 완벽하게 재구성하는 것이 이상적이겠지만, 수년에 걸쳐 이미 많은 스윙 특성을 굳혀온 아마추어 골퍼에게 공격적인 스윙 변화는 리듬을 완전히 잃게 만들 수 있습니다. 커스텀 피팅은 부자연스럽고 딱딱한 기계적 강조를 강요하지 않으면서, 신체적 제약과 깊이 배어 있는 습관을 보완하는 다리 역할을 합니다.`,
  vsD3:`심리적 확신과 샷 일관성 — 제대로 피팅된 클럽은 골퍼의 마음에 절대적인 심리적 확신을 심어줍니다. 스윙 자체가 완벽하지 않더라도, 장비를 의심하기 시작하는 순간 각오와 기계적인 망설임이 스윙을 오염시키며 일관성을 무너뜨립니다. 커스텀 피팅은 실패 방정식에서 장비라는 변수를 제거해줍니다.`,

  dataEyebrow:`2. Club Fitting Data`, dataTitle:`측정 항목`,
  dataDesc:`클럽 피팅은 아래 6가지 핵심 지표를 정밀 측정·분석해 진행합니다.`,
  d1t:`A. Swing Weight (스윙웨이트)`, d1d:`클럽을 스윙할 때 헤드 쪽이 얼마나 무겁게 느껴지는지를 나타내는 지표입니다. 클럽의 실제 총 무게가 아니라 밸런스 포인트를 측정합니다.`,
  d1_m:`측정 방식 — 알파벳-숫자 척도(예: C9, D0, D2)로 측정합니다. 알파벳과 숫자가 올라갈수록(D0에서 D2로) 그립 쪽 대비 헤드가 더 무겁게 느껴집니다.`,
  d1_w:`중요한 이유 — 적절한 스윙웨이트는 타감과 타이밍에 필수적입니다. 클럽이 너무 가벼우면 스윙 중 헤드 위치를 놓치기 쉽고, 너무 무거우면 조기 피로를 유발하고 스윙 스피드를 늦출 수 있습니다.`,
  d2t:`B. MOI (관성 모멘트)`, d2d:`클럽 피팅에서 MOI는 두 가지 방식으로 활용됩니다: 클럽헤드 MOI(관용성)와 전체 클럽 MOI(세트 매칭).`,
  d2_m:`클럽헤드 MOI — 볼의 중심에서 벗어난 타격에 헤드가 비틀리는 정도에 대한 저항을 측정합니다. "높은 MOI" 드라이버는 미스히트 때도 덜 비틀려 볼이 더 곧게 나갑니다.`,
  d2_w:`전체 클럽 MOI — 백 안의 모든 클럽이 회전하는 데 정확히 동일한 에너지가 필요하도록 설계하는 프리미엄 피팅 방식입니다. 기존 스윙웨이트 매칭과 달리, MOI 매칭 클럽은 3번 아이언부터 피칭웨지까지 스윙 중 느껴지는 노력이 동일하게 유지되도록 합니다.`,
  d3t:`C. CPM (분당 진동수)`, d3d:`샤프트의 정확한 진동수, 즉 강도를 결정하는 데 사용되는 정밀한 과학적 측정값입니다.`,
  d3_m:`측정 방식 — 클럽을 그립 쪽에 기계적으로 고정하고 진동시킨 뒤, 1분 동안 샤프트가 몇 번 진동하는지 측정합니다.`,
  d3_w:`중요한 이유 — "Regular"나 "Stiff" 같은 표준 표기는 제조사마다 크게 다릅니다. CPM은 객관적인 데이터를 제공합니다. CPM이 높을수록 샤프트가 더 뻣뻣하고, 낮을수록 더 부드럽고 유연합니다. 피터들은 CPM을 활용해 세트 전체의 강도 변화가 완벽하게 매끄럽게 이어지도록 합니다.`,
  d4t:`D. Length (길이)`, d4d:`그립 캡 상단부터 지면에 닿는 클럽헤드 힐까지의 물리적인 측정값입니다.`,
  d4_w:`중요한 이유 — 길이는 자세, 볼과의 거리, 클럽페이스의 임팩트 위치를 직접적으로 좌우합니다. 클럽이 길수록 헤드 스피드는 높아지지만 컨트롤은 어려워집니다. 적절한 피팅은 편안하고 안정적인 자세를 유지하면서 페이스를 스퀘어로 꾸준히 맞출 수 있는 최적의 길이를 찾아줍니다.`,
  d5t:`E. Weight (총 무게)`, d5d:`완성된 클럽 전체(헤드, 샤프트, 그립, 상황에 따라 웨이트 포함)의 실제 물리적 무게로, 그램 단위로 측정합니다.`,
  d5_w:`중요한 이유 — 스윙웨이트가 밸런스 느낌을 좌우한다면, 총 무게는 신체에 가해지는 부하를 좌우합니다. 일반적으로 템포가 빠르고 스윙이 공격적인 골퍼는 더 무거운 총 무게가 궤도를 안정시키는 데 도움이 됩니다. 템포가 부드럽거나 스윙 스피드가 느린 골퍼는 더 가벼운 무게가 가속과 비거리를 극대화하는 데 유리합니다.`,
  d6t:`F. Loft (로프트)`, d6d:`지면에 수직인 평면을 기준으로 한 클럽페이스의 각도로, 도(degree) 단위로 측정합니다.`,
  d6_w:`중요한 이유 — 로프트는 발사각과 스핀량을 좌우하는 핵심 요소입니다. 로프트가 너무 크면 비거리를 잃고, 너무 작으면 볼이 낮게 떠 스핀이 충분치 못해 그린에서 세우기 어려워집니다. 피터는 목표 캐리 비거리를 달성하고 클럽 간 적절한 "갭"(일정한 거리 간격)을 만들도록 로프트를 최적화합니다.`,

T.en.fittingClub = {
  pageEyebrow:`3F Golf Fitting · Club Fitting`, pageTitle:`Precision club fitting to the KGFA standard, completing your spec sheet`,
  pageDesc:`Many golfers think club fitting is a luxury reserved for tour pros — but it's actually the most direct way for a golfer at any level to find consistency.`,
  backLink:`← View All Fitting Services`,

  introEyebrow:`About Club Fitting`, introTitle:`What is Custom Club Fitting?`,
  introDesc:`Club fitting splits into two core approaches: diagnostic calibration (Passive Fitting) and performance optimization (Active Fitting).`,

  passT:`A. Passive Fitting (Club Check-Up)`, passSub:`Verifying Equipment Condition`,
  passD:`An accurate exam comes before treating any symptom. Passive Fitting inspects the objective data of your current 14 clubs to confirm they're performing as designed.`,
  pass_li1:`Spec verification — checks the actual technical specs of all 14 clubs in your bag against the manufacturer's official spec sheet, identifying and correcting any discrepancies.`,
  pass_li2:`Periodic calibration — over time and repeated impact, clubs inevitably drift in weight, loft/lie angle, and alignment. Regular check-ups and calibration are essential to maintaining factory-spec precision.`,
  pass_li3:`Set consistency review — analyzes and re-tunes core metrics across the whole set (loft, swing weight, MOI, length, CPM, shaft spin) to guarantee a smooth, uniform progression from driver to wedge.`,

  actT:`B. Active Fitting (Club Performance)`, actSub:`Maximizing Power Performance`,
  actD:`A custom optimization process that translates a golfer's own physical traits and real swing dynamics directly into equipment specs.`,
  act_li1:`Maximize distance & control direction — precisely evaluates swing speed, body type, and impact path to build the ideal head/shaft/grip blueprint for maximum distance and minimum dispersion.`,
  act_li2:`Correct shot shape & mishits — persistent swing faults like a chronic slice, hook, duff (excessive ground contact), or a suboptimal launch angle can be physically mitigated through precise equipment tuning.`,
  act_li3:`Improve feel — fine-tunes lie angle, total set weight, and balance point to sharpen the tactile response and "feel" at impact, building ultimate confidence through the swing.`,

  vsT:`C. Swing Correction vs. Club Fitting: Which Matters More?`,
  vsD1:`Golf performance folklore says the swing accounts for 80% of results and equipment for 20%. Numerically, the swing carries more weight — but the two aren't competing; they work in complete symbiosis.`,
  vsD2:`A fix for deep-rooted swing habits — rebuilding a golf swing to textbook perfection sounds ideal, but for an amateur who has spent years grooving certain swing traits, an aggressive swing change can shatter their rhythm entirely. Custom fitting bridges physical limitations and deeply ingrained habits without forcing an unnatural, rigid mechanical emphasis.`,
  vsD3:`Psychological confidence & shot consistency — a properly fitted club plants absolute psychological confidence in a golfer's mind. Even when the swing itself isn't perfect, the moment doubt about the equipment creeps in, hesitation and mechanical second-guessing contaminate the swing and break down consistency. Custom fitting removes equipment as a variable from the failure equation.`,

  dataEyebrow:`2. Club Fitting Data`, dataTitle:`What Gets Measured`,
  dataDesc:`Club fitting is built on precise measurement and analysis of these six core metrics.`,
  d1t:`A. Swing Weight`, d1d:`A measure of how heavy the head feels during the swing — not the club's actual total weight, but its balance point.`,
  d1_m:`Measurement — measured on an alphanumeric scale (e.g. C9, D0, D2). As the letter/number climbs (D0 toward D2), the head feels progressively heavier relative to the grip.`,
  d1_w:`Why it matters — proper swing weight is essential to feel and timing. A club that's too light makes it easy to lose track of the head through the swing; too heavy causes early fatigue and slows swing speed.`,
  d2t:`B. MOI (Moment of Inertia)`, d2d:`In club fitting, MOI is used in two ways: clubhead MOI (forgiveness) and total-club MOI (set matching).`,
  d2_m:`Clubhead MOI — measures resistance to twisting on an off-center hit. A "high-MOI" driver twists less on a mishit, so the ball flies straighter.`,
  d2_w:`Total-club MOI — a premium fitting method that designs every club in the bag to require exactly the same energy to rotate. Unlike traditional swing-weight matching, MOI-matched clubs keep the effort felt during the swing identical from the 3-iron all the way to the pitching wedge.`,
  d3t:`C. CPM (Cycles Per Minute)`, d3d:`A precise scientific measurement used to determine a shaft's exact frequency — i.e., its stiffness.`,
  d3_m:`Measurement — the club is mechanically clamped at the grip and set oscillating, then the number of times the shaft cycles per minute is measured.`,
  d3_w:`Why it matters — standard labels like "Regular" or "Stiff" vary wildly between manufacturers. CPM gives you objective data. The higher the CPM, the stiffer the shaft; the lower, the softer and more flexible. Fitters use CPM to make the stiffness progression across the whole set perfectly smooth.`,
  d4t:`D. Length`, d4d:`A physical measurement from the top of the grip cap to the clubhead's heel where it touches the ground.`,
  d4_w:`Why it matters — length directly governs posture, distance from the ball, and where the clubface makes impact. A longer club raises head speed but is harder to control. Proper fitting finds the optimal length that lets you maintain a comfortable, stable posture while consistently squaring the face.`,
  d5t:`E. Weight (Total Weight)`, d5d:`The actual physical weight of the finished club (head, shaft, grip, and situationally added weight), measured in grams.`,
  d5_w:`Why it matters — if swing weight governs the feel of balance, total weight governs the load placed on the body. Golfers with a fast tempo and aggressive swing generally benefit from a heavier total weight that stabilizes the swing path. Golfers with a smoother tempo or slower swing speed benefit from a lighter weight that maximizes acceleration and distance.`,
  d6t:`F. Loft`, d6d:`The angle of the clubface relative to a plane perpendicular to the ground, measured in degrees.`,
  d6_w:`Why it matters — loft is a core factor governing launch angle and spin rate. Too much loft costs you distance; too little sends the ball out low without enough spin to hold the green. Fitters optimize loft to hit your target carry distance and build a proper "gap" (consistent distance spacing) between clubs.`,
