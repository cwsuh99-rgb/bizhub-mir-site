<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>오피스 안내 | 2F 오피스 | BizHub Mir</title>
<meta name="description" content="프라이빗 2인실 3실과 버추얼 오피스, 방음·보안까지 갖춘 업무 인프라를 제공합니다.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/core.css">
</head>
<body>
<div id="app"></div>
<script src="assets/core.js"></script>
<script>
const DOC_TITLE = { ko:`오피스 안내 | 2F 오피스 | BizHub Mir`, en:`Office Guide | 2F Office | BizHub Mir` };

T.ko.officeGuide = {
  pageEyebrow:`2F 오피스 · 오피스 안내`, pageTitle:`법적으로 안전하게, 부담 없는 비용으로 시작하는 사무 공간`, pageDesc:`프라이빗 2인실 3실과 버추얼 오피스, 방음·보안까지 갖춘 업무 인프라를 제공합니다.`,
  facilitiesEyebrow:`Facilities`, facilitiesTitle:`제공 인프라`, facilitiesDesc:`2인실 규모의 프라이빗 오피스 3실 모두에 아래 인프라가 기본으로 제공됩니다.`,
  f1t:`독립 인터넷`, f1d:`호실별 CAT.6 회선`, f2t:`스마트 도어록`, f2d:`지문·카드키·QR 출입통제`,
  f3t:`업무 장비`, f3d:`대형 모니터, 테이블, 캐비닛`, f4t:`복합기`, f4d:`공용 프린터·스캐너`,
  packagesEyebrow:`Packages`, packagesTitle:`오피스 이용 패키지`, packagesDesc:`정확한 비용은 상담을 통해 맞춤 안내해 드립니다.`,
  starterName:`Starter`, starterPrice:`버추얼 오피스 · 법인주소지 중심`, starterLi1:`법인 주소지 제공 (SLF·HO)`, starterLi2:`우편물 수령 대행`, starterLi3:`월 2회 미팅룸 이용`, starterBtn:`상담 문의`,
  standardTag:`추천`, standardName:`Standard`, standardPrice:`프라이빗 2인실 + 컨설팅 패키지`, standardLi1:`프라이빗 2인실 전용 사용 (전체 3실 중 배정)`, standardLi2:`Notary·OSS/Coretax 컨설팅 연계`, standardLi3:`1F 카페 · 3F 골프피팅 할인 혜택`, standardBtn:`상담 문의`,
  linkConsulting:`창업 컨설팅 서비스 자세히 보기`,
};
T.en.officeGuide = {
  pageEyebrow:`2F Office · Office Guide`, pageTitle:`A safe, legally sound office — without the high cost`, pageDesc:`Three private 2-person offices plus a virtual office, with soundproofing and security built in.`,
  facilitiesEyebrow:`Facilities`, facilitiesTitle:`What's Included`, facilitiesDesc:`All three of our 2-person private offices come standard with the following infrastructure.`,
  f1t:`Dedicated Internet`, f1d:`CAT.6 line in every room`, f2t:`Smart Door Lock`, f2d:`Fingerprint, card key, or QR access`,
  f3t:`Work Equipment`, f3d:`Large monitor, desk, cabinet`, f4t:`Multi-Function Printer`, f4d:`Shared printer & scanner`,
  packagesEyebrow:`Packages`, packagesTitle:`Office Packages`, packagesDesc:`Exact pricing is provided through a personalized consultation.`,
  starterName:`Starter`, starterPrice:`Virtual office · registered address focus`, starterLi1:`Company registered address (SLF·HO)`, starterLi2:`Mail handling service`, starterLi3:`2 meeting-room uses per month`, starterBtn:`Ask for a Quote`,
  standardTag:`Recommended`, standardName:`Standard`, standardPrice:`Private 2-person office + consulting package`, standardLi1:`Dedicated private 2-person office (assigned from 3 available)`, standardLi2:`Notary · OSS/Coretax consulting included`, standardLi3:`Discounts at 1F Café · 3F Golf Fitting`, standardBtn:`Ask for a Quote`,
  linkConsulting:`See Startup Consulting Services`,
};

function renderOfficeGuide(lang){ const t = T[lang].officeGuide; return `
${siteHeader('office-guide', lang)}
${pageHero('office-guide','', lang, t.pageEyebrow, t.pageTitle, t.pageDesc)}
<section class="section">
  <div class="wrap">
    ${eyebrow(t.facilitiesEyebrow)}
    <h2 class="sec-h2">${t.facilitiesTitle}</h2>
    <p class="sec-desc">${t.facilitiesDesc}</p>
    <div class="grid-4" style="margin-top:22px;">
      <div class="stat"><div class="ic">${icon('wifi',22)}</div><b>${t.f1t}</b><span>${t.f1d}</span></div>
      <div class="stat"><div class="ic">${icon('lock',22)}</div><b>${t.f2t}</b><span>${t.f2d}</span></div>
      <div class="stat"><div class="ic">${icon('monitor',22)}</div><b>${t.f3t}</b><span>${t.f3d}</span></div>
      <div class="stat"><div class="ic">${icon('printer',22)}</div><b>${t.f4t}</b><span>${t.f4d}</span></div>
    </div>
  </div>
</section>
<section class="section">
  <div class="wrap">
    ${eyebrow(t.packagesEyebrow)}
    <h2 class="sec-h2">${t.packagesTitle}</h2>
    <p class="sec-desc">${t.packagesDesc}</p>
    <div class="grid-2">
      <div class="pkg">
        <h4>${t.starterName}</h4>
        <div class="price">${t.starterPrice}</div>
        <ul>
          <li><span class="ic">${icon('check',15)}</span>${t.starterLi1}</li>
          <li><span class="ic">${icon('check',15)}</span>${t.starterLi2}</li>
          <li><span class="ic">${icon('check',15)}</span>${t.starterLi3}</li>
        </ul>
        <a class="btn btn-line btn-block" onclick="navigate('contact')">${t.starterBtn}</a>
      </div>
      <div class="pkg hi">
        <span class="tag">${t.standardTag}</span>
        <h4>${t.standardName}</h4>
        <div class="price">${t.standardPrice}</div>
        <ul>
          <li><span class="ic">${icon('check',15)}</span>${t.standardLi1}</li>
          <li><span class="ic">${icon('check',15)}</span>${t.standardLi2}</li>
          <li><span class="ic">${icon('check',15)}</span>${t.standardLi3}</li>
        </ul>
        <a class="btn btn-navy btn-block" onclick="navigate('contact')">${t.standardBtn}</a>
      </div>
    </div>
  </div>
</section>
<section class="section">
  <div class="wrap">
    <a class="btn btn-line" onclick="navigate('office-consulting')">${t.linkConsulting} ${icon('arrowRight',14)}</a>
  </div>
</section>
${siteFooter(lang)}`; }

function renderCurrentPage(){
  document.documentElement.lang = currentLang;
  document.title = DOC_TITLE[currentLang] || DOC_TITLE.en;
  app.innerHTML = renderOfficeGuide(currentLang) + fab(currentLang);
  window.scrollTo(0,0);
}
renderCurrentPage();
</script>
</body>
</html>
