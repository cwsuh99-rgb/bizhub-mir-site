function renderHome(lang){ const t = T[lang].home; return `
${siteHeader('home', lang)}
<section class="hero-home">
  <div class="hero-home-in">
    <div class="hero-copy">
      ${eyebrow(t.eyebrow)}
      <h1>${t.h1}</h1>
      <p class="lead">${t.lead}</p>
      <div class="hero-cta-row">
        <a class="btn btn-navy" onclick="navigate('office-consulting')">${t.ctaPrimary} ${icon('arrowRight',15)}</a>
      </div>
      <div class="trust-row">
        <span class="lbl">${t.trustLabel}</span>
        <span class="trust-chip">${t.trust1}</span>
        <span class="trust-chip">${t.trust2}</span>
        <span class="trust-chip">${t.trust3}</span>
      </div>
    </div>
    <div class="hero-visual">
      <div class="hero-photo">
        <div class="glyph">${icon('cluster',180)}</div>
        <div class="stat-float">
          <div class="lbl">${t.statLabel}</div>
          <div class="num">${t.statNum}</div>
          <div class="sub">${t.statSub}</div>
        </div>
        <div class="tag-overlay">
          <span class="tag-pill">${t.tag1}</span>
          <span class="tag-pill">${t.tag2}</span>
          <span class="tag-pill">${t.tag3}</span>
          <span class="tag-pill">${t.tag4}</span>
          <span class="tag-pill">${t.tag5}</span>
          <span class="tag-pill more">${t.tagMore}</span>
        </div>
      </div>
    </div>
  </div>
  <div class="feature-strip">
    <div class="feature-item"><div class="ic">${icon('building',26)}</div><b>${t.f1t}</b><span>${t.f1d}</span></div>
    <div class="feature-item"><div class="ic">${icon('mapPin',26)}</div><b>${t.f2t}</b><span>${t.f2d}</span></div>
    <div class="feature-item"><div class="ic">${icon('shield',26)}</div><b>${t.f3t}</b><span>${t.f3d}</span></div>
    <div class="feature-item"><div class="ic">${icon('target',26)}</div><b>${t.f4t}</b><span>${t.f4d}</span></div>

  <div class="wrap">
    ${eyebrow(t.floorsEyebrow)}
    <h2 class="sec-h2">${t.floorsTitle}</h2>
    <p class="sec-desc">${t.floorsDesc}</p>
    <div class="floor-grid">
      <div class="floor-card" onclick="navigate('cafe-menu')">
        <div class="floor-chip cafe">${icon('coffee',22)}</div>
        <h3>${t.floor1t}</h3>
        <p>${t.floor1d}</p>
        <a class="floor-link cafe">${t.floor1l} ${icon('arrowRight',14)}</a>
      </div>
      <div class="floor-card" onclick="navigate('office-guide')">
        <div class="floor-chip office">${icon('briefcase',22)}</div>
        <h3>${t.floor2t}</h3>
        <p>${t.floor2d}</p>
        <a class="floor-link office">${t.floor2l} ${icon('arrowRight',14)}</a>
      </div>
      <div class="floor-card" onclick="navigate('golf-fitting')">

</section>

<section class="section">
  <div class="wrap">
    <div class="diff-banner">
      <div class="ic">${icon('star',36)}</div>
      <div>
        <h4>${t.diffTitle}</h4>
        <p>${t.diffDesc}</p>
      </div>
    </div>
  </div>
</section>

<section class="section">
  <div class="wrap">
    <div class="cta-band">
      <div>
        <h3>${t.ctaTitle}</h3>
        <p>${t.ctaDesc}</p>
      </div>
      <a class="btn btn-navy" onclick="navigate('contact')">${icon('chat',16)} ${t.ctaBtn}</a>
    </div>
  </div>
</section>
${siteFooter(lang)}`; }

function renderCurrentPage(){
  document.documentElement.lang = currentLang;
  document.title = DOC_TITLE[currentLang] || DOC_TITLE.en;
  app.innerHTML = renderHome(currentLang) + fab(currentLang);
  window.scrollTo(0,0);
}
renderCurrentPage();
