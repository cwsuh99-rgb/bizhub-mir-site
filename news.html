    desc:`CNBC인도네시아는 11월9일, 통상부 부통상장관 디아 로로 에스티가 EU-인도네시아 포괄적경제동반자협정(IEU-CEPA)의 최종 서명이 11월28일경 이뤄질 것으로 예상한다고 밝혔다고 보도했습니다. 반면 같은 시기 경제조정부 장관 아이르랑가 하르타르토는 서명일을 11월21일로, 유럽의회 처리 일정을 11월23일경으로 언급해 정부 고위 관료들 사이에서도 구체적 일정이 엇갈리고 있는 것으로 확인됩니다. 양측은 2025년9월23일 발리 누사두아에서 사실상 협정 타결과 가서명을 마쳤고, 이후 법률 문안을 다듬는 '법률 검토(legal scrubbing)' 단계를 거쳐왔습니다. voi.id 등은 법률 검토 단계가 마무리 국면에 들어섰으며 2027년 초 시행을 목표로 하고 있다고 전했습니다. 협정이 발효되면 인도네시아는 EU산 제품 관세를 상당 부분 단계적으로 철폐하게 되며, 보도에 따라 전체 품목의 98% 안팎을 3~20년에 걸쳐 철폐·인하하는 것으로 설명되고 있습니다. 다만 정식 발효를 위해서는 유럽의회 동의, EU 회원국 승인, 인도네시아 측 비준 절차가 추가로 필요합니다. 양측은 2026년4분기 서명, 2027년1월 발효를 목표로 작업을 이어가고 있는 것으로 파악됩니다. EU산 원자재·설비를 수입하거나 EU向 완제품을 생산하는 PT PMA는 서명·비준 일정에 따라 관세 혜택 적용 시점이 달라질 수 있으므로 공식 발표를 주시해야 합니다. 특히 한국계 PT PMA 중 인도네시아를 생산기지로 EU 수출을 계획하는 기업은 원산지 규정(rules of origin) 충족 여부를 사전에 점검해 두는 것이 유리합니다.`,

  { cat:`reg`, date:`2027.10.28 시행령 제정 기한`, title:`신 노동법 시행령 제정 시한, 2027년10월28일로 확정`,
    desc:`포춘인도네시아(Fortune Indonesia) 등은 10월28일 공포·시행된 노동자보호법(UU 27/2026)과 관련해, 법률이 위임한 세부 시행령(PP)을 공포일로부터 1년 이내, 즉 2027년10월28일까지 제정해야 한다는 점을 재확인해 보도했습니다. 국회(DPR) 심의 과정에서 해고(PHK) 사유별 퇴직금(페상곤) 배율 산정 방식 등 노사 양측이 가장 민감하게 여기는 쟁점들은 법률 본문이 아닌 후속 정부규정(PP)으로 위임된 것으로 확인됩니다. 지난주 보도된 아웃소싱 허용 5대 업종, 퇴직금 적립준비금(dana cadangan pesangon) 산정 방식, 최저임금 알파지수 범위 등도 모두 이 1년짜리 시행령 제정 시한 안에서 구체화될 핵심 항목들입니다. 노동계와 경영계 모두 시행령 초안이 공개될 때마다 자신들의 요구가 반영되는지 주시하고 있으며, 노동조합총연맹(KSPI) 등은 기존에 확보된 근로자 보호 수준이 시행령 단계에서 후퇴하지 않도록 정부에 감시를 요구하고 있습니다. 반대로 경영계는 퇴직금 적립준비금 등 신설 제도가 추가 비용 부담으로 이어지지 않도록 산정 비율을 합리적으로 정해 달라고 요구하는 것으로 알려졌습니다. 법 시행 후 약 1개월이 지난 현재까지 구체적인 PP 초안이 공개로 발표된 사례는 확인되지 않고 있습니다. PT PMA는 앞으로 약 11개월에 걸쳐 순차적으로 공개될 시행령 초안을 지속적으로 모니터링하면서, PKWT 계약·아웃소싱·퇴직금 관련 인사정책을 단계적으로 정비할 준비를 지금부터 시작하는 것이 바람직합니다. 특히 인건비·퇴직금 부담이 큰 제조업 PT PMA는 시행령이 나올 때마다 재무 영향을 즉시 재추산해 연간 예산에 반영해야 합니다.`,
    source:`Fortune Indonesia`, url:`https://www.fortuneidn.com/business/uu-nomor-27-tahun-2026-resmi-berlaku-d7w02-00-lflgw-3ftg0m` },
  { cat:`tip`, date:`2027.01.01 적용 예정`, title:`2027년 UMP 산정공식 공개, 법적근거 두고 혼선`,
    desc:`CNN인도네시아는 11월10일, 노동부 장관 야시에를리가 2027년도 지방최저임금(UMP) 산정이 10월28일 발효된 신 노동자보호법(UU 27/2026) 제139조를 근거로 이뤄진다고 밝혔다고 보도했습니다. 제139조 제1항은 '최저임금 공식' 또는 '적정생계비(KHL)' 기준 중 하나를 선택해 산정할 수 있도록 규정하고 있습니다. 공식을 적용할 경우 제139조 제2항에 따라 경제성장률, 물가상승률, 그리고 '특정지수(알파)'를 함께 반영해야 한다고 명시돼 있습니다. 다만 알파지수의 적용 범위를 두고 매체 간 혼선이 있는데, CNN인도네시아는 0.5~1.0을 보도했고 다른 매체들은 기존 정부규정(PP 49/2025)에 규정된 0.5~0.9를 인용해 정확한 범위가 아직 확정되지 않은 것으로 보입니다. 노동조합총연맹(KSPI)은 가장 높은 알파값인 0.9를 적용해 7.5~9.5%의 임금 인상을 요구하고 있다고 카타다타 등이 전했습니다. 동시에 노동부는 2027년도 UMP 산정에 여전히 기존 PP 49/2025를 적용한다고 설명해, 신법과 기존 정부규정 중 실제로 어느 것이 적용될지 자체도 명확히 정리되지 않은 상태입니다. 정부는 2027년1월1일부터 적용될 새 UMP 확정을 위한 내부 논의를 11월 말까지 마무리하는 것을 목표로 하고 있습니다. 노동계와 경영계는 최종 인상률을 두고 여전히 입장 차이를 보이고 있습니다. PT PMA는 알파지수가 최종 확정되기 전까지 7.5%·8.5%·9.5% 등 복수 인상률 시나리오로 2027년도 인건비 예산을 미리 준비해 두는 것이 안전합니다.`,
    source:`CNN Indonesia`, url:`https://www.cnnindonesia.com/ekonomi/20261110123537-92-1425344/begini-rincian-dan-formula-ump-2027` },
  { cat:`econ`, date:`2026.11.11 보도`, title:`루피아 약세, MSCI 지수 재검토 앞두고 자금유출 우려`,
    desc:`트레이딩이코노믹스(Trading Economics)는 11월11일, 인도네시아 루피아가 달러 강세와 정치적 리스크 속에 약세를 보이며 1달러당 18,150루피아선을 넘어섰다고 보도했습니다. 이번 약세는 MSCI(모건스탠리캐피털인터내셔널)의 11월 인도네시아 증시 지수 정기 리뷰를 앞두고 외국인 자금 추가 유출 우려가 재부각된 가운데 나타났습니다. 현지 매체들에 따르면 MSCI 정기 지수 리뷰 결과는 11월11~12일경 발표되고, 포트폴리오 조정은 11월30일 종가 기준으로 이뤄지며 신규 지수는 12월1일부터 적용될 예정입니다. 앞서 MSCI는 지난 6월 인도네시아의 신흥시장(Emerging Market) 지위는 유지하되, 자본시장 개혁이 충분히 진전되지 않으면 11월 리뷰 시점에 '프런티어마켓' 강등 관련 협의를 시작할 수 있다고 경고한 바 있습니다. 10월에는 이런 우려로 루피아가 18,046루피아까지 밀렸고, 올해 들어 10월19일까지 외국인의 주식 순매도 규모가 89조9,100억 루피아에 달했다고 비즈니스닷컴(Bisnis.com)이 전했습니다. 분석기관 MUFG는 10월 소비자물가 상승률이 전년동월대비 3.23%로 9월 3.28%보다 둔화됐지만 환율 리스크는 여전히 남아있다고 평가했습니다. 인도네시아 중앙은행(BI)은 MSCI발 외국인 자금 유출이 주식뿐 아니라 국채(SBN)·중앙은행증권(SRBI) 시장까지 번지고 있음을 인정하고, 루피아 변동성 관리를 위해 역외선물환(DNDF)과 현물시장 개입을 준비해 두고 있다고 밝혔습니다. 외화 결제·외화 부채가 있는 PT PMA는 MSCI 리뷰 결과 반영(11월30일 포트폴리오 조정, 12월1일 지수 적용) 전후의 단기 환율 변동성 확대에 대비해 환헤지 수단을 점검해 두는 것이 바람직합니다.`,
    source:`Trading Economics`, url:`https://tradingeconomics.com/indonesia/currency/news/600275` },
  { cat:`tax`, date:`2026.10.22 보도`, title:`Coretax-AHU Online 포털 연동, 법인 NPWP 자동발급`,
    desc:`DDTC뉴스는 10월22일, 국세청(DJP)과 법무부 법인등기총국(Ditjen AHU)이 코어택스(Coretax) 시스템과 AHU 온라인 포털을 연동했다고 보도했습니다. 이번 연동으로 PT 퍼로랑안(1인 PT), CV(합자회사), 피르마(합명회사), 민사조합 등 법인 설립 시 세무등록번호(NPWP) 법인이 별도 신청 없이 자동으로 발급됩니다. 기사에 따르면 이번 조치는 법인 설립 행정을 간소화하고 세무·법률 행정 간 연계를 강화하기 위한 것으로, DDTC는 기업에 돌아가는 혜택이 최소 여섯 가지에 이른다고 전했습니다. 다만 법인 정보 변경이나 해산 시 AHU 쪽 정보가 Coretax에 자동으로 반영되는지는 아직 명확히 공지되지 않았으며, 해산 시에는 별도로 NPWP 말소를 신청해야 한다고 관련 업계지(UKM Indonesia)가 전했습니다. 부가가치세 과세대상사업자(PKP) 등록은 이번 연동과 별개로 계속 개별 신청해야 한다는 점도 확인됩니다. 이번 연동은 PT PMA 자체보다는 PT 퍼로랑안·CV 등 중소 법인 형태에 우선 적용되는 것으로 보이나, PT PMA 산하에 현지 협력업체나 자회사를 추가 설립하는 한국 기업은 설립 일정이 단축될 수 있다는 점을 참고할 수 있습니다. 다만 이사 교체, 주소 변경 등 법인 정보 변경 시에는 AHU와 Coretax 양쪽에 모두 반영됐는지 당분간 별도로 확인하는 절차를 유지하는 것이 안전합니다.`,
    source:`DDTC News`, url:`https://news.ddtc.co.id/berita/nasional/1823494/coretax-dan-portal-ahu-online-terintegrasi-ini-6-manfaatnya-bagi-wp` },
  { cat:`tax`, date:`2026.11월 기준`, title:`LKPM 미제출시 단계적 제재, NIB 취소까지 이어질 위험`,
    desc:`법무·투자 컨설팅업체 프로리걸(Prolegal.id)은 11월 들어 투자조정청(BKPM) 규정 5/2025에 따른 투자활동보고서(LKPM) 미제출 제재 규정을 재차 상기시키는 안내를 전했습니다. 해당 규정 제373조 제2항은 2회 연속 LKPM을 제출하지 않은 사업자에 대해 행정제재를 부과할 수 있도록 규정하고 있습니다. 제재는 1차 서면경고, 그래도 미제출시 2차 경고, 계속 위반할 경우 사업활동 일시정지 및 행정과태료 부과로 단계적으로 강화되며, 최종적으로는 사업허가(NIB) 취소까지 이어질 수 있다고 설명됩니다. 사업활동 일시정지 처분은 행정과태료와 함께 부과되는 것이 특징입니다. 정부규정(PP) 28/2025는 기존보다 제재 범위를 넓혀 행정과태료를 추가하는 등 LKPM 위반에 대한 제재를 전반적으로 강화한 것으로 분석됩니다. 다만 제재가 곧바로 NIB 취소로 이어지는 것은 아니며 단계적으로 적용되므로, 조기에 보고를 정상화하면 최악의 제재는 피할 수 있다는 점도 함께 강조되고 있습니다. 지난주 안내된 2026년4분기 LKPM 제출 마감(2027년1월15일)과 맞물려, 이미 직전 분기 보고를 누락한 적이 있는 PT PMA는 이번 4분기분을 반드시 기한 내 제출해 2회 연속 누락으로 인한 제재 대상이 되지 않도록 해야 합니다. PT PMA는 분기별 LKPM 제출 일정을 사내 캘린더에 고정해 관리하고, 이미 경고를 받은 사업장이 있다면 즉시 보고를 정상화해 사업활동 정지나 NIB 취소로 이어지지 않도록 선제적으로 대응하는 것이 바람직합니다.`,
    source:`Prolegal.id`, url:`https://prolegal.id/awas-cabut-nib-sanksi-belum-lapor-lkpm-kuartal-3-2026/` },
  { cat:`tip`, date:`2026.09.09 제정, 시행 중`, title:`외국인력 허가(RPTKA) 절차 통합, 처리기간 단축 추진`,
    desc:`노동부·투자부·이민당국 등 관계기관은 2026년9월9일 공동결정(케푸멘아커 1/2026 등)을 통해 외국인력활용계획서(RPTKA) 승인과 비자(VITAS)·체류허가(ITAS·ITAP) 신청 절차를 OSS(온라인단일창구) 하나로 통합했다고 파사르다나(Pasardana)와 IKPI가 9월 보도했습니다. 통합의 목적은 외국인 투자·전문인력 유치를 위해 관련 행정 처리 속도를 끌어올리는 것으로 설명됩니다. 카타다타에 따르면 정부는 처리 기간을 종전보다 단축해 약 4~5일 안에 끝내는 것을 목표로 하고 있습니다. 정해진 처리기한이 지나면 OSS와 연계된 '포지티브 피션(positive fiction)' 메커니즘을 통해 서류가 자동 발급될 수 있도록 설계됐다고 IKPI는 설명했습니다. 이 통합 시스템은 OSS, 노동부의 SIAPkerja, 이민당국의 All Indonesia 시스템과 서로 연동됩니다. 다만 법률 자문사들은 이번 개편이 RPTKA 제도 자체를 없애는 것은 아니며, 기업은 여전히 RPTKA 승인 근거를 확보해야 한다고 설명하고 있습니다. 별도의 IMTA(외국인 근로자 고용허가서)는 더 이상 요구되지 않고, RPTKA 승인과 관련 이민 규정 준수가 일반적인 요건이 된다는 점도 확인됩니다. 외국인 임원·전문인력을 채용하거나 갱신하는 PT PMA는 신청 전 최초 신청과 갱신 신청 간 데이터 일치 여부를 반드시 확인해야 하며, 통합 시스템 시행 이후에도 실제 처리기간이 목표치(4~5일)에 부합하는지 현장에서 재확인하는 것이 바람직합니다.`,
    source:`IKPI`, url:`https://ikpi.or.id/articles/pemerintah-kejar-investasi-asing-lewat-integrasi-layanan-tka` },
  { cat:`kr`, date:`2026.11.11 개최`, title:`제12차 한-인니 방산협력위원회, 자카르타서 개최`,
    desc:`방위사업청은 11월11일 인도네시아 자카르타에서 인도네시아 국방부와 제12차 한-인니 방산협력위원회를 개최했다고 밝혔습니다. 한국 측은 정기영 방위사업청 미래전력사업본부장이, 인도네시아 측은 스리얀또 국방부 예비전력총국장이 각각 수석대표로 공동위원장을 맡았습니다. 한국에서는 한국항공우주산업(KAI), 한화오션, LIG D&A, 풍산, 한화에어로스페이스 등 10개 기업이, 인도네시아에서는 PT.DI, PT.PAL 등 약 30개 기업이 참가했습니다. 정부간 협력 세션에서는 완제품 수출 위주에서 벗어나 공동연구개발, 현지화 생산, 제3국 공동수출 등으로 협력모델을 다변화하는 방안이 논의됐습니다. KF-21, T-50, 잠수함 등 기존 진행 중인 사업의 이행 계획도 함께 점검했습니다. 기업간 세션에서는 신규 협력사업 발굴 등 네트워크 확대 성과가 있었다고 방사청은 평가했으나, 실질적인 구매계약이나 구체적 도입 규모 확정 등 가시적 성과는 이번에 나오지 않은 것으로 알려졌습니다. 이에 따라 올해 4월 한-인니 정상회담 이후 연내 타결 기대를 모았던 KF-21 수출계약도 인도네시아측 재정부담 등을 이유로 내년 상반기 이후로 미뤄질 수 있다는 관측이 나옵니다. 인도네시아에 진출한 방산·제조 분야 한국 기업은 이번 회의에서 논의된 현지화 생산·제3국 공동수출 모델이 구체화될 경우 현지 합작법인(PT PMA) 설립이나 부품 현지조달 비율 확대 요구가 커질 수 있다는 점을 참고할 필요가 있습니다.`,
    source:`fnnews`, url:`https://www.fnnews.com/news/202611111428263260` },
  { cat:`econ`, date:`2026.11.17~18 예정`, title:`BI 11월 금융통화회의 17~18일 개최, 금리 전망 주목`,
    desc:`인도네시아 중앙은행(BI)이 공개한 2026년도 월례 이사회의(Rapat Dewan Gubernur, RDG) 일정에 따르면 11월 회의는 11월17일(화)부터 18일(수)까지 이틀간 열리며, 둘째 날인 18일 총재 기자회견을 통해 결과가 발표될 예정이라고 비즈니스닷컴(Bisnis.com)이 전했습니다. 직전 10월 회의(10월20~21일)에서 BI는 기준금리(BI-Rate)를 5.75%로 3개월 연속 동결하는 한편, 대출시설(Lending Facility) 금리는 6.50%로 유지하고 예금시설(Deposit Facility) 금리만 5.00%로 소폭 상향한 바 있습니다. BI는 이 조정이 기준금리 동결과 예금시설 금리 인상, 지급준비율 완화를 결합해 시중 유동성을 지원하려는 조치라고 설명했습니다. BI는 3분기 GDP가 5.47% 성장해 예상치를 상회한 점, 10월 소비자물가 상승률이 3.23%로 전월(3.28%)보다 둔화된 점 등을 통화정책 여력을 가늠하는 근거로 보고 있는 것으로 파악됩니다. 다만 이번 11월 회의는 MSCI발 자본유출 우려와 루피아 변동성 확대가 겹치는 시점에 열리는 만큼, 시장에서는 BI가 환율 안정을 우선해 추가 동결에 나설 가능성이 높다는 관측이 나옵니다. 12월 회의는 12월15~16일로 예정돼 있어, 올해 마지막 통화정책 결정 기회가 한 차례 더 남아 있습니다. 루피아 조달비용이나 현지 대출을 활용하는 PT PMA는 11월18일 발표되는 BI의 금리 결정과 함께 나올 향후 정책 방향을 확인해 환리스크·자금조달 계획에 반영하는 것이 바람직합니다.`,
    source:`Bisnis.com`, url:`https://finansial.bisnis.com/read/20251222/11/1938911/jadwal-rapat-dewan-gubernur-rdg-bank-indonesia-2026-ini-daftar-lengkap-tanggal-resminya` },
  { cat:`kr`, date:`2026.11.06 보도`, title:`한-인도네시아 CEPA 발효 3년, 활용 과제 점검`,
    desc:`KOTRA는 11월6일 '한-인도네시아 CEPA 발효 3년, 양국 교역 성과와 활용 과제'라는 보고서를 발표했습니다. 이는 한-인도네시아 포괄적경제동반자협정(IK-CEPA) 발효 3주년을 맞아 그간의 성과와 남은 과제를 정리한 것입니다. 보고서는 협정의 실제 효과가 기업들의 활용도에 따라 달라진다는 점을 짚었습니다. 앞서 2026년9월 인도네시아 일간지 비즈니스 인도네시아는 양국 기업이 IK-CEPA가 제공하는 관세 혜택을 아직 충분히 활용하지 못하고 있다고 보도했으며, KOTRA도 이를 함께 인용했습니다. 이와 별도로 산업통상부에 따르면 10월28일 서울에서 제2차 한-인니 CEPA 공동위원회가 열려 협정 이행 현황 점검과 양국 통상 현안이 논의됐습니다. KOTRA 자카르타 FTA 활용지원센터의 실무 가이드에 따르면 협정 적용 품목은 3년에서 20년에 걸쳐 단계적으로 관세가 철폐되거나 인하됩니다. 인도네시아에 수출하거나 현지에서 생산해 한국으로 역수입하는 PT PMA는 자사 품목의 관세철폐 일정과 원산지 증명 요건을 다시 점검해 협정 혜택을 놓치지 않아야 합니다. 특히 FTA 활용률이 아직 낮다는 지적이 나온 만큼, 관세청·KOTRA가 제공하는 원산지 판정 지원 서비스를 적극 활용하는 것이 실무적으로 유리합니다. EU-인니 CEPA 서명이 임박한 가운데, 기존 한-인니 CEPA 활용도를 먼저 끌어올리는 것이 당장의 비용 절감에 더 직접적인 효과가 있다는 점도 참고할 만합니다.`,
    source:`KOTRA`, url:`https://dream.kotra.or.kr/user/extra/kotranews/bbs/linkView/jsp/Page.do?dataIdx=244969` },
];

function renderNews(lang){ const t = T[lang].news; return `
${siteHeader('news', lang)}
${pageHero('news','gold', lang, t.pageEyebrow, t.pageTitle, t.pageDesc)}
<section class="section">
  <div class="wrap">
    <div class="grid-3">
      <div class="news-card">
        <div class="news-ph">${ph(t.c1ph,'coffee')}</div>
        <div class="news-body"><span class="date">${t.c1date}</span><h4>${t.c1title}</h4><p>${t.c1desc}</p></div>
      </div>
      <div class="news-card">
        <div class="news-ph">${ph(t.c2ph,'green')}</div>
        <div class="news-body"><span class="date">${t.c2date}</span><h4>${t.c2title}</h4><p>${t.c2desc}</p></div>
      </div>
      <div class="news-card">
        <div class="news-ph">${ph(t.c3ph,'navy')}</div>
        <div class="news-body"><span class="date">${t.c3date}</span><h4>${t.c3title}</h4><p>${t.c3desc}</p></div>
      </div>
    </div>
    <div class="nl-panel">
      <div class="nl-head">
        <div>
          ${eyebrow(t.nlEyebrow)}
          <h3>${t.nlTitle}</h3>
          <p>${t.nlDesc}</p>
        </div>
        <span class="nl-period">${NEWSLETTER_PERIOD}</span>
      </div>
      <div class="nl-list">
        ${NEWSLETTER_ITEMS.map((n,i)=>{ const c = NL_CATS[n.cat]; return `
        <div class="nl-item">
          <div class="nl-rank">${i+1}</div>
          <div class="nl-body">
            <div class="nl-top"><span class="badge-pill ${c.theme}"><span class="dot"></span>${c.label}</span></div>
            <h4>${n.title}</h4>
            <p>${n.desc}</p>
            <div class="nl-meta">
              <span>${n.date}</span><span class="dot-sep"></span><span>${n.source}</span><span class="dot-sep"></span>
              <a class="nl-src" href="${n.url}" target="_blank" rel="noopener noreferrer">${t.nlSrcLabel}${icon('arrowRight',13)}</a>
            </div>
          </div>
        </div>`; }).join('')}
      </div>
      <p class="nl-note">${t.nlNote}</p>
    </div>
  </div>
</section>
${siteFooter(lang)}`; }

function renderCurrentPage(){
  document.documentElement.lang = currentLang;
  document.title = DOC_TITLE[currentLang] || DOC_TITLE.en;
  app.innerHTML = renderNews(currentLang) + fab(currentLang);
  window.scrollTo(0,0);
}
renderCurrentPage();
</script>
</body>
</html>
