  { cat:`econ`, date:`2026.08.18-19 (이번 주)`, title:`印 중앙은행, 이번 주 금리 결정...7월엔 5.75% 동결`,
    desc:`인도네시아 중앙은행(Bank Indonesia)이 지난 7월 21~22일 통화정책회의(RDG)에서 시장의 추가 인상 전망과 달리 기준금리(BI-Rate)를 5.75%로 동결했습니다. 예치금리(Deposit Facility)는 4.75%, 대출금리(Lending Facility)는 6.50%로 함께 유지됐습니다. 앞서 중앙은행은 지난 5월 50bp, 6월 25bp씩 잇달아 금리를 인상하며 루피아화 방어에 나선 바 있어, 7월의 동결 결정은 긴축 기조에 일단 제동을 건 것으로 해석됩니다. 중앙은행은 중동발 지정학적 불확실성이 이어지는 가운데서도 2026~2027년 물가상승률을 목표 범위인 2.5%±1% 이내로 관리하고 루피아화 안정을 지키는 데 우선순위를 두고 있다고 설명했습니다. 최근 한 달간 루피아화는 달러 대비 소폭 강세를 보였으나, 지난 1년간은 여전히 두 자릿수 약세를 나타내고 있어 통화 변동성에 대한 경계는 여전합니다. Bank Indonesia는 2026년도 월별 통화정책회의(RDG) 일정을 사전 공지했으며, 이번 주 화~수요일인 8월 18~19일이 바로 다음 회의로 예정되어 있습니다. 이번 회의에서는 동결 기조를 이어갈지, 혹은 완화 전환에 나설지가 관전 포인트입니다. 금리 결정은 PT PMA의 루피아 표시 차입 비용, 환헤지 전략, 설비·원자재 수입대금 결제 시점에 직접 영향을 미칩니다. 특히 금리 인하로 전환될 경우 단기적으로 루피아 변동성이 커질 수 있어, 대규모 루피아 환전이나 배당금 송금을 계획 중인 한국 기업은 회의 결과를 확인한 뒤 일정을 조정하는 것이 안전합니다. 현지 통화 대출을 활용 중인 기업이라면 이번 회의 결과에 따른 대출금리 변동 가능성도 함께 점검할 필요가 있습니다.`,

  { cat:`econ`, date:`2026.08.05 발표`, title:`2분기 GDP 5.29%↑...예상치 상회, 성장세는 둔화`,
    desc:`인도네시아 통계청(BPS)이 지난 8월 5일 발표한 자료에 따르면, 2026년 2분기 인도네시아 경제는 전년 동기 대비 5.29% 성장해 시장 전망치(약 5.1%)를 상회했습니다. 다만 이는 2025년 3분기 이후 가장 낮은 분기별 성장률로, 성장세 자체는 다소 둔화되는 흐름입니다. 불변가격 기준 2분기 GDP는 3576조2000억 루피아, 경상가격 기준으로는 6552조1000억 루피아를 기록했습니다. 생산 측면에서는 제조업, 도소매업, 정보통신업이 성장을 견인한 것으로 나타났습니다. 지출 측면에서는 가계소비가 성장 기여도 2.67%포인트로 가장 컸고, 정부소비가 1.07%포인트, 총고정자본형성(투자, PMTB)이 2.06%포인트를 각각 기여했습니다. 투자(PMTB) 항목의 견조한 기여는 외국인 직접투자를 포함한 설비투자가 여전히 성장의 중요한 축임을 보여줍니다. BPS는 국가별 통계 발표를 담당하는 에디 마흐무드(Moh. Edy Mahmud) 부청장이 자카르타에서 직접 브리핑을 진행했다고 밝혔습니다. 시장 예상치를 웃돈 성장률은 단기적으로 루피아화와 인도네시아 증시에 긍정적 신호로 해석될 수 있습니다. 다만 성장 둔화 추세가 이어질 경우 소비재·서비스업을 중심으로 사업을 운영하는 PT PMA는 하반기 매출 전망을 보수적으로 재점검할 필요가 있습니다. 설비투자·인프라 관련 사업을 하는 한국 기업이라면 투자(PMTB) 부문의 견조한 성장세를 참고해 신규 프로젝트 수주 기회를 모색해볼 만합니다.`,
    source:`BPS(인도네시아 통계청)`, url:`https://www.bps.go.id/en/pressrelease/2026/08/05/2605/ekonomi-indonesia-triwulan-ii-2026-tumbuh-5-29-persen--y-on-y-.html` },
  { cat:`reg`, date:`2026.08.04 체결`, title:`인니-사우디, 투자촉진 MOU 전격 체결`,
    desc:`인도네시아와 사우디아라비아가 지난 8월 4일(화) 양국 간 직접투자 협력·촉진에 관한 양해각서(MoU)를 체결했다고 밝혔습니다. 서명식에는 로산 로슬라니 인도네시아 투자·다운스트리밍부 장관 겸 투자조정청(BKPM) 청장과 파하드 빈 압둘잘릴 알사이프 사우디 투자부 장관이 참석했습니다. 이번 MoU는 양국 간 통계 데이터 공유, 투자정보 교환, 규제 프레임워크 업데이트를 핵심 내용으로 담고 있습니다. 아울러 민간부문 협의체 운영, 공동 투자유치 캠페인, 전문가 대표단 교류, 기술 노하우 공유 등 구체적 협력 메커니즘도 함께 규정됐습니다. 인도네시아 투자부에 따르면 2021년부터 2026년 상반기까지 사우디아라비아의 대인도네시아 실현 외국인직접투자(FDI)는 1억2620만 달러 규모로 집계됐습니다. 이번 협약은 글로벌 경제 지형 변화 속에서 각국이 안정적 파트너십을 모색하는 흐름 속에 이뤄진 것으로, 사우디는 '비전 2030' 경제 다각화 정책을, 인도네시아는 산업화·다운스트리밍·인프라 개발 가속화 정책을 각각 추진 중입니다. 이번 협약 자체가 특정 프로젝트나 자금 집행을 의미하는 것은 아니며, 향후 양국 간 구체적인 투자 프로젝트로 이어질지가 관건입니다. 인도네시아 진출을 검토 중인 한국 기업 입장에서는 이번 협약이 인도네시아 정부의 대외 투자유치 규제 프레임워크 개편 움직임의 일환이라는 점에 주목할 필요가 있습니다. 향후 유사한 양자 MoU가 한국을 포함한 다른 투자국과도 체결·개정될 가능성이 있어, 정기적으로 투자 관련 협정 동향을 확인하는 것이 좋습니다.`,
    source:`ANTARA News`, url:`https://en.antaranews.com/news/425757/indonesia-saudi-arabia-sign-mou-to-boost-direct-foreign-investment` },
  { cat:`reg`, date:`2026.08.14 보도`, title:`프라보워 대통령, 국제금융센터(IIFC) 설립 가속화 지시`,
    desc:`프라보워 수비안토 인도네시아 대통령이 지난 7월 23일 국제표준 금융센터인 인도네시아국제금융센터(IIFC, Indonesia International Financial Center) 설립을 가속화하라고 관계 장관들에게 지시했습니다. 이는 인도네시아의 투자 목적지로서의 경쟁력과 국제 수준의 금융서비스센터 기능을 강화하기 위한 조치로 추진되고 있습니다. 로산 로슬라니 투자부 장관은 8월 14일, 발리 누사두아에서 아시아 전역의 비즈니스 전문가 및 기관 110곳과 진행한 회의를 언급하며 IIFC 구상이 아시아 투자자들과 패밀리오피스로부터 긍정적 반응을 얻고 있다고 밝혔습니다. 국제표준 금융센터 건설에는 완전 가동까지 2~3년 정도가 소요될 것으로 예상되며, 그 준비 기간 동안에는 자카르타가 임시 거점으로 활용될 계획입니다. 최종적으로는 발리에도 국제금융센터 기능이 들어설 가능성이 거론되고 있어, 입지를 둘러싼 논의도 이어지고 있습니다. IIFC는 국부펀드 다난타라(Danantara)와 별도의 전담 기구가 관리할 것으로 알려졌습니다. 이는 인도네시아가 싱가포르, 홍콩 등 역내 금융허브에 대응해 독자적인 국제금융센터를 육성하려는 장기 전략의 일환으로 해석됩니다. 다만 구체적인 세제 인센티브, 입주 자격, 규제 프레임워크 등 세부 제도는 아직 확정되지 않아 향후 추가 공표를 지켜봐야 합니다. 금융, 자산운용, 패밀리오피스 관련 사업을 검토 중인 한국 기업이라면 IIFC의 구체적 제도 설계 단계부터 관련 동향을 주시할 필요가 있습니다. 제조업 중심 PT PMA라도 향후 인도네시아의 자본시장 접근성과 외화 조달 환경이 개선될 수 있다는 점에서 중장기적으로 참고할 만한 정책 흐름입니다.`,
    source:`ANTARA News`, url:`https://en.antaranews.com/news/427247/indonesia-leverages-growing-appeal-with-new-investment-hub-plan` },
  { cat:`tax`, date:`2026.05.01 시행`, title:`세무부, PMK 28/2026으로 세무조사·환급 규정 강화`,
    desc:`인도네시아 재무부가 지난 5월 1일부로 시행된 재무부령(PMK) 제28호(2026)를 통해 세금 환급(restitusi) 절차와 국세청(DJP)의 행정제재 부과 기준을 대폭 정비했습니다. 이번 규정은 기존 PMK 39/2018호부터 PMK 119/2024호에 이르는 여러 개별 규정을 통합·대체하는 것으로, 세무행정 전반의 정합성을 높이는 데 목적이 있습니다. 핵심 변화는 예비환급(가속환급, restitusi dipercepat)과 정식 세무조사를 통한 환급을 명확히 구분하고, 각각에 요구되는 서류·심사 절차를 별도로 규정한 점입니다. 예비환급을 받으려면 재무제표가 3년 연속 적정의견(unqualified opinion)을 받아야 하고, 중요한 수정사항이 매출의 5%를 넘지 않아야 하는 등 요건이 한층 까다로워졌습니다. 또한 일부 예비환급 유형은 최대 10억 루피아로 한도가 설정되어, 국세청이 가속환급 승인에 더욱 신중해질 것으로 예상됩니다. DJP는 전자데이터 검증과 시스템상 성실납세 이력 확인을 강화하는 방향으로 행정 절차를 재설계하고 있습니다. 업계에서는 이번 개정과 맞물려 2026년 하반기 세무조사 강도가 한층 강화될 것으로 전망하고 있습니다. 부가가치세 환급을 자주 신청하는 수출 중심 PT PMA나 투자 초기 매입세액이 매출세액을 상회하는 신설 법인은 이번 개정의 서류 요건을 재점검해야 합니다. 특히 재무제표 감사의견 이력이 짧거나 감사보고서에 중요한 수정사항이 있는 기업은 예비환급 대신 정식 세무조사 절차를 거쳐야 할 가능성이 커진 만큼, 세무 전문가와 사전 상담을 권장합니다. 환급 신청 전 회계·세무 기록의 정합성을 미리 점검해두면 심사 지연이나 반려 위험을 줄일 수 있습니다.`,
    source:`DDTCNews`, url:`https://news.ddtc.co.id/berita/nasional/1819162/pmk-282026-rombak-aturan-restitusi-dipercepat-ini-pernyataan-djp` },
  { cat:`tax`, date:`2026.10.01-15 마감`, title:`LKPM 3분기(7~9월) 보고, 10월 1~15일 마감`,
    desc:`인도네시아 투자조정청(BKPM) 규정 5호(2025)에 따라, PT PMA를 포함한 모든 대규모 사업자는 투자실적보고서(LKPM)를 분기별로 OSS 시스템을 통해 제출해야 합니다. 외국인투자기업(PT PMA)은 투자 규모와 무관하게 항상 '대규모 사업자'로 분류되어 예외 없이 분기 보고 의무를 집니다. 2025년 개정 규정에 따라 제출 마감일이 기존 매 분기 10일에서 15일로 연장되어, 4월·7월·10월·1월 각 15일이 새로운 마감일로 적용되고 있습니다. 이에 따라 3분기(7~9월) 실적에 대한 LKPM은 10월 1일부터 15일 사이에 제출해야 합니다. 보고 항목에는 실제 투자 실현액, 고용 인원, 생산·판매 현황 등이 포함되며, 사업 진행 상황을 있는 그대로 정확히 기재해야 합니다. BKPM 규정 5호는 미제출·부실 보고에 대해 단계적 제재를 명시하고 있는데, 1차 위반 시 서면 경고, 반복 위반 시 사업허가(라이선스) 정지, 최종적으로는 사업자등록번호(NIB) 취소까지 이어질 수 있습니다. 특히 4개 분기 연속 투자실현액이 '0'으로 보고될 경우 OSS 시스템이 자동으로 행정제재를 발동하도록 설계되어 있어 각별한 주의가 필요합니다. 아직 시일은 남았지만, 신설 또는 최근 증자한 PT PMA는 3분기 실적 자료를 미리 취합해두는 것이 마감 임박 시 혼선을 줄이는 방법입니다. 특히 담당 인력 교체나 OSS 계정 접근 권한 문제로 마감을 놓치는 사례가 잦은 만큼, 한국 기업은 마감 2주 전쯤 담당자 지정과 계정 상태를 사전 점검하는 것을 권장합니다. 보고 데이터는 향후 세무조사·인허가 심사에서도 참고자료로 활용될 수 있어 실제 사업 현황과 일치하도록 성실히 작성해야 합니다.`,
    source:`Emerhub Indonesia`, url:`https://emerhub.com/indonesia/lkpm-report/` },
  { cat:`tip`, date:`2026.06.18 마감 · 계속 이슈`, title:`KBLI 2025 전환 마감 도과...미전환시 정지 위험`,
    desc:`인도네시아 통계청(BPS) 규정 7호(2025)에 따라 모든 사업자는 신규 표준산업분류체계인 'KBLI 2025'로 사업분류코드를 전환해야 했으며, 그 최종 마감일은 지난 6월 18일이었습니다. KBLI(Klasifikasi Baku Lapangan Usaha Indonesia)는 인도네시아의 공식 업종분류 체계로, 사업자등록번호(NIB)와 사업 인허가 전반의 기준이 되는 핵심 코드입니다. OSS 시스템과 법무인권부 산하 AHU 시스템 등 관계기관들도 이 날짜를 기해 KBLI 2025 체계로 완전히 전환을 마쳤습니다. 문제는 마감일이 이미 두 달 가까이 지났음에도 불구하고, 여전히 구(舊) 분류체계로 등록된 사업자 계정이 적지 않다는 점입니다. 아직 전환을 완료하지 못한 사업자는 계정이 일시 정지 상태로 표시되거나, 신규 인허가·라이선스 신청 시 시스템에서 반려되는 사례가 발생하고 있는 것으로 파악됩니다. 전환 작업은 기존 KBLI 코드를 새 체계의 대응 코드로 매핑하고, 사업 실태와 코드가 일치하는지 재확인하는 절차를 포함합니다. 만약 사업 영역이 세분화되거나 통합된 경우 단순 매핑이 아니라 신규 인허가 절차를 다시 밟아야 할 수도 있어 주의가 필요합니다. 사업자등록증(NIB)이나 관련 인허가를 아직 KBLI 2025로 갱신하지 않은 PT PMA는 우선적으로 OSS 계정 상태를 확인해야 합니다. 특히 라이선스 갱신, 증자, 신규 사업장 개설 등을 앞두고 있는 한국 기업이라면 전환 미비로 절차가 지연되지 않도록 최우선적으로 점검할 것을 권장합니다. 현지 법무·인허가 대행사를 통해 조속히 KBLI 코드 전환 여부를 재확인하고, 필요 시 즉시 보완 신청을 진행하는 것이 안전합니다.`,
    source:`TraceWorthy`, url:`https://www.traceworthy.com/kbli-2025-migration-deadline-pt-pma-indonesia/` },
  { cat:`tip`, date:`2026.01.01 시행 · 계속 적용`, title:`2026년 최저임금 5~8% 인상...신산정공식 적용`,
    desc:`인도네시아는 전국 단일 최저임금 없이 각 주(州)가 매년 자체적으로 지역최저임금(UMP)을 결정하고, 일부 시·군은 이보다 높은 지역별 최저임금(UMK)을 별도로 책정하는 구조를 운영합니다. 2026년 1월 1일부로 전국 38개 주가 새 최저임금을 일제히 발효시켰으며, 전국 평균 인상률은 전년 대비 5~8% 수준입니다. 수도 자카르타(DKI Jakarta)의 2026년 UMP는 572만9876루피아로, 2025년 대비 6.17% 인상됐습니다. 올해부터는 정부규정(PP) 제49호(2025)에 따른 새로운 산정공식이 처음 적용됐는데, 지역별 물가상승률과 경제성장률에 더해 노동의 지역경제 기여도를 반영하는 알파(Alpha) 계수(0.50~0.90)가 새로 추가된 것이 특징입니다. 최저임금은 근속 1년 미만 근로자에게만 그대로 적용되며, 근속 1년을 초과한 근로자에 대해서는 회사가 별도의 공식 임금체계·등급표(SUSU, Struktur dan Skala Upah)를 갖춰 적용해야 합니다. 사업장이 여러 주에 걸쳐 있는 기업은 본사 소재지가 아니라 실제 근무지 기준으로 해당 지역의 최저임금을 적용해야 한다는 점도 실무상 자주 놓치는 부분입니다. 외국인 투자기업(PT PMA)도 현지 기업과 동일하게 최저임금 규정을 준수해야 하며, 위반 시 최대 4억 루피아의 벌금 또는 1~4년의 징역형에 처해질 수 있는 형사처벌 대상입니다. 인건비 비중이 큰 제조업·서비스업 분야 한국 기업은 사업장별 UMP·UMK를 개별적으로 재확인하고, 근속 1년 이상 직원에 대한 임금체계(SUSU) 마련 여부를 함께 점검해야 합니다. 연말 임금 협상이나 신규 채용 계획을 세울 때는 이번에 도입된 알파 계수 기반 산정공식의 변동 요인도 함께 감안하는 것이 바람직합니다.`,
    source:`ILA Global Consulting`, url:`https://ilaglobalconsulting.com/2026-indonesia-minimum-wage/` },
  { cat:`kr`, date:`2026.07.27 개최`, title:`서울서 한·인니 비즈니스포럼...한국기업 30곳 참가`,
    desc:`주한 인도네시아 대사관이 지난 7월 27일 서울 페어몬트 앰배서더 호텔에서 '인도네시아-한국 비즈니스포럼 2026'을 개최했습니다. '인도네시아 투자: 전략적 산업 파트너십 심화'를 주제로 열린 이번 포럼에는 국내 주요 기업·산업단체 30곳의 대표들이 참석했습니다. 포럼은 첨단제조, 그린에너지 전환, 디지털 인프라 등 3대 분야를 중심으로 양국 기업 간 실질적 협력 기회를 모색하는 자리로 마련됐습니다. 대사관 측은 이번 행사를 통해 인도네시아의 우선 육성 산업 분야에 대한 고품질 한국 자본 유치를 적극 독려했다고 밝혔습니다. 한국 외교부도 전기차, 청정에너지, 인공지능(AI) 분야에서 국내 기업들의 강한 관심을 확인했다고 전했습니다. 인도네시아 투자부 집계에 따르면 2021년부터 2025년까지 한국의 대인도네시아 투자 누적액은 114억5000만 달러에 달합니다. 이는 앞서 지난 4월 이재명 대통령과 프라보워 대통령이 서울에서 정상회담을 갖고 핵심광물·기술·청정에너지 분야 협력 확대에 합의한 데 이은 후속 행보로 풀이됩니다. 당시 정상회담에서는 재생에너지, 데이터센터 관련 프로젝트 지원 방안도 함께 논의된 바 있습니다. 인도네시아 진출을 검토 중이거나 이미 진출한 한국 기업은 이번 포럼을 계기로 형성되는 정부 간 협력 채널과 양국 산업단체의 후속 네트워킹 프로그램을 참고할 만합니다. 특히 전기차·배터리·청정에너지·AI 분야는 정부 차원의 정책적 지원이 뒤따를 가능성이 높은 만큼, 관련 업종 기업이라면 대사관이나 코트라를 통해 후속 상담 기회를 적극적으로 모색해볼 필요가 있습니다.`,
    source:`ANTARA News`, url:`https://en.antaranews.com/news/424329/seoul-forum-indonesia-seeks-more-south-korean-industrial-capital` },
  { cat:`kr`, date:`2026.08.28-29 예정`, title:`KOTRA, 발리서 '한·아세안 마리타임 위크' 개최 예정`,
    desc:`KOTRA(대한무역투자진흥공사)가 오는 8월 28~29일 인도네시아 발리에서 국내 조선해양 기자재 기업들의 아세안 시장 진출을 지원하기 위한 '2026 한·아세안 마리타임 위크'를 개최한다고 밝혔습니다. 이번 행사는 국내 조선업 수출이 3년 연속 증가세를 이어가는 가운데, 이러한 호조세를 조선해양 기자재 기업의 해외 진출 기회로 확대하기 위해 기획됐습니다. 행사에서는 현지 조선소, 해운사 등과의 수출 상담회 및 전시가 함께 진행될 예정입니다. KOTRA 관계자는 아세안 시장이 해양 인프라 개발과 중소형 선박 건조 수요 증가로 새로운 조선해양 거점으로 주목받고 있다고 설명했습니다. 현지 조선소와 해운사들의 한국 기업에 대한 협력 수요가 이미 확인된 만큼, KOTRA는 K-조선해양 중소·중견기업의 아세안 진출 지원을 한층 확대하겠다는 방침입니다. 인도네시아는 동남아 최대 도서국가로 연안·근해 물류, 어업, 해양플랜트 수요가 꾸준한 지역인 만큼, 조선기자재뿐 아니라 선박 정비(MRO)·항만 설비 분야 기업에도 관심을 가질 만한 시장입니다. 아직 행사 개최 전 단계로, 참가 기업 명단이나 구체적 상담 성과는 행사 이후 추가로 공개될 예정입니다. 조선기자재, 선박 부품, 해양플랜트 관련 사업을 하는 한국 중소·중견기업이라면 이번 발리 행사의 참가 신청 여부를 KOTRA 자카르타 무역관 등을 통해 확인해볼 만합니다. 이미 인도네시아에 진출한 PT PMA 형태의 조선 관련 기업이라면, 이번 행사를 계기로 형성되는 현지 조선소·해운사 네트워크를 협력사 발굴이나 공급망 확대에 활용할 수 있습니다. 발리 현지 인허가나 통관 절차에 대한 사전 문의가 필요하다면 행사 기간 중 KOTRA 부스를 통해 실무 상담을 받아보는 것도 방법입니다.`,
    source:`서울경제`, url:`https://www.sedaily.com/article/20073177` },
];

function renderNews(lang){ const t = T[lang].news; return `
${siteHeader('news', lang)}
${pageHero('news','gold', lang, t.pageEyebrow, t.pageTitle, t.pageDesc)}
<section class="section">
  <div class="wrap">
    <div class="grid-3">
      <div class="news-card">
        <div class="news-ph">${ph(t.c1ph,'coffee')}</div>
        <div class="news-body"><span class="date">${t.c1date}</span><h4>${t.c1title}</h4><p>${t.c1desc}</p></div>
      </div>
      <div class="news-card">
        <div class="news-ph">${ph(t.c2ph,'green')}</div>
        <div class="news-body"><span class="date">${t.c2date}</span><h4>${t.c2title}</h4><p>${t.c2desc}</p></div>
      </div>
      <div class="news-card">
        <div class="news-ph">${ph(t.c3ph,'navy')}</div>
        <div class="news-body"><span class="date">${t.c3date}</span><h4>${t.c3title}</h4><p>${t.c3desc}</p></div>
      </div>
    </div>
    <div class="nl-panel">
      <div class="nl-head">
        <div>
          ${eyebrow(t.nlEyebrow)}
          <h3>${t.nlTitle}</h3>
          <p>${t.nlDesc}</p>
        </div>
        <span class="nl-period">${NEWSLETTER_PERIOD}</span>
      </div>
      <div class="nl-list">
        ${NEWSLETTER_ITEMS.map((n,i)=>{ const c = NL_CATS[n.cat]; return `
        <div class="nl-item">
          <div class="nl-rank">${i+1}</div>
          <div class="nl-body">
            <div class="nl-top"><span class="badge-pill ${c.theme}"><span class="dot"></span>${c.label}</span></div>
            <h4>${n.title}</h4>
            <p>${n.desc}</p>
            <div class="nl-meta">
              <span>${n.date}</span><span class="dot-sep"></span><span>${n.source}</span><span class="dot-sep"></span>
              <a class="nl-src" href="${n.url}" target="_blank" rel="noopener noreferrer">${t.nlSrcLabel}${icon('arrowRight',13)}</a>
            </div>
          </div>
        </div>`; }).join('')}
      </div>
      <p class="nl-note">${t.nlNote}</p>
    </div>
  </div>
</section>
${siteFooter(lang)}`; }

function renderCurrentPage(){
  document.documentElement.lang = currentLang;
  document.title = DOC_TITLE[currentLang] || DOC_TITLE.en;
  app.innerHTML = renderNews(currentLang) + fab(currentLang);
  window.scrollTo(0,0);
}
renderCurrentPage();
</script>
</body>
</html>
