  { cat:`reg`, date:`2027.01.01 전면시행`, title:`전략자원 수출통제 PP24/2026, 내년 전면시행`,
    desc:`더구루(TheGuru)는 11월 보도에서, 인도네시아 정부가 올해 발효시킨 '전략 천연자원 수출 거버넌스에 관한 정부규정(PP) 24/2026'에 따라 석탄·팜유·합금철 등 전략자원 수출을 국영 수출전담기구(DSI)가 총괄하는 체제로 전환하고 있다고 전했습니다. 이 규정에 따르면 DSI가 해당 품목의 판매가격과 마진 책정 권한을 갖게 되며, 정부는 저가 청구(under-invoicing)와 이전가격 조작 등 부정 무역 관행을 근절하고 수출대금의 국내 유입을 극대화하는 것을 목표로 내세우고 있습니다. 올해 말까지는 과도기로 설정돼 민간 수출업체가 기존처럼 운영 통제권을 유지하되, 재무부 관세청과 연계된 통합시스템을 통해 거래 내역을 DSI에 보고해야 하며, 2027년1월1일부터는 새 체제가 전면 시행됩니다. 다만 싱가포르 매체 SCMP는 정부가 당초 검토했던 '단독 수출업체' 독점 방식을 철회하고, DSI가 모든 수출 건을 사전 검토·승인하는 방식으로 선회했다고 보도해 세부 운영 방식을 두고 보도마다 다소 차이가 있습니다. 중국계 매체 SMM은 이미 6월1일부터 국영 지정기업을 통한 일원화 관리가 시작됐다고 전해, 시행 시점 자체도 자료별로 엇갈리는 상황입니다. 합금철(페로알로이)이 대상 품목에 포함되어 있어 니켈·철강 등 광물 가공 분야에 투자한 한국계 PT PMA에도 직접적인 영향이 예상됩니다. 해당 품목을 생산·수출하는 PT PMA는 거래 보고 의무와 가격·마진 결정권 이전에 따른 현금흐름·계약조건 변화를 사전에 점검해야 합니다. 특히 포스코 등 철강·합금철 관련 투자를 검토 중인 한국 기업은 2027년1월 전면 시행 전까지 과도기 보고 의무를 준수하면서 DSI 체제 하의 구체적 운영 지침을 주시할 필요가 있습니다. 정확한 시행 범위와 절차는 아직 정부 공식 발표로 확정되지 않은 부분이 있어, 투자·법률 자문사를 통한 추가 확인이 권장됩니다.`,

  { cat:`tax`, date:`2027.01.15 제출기한`, title:`LKPM 4분기 제출기한 2027년1월15일, 사전준비 당부`,
    desc:`투자행정 전문매체 izin.co.id는 11월 보도에서, 2026년4분기(10~12월) 투자활동보고서(LKPM)의 정규 제출기한이 투자부/BKPM 규정 5/2025 제286조에 따라 2027년1월15일로 정해져 있다고 안내했습니다. 다만 BKPM이 실제로 제출 창구를 여는 정확한 개시일은 이번 보도 시점까지 공식 공지되지 않은 것으로 확인됩니다. 과거 패턴을 보면 2026년3분기 LKPM은 10월1일부터 15일까지 접수가 진행됐고, 1분기 LKPM도 4월1일부터 15일까지 접수됐던 점에 비춰, 4분기 역시 2027년1월1일경 개시돼 15일에 마감될 가능성이 높다고 izin.co.id는 추정하면서도 이는 추정일 뿐 확정 공지를 BKPM과 OSS 계정을 통해 반드시 재확인해야 한다고 당부했습니다. 과거 제출기한이 매월 10일이었던 점을 기억하는 기업이 많으나, 현재는 매월 15일로 변경됐다는 점도 함께 짚었습니다. 지난주 다룬 2회 연속 미제출시 행정제재(서면경고→사업활동 일시정지·과태료→NIB 취소) 규정과 맞물려, 이번 4분기분을 기한 내 제출하는 것이 특히 중요합니다. 제출기한이 공휴일과 겹칠 경우 일정이 조정되며 이는 OSS를 통해 별도 공지된다고 설명됩니다. PT PMA는 연말 결산 작업과 겹치는 시기임을 감안해 4분기 투자실현 데이터(토지·건물·설비 투자액, 고용인원 등)를 미리 정리해 두는 것이 바람직합니다. 특히 직전 분기 보고를 누락한 적이 있는 PT PMA는 이번 보고를 반드시 기한 내 마쳐 2회 연속 누락에 따른 제재 대상이 되지 않도록 주의해야 합니다.`,
    source:`izin.co.id`, url:`https://izin.co.id/blog/lkpm-triwulan-iv/` },
  { cat:`tip`, date:`2026.12.01 경고~2027.01.02 차단`, title:`PT 연차보고서 미제출시 12월부터 AHU 제재 시행`,
    desc:`법인등기총국(Ditjen AHU)은 10월27일 공고를 통해, PT(주식회사)의 2025년도 연차보고서(Laporan Tahunan) 승인 미제출에 대한 행정제재 일정을 2단계로 확정해 발표했다고 izin.co.id와 IKPI가 전했습니다. 1단계로 2026년12월1일부터 31일까지 SABH(법인행정시스템) 알림 또는 이메일을 통한 서면경고가 발송되며, 통지 후 30일 내 의무를 이행하지 않으면 2단계로 2027년1월2일부터 SABH 접근이 차단됩니다. 법적 근거는 법무부령(Permenkum) 49/2025로, 이사회가 연차보고서를 작성해 주주총회(RUPS) 승인을 받은 뒤 공증인을 통해 아크타 서명일로부터 30일 내 법무부에 제출해야 한다고 규정하고 있습니다. 보고서에는 이사·감사의 명단과 급여·수당을 포함한 7개 필수 항목이 담겨야 합니다. SABH 접근이 차단되면 이사·감사 구성 변경 등 법인 정보 변경 신청 자체가 불가능해지므로, 인사이동이 예정된 PT PMA는 특히 주의가 필요합니다. bplawyers 자료에 따르면 차단 해제 수수료는 정부규정(PP) 30/2026에 따라 외부감사 의무 법인은 건당 200만 루피아, 비의무 법인은 100만 루피아로 책정돼 있습니다. 당초 제재 시행 시점이 2026년11월로 알려졌다가 이번에 12월·1월로 재조정된 것이어서, 혼선을 피하려면 AHU의 공식 인스타그램(@djahu_kemenkum) 공지를 재확인하는 것이 안전합니다. 아직 2025년도 연차보고서 승인을 받지 못한 PT PMA는 늦어도 11월 안에 이사회·주주총회 절차를 마치고 공증을 받아 제출하는 것이 바람직합니다.`,
    source:`izin.co.id`, url:`https://izin.co.id/blog/ditjen-ahu-umumkan-jadwal-sanksi-laporan-tahunan-pt-blokir-sabh-mulai-januari-2027/` },
  { cat:`econ`, date:`2026.11.18 결정`, title:`BI, 기준금리 25bp 깜짝 인상해 6.00%로`,
    desc:`인도네시아 중앙은행(BI)은 11월17~18일 이틀간 열린 월례 이사회의(RDG) 결과, 기준금리(BI-Rate)를 25bp 인상해 6.00%로 올렸다고 18일 데스트리 다마야티 총재가 기자회견에서 발표했습니다. 이에 따라 예금시설(Deposit Facility) 금리는 5.25%로, 대출시설(Lending Facility) 금리는 6.75%로 각각 함께 상향됐습니다. 시장 컨센서스는 5.75% 동결을 예상했던 만큼 이번 인상은 다소 깜짝 결정으로 받아들여졌으며, Bloomberg Technoz 등은 루피아 방어를 위한 선제적 조치라고 평가했습니다. 결정 직전 루피아는 1달러당 18,245루피아로 10월 말 대비 0.66% 약세를 보이고 있었고, BI는 루피아 안정이 이번 인상의 핵심 고려 요인이었다고 설명했습니다. 한 이코노미스트는 이번 인상이 올해 들어 네 번째 기준금리 인상이라고 지적했습니다. BI는 금리 인상과 동시에 지급준비율(GWM) 완화를 11월1일과 12월1일에 걸쳐 단계적으로 시행해 시중 유동성을 지원하는 '상쇄' 조치도 함께 발표했습니다. 사무엘증권은 이번 인상이 단기적으로 루피아에 지지력을 줄 수 있으나 실제 강세 여부는 글로벌 위험선호와 외국인 자금 회복세에 좌우될 것이라고 분석했습니다. 반면 금리 인상은 은행 마진 압박, 고부채 기업·소비재·금융·부동산 업종의 자금조달 비용 상승으로 이어질 수 있다는 우려도 함께 제기됩니다. 12월15~16일로 예정된 다음 RDG가 올해 마지막 통화정책 결정 기회이며, 루피아 조달·현지 대출을 활용하는 PT PMA는 금리 상승에 따른 조달비용 증가를 2027년 예산에 반영하는 것이 바람직합니다.`,
    source:`Bank Indonesia`, url:`https://www.bi.go.id/en/iru/highlight-news/Pages/BI-Rate-Raised-25-bps-to-6.00-percent-Strengthening-Stability,-Supporting-Economic-Growth.aspx` },
  { cat:`reg`, date:`2026.11.06 발표`, title:`광물 수출대금 외화보유 특례, 한·일·EU로 확대`,
    desc:`Indonesia Business Post 등 현지 매체는 11월3일 경제조정 부처 회의 결정을 거쳐 6일 아이를랑가 하르타르토 경제조정부 장관이 발표한 내용으로, 광물 수출대금(DHE SDA) 외화 보유 특례 적용 대상국이 한국·일본·EU 투자자가 지배하는 광산기업으로 확대된다고 전했습니다. 이는 정부규정(PP) 21/2026 제18A조에 근거한 특례로, 기존에는 미국·캐나다·중국·홍콩·호주 투자자 소유 기업에만 적용되고 있었습니다. 특례를 적용받는 적격 광산 수출업체는 천연자원 수출대금의 최소 30%를 최소 3개월간 인도네시아 국내에 보유해야 하는 요건을 충족해야 합니다. 이번 확대 조치가 실제로 효력을 가지려면 재무부령 48/2026 개정 등 추가 기술적 절차가 남아 있어, 아직 시행 세부사항이 모두 확정된 것은 아닙니다. 함께 발표된 내용에 따르면 천연자원 수출대금을 취급할 수 있는 지정 외환은행도 기존 15곳(국영 5·민간 10)에서 16곳(국영 5·민간 11)으로 확대됩니다. 그동안 한국계 광산·니켈 관련 PT PMA는 미국·중국계 기업과 달리 수출대금 전액을 국내 은행에 예치해야 하는 등 상대적으로 불리한 조건에 있었는데, 이번 조치로 그 격차가 해소될 전망입니다. 다만 재무부령 개정이 완료되기 전까지는 기존 요건이 그대로 적용되므로, 해당 업종 PT PMA는 세부 시행규정 공개 시점을 주시해야 합니다. 니켈·광물 가공 분야에 투자한 한국 기업은 이번 특례 확대를 자금관리 계획에 반영하되, 재무부령 개정 완료 여부를 금융기관을 통해 사전에 확인하는 것이 바람직합니다.`,
    source:`Indonesia Business Post`, url:`https://indonesiabusinesspost.com/7778/markets-and-finance/indonesia-expands-export-proceeds-concessions-for-mining-firms-with-investors-from-eight-markets` },
  { cat:`tax`, date:`2026.12.31 세액납부 마감`, title:`글로벌최저한세 적용대상 확정, 12월31일 납부시한`,
    desc:`DDTC뉴스는 11월 보도에서, 국세청(DJP) 빔보 위자얀토 청장이 글로벌최저한세(GMT/GloBE) 적용대상을 공식 집계해 발표했다고 전했습니다. 국내 최상위지배기업(UPE) 37곳과 그 국내 자회사 1,721곳이 적용대상이며, 이와 별도로 해외 UPE 1,717곳과 그 인도네시아 내 자회사 4,688곳도 함께 적용대상에 포함된다고 밝혔습니다. 적용 기준은 연결재무제표 기준 매출 7억5,000만 유로 이상인 다국적기업 그룹입니다. 국세청 FAQ(PMK 136/2026)에 따르면, 2025년1~12월 회계연도 그룹의 경우 추가세액(top-up tax) 납부기한은 2026년12월31일로 명시돼 있습니다. 세무등록(WP GloBE 지위 추가) 자체는 PER-6/PJ/2026 제4조2항에 따라 GloBE 과세연도 종료 후 9개월 내, 즉 1~12월 회계연도 그룹은 2026년9월까지였던 것으로 확인되며 이는 이미 지난 시한입니다. 다만 국세청은 최초 적용연도(2025년)의 GloBE SPT 신고기한은 2027년6월30일까지로 별도 연장해 두었습니다. 지난달 DDTC 보도에서는 전체 22,662개 대상 납세자 중 GloBE 지위 등록을 마친 비율이 약 25%에 불과하다는 점도 지적된 바 있습니다. 이 제도는 PT PMA 자체의 매출이 아니라 소속된 다국적 모그룹의 연결매출을 기준으로 적용 여부가 결정되므로, 대규모 한국 대기업 그룹 산하 PT PMA는 모그룹의 GloBE 적용 여부와 등록·신고 현황을 그룹 본사 세무팀을 통해 반드시 확인해야 합니다.`,
    source:`DDTC News`, url:`https://news.ddtc.co.id/berita/nasional/1824090/djp-identifikasi-ribuan-entitas-tercakup-pajak-minimum-global` },
  { cat:`econ`, date:`2026.11.19 보도`, title:`루피아, 금리인상에도 2026년 누적 8.4% 약세`,
    desc:`비즈니스닷컴(Bisnis.com)은 11월19일, BI의 기준금리 인상 발표 다음 날에도 루피아가 2026년 연초 대비 누적 8.4% 약세를 보이고 있다고 보도하며, BI가 이를 글로벌 여건 탓으로 설명했다고 전했습니다. 다만 금리 인상 당일인 11월18일 루피아는 시장 예상과 달리 0.13% 소폭 강세를 보이며 1달러당 18,232루피아로 마감했습니다. 금리 결정을 앞두고 국내 증시에서는 11월16일까지 약 9억 달러 규모의 외국인 자금 유출이 있었으며, 종합주가지수(IHSG)는 금리 발표 직전 6,608.5포인트까지 하락했습니다. 사무엘증권은 금리 인상이 단기적으로 루피아에 지지력을 제공할 수 있으나, 실제 강세 전환 여부는 글로벌 위험선호 및 외국인 자금 회복세에 달려 있다고 분석했습니다. BI는 환율시장 모니터링을 지속하며 역외선물환(DNDF)과 현물시장 개입 수단을 준비해 두고 있다고 밝혔습니다. 이코노미스트들은 금리 인상에 따라 은행 마진이 압박받을 수 있으며, 고부채 기업·소비재·금융·부동산 업종이 긴축 영향에 상대적으로 취약하다고 지적했습니다. 올해 네 차례에 걸친 금리 인상에도 루피아 약세가 이어지고 있다는 점은 환율 리스크가 단기간에 해소되기 어려움을 시사합니다. 외화 결제·외화 부채가 있는 PT PMA는 연말까지 루피아 변동성이 이어질 가능성에 대비해 환헤지 수단과 결제 일정을 재점검하는 것이 바람직합니다.`,
    source:`Bisnis.com`, url:`https://finansial.bisnis.com/read/20261119/11/2022820/rupiah-melemah-84-sepanjang-2026-bi-singgung-kondisi-global` },
  { cat:`tip`, date:`2026.11.21 결정시한`, title:`UMP 2027 결정 임박, 노사정 제안액 격차`,
    desc:`DDTC뉴스는 11월 보도에서, 신 노동자보호법(UU 27/2026) 제137~139조에 따라 각 주정부는 2027년도 지방최저임금(UMP)을 2026년11월21일까지 확정해야 하며, 시군 최저임금(UMK)은 11월25일, 업종별 최저임금(UMSP·UMSK)은 각각 11월26일과 30일까지 정해야 한다고 전했습니다. DKI자카르타 임금위원회는 11월18일 회의를 열어 노동계·경영계·정부 3자의 2027년 UMP 제안액을 논의했는데, 노동계는 약 609만 루피아, 경영계는 약 605만 루피아를 제시해 격차가 크지 않은 것으로 나타났습니다. 3자 모두 'UMP 2026 + 물가상승률 + (경제성장률×알파지수)' 공식 자체에는 합의했으나, 핵심 쟁점인 알파지수 값을 두고는 이견이 남아 있는 것으로 파악됩니다. 노동조합총연맹(KSPI)은 전국 단위로 최대 9.5%까지의 인상을 지속적으로 요구하고 있습니다. 참고로 2026년도 DKI자카르타 UMP는 전년 대비 6.17% 오른 572만9,876루피아로 확정됐었습니다. 11월21일 시한이 이미 지난 현재(11월23일 기준), 검색 시점까지 전국 또는 DKI자카르타의 2027년 UMP 최종 확정치는 공식 보도로 확인되지 않았습니다. 확정치가 공개되는 즉시 지역별 인상률이 상이할 수 있으므로, PT PMA는 사업장 소재 주(州)의 주지사 결정(Kepgub)을 직접 확인해야 합니다. 확정 발표 전까지 PT PMA는 노사 제안액 범위(약 5~9%대)를 참고해 2027년도 인건비 예산을 복수 시나리오로 준비해 두는 것이 안전합니다.`,
    source:`DDTC News`, url:`https://news.ddtc.co.id/berita/nasional/1824175/provinsi-wajib-tetapkan-ump-2027-paling-lambat-21-november` },
  { cat:`kr`, date:`2026.11.15 보도`, title:`한-인니 청정에너지 협력, 산업전략 전환 필요성 제기`,
    desc:`자카르타포스트(The Jakarta Post)는 11월15일, 10월30일 자카르타에서 열린 토론회 내용을 바탕으로 한국과 인도네시아의 청정에너지 협력을 구체적 산업전략으로 전환해야 한다는 지적이 나왔다고 보도했습니다. 양국은 지난 4월 정상회담을 계기로 청정에너지·핵심광물·탄소포집 분야를 포함한 10건의 양해각서(MoU)를 체결했으나, 토론회 참석자는 "그 MoU 서명 이후 인도네시아와 한국 사이에 아직 큰 진전을 보지 못했다"고 10월30일 발언한 것으로 전해졌습니다. 협력의 핵심은 탄소포집·저장(CCS)과 신재생에너지 분야로, 인도네시아의 천연자원과 한국의 기술력을 결합하는 것을 목표로 합니다. 같은 시기 한국 기후에너지환경부는 약 1,000조원(약 7,470억 달러) 규모의 '그린 트랜스포메이션' 산업전략을 별도로 발표했는데, 청정에너지 공급망 자립도 강화, 산업 부문 탄소중립, 전 운송수단 전동화 등을 목표로 하고 있습니다. 토론회 참석자들은 지난 4월 체결된 MoU들이 아직 구체적 실행계획이나 투자 프로젝트로 이어지지 못하고 있다는 점을 공통적으로 지적했습니다. 이는 지난주 다룬 제12차 한-인니 방산협력위원회에서도 가시적 성과 없이 네트워크 구축 수준에 머물렀다는 평가와 맥을 같이 합니다. 청정에너지·핵심광물 분야에 투자를 검토 중인 한국 기업은 정부간 MoU 체결 소식만으로 사업 추진을 낙관하기보다, 후속 산업전략·구체적 이행계획이 실제로 나오는지를 지켜보며 투자 시점을 조율하는 것이 바람직합니다. 다만 기사 본문 전체는 유료 구독 제한이 있어 세부 내용 확인에는 한계가 있었습니다.`,
    source:`The Jakarta Post`, url:`https://www.thejakartapost.com/world/2026/11/15/jakarta-must-turn-clean-energy-deals-with-seoul-into-industrial-strategy-discussion` },
  { cat:`econ`, date:`2026.11.05 발표`, title:`3분기 GDP 5.47% 성장, 예상치 상회`,
    desc:`인도네시아 통계청(BPS)은 11월5일, 2026년3분기 경제성장률이 전년동기대비 5.47%를 기록해 시장 예상치 5.2%를 상회했다고 발표했으며, 자카르타포스트가 이를 보도했습니다. 이는 3분기 연속 최저치였던 2분기 5.29%에서 뚜렷하게 반등한 수치이며, 3분기까지의 연간 누적 성장률은 5.45%로 집계됩니다. 성장을 이끈 요인은 가장 큰 비중을 차지하는 가계소비(+5%)와 투자(+6.1%)였으며, 수출도 2분기 4.13%에서 3분기 4.59%로 성장폭이 확대됐습니다. 이에 따라 다나몬은행(Bank Danamon)은 2026년 전체 성장률 전망을 5.2%에서 5.35%로 상향했으나, 4분기에는 성장세가 다소 둔화될 수 있다고 덧붙였습니다. 정부의 2026년 성장률 목표는 5.4%입니다. 같은 기간 10월 소비자물가 상승률은 전년동월대비 3.23%로 정부 목표범위(2.5%±1%p) 안에 머물렀고, 핵심물가는 2.56%로 둔화됐습니다. 다만 식품·음료·담배 가격은 4.82%, 교통비는 4.87% 올라 체감 물가 부담은 여전한 것으로 나타났습니다. 일부 이코노미스트는 3분기 생산측·지출측 GDP 집계 간 약 333조2,000억 루피아(GDP의 약 4.94%)에 달하는 통계상 불일치가 있다고 지적해 데이터 해석에 신중할 필요가 있다고 덧붙였습니다. 전반적인 성장 모멘텀은 양호하나, 식품·교통비 상승이 이어지고 있는 만큼 PT PMA는 원가·임금 압박 요인으로 이를 함께 모니터링하는 것이 바람직합니다.`,
    source:`The Jakarta Post`, url:`https://www.thejakartapost.com/business/2026/11/05/indonesia-economy-picks-up-pace-in-third-quarter.html` },
];

function renderNews(lang){ const t = T[lang].news; return `
${siteHeader('news', lang)}
${pageHero('news','gold', lang, t.pageEyebrow, t.pageTitle, t.pageDesc)}
<section class="section">
  <div class="wrap">
    <div class="grid-3">
      <div class="news-card">
        <div class="news-ph">${ph(t.c1ph,'coffee')}</div>
        <div class="news-body"><span class="date">${t.c1date}</span><h4>${t.c1title}</h4><p>${t.c1desc}</p></div>
      </div>
      <div class="news-card">
        <div class="news-ph">${ph(t.c2ph,'green')}</div>
        <div class="news-body"><span class="date">${t.c2date}</span><h4>${t.c2title}</h4><p>${t.c2desc}</p></div>
      </div>
      <div class="news-card">
        <div class="news-ph">${ph(t.c3ph,'navy')}</div>
        <div class="news-body"><span class="date">${t.c3date}</span><h4>${t.c3title}</h4><p>${t.c3desc}</p></div>
      </div>
    </div>
    <div class="nl-panel">
      <div class="nl-head">
        <div>
          ${eyebrow(t.nlEyebrow)}
          <h3>${t.nlTitle}</h3>
          <p>${t.nlDesc}</p>
        </div>
        <span class="nl-period">${NEWSLETTER_PERIOD}</span>
      </div>
      <div class="nl-list">
        ${NEWSLETTER_ITEMS.map((n,i)=>{ const c = NL_CATS[n.cat]; return `
        <div class="nl-item">
          <div class="nl-rank">${i+1}</div>
          <div class="nl-body">
            <div class="nl-top"><span class="badge-pill ${c.theme}"><span class="dot"></span>${c.label}</span></div>
            <h4>${n.title}</h4>
            <p>${n.desc}</p>
            <div class="nl-meta">
              <span>${n.date}</span><span class="dot-sep"></span><span>${n.source}</span><span class="dot-sep"></span>
              <a class="nl-src" href="${n.url}" target="_blank" rel="noopener noreferrer">${t.nlSrcLabel}${icon('arrowRight',13)}</a>
            </div>
          </div>
        </div>`; }).join('')}
      </div>
      <p class="nl-note">${t.nlNote}</p>
    </div>
  </div>
</section>
${siteFooter(lang)}`; }

function renderCurrentPage(){
  document.documentElement.lang = currentLang;
  document.title = DOC_TITLE[currentLang] || DOC_TITLE.en;
  app.innerHTML = renderNews(currentLang) + fab(currentLang);
  window.scrollTo(0,0);
}
renderCurrentPage();
</script>
</body>
</html>
