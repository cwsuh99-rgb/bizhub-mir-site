  { cat:`reg`, date:`2026.09.09 서명, 9월말 시행`, title:`외국인력 허가절차 5일로 단축...OSS 통합`,
    desc:`인도네시아 정부가 9월 9일 투자부(BKPM)·노동부(Kemnaker)·이민청 3개 기관 합동으로 외국인력 허가절차를 최대 5일 이내로 단축하는 통합 시스템 구축에 서명했습니다. 이번 조치는 투자부의 온라인단일창구(OSS), 노동부의 SIAPkerja 시스템, 이민청의 올인도네시아(All Indonesia) 애플리케이션을 하나의 진입점으로 연동해, 기업이 여러 시스템을 오가며 별도로 신청하던 번거로움을 없애는 것이 핵심입니다. 통합 대상 절차는 외국인력활용계획서(RPTKA) 승인부터 제한체류비자(VITAS), 제한체류허가(ITAS), 영주허가(ITAP) 발급까지 외국인 고용에 필요한 전 과정을 포괄합니다. 특히 소관 기관이 정해진 처리기한 내에 심사를 완료하지 못하면 통합 OSS 시스템을 통해 자동으로 승인이 이뤄지는 자동승인 장치도 새로 도입됩니다. 이 통합 시스템은 9월 말부터 정식 가동될 예정이며, 기존에는 부처별로 별도 신청·심사를 거쳐야 해 수주에서 수개월까지 걸리던 처리 기간이 대폭 단축될 것으로 기대됩니다. 정부는 이번 개편이 외국인 투자기업의 인력 조달 속도를 높여 투자환경 개선에 기여할 것이라고 설명했습니다. 한국인 주재원이나 기술인력을 신규로 파견하려는 PT PMA라면, 9월 말 시스템 가동 이후 RPTKA 신청부터 비자·체류허가 발급까지 실제 처리 기간이 어떻게 달라지는지 확인하고 인력 파견 일정을 조정할 필요가 있습니다. 다만 처리 기간 단축이 서류 요건 자체를 완화하는 것은 아니므로, 기존과 동일하게 지식이전계획이나 인도네시아인 카운터파트 지정 등 필수 요건은 계속 충족해야 합니다. 신규 인력 배치나 기존 인력의 허가 갱신을 계획 중인 기업은 시스템 전환 초기 혼선에 대비해 여유 있게 일정을 준비하는 것이 바람직합니다.`,

  { cat:`tax`, date:`2026.10.15 마감`, title:`LKPM 3분기 신고마감 10월15일 임박`,
    desc:`인도네시아 투자부(BKPM) 규정에 따라 기업 규모별로 제출해야 하는 투자실현보고서(LKPM) 중 2026년 3분기(7~9월)분 제출 마감이 10월 15일로 다가오고 있습니다. 중견·대기업은 분기마다, 소규모 사업자는 반기마다 LKPM을 제출해야 하며, 모든 보고는 온라인단일창구(OSS) 시스템을 통해 전자적으로 이뤄집니다. 이번 3분기 마감은 지난해 시행된 투자부·BKPM 규정 5/2025호에 따라 정착된 분기별 15일 마감 체계의 세 번째 순서에 해당합니다. LKPM을 기한 내 제출하지 않을 경우 서면경고, 사업활동 일시정지와 함께 행정과태료 부과, 나아가 사업허가(NIB) 취소까지 이어지는 단계적 제재가 적용될 수 있습니다. 특히 4개 분기 연속으로 투자실현액을 0으로 신고할 경우 OSS 시스템이 자동으로 행정제재를 발동하도록 설계돼 있어, 실제로는 사업을 진행 중인데도 보고를 소홀히 해 불이익을 받는 사례가 없도록 유의해야 합니다. LKPM은 단순 행정보고가 아니라 BKPM이 국가 전체 투자실적을 집계하고 인센티브·세제혜택 대상 기업을 관리하는 핵심 자료로 활용되기 때문에, 보고 내용의 정확성도 중요합니다. NIB를 보유한 모든 PT PMA는 예외 없이 보고 의무 대상이므로, 아직 3분기 데이터를 정리하지 못한 기업이라면 마감 하루 전이 아니라 지금부터 실현 투자금액, 고용인원, 생산실적 등 필요 항목을 준비하는 것이 안전합니다. 회계·컴플라이언스 담당자가 없는 소규모 PT PMA는 현지 컨설팅사를 통해 OSS 입력 오류나 누락이 없는지 사전에 점검받는 것을 권장합니다.`,
    source:`Legal Indonesia`, url:`https://legalindonesia.id/id/izin-usaha-lkpm-aturan-baru-oss/` },
  { cat:`econ`, date:`2026.09.07 잠정합의`, title:`RAPBN 2027 세입세출 9.1조루피아 증액 합의`,
    desc:`인도네시아 국회 예산위원회(Banggar DPR)와 정부는 9월 7일 회의를 통해 2027년 국가예산안(RAPBN 2027)의 잠정 골격에 합의했습니다. 이번 합의로 국가수입·보조금 목표는 3435조1000억 루피아, 국가지출은 4106조3000억 루피아로 각각 당초 재정정책서(Nota Keuangan) 대비 9조1000억 루피아씩 상향 조정됐습니다. 세수 목표는 종전 2908조 루피아에서 2912조 루피아로 4조 루피아 늘었고, 중앙정부 지출도 3362조2000억 루피아에서 3371조3000억 루피아로 증가했는데, 이 중 상당 부분은 각 부처·기관 예산이 1504조7000억 루피아에서 1513조8000억 루피아로 늘어난 데서 비롯됐습니다. 다만 수입과 지출이 함께 늘면서도 재정적자 규모는 671조2000억 루피아, GDP 대비 2.4%로 종전과 동일하게 유지됐습니다. 앞서 프라보워 수비안토 대통령이 제시한 2027년 거시경제 전제치는 경제성장률 6%, 물가상승률 2.5%, 10년 만기 국채(SBN) 금리 6.9%, 환율 1달러당 1만7500루피아로, 이는 2026년 예산(APBN 2026)의 성장률 5.4%보다 높여 잡은 수치입니다. 이번 잠정 합의는 본예산 확정을 위한 국회 의결에 앞선 중간 단계로, 향후 세부 항목별 예산 배정 논의가 이어질 예정입니다. 성장률과 정부지출 목표가 높아진 것은 내수 확대와 인프라 투자 지속 의지를 보여주는 신호로 해석됩니다. PT PMA 입장에서는 2027년 예산에 반영될 산업별 인센티브나 조달 프로젝트 예산 규모, 환율 전제치(1만7500루피아) 등을 참고해 내년도 사업계획과 환리스크 관리 전략을 세워볼 만합니다. 최종 확정된 RAPBN 2027 세부 내용은 통상 연말 국회 본회의 의결을 거쳐 발표되므로, 관련 소식을 계속 확인하는 것이 좋습니다.`,
    source:`CNN Indonesia`, url:`https://www.cnnindonesia.com/nasional/20260907182831-633-1401143/banggar-dpr-dan-pemerintah-sepakati-perubahan-rapbn-2027` },
  { cat:`kr`, date:`2026.09.01 발행가 확정`, title:`에코프로비엠, 인니 니켈제련소 투자 본격화`,
    desc:`국내 배터리소재 기업 에코프로비엠이 인도네시아 니켈제련소 투자를 위한 대규모 유상증자 절차를 본격화하고 있습니다. 회사는 지난 6월 말 주주배정 후 실권주 일반공모 방식으로 최대 1조2000억원 규모의 유상증자를 결정했으며, 신주 990만990주(액면가 500원)를 발행할 예정입니다. 9월 1일에는 신주 1차 발행가액이 주당 8만9500원으로 확정됐는데, 이는 기산일 전후 주가를 가중평균한 기준주가에 20% 할인율을 적용해 산출된 것으로, 최근 주가 하락 영향으로 당초 목표 조달액보다 실제 모집액은 다소 줄어들 전망입니다. 확정 발행가는 10월 12일 결정되며, 구주주 청약은 10월 15~16일, 대금 납입은 10월 23일, 신주 상장은 11월 5일로 예정돼 있습니다. 조달 자금 중 9150억원은 인도네시아 'BNSI(Bahodopi Nickel Smelting Indonesia) 제련소' 지분 확보와 헝가리 법인 잔여 투자에, 1350억원은 원재료 매입 등 운영자금에, 1500억원은 시설자금에 각각 투입됩니다. BNSI는 인도네시아 국영 광산기업 PT Vale Indonesia(지분 30%), 중국 GEM(21%)과 함께 추진하는 합작 제련소 프로젝트로, 에코프로 컨소시엄이 39% 지분을 확보해 최대주주로 참여합니다. 완공 시 연간 니켈 9만톤(전기차 약 200만대 공급 가능 규모)을 생산할 수 있는 반응기 3기(기당 3만톤) 체제로, 현재까지 반응기 2기가 입고됐고 나머지 1기도 9월 중 반입될 예정이어서 연내 준공·시험생산을 거쳐 내년 2분기 본격 가동을 목표로 하고 있습니다. 인도네시아에서 배터리 소재·니켈 관련 사업을 영위하거나 협력사로 참여 중인 PT PMA라면, BNSI 제련소의 완공 일정과 향후 국내 대기업들의 추가 투자 발표 여부를 주시할 필요가 있습니다.`,
    source:`CBC뉴스`, url:`https://www.cbci.co.kr/news/articleView.html?idxno=603174` },
  { cat:`kr`, date:`2026.09.01~09.05 실시`, title:`서부발전, 인니·말레이서 1876만달러 수출상담`,
    desc:`한국서부발전(KOWEPO)이 9월 1일부터 5일까지 인도네시아 자카르타·브카시와 말레이시아 쿠알라룸푸르·조호르바루에서 '인도네시아-말레이시아 발전기자재 무역사절단'을 운영해 총 1876만달러 규모의 수출상담 성과를 거뒀습니다. 이번 사절단은 서부발전이 올해 5월 한국전기기술인협회와 체결한 상생협력 업무협약(MOU)의 후속 조치로 추진됐으며, 국내 전력·에너지 분야 중소기업 12개사가 참여했습니다. 인도네시아 브카시 현지에서는 총 98건의 수출상담이 이뤄졌고, 이 가운데 3건이 실제 업무협약(MOU) 체결로 이어져 예상 계약 규모는 1397만달러로 집계됐습니다. 말레이시아 조호르바루에서 열린 수출상담회에서도 1건의 실제 계약이 성사됐고, 479만달러 규모의 추가 수출상담 실적이 확보됐습니다. 서부발전은 발전 공기업으로서 축적한 동남아 현지 네트워크와 신인도를 활용해 국내 중소 발전기자재 업체들의 해외 판로 개척을 지원하는 상생협력 사업을 지속하고 있습니다. 동남아 지역은 전력 인프라 확충 수요가 꾸준한 반면 현지 조달망이나 바이어 접점이 부족한 국내 중소기업이 많아, 공기업이 주도하는 이 같은 무역사절단이 실질적인 판로 개척 통로로 활용되고 있습니다. 인도네시아에서 발전설비, 전력기자재, 관련 부품을 조달하거나 현지 발전 프로젝트에 납품을 검토 중인 한국 PT PMA라면, 서부발전이나 관련 협회가 주관하는 후속 상담회·박람회 일정을 확인해 참여 기회를 모색해볼 만합니다. 이번 사절단 성과는 아직 확정 계약이 아닌 상담·MOU 단계가 대부분이므로, 실제 수출 성사 여부와 후속 계약 체결 소식을 계속 지켜볼 필요가 있습니다.`,
    source:`한국경제`, url:`https://www.hankyung.com/article/202609078503i` },
  { cat:`tax`, date:`2026.11.01 시행 예정`, title:`이커머스 PPh22 원천징수 11월로 재연기`,
    desc:`인도네시아 국세청(DJP)이 마켓플레이스를 통한 온라인 판매자에 대한 소득세(PPh 22) 원천징수 제도 시행을 재차 연기했습니다. 재무부규정(PMK) 37/2025호에 근거한 이 제도는 당초 지난 8월 1일부터 토코피디아, 쇼피, 라자다, 블리블리 등 국세청이 지정한 4개 대형 마켓플레이스가 입점 판매자의 매출에서 세금을 원천징수하도록 설계됐습니다. 그러나 국세청은 서민 구매력 보호를 이유로 시행 시기를 10월 말까지 한 차례 미룬 데 이어, 최종적으로 11월 1일부터 시행하는 것으로 재조정했습니다. 원천징수 세율은 부가가치세와 사치재판매세를 제외한 총매출액의 0.5%이며, 연간 매출이 5억 루피아를 초과하는 판매자에게만 적용됩니다. 특히 국세청은 공고문(PENG-46/PJ.09/2026호)을 통해 지난 8월 1일부터 시행 연기 전까지 일부 마켓플레이스가 이미 징수한 세액이 있다면 해당 판매자에게 전액 환급하도록 조치했습니다. 이번 제도 연기는 정부의 서민 소비여력 보호 기조와 맞물려, 코레탁스(Coretax) 시스템 안착과 동시에 진행되고 있는 세정 디지털화 작업의 일환으로 볼 수 있습니다. 인도네시아에서 자체 온라인몰이나 대형 마켓플레이스 입점을 통해 소비재를 판매하는 PT PMA, 특히 뷰티·식품·생활용품 등 이커머스 채널 의존도가 높은 한국계 유통기업이라면 11월 1일 시행일에 맞춰 판매관리 시스템과 정산 프로세스에 원천징수 반영 여부를 미리 점검해야 합니다. 연 매출 5억 루피아 기준에 근접한 소규모 셀러라면 기준 초과 여부를 지속적으로 모니터링해 예상치 못한 세부담 변화에 대비하는 것이 바람직합니다.`,
    source:`Viva.co.id`, url:`https://www.viva.co.id/bisnis/1919403-ditunda-hingga-akhir-oktober-djp-pajak-e-commerce-mulai-berlaku-di-1-november-2026` },
  { cat:`tip`, date:`상시 점검 필요`, title:`PT PMA 버추얼오피스 사용요건 강화`,
    desc:`최근 인도네시아에서 외국인투자기업(PT PMA)의 버추얼오피스(가상사무실) 활용에 대한 규제가 한층 까다로워지고 있어 사업장 주소를 정할 때 각별한 주의가 필요합니다. 자카르타에서는 PT PMA가 버추얼오피스를 사용하려면 반드시 '사무구역 서브존(Sub Zona Perkantoran, KT)'으로 지정된 구역 내 주소여야 하며, 주거지역이나 비상업지역에 위치한 주소는 온라인단일창구(OSS) 시스템에서 사업인허가 신청 자체가 반려되거나 이미 발급된 인허가가 취소될 수 있습니다. 특히 지난 5월 중순부터 OSS 시스템에 이 같은 존닝(zoning) 검증 로직이 새롭게 반영되기 시작했으며, 신규로 PT PMA를 설립하려는 기업, 그중에서도 발리 지역 신청 건이 집중적인 영향을 받고 있는 것으로 파악됩니다. 부동산 임대, 빌라 관리, 컨설팅, 여행업, 소매업, 차량 렌트 등 상대적으로 위험도가 낮은 KBLI 업종으로 등록된 PT PMA일수록 이러한 심사가 더욱 엄격하게 적용되는 경향이 있습니다. 법률 자문업계에서는 일반 내국인 소유 PT나 1인 회사(PT Perorangan)의 경우 제한적으로 버추얼오피스 사용이 허용되는 것과 달리, PT PMA는 원칙적으로 실제 영업이 이뤄지는 물리적 사무공간을 보유해야 한다는 해석이 우세합니다. 이는 그간 초기 비용 절감을 위해 버추얼오피스 주소로 법인을 설립해 온 소규모 외국인투자기업들에게 실질적인 컴플라이언스 리스크로 작용할 수 있습니다. 자카르타나 발리에서 버추얼오피스 주소로 PT PMA를 운영 중이거나 신규 설립을 준비 중인 한국 기업이라면, 현재 등록 주소가 해당 지역의 사무구역 서브존 또는 상업지역에 해당하는지, KBLI 코드별 위험등급이 어떻게 분류되는지 노타리스나 현지 법무법인을 통해 사전에 확인해두는 것이 안전합니다. 이미 설립된 법인이라도 갱신·변경 신청 시점에 갑작스러운 반려를 겪지 않도록, 필요하다면 물리적 사무공간 확보나 주소 변경을 미리 검토해볼 필요가 있습니다.`,
    source:`XPND(법률자문사)`, url:`https://xpnd.co.id/blogs/virtual-office-jakarta-pt-pma/` },
  { cat:`econ`, date:`2026.09.01 발표(7월 실적)`, title:`7월 무역수지 1.2억달러 흑자 전환`,
    desc:`인도네시아 통계청(BPS)이 9월 1일 발표한 자료에 따르면, 2026년 7월 상품수지가 1억2000만달러 흑자를 기록하며 6월의 4억5000만달러 적자에서 흑자로 전환했습니다. 앞서 6월에는 전년 동월 4억1100만달러 흑자에서 큰 폭으로 악화돼 적자로 돌아선 바 있어, 이번 7월 흑자 전환은 시장에 다소 안도감을 준 것으로 평가됩니다. 다만 흑자 규모 자체는 1억2000만달러로 크지 않아, 여전히 무역수지가 완전히 견조한 흐름을 회복했다고 보기는 이르다는 시각도 있습니다. 올해 1~7월 누적 기준으로는 수출이 전년 동기 대비 4.43% 증가했지만 수입은 19.94%나 급증하면서, 누적 무역수지 흑자 규모는 37억달러 수준으로 집계됐습니다. 수입 증가율이 수출 증가율을 크게 웃도는 현상은 내수 소비·투자 회복에 따른 원자재·자본재 수입 확대를 반영하는 동시에, 향후 무역수지가 다시 적자로 전환될 가능성에 대한 경계 요인으로도 해석됩니다. 무역수지 흐름은 환율 안정과 직결되는 만큼, 루피아 표시 매출 비중이 높거나 수입 원자재 의존도가 높은 PT PMA라면 관련 지표를 지속적으로 모니터링할 필요가 있습니다. 특히 수입 증가세가 이어질 경우 루피아 약세 압력으로 이어질 수 있어, 환헤지나 결제통화 다변화를 검토 중인 기업이라면 8월 이후 무역수지 추이를 참고해 자금계획을 세우는 것이 바람직합니다.`,
    source:`Infobanknews`, url:`https://infobanknews.com/neraca-dagang-ri-bangkit-surplus-usd120-juta-per-juli-2026` },
  { cat:`kr`, date:`2026.08.31~09.04 실시`, title:`K-농기자재 수출개척단, 인니서 498만달러 MOU`,
    desc:`농림축산식품부와 한국농어촌공사가 8월 31일부터 9월 4일까지 국내 농기자재 수출기업 27개사로 구성된 'K-농기자재 시장개척단'을 인도네시아와 말레이시아에 파견해 동남아 시장 공략에 나섰습니다. 이번 개척단 활동을 통해 현지 바이어들과 총 2141만달러 규모의 수출상담이 이뤄졌으며, 이 가운데 498만달러 상당의 실질적인 수출 업무협약(MOU)이 체결되는 성과를 거뒀습니다. 인도네시아는 세계 유수의 농업 인구와 경작지를 보유한 시장으로, 정부 차원의 농업 기계화·생산성 향상 정책이 이어지면서 트랙터, 관개설비, 수확기계 등 농기자재에 대한 수요가 꾸준히 늘고 있는 것으로 평가됩니다. 이번 개척단은 국내 중소 농기자재 기업들이 개별적으로 접근하기 어려운 현지 유통망과 바이어를 정부 지원 사업을 통해 연결해주는 방식으로 운영됐습니다. 코로나19 이후 정체됐던 K-농기자재 수출이 동남아 신흥시장을 중심으로 다시 회복세를 보이고 있다는 점에서, 정부는 이 같은 시장개척단 파견을 연중 지속적으로 확대할 계획인 것으로 알려졌습니다. 인도네시아에서 농업·원예·조경 관련 사업을 하거나 국내 농기자재 기업의 현지 유통·에이전트 역할을 검토 중인 PT PMA라면, 이번에 체결된 MOU 기업 명단과 후속 계약 진행 상황을 참고해 협력 파트너십 기회를 모색해볼 수 있습니다. 다만 이번 성과 역시 상담·MOU 단계가 중심이므로, 실제 수출 계약 이행과 현지 인증·통관 절차까지 원활하게 마무리되는지는 계속 확인이 필요합니다.`,
    source:`한국영농신문`, url:`https://www.youngnong.co.kr/news/articleView.html?idxno=70064` },
  { cat:`tip`, date:`근무 6개월 이상시 의무`, title:`외국인 근로자도 BPJS 가입 의무`,
    desc:`PT PMA에서 6개월 이상 근무하는 외국인 근로자(TKA)도 내국인 직원과 마찬가지로 사회보장제도인 BPJS 가입 의무 대상이라는 점을 다시 한 번 점검할 필요가 있습니다. 인도네시아 법령에 따르면 6개월 이상 고용된 외국인 근로자는 건강보험인 BPJS Kesehatan과 고용보험 성격의 BPJS Ketenagakerjaan에 모두 가입해야 하며, 이는 회사가 임의로 선택할 수 있는 사항이 아니라 법적 의무사항입니다. 사용자는 실제 근무가 시작되기 전에 BPJS Ketenagakerjaan과 BPJS Kesehatan 각각에 대해 별도로 회사 및 근로자 등록 절차를 완료해야 합니다. BPJS Ketenagakerjaan의 경우 산재보험(JKK), 사망보험(JKM), 퇴직연금 성격의 노령저축(JHT)은 외국인 근로자에게도 의무 적용되지만, 연금보험(JP)만은 외국인 근로자에게 의무사항이 아니라는 점이 내국인 근로자와의 차이점입니다. 매월 보험료 납부기한은 익월 15일로, 급여 지급 주기와 별도로 관리해야 하는 컴플라이언스 일정입니다. 이러한 의무를 이행하지 않을 경우 노동부의 외국인력 관련 점검·감사 과정에서 함께 적발될 가능성이 있으며, 최근 노동부가 RPTKA 미승인 인력에 대한 단속을 강화하고 있는 흐름과 맞물려 관련 서류 점검의 중요성이 더욱 커지고 있습니다. 한국인 주재원이나 기술인력을 고용 중인 PT PMA 인사담당자는 파견 인력의 BPJS 가입 여부와 매월 납부 현황을 정기적으로 점검하고, 아직 등록하지 않은 인력이 있다면 지체 없이 절차를 진행하는 것이 바람직합니다. 특히 신규 파견 인력의 경우 근무 개시 시점부터 6개월 경과 시점을 별도로 기록해 가입 시기를 놓치지 않도록 관리하는 것이 실무적으로 중요합니다.`,
    source:`Hukumonline`, url:`https://www.hukumonline.com/klinik/a/apakah-tenaga-kerja-asing-wajib-jadi-peserta-bpjs-ketenagakerjaan-lt54d2b4c94b84e/` },
];

function renderNews(lang){ const t = T[lang].news; return `
${siteHeader('news', lang)}
${pageHero('news','gold', lang, t.pageEyebrow, t.pageTitle, t.pageDesc)}
<section class="section">
  <div class="wrap">
    <div class="grid-3">
      <div class="news-card">
        <div class="news-ph">${ph(t.c1ph,'coffee')}</div>
        <div class="news-body"><span class="date">${t.c1date}</span><h4>${t.c1title}</h4><p>${t.c1desc}</p></div>
      </div>
      <div class="news-card">
        <div class="news-ph">${ph(t.c2ph,'green')}</div>
        <div class="news-body"><span class="date">${t.c2date}</span><h4>${t.c2title}</h4><p>${t.c2desc}</p></div>
      </div>
      <div class="news-card">
        <div class="news-ph">${ph(t.c3ph,'navy')}</div>
        <div class="news-body"><span class="date">${t.c3date}</span><h4>${t.c3title}</h4><p>${t.c3desc}</p></div>
      </div>
    </div>
    <div class="nl-panel">
      <div class="nl-head">
        <div>
          ${eyebrow(t.nlEyebrow)}
          <h3>${t.nlTitle}</h3>
          <p>${t.nlDesc}</p>
        </div>
        <span class="nl-period">${NEWSLETTER_PERIOD}</span>
      </div>
      <div class="nl-list">
        ${NEWSLETTER_ITEMS.map((n,i)=>{ const c = NL_CATS[n.cat]; return `
        <div class="nl-item">
          <div class="nl-rank">${i+1}</div>
          <div class="nl-body">
            <div class="nl-top"><span class="badge-pill ${c.theme}"><span class="dot"></span>${c.label}</span></div>
            <h4>${n.title}</h4>
            <p>${n.desc}</p>
            <div class="nl-meta">
              <span>${n.date}</span><span class="dot-sep"></span><span>${n.source}</span><span class="dot-sep"></span>
              <a class="nl-src" href="${n.url}" target="_blank" rel="noopener noreferrer">${t.nlSrcLabel}${icon('arrowRight',13)}</a>
            </div>
          </div>
        </div>`; }).join('')}
      </div>
      <p class="nl-note">${t.nlNote}</p>
    </div>
  </div>
</section>
${siteFooter(lang)}`; }

function renderCurrentPage(){
  document.documentElement.lang = currentLang;
  document.title = DOC_TITLE[currentLang] || DOC_TITLE.en;
  app.innerHTML = renderNews(currentLang) + fab(currentLang);
  window.scrollTo(0,0);
}
renderCurrentPage();
</script>
</body>
</html>
