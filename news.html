  { cat:`econ`, date:`2026.10.19 발표`, title:`3분기 투자실현 528.7조 루피아, 목표 75% 달성`,
    desc:`투자부 장관 로산 로에슬라니는 10월 19일 프라보워 대통령에게 2026년 3분기(7~9월) 투자실현액이 528.7조 루피아를 기록했다고 보고했습니다. 이는 전년 동기(491.4조 루피아) 대비 약 7.6% 증가한 수치입니다. 올해 1~9월 누적 투자실현액은 1,539.2조 루피아로, 정부가 설정한 연간 목표 2,041.3조 루피아의 75.4%에 해당합니다. 이번 투자로 약 219만 명의 고용이 창출된 것으로 집계됐습니다. 3분기 투자 중 외국인투자(PMA)는 약 270.2조 루피아, 국내투자(PMDN)는 약 258.5조 루피아로 두 부문이 비슷한 비중을 보였습니다. 누적 기준 외국인투자 유치국 중에서는 싱가포르가 1위를 차지했고, 3분기 단일 기준으로는 홍콩이 가장 많은 투자를 집행한 것으로 나타났습니다. 로산 장관은 남은 4분기에도 투자 유치 속도를 끌어올려 연간 목표치에 도달하겠다는 의지를 밝혔습니다. 이번 발표는 Katadata, RMOL, RCTI+ 등 현지 매체를 통해 10월 19일경 보도되었습니다. 인도네시아에 이미 진출한 PT PMA는 이번 수치를 통해 자국 투자 환경에 대한 정부의 평가와 4분기 추가 인센티브 발표 가능성을 참고할 수 있습니다. 신규 투자를 검토하는 한국 기업은 PMA와 PMDN 투자가 균형을 이루는 현재 흐름과 홍콩·싱가포르 자본의 동향을 벤치마킹할 필요가 있습니다.`,
    source:`RMOL.id`, url:`https://rmol.id/read/2026/10/19/725526/realisasi-investasi-hingga-kuartal-iii-sentuh-rp1-539-t` },
  { cat:`econ`, date:`2026.10.21 결정`, title:`BI, 기준금리 5.75% 동결·예금시설금리는 인상`,
    desc:`인도네시아 중앙은행(BI)은 10월 20~21일 이틀간 열린 이사회 회의(RDG)에서 기준금리(BI Rate)를 5.75%로 다섯 번째 연속 동결했습니다. 반면 예금시설금리(Deposit Facility Rate)는 0.25%포인트 올려 5%로 상향 조정했고, 대출시설금리(Lending Facility Rate)는 6.50%로 유지했습니다. 블룸버그가 집계한 이코노미스트 38명 중 19명이 금리 인상을 예상했을 정도로 이번 동결은 시장의 예상을 벗어난 결과였습니다. BI는 올해 들어서만 기준금리를 누적 100bp 올렸으며, 가장 최근 인상은 6월 5.50%에서 5.75%로 올린 것이었습니다. 9월 연간 소비자물가 상승률은 3.28%로 올해 최고치를 기록했으나 근원물가는 2.84%로 다소 완화됐으며, BI는 물가가 목표 범위인 2.5%±1% 안에서 관리되고 있다고 평가했습니다. 루피아 환율은 달러당 1만8,000루피아 아래에서 거래되고 있지만, 연초 대비로는 약 7.9% 약세를 보인 상태입니다. 일부 외신은 중앙은행이 루피아 안정과 대외 불확실성 속에서 신중한 통화정책을 이어가고 있다고 평가했습니다. 달러화 자금 조달 비중이 높은 PT PMA는 예금시설금리 인상이 단기 예치 수익률에 영향을 줄 수 있다는 점과, 기준금리 동결 기조가 당분간 이어질 가능성을 참고해 환헤지·자금운용 전략을 조정할 필요가 있습니다. 소비재·유통업 PT PMA는 9월 물가 상승 흐름이 이어지고 있는 만큼 원가와 가격정책을 지속적으로 점검해야 합니다.`,

  { cat:`reg`, date:`2026.10.31 시한`, title:`신 노동자보호법, 대통령 서명 지연 우려 확산`,
    desc:`인도네시아 노동계는 10월 21일 하원이 10월 6일 의결한 '노동자보호법(UU Pelindungan Ketenagakerjaan)'에 프라보워 수비안토 대통령이 아직 서명하지 않고 있다며 신속한 서명을 촉구했습니다. 노동조합총연맹(KSPI)과 노동당은 법 시행이 내년으로 미뤄지거나 일부 조항이 수정될 수 있다는 소문이 돌고 있다고 전했습니다. 이 법은 23개 장, 313개 조항으로 구성되어 있으며, 헌법재판소가 2023년 168/PUU-XXI/2023 결정으로 부여한 입법 시한인 10월 31일을 앞두고 있습니다. KSPI 측은 기자회견 당시까지도 최종 의결된 법안 전문을 공식적으로 입수하지 못했다고 밝혔습니다. 노동계는 법 자체에 대해서는 조건부로 수용하는 입장이지만, 서명이 지연될 경우 퇴직금 적립 의무화, 효율화 해고 요건 강화 등 핵심 노동자 보호 조항의 시행이 함께 늦춰질 것을 우려하고 있습니다. 일부 보도에 따르면 법은 공포 후 1년의 전환 기간을 거쳐 본격 시행될 예정입니다. 정부와 하원은 앞서 법안 통과 목표 시점을 여러 차례 연기해온 전력이 있어, 이번에도 서명 지연 가능성을 완전히 배제하기 어려운 상황입니다. 인력 비중이 높은 제조업·서비스업 PT PMA는 법안 공포 여부와 정확한 공포일을 관보(Lembaran Negara)나 정부 공식 채널로 수시로 확인하고, 1년 전환 기간 중 퇴직금 적립·해고 절차 등 후속 시행령 마련 동향을 계속 주시할 필요가 있습니다.`,
    source:`RCTI+`, url:`https://www.rctiplus.com/news/detail/inews/5499232/buruh-desak-prabowo-segera-teken-uu-pelindungan-ketenagakerjaan--ada-rumor-penundaan` },
  { cat:`reg`, date:`2026.10.08 가동`, title:`프라보워, 니켈 하류산업단지 가동식서 투자보호 공약`,
    desc:`프라보워 수비안토 대통령은 10월 8일 북말루쿠주 웨다베이 산업단지에서 니켈 기반 배터리·알루미늄·태양광 소재 생산시설 가동식을 열고, 출신지와 관계없이 모든 투자를 존중하고 보호하겠다고 밝혔습니다. 자카르타포스트에 따르면 이날 가동된 상업 생산 설비 4곳의 투자 규모는 약 34억 달러이며, 건설 중인 7개 공장에는 약 68억 달러가 추가로 투입되고 있습니다. 가동된 설비에는 니켈 가공업체 PT Blue Sparking Energy, 배터리 제조사 PT REPT Battero Indonesia, 알루미늄 생산업체 PT Pioneer Aluminum Industries, 중장비 제조사 PT XCMG Indonesia Manufacturing이 포함됩니다. 이날 행사에서는 REPT Battero가 생산한 전기차 배터리의 첫 수출 물량 선적식도 함께 열렸습니다. 대통령의 이번 발언은 중국계 기업들이 니켈 광산 쿼터 축소, 세율 인상, 새로운 가격산정 공식 등으로 비용 부담이 커지고 투자 유인이 줄고 있다며 정부에 서한으로 우려를 전달한 직후 나온 것으로 알려졌습니다. 웨다베이 산업단지는 중국 칭산(Tsingshan) 그룹이 상당 부분 지분을 보유하고 있으며, 이번 신규 투자 역시 대부분 중국계 자본으로 분석됩니다. 일부 전문가들은 웨다베이 주변의 토지와 하천, 해양 생태계가 이 같은 급속한 하류산업 확장을 감당할 수 있을지에 대한 우려도 제기하고 있습니다. 니켈 하류산업에 직접 참여하지 않는 PT PMA라도, 이번 사례를 통해 정부가 광업 쿼터·세율·가격공식 조정에 따른 투자자 불만에 어떻게 대응하는지, 외국인 투자 보호에 대한 정책 신호를 참고할 수 있습니다.`,
    source:`The Jakarta Post`, url:`https://www.thejakartapost.com/business/2026/10/09/prabowo-launches-10-2b-nickel-downstream-projects-at-weda-bay` },
  { cat:`tip`, date:`2026.10.08 발표`, title:`신 노동법, 아웃소싱 계약 최장 4년으로 제한`,
    desc:`인도네시아 경영자단체 아판도(Apindo)는 10월 8일 자카르타에서 새로 제정된 노동자보호법의 아웃소싱(알리 다야) 관련 조항에 대한 입장을 밝혔습니다. 안타라 통신에 따르면 이 법은 아웃소싱 근로계약 기간을 최장 4년으로 제한하며, 최초 계약은 최대 2년, 이후 1년 단위로 최대 두 차례까지만 연장할 수 있도록 규정했습니다. 아판도 회장 신타 캄다니는 이전부터 아웃소싱 계약 기간을 5년까지 허용해 달라고 요청해왔으나, 최종 법에서는 이보다 짧게 조정된 것으로 알려졌다고 밝혔습니다. 다만 신타 회장은 법안 최종본을 아직 정식으로 전달받지 못해 세부 내용의 정확성을 완전히 확인하지는 못했다고 덧붙였습니다. 새 법은 아웃소싱으로 활용할 수 있는 업무의 범위도 제한하는데, 아판도는 심사 단계에서 보조 업무 5개 범주로만 아웃소싱을 한정하는 조항이 지나치게 좁다고 지적한 바 있습니다. 또한 아웃소싱 근로자도 해고(PHK) 시 퇴직금을 받을 권리를 명시적으로 인정받게 됐습니다. 아판도 노동분과 위원장 봅 아잠은 아웃소싱 외에도 기간제 근로계약(PKWT), 근로시간, 최저임금, 해고 절차 등 4가지를 핵심 쟁점으로 꼽았습니다. 용역업체를 통해 생산·물류 인력을 운용하는 제조업·물류업 PT PMA는 기존 아웃소싱 계약이 4년 한도를 넘는 경우 재구조화가 필요할 수 있으며, 아웃소싱 가능 업무 범위와 퇴직금 지급 의무를 반영해 용역계약과 인사 정책을 선제적으로 점검할 필요가 있습니다.`,
    source:`ANTARA News`, url:`https://www.antaranews.com/berita/5776461/apindo-buka-suara-soal-uu-pelindungan-ketenagakerjaan-baru` },
  { cat:`econ`, date:`2026.10.14 발표`, title:`정부, 2026년 니켈 수출 450억 달러 목표 제시`,
    desc:`바흘릴 라하달리아 하류산업·에너지전환 조정장관은 10월 14일 탕으랑에서 개막한 제41회 인도네시아 무역박람회(TEI 2026) 개막식에서 프라보워 대통령을 대신해 2026년 니켈 수출액을 최소 450억 달러로 끌어올리겠다는 목표를 제시했습니다. 그는 2026년 목표를 최소 450억 달러로 잡았으며 이는 단 하나의 품목에 대한 수치라고 강조하며 니켈 하류산업의 성과를 부각했습니다. 인도네시아의 니켈 수출액은 2017~2018년 약 33억 달러에서 2023년 340억 달러, 2025년에는 400억 달러를 넘어선 것으로 집계됐으며, 이는 니켈 원광 수출 금지 조치 이후 하류산업화가 본격화된 결과로 설명됩니다. 니켈광산경제연구소(Pushep)의 비스만 바흐티아르 이사는 이번 목표가 상당히 도전적인 수준이라고 평가하며, 수출 물량 유지와 제련소(스멜터) 운영 효율성, 하류 니켈 제품의 경쟁력 확보가 관건이라고 지적했습니다. 바흘릴 장관은 이와 함께 2040년까지 광물, 석탄, 석유·가스, 임업, 수산, 농업을 포괄하는 하류산업화 마스터플랜에 6,180억 달러 규모의 투자를 유치하겠다는 장기 구상도 함께 소개했습니다. 닷새간 열리는 이번 박람회는 175억 달러 규모의 거래 성사를 목표로 하고 있습니다. 니켈 원자재나 중간재를 소싱하거나 배터리·스테인리스 등 하류 제품을 생산하는 PT PMA는 정부의 수출 확대 드라이브와 함께 제련소 가동률, 품질 경쟁력 요구가 높아질 가능성을 염두에 두고 중장기 공급망 전략을 점검할 필요가 있습니다.`,
    source:`IDN Financials`, url:`https://www.idnfinancials.com/news/70318/nickel-exports-surge-as-indonesia-targets-usd-45-billion-in-2026` },
  { cat:`tip`, date:`2026.11.01 결정 요구`, title:`노동계, 2027년 최저임금 7.5~9.5% 인상 요구`,
    desc:`인도네시아 노동조합총연맹(KSPI)은 2027년도 지방 최저임금(UMP·UMK)을 7.5%에서 9.5% 수준으로 인상해야 한다고 제안했다고 10월 13일 보도되었습니다. 이 제안은 전국 평균 물가상승률과 경제성장률의 평균치에 0.9라는 지수를 곱하는 산정 방식을 근거로 하며, 이 가정에 따르면 전국 평균 인상률은 약 7.7%로 계산됩니다. 노동계는 중앙정부와 각 주 정부가 2027년 시행 60일 전인 2026년 11월 1일까지 최저임금을 확정해 달라고 요구하고 있습니다. 한 경제 전문가는 노동계가 요구하는 9.5%대 인상률이 실현될 경우 산업계와 상당한 마찰이 예상된다고 지적했습니다. 인도네시아의 최저임금은 중앙정부가 아닌 각 주지사가 지역별로 결정하는 구조이기 때문에, 실제 인상률과 시행 시점은 사업장이 위치한 주(州)에 따라 달라질 수 있습니다. 올해 9월 연간 소비자물가 상승률이 3.28%로 연중 최고치를 기록한 점도 임금 인상 압력을 뒷받침하는 배경으로 꼽힙니다. 아판도(APINDO) 등 경영자단체는 앞서 최저임금 인상 논의를 노사 양자협의(바이파르티트) 방식으로 진행하자고 제안한 바 있어, 올해 결정 과정에서도 노사 간 이견이 이어질 가능성이 있습니다. 자카르타·서부자바 등 인건비 비중이 높은 지역에 생산시설을 둔 PT PMA는 11월 초 각 주정부의 2027년 최저임금 발표를 주시해 인건비 예산과 가격 정책을 미리 조정할 필요가 있습니다.`,
    source:`Bisnis.com`, url:`https://ekonomi.bisnis.com/read/20261013/12/2012140/buruh-minta-ump-2027-naik-75-95-begini-hitungannya` },
  { cat:`tax`, date:`2026.10.15 마감`, title:`LKPM 3분기 신고 마감, 미제출시 제재 위험`,
    desc:`인도네시아 투자부·BKPM의 투자활동보고(LKPM) 3분기(7~9월) 신고 기간이 10월 1일부터 10월 15일까지 진행되어, 10월 26일 현재 이미 마감일이 지난 상태입니다. 중·대규모 PT PMA와 PT PMDN은 OSS 계정의 보고(Pelaporan) 메뉴를 통해 LKPM 목록에 접속해 7~9월 투자 실적을 신고해야 하며, 투자부는 대상 기업에 사전 안내문을 발송한 것으로 알려졌습니다. 아직 영업을 시작하지 않은 법인도 투자 실적이 없다는 내용을 포함해 LKPM을 반드시 제출해야 합니다. BKPM 규정 5/2025호 제373조에 따르면, 2개 보고 기간 연속으로 LKPM을 제출하지 않을 경우 서면 경고, 사업활동 일시정지, 심한 경우 사업허가(Perizinan Berusaha) 취소 등 단계적 행정제재가 부과될 수 있습니다. 소규모 사업자는 분기별이 아닌 반기별로 신고하며, 상반기는 7월 15일까지, 하반기는 다음 해 1월 15일까지 신고하면 됩니다. 4분기(10~12월) 신고 기간은 2027년 1월 1일부터 1월 15일까지로 예정되어 있어, 이번 3분기 신고를 놓친 기업은 다음 신고 기한까지 연속 누락되지 않도록 유의해야 합니다. 투자부는 신고 지원을 위해 OSS 차원에서 LKPM 작성 기술지도(Bimtek) 프로그램을 무료로 운영하며 475명 규모의 참가자를 모집해 교육을 진행한 것으로 전해졌습니다. 3분기 LKPM을 아직 제출하지 못한 PT PMA는 지체 없이 OSS 계정을 통해 신고를 완료하고, 2개 기간 연속 누락으로 인한 제재를 피하기 위해 내부 일정관리 체계를 정비하는 것이 안전합니다.`,
    source:`izin.co.id`, url:`https://izin.co.id/blog/laporan-lkpm-triwulan-3-2026/` },
  { cat:`tax`, date:`2026.10.01 시행`, title:`마켓플레이스 PPh 22 징수, 예정보다 한달 앞당겨 10월 시행`,
    desc:`인도네시아 국세청(DJP)은 당초 11월 1일로 예정했던 온라인 마켓플레이스의 PPh 22 징수 의무화를 한 달 앞당겨 10월 1일부터 시행했다고 밝혔습니다. 국세청은 9월 24일 쇼피, 토코페디아, 블리블리, 라자다 4개 플랫폼을 PPh 22 징수의무자로 공식 지정했으며, 제도의 법적 근거는 기존 재무부규정(PMK) 37/2025호를 그대로 유지한다고 설명했습니다. 징수율은 입점 판매자 매출(부가세·특별소비세 제외) 총액의 0.5%이며, 연 매출 5억 루피아 이하인 소규모 개인사업자는 징수 대상에서 제외됩니다. 국세청은 이번 조치가 새로운 세금이 아니라 기존에도 존재했던 사업소득 과세 의무를 징수 방식만 바꿔 효율화한 것이라고 강조했습니다. 이미 다른 방식으로 과세된 거래는 시스템에서 식별돼 이중으로 징수되지 않도록 조치했다고도 밝혔습니다. 전자상거래협회(idEA)는 시행 초기 전환 과정에서 기술적 오류가 발생할 수 있다고 우려하며, 판매자들에게 명확한 안내가 필요하다고 지적했습니다. 실제로 쇼피는 10월 1일이 아닌 10월 2일부터 징수를 시작한 것으로 보도되어, 플랫폼별로 적용 시점에 다소 차이가 있었던 것으로 나타났습니다. 이는 당초 11월 1일로 알려졌던 재시행 계획보다 시행 시점이 앞당겨진 것으로, 쇼피·토코페디아·블리블리·라자다에서 직접 판매하거나 해당 플랫폼으로 유통하는 PT PMA는 이미 10월 정산분부터 0.5%가 선공제되고 있는지 즉시 확인하고, 세금계산서·현금흐름 처리 절차를 서둘러 재점검해야 합니다.`,
    source:`tirto.id`, url:`https://tirto.id/djp-resmi-tunjuk-shopee-tokopedia-pungut-pph-per-1-oktober-2026-hDsv` },
  { cat:`kr`, date:`2026.10.21 발언`, title:`인니 국부펀드 다난타라, 한국 기관투자자에 공동투자 제안`,
    desc:`인도네시아 국부펀드 다난타라(Danantara)의 투자운용 자회사 PT Danantara Investment Management(DIM)는 10월 21일 싱가포르에서 열린 ASK Singapore 2026 콘퍼런스에서 한국 기관투자자들과의 전략적 공동투자(co-investment) 파트너십을 적극적으로 모색하고 있다고 밝혔습니다. KED 글로벌에 따르면 DIM의 한 매니징 디렉터가 이날 패널 세션에서 아시아 전역으로 투자를 확대하려는 펀드의 구상을 설명했습니다. 다난타라 측은 특히 동남아시아로 재투자(reinvestment)가 이어지는 국경 간(cross-border) 투자 구조를 우선적으로 선호한다고 설명했습니다. 이번 콘퍼런스는 한국의 기관투자자(LP)·패밀리오피스와 현지 펀드매니저를 연결하는 일대일 매칭 상담 프로그램도 함께 운영한 것으로 전해졌습니다. 다난타라가 한국과의 협력을 모색한 것은 이번이 처음이 아닌데, 2025년 6월에는 최고투자책임자(CIO) 판두 샤히르가 한국의 미디어·엔터테인먼트 산업에 대한 투자 가능성을 검토하겠다고 밝힌 바 있습니다. 또한 올해 4월 한국 방문 당시 양국 기업 간 102억 달러 규모의 업무협약(MOU)이 체결되는 등, 양국은 비즈니스 포럼을 통해 지속적으로 투자 협력을 넓혀가고 있습니다. 다만 이번 발언은 구체적인 거래 체결이 아니라 파트너십 모색 단계임을 명확히 해야 합니다. 인도네시아 내 공동투자나 금융 파트너십을 검토하는 한국 기관투자자·금융회사는 다난타라가 선호하는 동남아 재투자형 구조와 산업 분야를 참고해 구체적인 협력 분야를 제안해볼 수 있으며, 이미 진출한 한국계 PT PMA도 다난타라와의 자본 연계 가능성이 업종별로 확대될 수 있다는 점을 염두에 둘 필요가 있습니다.`,
    source:`KED Global`, url:`https://www.kedglobal.com/ask-2026/newsView/ked202610210010` },
];

function renderNews(lang){ const t = T[lang].news; return `
${siteHeader('news', lang)}
${pageHero('news','gold', lang, t.pageEyebrow, t.pageTitle, t.pageDesc)}
<section class="section">
  <div class="wrap">
    <div class="grid-3">
      <div class="news-card">
        <div class="news-ph">${ph(t.c1ph,'coffee')}</div>
        <div class="news-body"><span class="date">${t.c1date}</span><h4>${t.c1title}</h4><p>${t.c1desc}</p></div>
      </div>
      <div class="news-card">
        <div class="news-ph">${ph(t.c2ph,'green')}</div>
        <div class="news-body"><span class="date">${t.c2date}</span><h4>${t.c2title}</h4><p>${t.c2desc}</p></div>
      </div>
      <div class="news-card">
        <div class="news-ph">${ph(t.c3ph,'navy')}</div>
        <div class="news-body"><span class="date">${t.c3date}</span><h4>${t.c3title}</h4><p>${t.c3desc}</p></div>
      </div>
    </div>
    <div class="nl-panel">
      <div class="nl-head">
        <div>
          ${eyebrow(t.nlEyebrow)}
          <h3>${t.nlTitle}</h3>
          <p>${t.nlDesc}</p>
        </div>
        <span class="nl-period">${NEWSLETTER_PERIOD}</span>
      </div>
      <div class="nl-list">
        ${NEWSLETTER_ITEMS.map((n,i)=>{ const c = NL_CATS[n.cat]; return `
        <div class="nl-item">
          <div class="nl-rank">${i+1}</div>
          <div class="nl-body">
            <div class="nl-top"><span class="badge-pill ${c.theme}"><span class="dot"></span>${c.label}</span></div>
            <h4>${n.title}</h4>
            <p>${n.desc}</p>
            <div class="nl-meta">
              <span>${n.date}</span><span class="dot-sep"></span><span>${n.source}</span><span class="dot-sep"></span>
              <a class="nl-src" href="${n.url}" target="_blank" rel="noopener noreferrer">${t.nlSrcLabel}${icon('arrowRight',13)}</a>
            </div>
          </div>
        </div>`; }).join('')}
      </div>
      <p class="nl-note">${t.nlNote}</p>
    </div>
  </div>
</section>
${siteFooter(lang)}`; }

function renderCurrentPage(){
  document.documentElement.lang = currentLang;
  document.title = DOC_TITLE[currentLang] || DOC_TITLE.en;
  app.innerHTML = renderNews(currentLang) + fab(currentLang);
  window.scrollTo(0,0);
}
renderCurrentPage();
</script>
</body>
</html>
