  { cat:`econ`, date:`2026.08.19 결정`, title:`印, 새 총재 첫 회의서 기준금리 5.75% 동결`,
    desc:`인도네시아 중앙은행(Bank Indonesia)이 8월 18~19일 통화정책회의(RDG)에서 기준금리(BI-Rate)를 5.75%로 2개월 연속 동결했습니다. 예치금리(Deposit Facility)는 4.75%, 대출금리(Lending Facility)는 6.50%로 함께 유지됐습니다. 이번 회의는 지난 7월 말 페리 와르지요 전 총재가 사임한 이후 임시총재로 취임한 데스트리 다마얀티가 처음으로 주재한 회의라는 점에서 주목받았습니다. 데스트리 임시총재는 기자회견에서 이번 결정이 중동발 지정학적 불확실성 속에서 루피아화 안정을 강화하고, 2026~2027년 물가상승률 목표(2.5%±1%)를 선제적으로 지키며, 지속가능한 경제성장을 뒷받침하려는 노력과 일관된 조치라고 설명했습니다. 앞서 프라보워 대통령은 8월 10일 데스트리 임시총재를 차기 총재 단독 후보로 국회(DPR)에 공식 제청했으며, 승인될 경우 그는 인도네시아 사상 첫 여성 중앙은행 총재가 됩니다. DPR 11위원회는 오는 8월 26일 데스트리 후보에 대한 인사청문회(적격성 심사)를 진행할 예정입니다. 시장에서는 이번 동결이 새 총재 체제에서도 정책 연속성이 유지될 신호로 해석하고 있습니다. 다만 8월 26일 청문회 결과에 따라 향후 통화정책 기조나 금융시장 심리가 영향을 받을 수 있어 주의 깊게 지켜볼 필요가 있습니다. 루피아 표시 차입이나 대규모 환전·배당송금을 계획 중인 PT PMA는 청문회 이후 발표되는 정책 방향을 확인한 뒤 일정을 조정하는 것이 안전합니다.`,

  { cat:`econ`, date:`2026.07 발표(상반기 실적)`, title:`상반기 투자실적 1010조 루피아...홍콩이 1위 투자국 등극`,
    desc:`인도네시아 투자조정청(BKPM)이 발표한 자료에 따르면, 2026년 상반기(1~6월) 전체 투자실현액은 1010조6000억 루피아를 기록했고 이 중 2분기(4~6월)에만 511조8000억 루피아가 실현돼 전년 동기 대비 7.1% 증가했습니다. 2분기 투자로 창출된 직접고용은 74만2293명에 달합니다. 상반기 외국인직접투자(FDI)는 507조6000억 루피아로 전체의 50.2%를 차지해 내수 투자와 비슷한 비중을 유지했습니다. 특히 2분기 국가별 FDI 순위에서는 지난 10년간 처음으로 홍콩(중국)이 약 50억 달러 규모로 1위에 올라섰고, 싱가포르·중국 본토·일본·말레이시아가 뒤를 이었습니다. 업종별로는 기초금속·비기계류 금속가공업이 투자를 견인했고, 이어 기타서비스업, 광업, 운수·창고·통신업 순으로 나타났습니다. 지역별로는 자바 이외 지역 투자(50.2%)가 처음으로 자바 지역(49.8%)을 근소하게 앞질렀습니다. 이번 통계에서 한국은 상위 5개 투자국에 이름을 올리지 못해, 니켈 하류화·배터리 등 기초금속 부문에서 중국계 자본과의 경쟁이 한층 치열해지고 있음을 보여줍니다. 니켈·배터리 밸류체인에 투자 중인 한국 기업이라면 이번 순위 변화를 참고해 경쟁 구도와 인허가·부지 확보 전략을 재점검할 필요가 있습니다. 전반적인 투자심리는 견조하게 유지되고 있어, 신규 진출을 검토하는 PT PMA에도 긍정적인 배경으로 볼 수 있습니다.`,
    source:`BKPM(인도네시아 투자조정청)`, url:`https://www.bkpm.go.id/en/info/press-release/investment-realization-reaches-idr-1-010-6-trillion-in-the-first-half-of-2026-creating-1-4-million-jobs` },
  { cat:`reg`, date:`2025년 시행 · 단속 강화`, title:`외국인근로자(TKA) 규정 대폭 강화...IMTA 폐지, RPTKA로 단일화`,
    desc:`인력법 6호(2023) 제42조에 따라 모든 외국인근로자(TKA)는 취업 전 반드시 노동부의 외국인력활용계획서(RPTKA) 승인을 받아야 합니다. 최근 개편으로 기존에 병행 발급되던 취업허가서(IMTA)는 폐지됐고, RPTKA가 외국인 취업의 유일한 공식 서류로 단일화됐습니다. RPTKA는 승인받은 기간에 한해 유효하며 1회 최대 2년까지 신청할 수 있습니다. 인사·노무관리(HR) 직군 전반은 여전히 외국인 채용이 전면 금지된 대표적 제한 직종입니다. 노동부는 산업단지를 중심으로 현장 단속을 강화하고 있는데, 지난해 10월 27일부터 11월 1일까지 끄따빵 산업단지에서 실시한 불시 점검에서 RPTKA 없이 근무 중인 외국인근로자 164명이 적발돼 해당 기업(PT BAP)에 21억7000만 루피아라는 이례적으로 큰 규모의 행정과징금이 부과된 사례가 있습니다. 이는 노동부가 밝힌 역대 최대 규모의 RPTKA 위반 제재 중 하나로 꼽힙니다. 이러한 흐름은 2026년 들어 정부가 외국인 고용 규정 준수를 한층 엄격하게 집행하고 있음을 보여줍니다. 한국인 주재원이나 기술인력을 다수 고용 중인 PT PMA는 전 직원의 RPTKA 승인 상태와 유효기간을 즉시 재확인하고, 특히 산업단지 내 사업장이라면 불시 점검 가능성에 대비해 서류를 상시 최신 상태로 유지해야 합니다.`,
    source:`Live and Work Indonesia`, url:`https://livenworkindonesia.com/news/indonesia-tightens-foreign-worker-compliance-in-2026-as-kemnaker-fines-company-idr-2-17-billion-over-unauthorized-rptka/` },
  { cat:`reg`, date:`2026년 시행 예정`, title:`조세감면 '택스홀리데이' 개편...글로벌최저한세 대응`,
    desc:`인도네시아의 법인세 감면 인센티브인 '택스홀리데이'는 현재 재무부령(PMK) 69/2024호에 근거해 2025년 12월 말까지만 유효하도록 규정돼 있었습니다. 재무부는 투자 모멘텀을 이어가기 위해 이를 2026년까지 1년 연장하는 새 재무부령(PMK)을 준비 중이라고 밝혔습니다. 다만 단순 연장이 아니라, 2026년부터 인도네시아에 도입되는 OECD 글로벌최저한세(GMT, 15%) 규정에 맞춰 제도 자체를 재설계하는 작업이 함께 진행되고 있습니다. 실효세율이 15%에 미달하는 다국적기업 그룹은 택스홀리데이 혜택을 받더라도 본국 등 다른 관할권에서 추가과세(top-up tax)를 부과받아 감면 효과가 상쇄될 수 있다는 문제 때문입니다. 현행 제도는 최소 1000억 루피아 이상을 투자하는 선도산업(파이오니어 섹터) 또는 경제특구(KEK)·신수도(IKN) 등 전략 입지에 대해 5~20년간 법인세를 최대 100% 감면하고, 이후 2년간 50% 추가 감면을 제공합니다. 새 PMK는 이러한 감면 구조를 유지하면서도 글로벌최저한세 하에서 실질적 혜택이 사라지지 않도록 세액공제 등 대안적 인센티브 방식을 함께 검토하는 것으로 알려졌습니다. 아직 최종 규정은 공표되지 않아 세부 조건은 확정을 기다려야 합니다. 대규모 제조·배터리 투자를 진행 중이거나 계획 중인 한국 기업, 특히 해외 지주회사 구조를 통해 그룹 실효세율이 15%에 가까운 기업은 새 PMK 발표 즉시 세무 전문가와 함께 기존·예정 택스홀리데이 신청에 미치는 영향을 재점검해야 합니다.`,
    source:`DDTCNews`, url:`https://news.ddtc.co.id/berita/nasional/1816109/pmk-sedang-disusun-insentif-tax-holiday-akan-diperpanjang-setahun` },
  { cat:`tax`, date:`KITAS 발급 전 납부`, title:`외국인근로자보상기금(DKP-TKA), 월 100달러 의무납부`,
    desc:`인도네시아에서 외국인근로자를 고용하려면 RPTKA 승인과 별개로 '외국인력활용보상기금'(DKP-TKA)을 납부해야 합니다. 금액은 외국인근로자 1인당 월 100달러로 고정돼 있으며, 근로자 개인이 아니라 고용주(스폰서 기업)가 전액 부담합니다. 이 기금은 정부 통합납부시스템(SIMPONI)을 통해 승인된 RPTKA 유효기간 전체에 대해 사전 일시납부해야 하며, 예컨대 2년짜리 RPTKA라면 2400달러를 미리 납부하는 방식입니다. DKP-TKA 납부가 완료되어야 비로소 해당 외국인근로자의 KITAS(제한체류허가) 발급이 진행될 수 있어, 사실상 취업비자 절차의 필수 관문에 해당합니다. 조성된 기금은 인도네시아 근로자 직업훈련 프로그램 재원으로 활용됩니다. 정부기관, 국제기구, 외국 정부 대표부 소속 인력 등은 정부규정(PP) 34/2021호에 따라 이 의무에서 면제됩니다. RPTKA·IMTA 관련 규정 개편과 맞물려 노무 관련 각종 비용·서류 요건이 동시에 늘어나고 있는 만큼, 한국인 주재원을 파견 중이거나 파견 예정인 PT PMA는 총 고용비용 산정 시 DKP-TKA 납부액을 반드시 반영해야 합니다. 특히 신규 채용이나 비자 갱신 일정을 세울 때는 SIMPONI 납부 완료 여부를 미리 확인해 KITAS 발급이 지연되지 않도록 관리하는 것이 중요합니다.`,
    source:`Visa Indonesia`, url:`https://visa-indonesia.com/visas-and-regulations/how-to-pay-dkp-tka-indonesia/` },
  { cat:`tax`, date:`2026.08.08-09 발생`, title:`Coretax 시스템 24시간 다운...세무 신고 일정 유의`,
    desc:`인도네시아 국세청(DJP)이 시스템 보안·안정성·성능 개선을 이유로 8월 8일(토) 오후 6시부터 8월 9일(일) 오후 6시까지 24시간 동안 Coretax 시스템 전면 점검(다운타임)을 실시했습니다. 이 기간 동안 e-Filing, e-Faktur(전자세금계산서), e-Bupot 등 Coretax 기반의 모든 온라인 세무 서비스 이용이 전면 중단됐습니다. DJP는 다운타임 기간 중 관계기관들이 납세자상태확인(KSWP) 절차를 우회(bypass)할 수 있도록 허용했으며, 공식 안내 페이지인 pajak.go.id는 정상적으로 접속 가능했다고 밝혔습니다. 당국은 주말 동안 세무 업무를 계획했던 납세자에게 다운타임 시작 전이나 시스템 정상화(8월 9일 오후 6시) 이후로 일정을 조정할 것을 권고했습니다. 이번 점검은 2025년 Coretax 전면 도입 이후 올해 들어서도 반복되고 있는 예정된 시스템 정비 중 하나로, 시스템 안정화가 아직 진행 중임을 보여줍니다. 세금계산서 발행이나 신고 마감이 임박한 상태에서 갑작스러운 접속 장애가 발생하면 가산세 등 불이익으로 이어질 수 있어 주의가 필요합니다. PT PMA 재무·세무 담당자는 신고·납부 마감일 직전 주말에 몰아서 처리하기보다 여유를 두고 미리 처리하는 습관을 들이고, DJP 공지사항 페이지를 통해 추가 점검 일정을 수시로 확인하는 것이 바람직합니다.`,
    source:`CNBC Indonesia`, url:`https://www.cnbcindonesia.com/news/20260807145702-4-757456/pengumuman-coretax-djp-tak-bisa-diakses-selama-akhir-pekan` },
  { cat:`tip`, date:`2026.10.17 마감`, title:`할랄인증 의무화 D-2개월...중소기업·수입품도 대상`,
    desc:`정부규정(PP) 42/2024호에 따른 할랄제품보장 의무화 조치가 단계적으로 확대되는 가운데, 오는 10월 17일은 소상공인(중소·영세기업)과 수입 식품·화장품 등에 대한 할랄인증 의무화 마감일입니다. 앞서 2024년 10월에는 중·대형 국내 생산업체가 먼저 의무화 대상이 됐으며, 이번에는 그 적용 범위가 식품·음료뿐 아니라 화장품, 의약품, 의료기기, 화학·생물학적 제품, GMO 제품 등으로 넓어집니다. 10월 18일부터는 할랄제품보장청(BPJPH)이 시장 감독·단속을 본격 개시하며, 인증받지 못한 제품은 매장 진열 중단, 벌금 부과, 사업허가 정지 등의 제재를 받을 수 있고 리테일·이커머스 플랫폼도 미인증 제품 판매를 거부할 수 있습니다. 통상 원재료 이력이 깨끗한 생산업체 기준으로도 할랄인증 취득에는 3~6개월이 소요되는 것으로 알려져, 아직 절차를 시작하지 않은 기업은 마감일을 놓칠 위험이 있습니다. 식품·화장품·소비재를 취급하며 자본금이나 매출 규모상 이번 단계 적용 대상에 해당하는 PT PMA, 특히 한국에서 원료·완제품을 수입해 유통하는 기업은 지금 즉시 인증 대상 여부를 점검해야 합니다. 할랄검사기관(LPH) 선정과 인도네시아 울라마협의회(MUI)의 할랄 파트와 취득 절차를 서둘러 시작하고, 소상공인 요건에 해당한다면 유예·지원 제도 적용 가능 여부도 함께 확인하는 것이 좋습니다.`,
    source:`Business Hub Asia`, url:`https://businesshubasia.com/halal-certificate-indonesia-2026/` },
  { cat:`tip`, date:`2026.05 이후 계속 적용`, title:`발리 신규 PT PMA, 가상오피스 주소 등록 불가`,
    desc:`올해 5월 중순부터 OSS 시스템 정책 변경으로 발리 지역에서는 신규 PT PMA 설립 시 가상오피스(버추얼오피스) 주소를 사업장 주소로 등록할 수 없게 됐습니다. 신규 설립 신청 기업은 이제 실제로 존재하고 확인 가능한 상업용 주소를 제시해야 하며, 해당 부지가 지역 용도지역계획(RTRW·RDTR)상 해당 업종 영위가 가능한 구역인지도 함께 충족해야 합니다. 이번 조치의 영향을 크게 받는 업종은 외국인 소자본 창업에서 흔히 활용되던 저위험·중저위험 KBLI 분류 사업들로, 부동산·빌라 관리, 컨설팅, 여행업, 소매업, 렌터카업 등이 대표적입니다. 이에 따라 공증인(노타리스)을 통한 법인 설립 절차에 들어가기 전, KBLI 위험등급 확인, 투자목록(포지티브 리스트)상 허용 여부, 그리고 실제 사업장 주소의 용도지역 적합성까지 사전에 해결해야 하는 순서로 절차가 바뀌었습니다. 그동안 관행적으로 활용되던 코워킹스페이스나 가상오피스 주소만으로는 더 이상 발리에서 신규 PT PMA 등록이 불가능해진 셈입니다. 발리에서 소규모 요식업, 숙박업, 컨설팅업 등으로 PT PMA 설립을 준비 중인 한국인 투자자라면 설립 초기 단계부터 실제 임대 사무실·매장 확보 비용을 예산에 반영해야 합니다. 등록 신청 전에 현지 인허가 대행업체를 통해 목표 부지의 용도지역이 계획 중인 KBLI 업종을 실제로 허용하는지 미리 확인해두면, OSS 반려로 인한 설립 지연을 예방할 수 있습니다.`,
    source:`Bali Villa Realty`, url:`https://balivillarealty.com/blog/bali-no-longer-permits-virtual-office-pt-pma/` },
  { cat:`kr`, date:`2026.08.10 세미나`, title:`에코프로, 인니 니켈제련소 대주주 참여 확대`,
    desc:`에코프로그룹이 인도네시아 산업단지 내 BNSI 니켈제련소 프로젝트에 대주주로 참여한다고 지난 6월 30일 밝힌 데 이어, 8월 10일 서울 JW메리어트호텔에서 그룹 사외이사와 기관투자자를 대상으로 '인도네시아 BNSI 투자설명회'를 열고 구체적인 투자 청사진을 공개했습니다. 에코프로와 에코프로비엠은 기존 계획보다 지분을 확대해 합산 39%를 확보하며 프로젝트를 주도할 예정입니다. 이번 투자가 마무리되면 에코프로는 지분율에 따라 연간 니켈 6만5000톤에 대한 수급권을 갖게 되며, 이는 업계 추산 전기차 약 150만 대분의 배터리 소재에 해당하는 물량입니다. BNSI 제련소는 지난해 4월 착공했으며, 지난달 23일 반응기(리액터) 반입이 완료돼 내년(2027년) 2분기 양산을 목표로 하고 있습니다. 이는 배터리 소재 기업들이 니켈 등 핵심광물 공급망을 중개상을 거치지 않고 현지에서 직접 확보하려는 흐름을 보여주는 사례로, CATL·안탐(Antam) 등 중국계 자본이 주도하는 인도네시아 니켈 프로젝트와의 경쟁이 심화되는 가운데 나온 결정입니다. 국내 배터리 소재·전구체·양극재 기업이나 관련 PT PMA는 에코프로의 이번 지분 확대가 인도네시아 니켈 생태계 내 협력사 발굴이나 공급계약 기회로 이어질 수 있는지 주시할 만합니다. 니켈 하류화 관련 신규 투자를 검토 중인 기업이라면 BNSI 프로젝트의 진행 상황을 참고 사례로 삼을 수 있습니다.`,
    source:`메트로서울`, url:`https://www.metroseoul.co.kr/article/20260811500453` },
  { cat:`kr`, date:`2026.08 보도`, title:`CJ푸드빌 뚜레쥬르, 인니 현지인력 채용 확대`,
    desc:`CJ푸드빌의 베이커리 브랜드 뚜레쥬르(TOUS les JOURS)가 인도네시아에서 영토 확장에 속도를 내고 있습니다. 매장 수는 2022년 47개에서 올해 약 70개로 늘었으며, 자카르타 수도권을 넘어 반둥·수라바야·발리까지, 지난 3월에는 한국 베이커리 브랜드 최초로 롬복섬에도 매장을 열었습니다. 이와 함께 회사는 자카르타 남부와 서부자바 베카시·치비퉁의 생산·물류 거점을 중심으로 예산관리, 구매 매니저, 품질관리 책임자, 물류 담당 등 전 직군에 걸쳐 현지 채용을 확대하고 있습니다. 이는 매장망 확대에 맞춰 현지 생산·유통 인프라를 다지고 수익성을 끌어올리기 위한 포석으로 풀이됩니다. 지난달 자카르타 스노파티(Senopati) 매장에서는 한국에서 인기 있는 '아그작(AGJAK)' 케이크를 출시해 연일 완판을 기록하는 등 현지화와 한국식 상품력을 함께 앞세우는 전략을 이어가고 있습니다. 회사는 앞서 청년 채용 프로그램을 통해 베이커리 전문가를 꿈꾸는 인도네시아 현지 학생들을 선발해 정직원으로 채용하기도 했습니다. 다만 뚜레쥬르의 동남아 전체 해외사업 실적은 국가별로 엇갈리는 것으로 알려진 가운데, 인도네시아는 상대적으로 성과가 좋은 시장으로 꼽힙니다. CJ푸드빌이 인도네시아 현지 생산·물류·품질관리 인프라를 자체적으로 갖춰가는 것은 현지 한식·K-푸드 생태계가 한 단계 성숙하고 있다는 신호로도 볼 수 있어, 관련 업종의 한국 PMA 기업이라면 물류·유통망 협력 가능성을 참고할 만합니다.`,
    source:`더구루`, url:`https://www.theguru.co.kr/news/article.html?no=105757` },
];

function renderNews(lang){ const t = T[lang].news; return `
${siteHeader('news', lang)}
${pageHero('news','gold', lang, t.pageEyebrow, t.pageTitle, t.pageDesc)}
<section class="section">
  <div class="wrap">
    <div class="grid-3">
      <div class="news-card">
        <div class="news-ph">${ph(t.c1ph,'coffee')}</div>
        <div class="news-body"><span class="date">${t.c1date}</span><h4>${t.c1title}</h4><p>${t.c1desc}</p></div>
      </div>
      <div class="news-card">
        <div class="news-ph">${ph(t.c2ph,'green')}</div>
        <div class="news-body"><span class="date">${t.c2date}</span><h4>${t.c2title}</h4><p>${t.c2desc}</p></div>
      </div>
      <div class="news-card">
        <div class="news-ph">${ph(t.c3ph,'navy')}</div>
        <div class="news-body"><span class="date">${t.c3date}</span><h4>${t.c3title}</h4><p>${t.c3desc}</p></div>
      </div>
    </div>
    <div class="nl-panel">
      <div class="nl-head">
        <div>
          ${eyebrow(t.nlEyebrow)}
          <h3>${t.nlTitle}</h3>
          <p>${t.nlDesc}</p>
        </div>
        <span class="nl-period">${NEWSLETTER_PERIOD}</span>
      </div>
      <div class="nl-list">
        ${NEWSLETTER_ITEMS.map((n,i)=>{ const c = NL_CATS[n.cat]; return `
        <div class="nl-item">
          <div class="nl-rank">${i+1}</div>
          <div class="nl-body">
            <div class="nl-top"><span class="badge-pill ${c.theme}"><span class="dot"></span>${c.label}</span></div>
            <h4>${n.title}</h4>
            <p>${n.desc}</p>
            <div class="nl-meta">
              <span>${n.date}</span><span class="dot-sep"></span><span>${n.source}</span><span class="dot-sep"></span>
              <a class="nl-src" href="${n.url}" target="_blank" rel="noopener noreferrer">${t.nlSrcLabel}${icon('arrowRight',13)}</a>
            </div>
          </div>
        </div>`; }).join('')}
      </div>
      <p class="nl-note">${t.nlNote}</p>
    </div>
  </div>
</section>
${siteFooter(lang)}`; }

function renderCurrentPage(){
  document.documentElement.lang = currentLang;
  document.title = DOC_TITLE[currentLang] || DOC_TITLE.en;
  app.innerHTML = renderNews(currentLang) + fab(currentLang);
  window.scrollTo(0,0);
}
renderCurrentPage();
</script>
</body>
</html>
