  { cat:`reg`, date:`2026.10.28 서명`, title:`프라보워, 신 노동자보호법(UU 27/2026) 서명·공포`,
    desc:`프라보워 수비안토 대통령이 10월28일 노동자보호법(UU Pelindungan Ketenagakerjaan)에 서명해 공포했다고 신도뉴스(Sindonews)가 11월7일 보도했습니다. 이 법은 10월6일 하원(DPR) 본회의에서 의결된 지 3주 만에 서명이 이뤄진 것으로, 법률 전문은 11월6일 국무장관실(Setneg) 법제정보시스템(JDIH)에 게재되며 공식 확인됐습니다. 법률 번호는 '2026년 제27호'로 부여됐으며, 총 23장 313개 조항으로 구성돼 있습니다. 이는 2024년 헌법재판소가 일자리창출법(Cipta Kerja)의 고용 관련 조항을 별도 법률로 분리해 재입법하라고 명령한 데 따른 후속 조치입니다. 법 제312조는 세부 시행령(PP)을 공포 후 1년 이내에 마련하도록 규정하고 있어, 2027년10월 말까지 시행 규칙이 차례로 나올 예정입니다. 기간제 근로계약(PKWT)은 최초 2년에 1년 단위로 두 차례까지만 연장할 수 있어 전체 계약 기간이 최장 4년으로 제한됩니다. 이주노동자 송출·관리 권한은 노동부에서 이주노동자보호청(P2MI)으로 이전됐다고 해당 부처 장관이 확인했습니다. 노동계는 시행령 제정 과정에서 기존 보호 수준이 약화되지 않도록 감시하겠다는 입장을 밝혔습니다. 모든 PT PMA는 1년 전환 기간 동안 순차 발표되는 시행령을 주시하며 PKWT 계약, 인력 송출, 외국인 근로자 관리 체계를 재정비할 준비를 시작해야 합니다. 특히 장기 PKWT 계약을 운용 중인 기업은 계약 갱신 시점마다 4년 한도 초과 여부를 점검해야 합니다.`,
    source:`Sindonews`, url:`https://nasional.sindonews.com/read/1769319/12/prabowo-tanda-tangani-uu-pelindungan-ketenagakerjaan-peraturan-pelaksanaan-paling-lama-1-tahun-1794003069` },
  { cat:`reg`, date:`2026.11.08 보도`, title:`최저임금 산정식 KHL 기준 변경, 퇴직금 적립준비금 신설`,
    desc:`콤파스(Kompas)는 11월8일 새로 공포된 노동자보호법(UU 27/2026)의 임금·퇴직금 핵심 조항을 정리해 보도했습니다. 이에 따르면 지역별 최저임금(UMP)이 해당 지역의 적정생계비(KHL)에 미달할 경우 우선 KHL 수준까지 끌어올리고, 이미 KHL을 넘어선 지역은 물가상승률·경제성장률과 '특정지수(알파)'를 반영한 공식으로 매년 조정하도록 규정했습니다. 카타다타(Katadata) 보도에 따르면 알파 지수 적용 범위가 기존 일자리창출법 시행령상 0.1~0.3에서 0.5~1.0으로 상향돼, 향후 매년 임금 인상률이 과거보다 커질 가능성이 있다고 분석가들은 전망했습니다. 해고(PHK) 시 지급하는 퇴직금(페상곤) 배율 산정에서는 기존에 적용되던 0.5배 할인 규정이 폐지되는 것으로 알려졌으며, 최종 배율은 근속연수 등 요소에 따라 결정됩니다. 법안은 기업이 퇴직금 지급 재원을 마련하도록 '퇴직금 적립준비금(dana cadangan pesangon)' 제도를 새로 도입했는데, 이는 실업보험(JKP)과는 별도의 기업 자체 적립 제도입니다. 다만 세부 산정 공식은 아직 시행령으로 확정되지 않았으며, 2027년도 최저임금은 기존 정부규정(PP 49/2025)에 따라 산정되고 새 공식은 공포 후 1년이 지난 시점부터 적용됩니다. 노동조합총연맹(KSPI)은 2027년도에 적용할 알파 지수를 0.9로 제안한 상태입니다. 인건비 비중이 높은 제조업·서비스업 PT PMA는 알파 지수 상향과 퇴직금 배율 변경이 향후 인건비·구조조정 비용에 미칠 영향을 시나리오별로 추산해 둘 필요가 있습니다. 퇴직금 적립준비금의 구체적 적립 방식과 비율은 시행령 공개 즉시 확인해 재무 계획에 반영해야 합니다.`,
    source:`Kompas.com`, url:`https://nasional.kompas.com/read/2026/11/08/11140711/poin-penting-uu-pelindungan-ketenagakerjaan-ump-dari-kebutuhan-hidup-layak` },
  { cat:`tip`, date:`2026.10.07 보도`, title:`아웃소싱(알리다야) 활용, 5대 지원 업종으로 엄격 제한`,
    desc:`RCTI+/iNews와 IDX채널은 10월7일, 새로 의결된 노동자보호법이 아웃소싱(알리다야) 활용 업종을 다섯 가지로 엄격히 제한했다고 보도했습니다. 허용되는 외주 업무는 청소, 근로자 급식 제공, 보안(경비), 광업·석유 부문 지원 서비스, 운송 등 다섯 가지뿐입니다. 이는 기존 일자리창출법 체제에서 비교적 폭넓게 허용되던 아웃소싱 범위를 크게 좁힌 것으로, 노동계가 꾸준히 요구해온 핵심 사안이 반영된 결과로 풀이됩니다. 법안은 이와 함께 기간제 계약(PKWT) 기간 제한, 근로시간·휴가·임금·사회보장·해고 관련 근로자 권리를 보다 상세히 규정했습니다. 다만 디지털 플랫폼 노동자(오젝 온라인 기사, 배달기사 등) 보호 조항은 최종 의결 과정에서 법안에서 빠진 것으로 카타다타가 확인했으며, DPR 측의 삭제 이유에 대한 공식 답변은 아직 나오지 않았습니다. 생산 보조 업무나 IT·고객센터 등을 외주 인력으로 운용하던 PT PMA는 해당 업무가 다섯 가지 허용 범위에 포함되는지 즉시 점검해야 합니다. 범위를 벗어나는 외주 계약은 시행령 공포 전환 기간 동안 직접고용으로 전환하거나 계약 구조를 재설계해야 할 가능성이 큽니다. 노동계는 시행령 제정 과정에서 기존 아웃소싱 근로자 보호 수준이 후퇴하지 않도록 감시할 것을 정부에 요구하고 있습니다. 외주 인력 비중이 높은 제조업·물류·IT 서비스 분야 PT PMA는 인사·법무팀 차원에서 현재 운용 중인 모든 외주 계약을 다섯 가지 허용 업종 기준으로 전면 재검토하는 작업을 지금부터 시작하는 것이 바람직합니다.`,
    source:`IDX Channel`, url:`https://www.rctiplus.com/news/detail/idxchannel/5487705/uu-ketenagakerjaan-disahkan--lindungi-pekerja-digital-hingga-perketat-aturan-outsourching` },
  { cat:`econ`, date:`2026.11.05 발표`, title:`3분기 GDP 5.47% 성장, 시장 예상치 상회`,
    desc:`인도네시아 통계청(BPS)은 11월5일 2026년 3분기(7~9월) 국내총생산(GDP)이 전년 동기 대비 5.47% 성장했다고 발표했습니다. BPS 균형·통계분석 담당 부청장 에디 마흐무드는 이 수치가 시장 예상치를 상회했다고 밝혔으며, 불변가격 기준 GDP는 3,633조2,000억 루피아, 현재가격 기준으로는 6,741조 루피아를 기록했습니다. 이는 직전 분기인 2분기 성장률 5.29%, 전년 동기인 2025년 3분기 5.04%보다 높아진 수치로, 메트로TV와 콘탄(Kontan) 등 현지 언론은 제조업과 투자 부문의 견조한 성장이 이를 뒷받침했다고 전했습니다. BPS는 올해 들어 분기별 성장률이 5% 이상을 안정적으로 유지하고 있다고 강조했으며, 모든 산업 부문과 전국 모든 섬 지역에서 양(+)의 성장을 기록했다고 설명했습니다. 투자실현 측면에서는 투자조정청(BKPM)이 집계한 3분기 투자실현액이 528조7,000억 루피아로 연간 목표의 75.4%에 달했다고 카타다타가 전했습니다. 다만 BPS는 내수 둔화 우려와 글로벌 교역 환경의 불확실성이 여전히 남아있다는 점도 함께 지적했습니다. 안정적인 5%대 성장세는 인도네시아 내수 시장을 겨냥한 PT PMA의 매출 전망에 긍정적 신호로 해석될 수 있습니다. 다만 성장 동력이 제조업·투자 중심으로 쏠려 있는 만큼, 자사가 속한 업종이 실제 수혜를 보고 있는지는 업종별 세부 지표로 별도 확인할 필요가 있습니다.`,
    source:`Metro TV News`, url:`https://www.metrotvnews.com/read/KRXCznRW-indonesian-economy-grows-5-47-in-third-quarter-beating-forecasts` },
  { cat:`tax`, date:`2026.11.06 보도`, title:`세금감면(Tax Holiday) 존폐 논란, 정부 "유지하되 개정"`,
    desc:`인도네시아 재무부의 세제 인센티브 정책을 두고 11월 첫째 주 엇갈린 발표가 이어졌습니다. DDTC뉴스는 11월4일 재무부 재정정책청(DJSEF) 멜라니 데위 아스투티 분석관이 "기존 인센티브는 대부분 글로벌최저한세(GMT) 체제와 양립 가능하지만 세금감면(tax holiday)만은 예외"라며 연장하지 않을 가능성을 시사했다고 보도했습니다. 그러나 이틀 뒤인 11월6일 IKPI(인도네시아 세무사협회)는 정부가 세금감면 제도 자체는 유지하되 관련 규정인 재무부규정(PMK) 69/2024를 글로벌최저한세 체제에 맞게 개정하는 방향으로 선회했다고 전했습니다. 카타다타도 같은 시기 정부가 글로벌최저한세 시행 속에서도 세금감면 인센티브 제공을 계속 이어가기로 했다고 보도해 이를 뒷받침했습니다. 경제조정부 장관 아이르랑가 하르타르토는 유럽연합과의 무역협정이 11월21일경 서명될 예정이며 글로벌최저한세 관련 내용도 포함된다고 언급했습니다. OECD의 글로벌최저한세 규정상 세금감면은 적격 세제혜택으로 인정되지 않는다는 점이 이번 논란의 배경입니다. 정부는 세금감면 대체 수단으로 세액공제 방식이나 비조세적 지원책 등을 검토 중인 것으로 알려졌으나 최종안은 아직 확정되지 않았습니다. 기존에 세금감면을 승인받았거나 신청을 준비 중인 PT PMA는 PMK 69/2024 개정안이 공개되는 즉시 자사에 적용되는 감면 기간·비율이 달라지는지 반드시 확인해야 합니다. 신규 대규모 투자를 계획 중인 기업은 대체 인센티브의 구체적 내용이 나올 때까지 투자 인센티브 관련 의사결정을 복수 시나리오로 검토하는 것이 바람직합니다.`,
    source:`IKPI`, url:`https://ikpi.or.id/articles/tax-holiday-masih-dipertahankan-pemerintah-bakal-revisi-aturannya` },
  { cat:`tax`, date:`2026.11.07~08 다운타임`, title:`Coretax 시스템 25시간 점검, 주말 접속 전면 중단`,
    desc:`인도네시아 국세청(DJP)은 코어택스(Coretax) 시스템의 보안·안정성·성능 개선을 위한 정기 점검을 이유로 11월7일(토) 오후5시부터 11월8일(일) 오후6시까지 약 25시간 동안 시스템 접속을 중단한다고 11월4일 공지했습니다. 이 공지는 DJP 홍보·서비스·공보국장 인게 디아나 리스마완티 명의로 발표됐으며, IKPI도 11월5일 이를 재확인해 회원들에게 전파했습니다. 점검 기간 동안 코어택스 공식 웹사이트(coretaxdjp.pajak.go.id)를 통한 모든 세무 행정 업무, 즉 세금계산서 발행, 세금신고서(SPT) 제출, 각종 신청서 접수 등이 전면 불가능했습니다. DJP는 납세자들에게 긴급한 업무는 11월7일 오후5시 이전에 마무리할 것을 권고했습니다. 이는 2026년에만 여러 차례 반복된 코어택스 다운타임 공지 중 가장 최근 사례로, DDTC뉴스 등에 따르면 올해 들어 거의 매달 주말마다 짧은 점검이 이뤄지고 있습니다. 코어택스는 2026년부터 법인·개인 SPT 연차신고와 부가가치세(PPN)·원천징수 신고 등 거의 모든 세무 행정의 필수 창구로 자리잡았습니다. 정기 점검 자체는 시스템 안정화 조치이지만, 반복되는 다운타임은 분기 말이나 신고 마감일 직전에 업무를 몰아서 처리하는 PT PMA 세무 담당자에게 일정 차질로 이어질 수 있습니다. 매달 발표되는 DJP의 점검 공지를 사전에 확인해 세금계산서 발행이나 신고서 제출 등 긴급 업무를 다운타임 전에 마무리하는 습관을 들이는 것이 안전합니다.`,
    source:`IKPI`, url:`https://ikpi.or.id/articles/coretax-tak-bisa-diakses-78-november-djp-jadwalkan-pemeliharaan-sistem` },
  { cat:`tax`, date:`2027.01.15 마감`, title:`4분기 LKPM 투자활동보고, PT PMA 규모 불문 의무 제출`,
    desc:`투자조정청(BKPM) 규정 5/2025 제286조에 따라 2026년4분기(10~12월) 투자활동보고서(LKPM) 정기 제출 마감일이 2027년1월15일로 확인됐습니다. 이는 인허가 전문 매체 이진닷코(izin.co.id)와 투자 컨설팅업체 에머허브(Emerhub)가 각각 공개한 LKPM 보고 일정표에서 공통으로 확인된 내용입니다. 모든 PT PMA(외국인투자기업)는 투자 규모와 관계없이 '대규모 사업자'로 자동 분류돼 매분기 LKPM을 의무적으로 제출해야 합니다. 반면 소기업은 2026년 하반기 단위로 보고하면 되고, 마이크로 사업자는 보고 의무 자체가 면제됩니다. 직전 분기인 3분기(7~9월) 보고 기간은 10월1일부터 10월15일까지였으며, 이번 4분기분은 10~12월 석 달간의 투자 실현 실적을 반영해야 합니다. BKPM규정 제373조 제2항에 따르면 2회 연속 LKPM을 제출하지 않을 경우 행정제재 대상이 될 수 있다고 명시돼 있습니다. 투자실현보고서에는 투자금 실현액, 고용 인원, 생산 실적 등 핵심 경영지표가 포함되므로 재무·인사 부서 간 사전 데이터 취합이 필요합니다. PT PMA는 연말 결산 업무와 겹치는 1월15일 마감일에 맞춰 11월부터 미리 4분기 투자·고용 실적 데이터를 정리해 두고, OSS 시스템을 통한 온라인 제출 절차를 사전에 점검해 두는 것이 안전합니다.`,
    source:`Izin.co.id`, url:`https://izin.co.id/blog/lkpm-triwulan-iv/` },
  { cat:`tip`, date:`2026.11월말 목표`, title:`2027년 최저임금(UMP) 논의 지연, 임금위원회 임기도 만료`,
    desc:`카타다타는 11월 초 보도에서 노동부 장관 야시에를리가 2027년도 지방최저임금(UMP) 산정에 관한 부처 내부 논의를 11월 마지막 주까지 마무리하는 것을 목표로 하고 있다고 전했습니다. 메트로TV와 코란자카르타 등도 같은 목표 일정을 확인하며, 내부 논의가 끝난 뒤에야 중앙임금위원회(Dewan Pengupahan Nasional)와 지방임금위원회 단계의 논의가 이어질 것이라고 전했습니다. 노동조합총연맹(KSPI) 사이드 이크발 위원장은 2027년도 UMP·업종별최저임금(UMSP)을 11월1일자로 조기 확정해 달라고 요구했으나 받아들여지지 않았으며, 정부 가이드라인이 늦어지면서 지방 임금위원회들이 혼선을 겪고 있다고 지적했습니다. 그는 특히 중앙임금위원회의 임기가 이미 만료됐는데도 차기 위원 구성이 이뤄지지 않은 상태라는 점도 문제로 제기했습니다. KSPI는 2027년도 임금 인상률로 7.5~9.5%를 제안했으며, 노동부는 2027년도 최저임금 산정에 여전히 기존 정부규정(PP 49/2025)을 적용한다고 확인했습니다. 지난해 사례를 보면 중앙정부의 공식 가이드라인은 11월 말~12월 초 사이에 나왔고, 각 주지사의 최종 UMP 확정은 12월24일을 기한으로 이뤄졌습니다. 올해도 유사한 일정이 예상되는 만큼, 2027년도 UMP 확정 시점은 11월 말~12월 말 사이가 될 가능성이 높습니다. 자카르타·서부자바 등 인건비 비중이 높은 지역에 사업장을 둔 PT PMA는 12월 중 발표될 2027년도 인건비 인상분을 반영해 내년도 예산안을 복수 시나리오(7.5%·8.5%·9.5% 등)로 미리 준비해 두는 것이 바람직합니다.`,
    source:`Katadata`, url:`https://katadata.co.id/berita/nasional/6ae076253350b/ump-2027-mulai-bergulir-menaker-target-pembahasan-internal-tuntas-november` },
  { cat:`kr`, date:`2026.11.02 완공`, title:`LG CNS, 자카르타에 한국 기업 첫 해외 AI데이터센터 완공`,
    desc:`LG CNS는 11월2일 인도네시아 자카르타에 30메가와트(MW) 규모의 하이퍼스케일 인공지능(AI) 데이터센터 건설을 완료했다고 발표했습니다. 코리아타임스 등 현지 보도에 따르면 이는 한국 기업이 해외에 지은 첫 AI 데이터센터로, LG CNS 측은 '한국 기업 최초의 해외 AI데이터센터 구축'이라는 의미를 부여했습니다. 이 프로젝트는 인도네시아 대기업 시나르마스 그룹과 한국투자리얼에셋운용의 합작법인인 KMG가 발주했으며, 완공 전부터 전체 용량이 모두 예약 완료된 것으로 알려졌습니다. 2025년 보도 당시 공사 계약 규모는 약 1,000억원(7,200만 달러)이었으나, 이번 완공 발표에서는 최종 투자액이 별도로 공개되지 않았습니다. LG CNS는 향후 증설을 통해 최종적으로 400메가와트 규모까지 용량을 늘리는 것을 목표로 하고 있으며, 현재 후속 공사 단계의 설계를 진행 중이라고 밝혔습니다. 회사 측은 이번 인도네시아 사업 경험을 바탕으로 말레이시아, 태국, 베트남, 필리핀, 일본 등 아시아태평양 지역으로 AI 데이터센터 사업을 확대할 계획이라고 설명했습니다. LG CNS는 이에 앞서 2026년9월 인도네시아 국세청으로부터 코어택스 시스템 구축·안정화 기여 공로로 감사패를 받기도 했습니다. 디지털 전환과 클라우드 인프라 확충을 추진하는 PT PMA는 자카르타 현지에 하이퍼스케일 AI 데이터센터가 가동되면서 클라우드·AI 서비스 이용 환경이 개선될 수 있다는 점을 참고할 수 있습니다. 특히 금융·제조·커머스 분야에서 AI 활용을 확대하려는 한국계 PT PMA는 LG CNS·시나르마스 합작망을 통한 현지 데이터센터 서비스 이용 가능성을 검토해볼 수 있습니다.`,
    source:`The Korea Times`, url:`https://www.koreatimes.co.kr/business/companies/20261102/lg-cns-completes-30-mw-ai-data-center-in-indonesia` },
  { cat:`econ`, date:`2026.11.03 보도`, title:`국부펀드 다난타라, 11월 재무보고 완료·200조 루피아 투자 집행`,
    desc:`인도네시아 국부펀드 다난타라(Danantara)의 로산 페르카사 루슬라니 최고경영자는 11월3일 프라보워 대통령을 면담한 자리에서 다난타라의 재무보고서를 11월 중 완료하는 것을 목표로 하고 있다고 밝혔다고 비즈니스닷컴(Bisnis.com)이 보도했습니다. 로산은 "11월 중 완료되기를 바란다"며 이를 재무 투명성 제고 노력의 일환이라고 설명했습니다. 앞서 10월26일 다난타라는 올해 안에 산하 투자운용사 다난타라 인베스트먼트 매니지먼트(DIM)에 최소 200조 루피아를 추가로 투입하겠다고 밝혔으며, 이를 통해 국영기업(BUMN) 부문 순이익 360조 루피아 달성을 목표로 하고 있습니다. 투자 대상으로는 폐기물에너지, 화학, 디지털 인프라, 농업 등 4대 우선 프로젝트 분야가 꼽혔습니다. 다난타라 산하 DIM은 지난 4월 기준 투자자산이 16조6,300억 루피아로, 2025년 말 300억 루피아에서 큰 폭으로 늘었다고 카타다타가 전했습니다. 다만 다난타라의 국고 배당 기여 여부를 두고는 정부 내에서도 엇갈린 설명이 나오고 있어, 2026·2027년 국가예산(APBN)에 다난타라 배당이 반영되는지는 추가 확인이 필요합니다. 국영기업과의 합작투자나 자금조달 파트너십을 모색하는 PT PMA는 다난타라가 집중하는 4대 우선순위 분야와 자사 사업 분야의 연관성을 검토해볼 수 있습니다. 다난타라의 투자 운용 규모가 계속 확대되고 있는 만큼, 관련 업종의 PT PMA는 BUMN과의 협력 기회를 주기적으로 모니터링하는 것이 유리합니다.`,
    source:`Bisnis.com`, url:`https://market.bisnis.com/read/20261103/192/2018094/rosan-targetkan-laporan-keuangan-danantara-rampung-november-2026` },
];

function renderNews(lang){ const t = T[lang].news; return `
${siteHeader('news', lang)}
${pageHero('news','gold', lang, t.pageEyebrow, t.pageTitle, t.pageDesc)}
<section class="section">
  <div class="wrap">
    <div class="grid-3">
      <div class="news-card">
        <div class="news-ph">${ph(t.c1ph,'coffee')}</div>
        <div class="news-body"><span class="date">${t.c1date}</span><h4>${t.c1title}</h4><p>${t.c1desc}</p></div>
      </div>
      <div class="news-card">
        <div class="news-ph">${ph(t.c2ph,'green')}</div>
        <div class="news-body"><span class="date">${t.c2date}</span><h4>${t.c2title}</h4><p>${t.c2desc}</p></div>
      </div>
      <div class="news-card">
        <div class="news-ph">${ph(t.c3ph,'navy')}</div>
        <div class="news-body"><span class="date">${t.c3date}</span><h4>${t.c3title}</h4><p>${t.c3desc}</p></div>
      </div>
    </div>
    <div class="nl-panel">
      <div class="nl-head">
        <div>
          ${eyebrow(t.nlEyebrow)}
          <h3>${t.nlTitle}</h3>
          <p>${t.nlDesc}</p>
        </div>
        <span class="nl-period">${NEWSLETTER_PERIOD}</span>
      </div>
      <div class="nl-list">
        ${NEWSLETTER_ITEMS.map((n,i)=>{ const c = NL_CATS[n.cat]; return `
        <div class="nl-item">
          <div class="nl-rank">${i+1}</div>
          <div class="nl-body">
            <div class="nl-top"><span class="badge-pill ${c.theme}"><span class="dot"></span>${c.label}</span></div>
            <h4>${n.title}</h4>
            <p>${n.desc}</p>
            <div class="nl-meta">
              <span>${n.date}</span><span class="dot-sep"></span><span>${n.source}</span><span class="dot-sep"></span>
              <a class="nl-src" href="${n.url}" target="_blank" rel="noopener noreferrer">${t.nlSrcLabel}${icon('arrowRight',13)}</a>
            </div>
          </div>
        </div>`; }).join('')}
      </div>
      <p class="nl-note">${t.nlNote}</p>
    </div>
  </div>
</section>
${siteFooter(lang)}`; }

function renderCurrentPage(){
  document.documentElement.lang = currentLang;
  document.title = DOC_TITLE[currentLang] || DOC_TITLE.en;
  app.innerHTML = renderNews(currentLang) + fab(currentLang);
  window.scrollTo(0,0);
}
renderCurrentPage();
</script>
</body>
</html>
