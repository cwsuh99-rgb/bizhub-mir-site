  { cat:`tax`, date:`2026.10.15 마감`, title:`LKPM 3분기(7~9월) 투자보고 10월15일 마감`,
    desc:`온라인단일창구(OSS)는 2026년 3분기(7~9월) 투자활동보고서(LKPM) 접수 기간이 10월 1일부터 15일까지라고 공지하고, 해당 기간 내에 보고 의무가 있는 사업자들에게 접수를 서두를 것을 당부했습니다. 투자부·BKPM 규정 5/2025호에 따라 마감 기준은 기존의 '분기 종료 후 영업일 10일 이내'에서 '매 분기 다음 달 15일까지'로 다소 완화됐지만, 중소형 이상 사업자는 분기마다, 소규모 사업자는 반기(상반기 7월15일, 하반기 익년 1월15일)마다 꼬박꼬박 보고해야 하는 의무 자체는 그대로입니다. 이번 3분기분은 7~9월 사업 진행 상황과 투자 실현액, 고용 현황 등을 OSS 시스템에 로그인해 보고메뉴(Laporan Kegiatan Penanaman Modal)에서 입력하는 방식으로 진행됩니다. 보고를 하지 않으면 서면경고가 먼저 발송되고, 2회 연속 미보고하거나 4회 연속 투자실현액을 0으로 보고할 경우 사업허가 정지, 나아가 사업자등록번호(NIB) 자체가 취소될 수 있다는 점이 실무자들 사이에서 꾸준히 강조되는 리스크입니다. 특히 올해 6월 KBLI 2025(신 표준산업분류) 전환이 마무리된 만큼, 사업목적·주주·자본금 등 회사 정보가 등기부와 OSS 상에서 일치하는지 이번 보고를 계기로 함께 점검해두는 것이 바람직합니다. PT PMA는 매출이 전혀 없는 설립 초기 단계라도 '투자실현 0' 보고 자체는 꾸준히 제출해야 하며, 보고를 누락하면 추후 사업확장이나 신규 인허가, LKPM과 연동된 다른 신고 절차에서도 발이 묶일 수 있습니다. 회계·법무 담당 인력이 제한적인 소규모 PT PMA라면 매 분기 반복되는 이 보고 업무를 캘린더에 미리 등록해 두거나 현지 대행사에 위탁해 기한을 놓치는 리스크를 줄이는 것이 안전합니다. 10월 15일 마감을 앞두고 있는 만큼, 아직 보고를 마치지 못한 PT PMA라면 이번 주 안에 투자실현액과 고용 현황 자료를 정리해 접수를 서둘러야 합니다.`,
    source:`OSS(온라인단일창구)`, url:`https://oss.go.id/en/pengumuman/memanggil-pelaku-usaha-untuk-menyampaikan-laporan-kegiatan-penanaman-modal-periode-1%E2%80%9315-oktober-2026` },
  { cat:`reg`, date:`2026.10.18 시행`, title:`수입 소비재 할랄 의무화, 2년 유예기간 종료`,
    desc:`인도네시아 할랄제품보장법에 따른 할랄 인증·표시 의무화가 2024년 10월 18일부터 단계적으로 시행된 가운데, 중소기업 제품과 해외에서 수입되는 식품·음료·화장품 등에 적용된 최대 2년의 유예기간이 2026년 10월 17~18일을 기점으로 끝나게 됩니다. 이에 따라 10월 18일부터는 수입 화장품을 포함한 소비재 전반에 대해 할랄 또는 비할랄 여부를 제품 라벨에 명시해야 하는 법적 의무가 전면 적용됩니다. 비할랄로 표기한 뒤 판매하는 것 자체는 가능하지만, 인구 2억9000만명 중 87%가 무슬림인 시장에서 할랄 표기가 없으면 유통·마케팅에서 실질적인 제약을 받게 됩니다. 인증 취득 경로는 한국 등 해외 할랄인증기관과 인도네시아 할랄제품보장청(BPJPH) 간 상호인정협정(MRA)을 활용하는 '교차인증'과, 현지 할랄심사기관(LPH)을 거치는 '직접인증' 두 가지로 나뉘며, 업계에서는 교차인증보다 현지 LPH를 통한 직접인증이 더 안정적이라는 의견도 나오고 있습니다. 한국 정부는 식약처를 중심으로 한국의약품수출입협회, 한국기계전기전자시험연구원(KTC) 등이 참여하는 약 27명 규모의 '민·관 합동 진출지원단'을 인도네시아 현지에 파견해 규제당국과 직접 협의하며 국내 수출기업의 대응을 지원하고 있습니다. 한국무역협회도 9월 초 자카르타에서 K-프리미엄 소비재전을 열어 할랄 인증 대응 사례를 공유하는 등 민간 차원의 대응도 이어지고 있습니다. 식품·화장품·생활용품을 인도네시아에 수입·유통하는 PT PMA라면 현재 취급 제품의 할랄 인증 또는 비할랄 라벨링 상태를 10월 18일 이전에 반드시 점검해야 하며, 아직 인증을 받지 못한 품목은 비할랄 표기로 우선 전환해 통관·유통이 막히지 않도록 대비해야 합니다. 신규로 소비재 사업을 준비 중인 PT PMA도 사업계획 단계에서부터 할랄 인증 비용과 소요 기간을 반영해두는 것이 안전합니다.`,
    source:`파이낸셜뉴스`, url:`https://www.fnnews.com/news/202609101629087494` },
  { cat:`kr`, date:`2026.09.28 보도`, title:`인니, 13조 한국투자에 배터리·방산 기술공유 요구`,
    desc:`인도네시아 콤파스TV가 9월 28일 보도한 바에 따르면, 한·인니 양국의 경제협력 성과는 102억 달러(약 13조8700억원) 규모의 총투자 약속 그 자체보다, 현지에 남는 고부가가치 제조기술과 숙련 인력 규모로 평가돼야 한다는 점이 현지에서 강조되고 있습니다. 이는 올해 4월 프라보워 수비안토 대통령의 방한을 계기로 양국이 핵심광물, 배터리 공급망, 청정에너지, 인공지능 등 분야에서 16건의 양해각서(MOU)를 체결하며 관계를 '특별 포괄적 전략 동반자'로 격상한 데 따른 후속 평가입니다. 현대차그룹의 전기차 코나 일렉트릭은 이미 현지 부품 조달 비율이 약 80%에 달하고, 에코프로는 니켈 제련 분야에 10억 달러 이상을 투자하는 등 한국 기업들의 현지화가 상당히 진척된 상태입니다. 그럼에도 인도네시아 정부와 현지 언론은 단순 조립공장 유치를 넘어, 배터리·방산 등 핵심 기술 자체를 현지에 이전하고 고숙련 인력을 양성하는 방향으로 협력의 축이 옮겨가야 한다는 입장을 분명히 하고 있습니다. 이는 인도네시아가 저가 노동력 기반의 단순 제조기지 역할에서 벗어나 기술 자립도를 높이려는 정책 방향과 맞닿아 있으며, 향후 신규 투자 협상에서 현지 부품 국산화율(TKDN)이나 기술이전 조건이 한층 까다로워질 수 있음을 예고합니다. 실제로 현대차-LG에너지솔루션 합작 배터리셀 공장도 단순 가동을 넘어 현지 인력 육성과 부품 국산화율 요건을 지속적으로 입증해야 하는 과제를 안고 있는 것으로 평가됩니다. 인도네시아에 생산기지를 둔 한국계 PT PMA, 특히 전기차·배터리·방산 관련 밸류체인에 속한 기업이라면 향후 신규 투자나 증설 협상 시 기술이전·현지 R&D·인력양성 계획을 사업계획서에 구체적으로 포함시켜 둘 필요가 있습니다. 단순 생산 설비 투자만으로는 인도네시아 정부의 정책적 기대에 부합하기 어려워지는 흐름이라는 점을 염두에 두어야 합니다.`,
    source:`글로벌이코노믹`, url:`https://www.g-enews.com/article/Global-Biz/2026/09/202609290700088214fbbec65dfb_1` },
  { cat:`econ`, date:`2026.10.01 종가`, title:`루피아, 美국채금리 급등에 1달러=1만7940루피아로 약세`,
    desc:`10월 1일 자카르타 외환시장에서 루피아는 전 거래일보다 0.39% 약세를 보이며 달러당 1만7940루피아로 장을 마쳤습니다. 이날 장중에는 1만7898루피아에서 출발해 한때 1만7921루피아까지 밀리는 등 거래 내내 약세 압력이 이어졌습니다. 루피아 약세의 가장 큰 배경은 미국 10년물 국채금리가 5.33%까지 치솟으며 2002년 이후 최고 수준을 기록한 점으로, 중동 지역 분쟁에 따른 글로벌 인플레이션 우려와 달러 자산에 대한 높은 수익률 기대가 겹치며 달러 선호 심리를 강화시켰습니다. 달러인덱스(DXY)도 최근 두 달 내 최고 수준 부근에서 강세를 유지해, 루피아뿐 아니라 일본 엔(-0.44%), 한국 원(-0.16%), 싱가포르달러(-0.16%), 말레이시아 링깃(-0.14%) 등 아시아 주요 통화 대부분이 동반 약세를 나타냈습니다. 인도네시아 중앙은행(BI)은 9월 22~23일 통화정책회의에서 기준금리를 5.75%로 3개월째 동결한 상태이며, 다음 통화정책회의는 10월 20~21일로 예정돼 있어 시장은 추가 금리 동결 혹은 소폭 조정 가능성을 주시하고 있습니다. 루피아가 연초 대비 약세 흐름을 보이고 있지만 정부는 견조한 국채 수요와 재정 건전성(APBN)을 근거로 급격한 추가 약세 가능성은 제한적이라는 입장을 유지하고 있습니다. 다만 외부 변수, 특히 미국 금리·중동 정세에 따라 단기 변동성이 커질 수 있다는 점은 유의해야 할 대목입니다. 원자재나 설비, 원부자재를 달러로 수입하는 PT PMA라면 환율 변동에 따른 원가 부담이 커질 수 있는 만큼 환헤지나 결제통화 다변화, 수입 시기 조정 등을 검토해두는 것이 바람직하며, 달러 표시 대출을 보유한 기업은 상환 스케줄 점검이 필요한 시점입니다.`,
    source:`CNBC Indonesia`, url:`https://www.cnbcindonesia.com/market/20261001150614-17-772549/rupiah-ditutup-melemah-039-dolar-as-tembus-rp17940` },
  { cat:`tax`, date:`2026.10.01 시행`, title:`코어택스 SPT 정정방식, '델타'에서 '교체'로 전환`,
    desc:`인도네시아 국세청(DJP)은 코어택스(Coretax) 시스템에서 세금신고서(SPT) 정정 시 적용하던 '델타(Delta)' 방식을 폐지하고, 2026년 10월 1일부터 '교체(Replace)' 방식을 재도입하는 국세청장 규정 PER-12/PJ/2026호를 시행했습니다. 이 규정은 코어택스 시스템 구축에 따른 PPh(소득세)·PPN(부가가치세)·PPnBM(사치품세)·인지세 신고 요건을 규정한 기존 PER-11/PJ/2025호를 개정하는 형태로 발표됐습니다. '교체' 방식에서는 정정 SPT가 기존 SPT를 완전히 대체하게 되며, 정정 신고서에 기재되는 수치는 정정 시점을 기준으로 한 완결된 최종 수치여야 합니다. 특히 이번 개정에서는 정정 SPT를 제출하기 전에 이미 이루어진 세액 납부나 환급 내역을 정정 과정에 반영하도록 하는 규정이 새로 추가됐고, 과다납부(SPT Lebih Bayar) 상태에서 이미 환급결정서(SKPPKP)가 발급된 경우에는 그 환급액을 정정 SPT에 반드시 반영하도록 명시했습니다. 10월 1일 이전에 제출됐지만 아직 처리가 끝나지 않은 정정 신고 건에 대해서는 종전의 PER-11/PJ/2025호 규정을 그대로 적용하는 경과조치도 함께 마련돼 있습니다. 코어택스 전환 이후 SPT 정정 업무를 처리해 본 회계·세무 담당자라면 이번 방식 변경으로 정정 절차와 화면 구성이 달라지는 점을 미리 숙지해둘 필요가 있습니다. PT PMA 세무담당자는 향후 법인세(PPh Badan)나 부가가치세 정정 신고가 필요한 경우, '델타' 방식 당시의 작업 매뉴얼을 그대로 적용하면 오류가 발생할 수 있으므로 현지 세무대리인과 함께 새 '교체' 방식의 입력 절차를 사전에 숙지해두는 것이 안전합니다. 특히 이미 세액을 환급받은 상태에서 정정이 필요한 경우에는 환급액 처리 방식이 달라진 만큼 더욱 신중한 검토가 요구됩니다.`,
    source:`DDTC News`, url:`https://news.ddtc.co.id/berita/nasional/1822905/per-12pj2026-terbit-djp-rombak-skema-delta-dalam-pembetulan-spt` },
  { cat:`kr`, date:`2026.09 land 매입 진행`, title:`한국계 신발업체, 서자바 꾸닝안에 1만1000명 공장`,
    desc:`한국계 신발 제조업체 PT 산둑 치르마이 인도네시아(PT Sanduk Ciremai Indonesia)가 서자바주 꾸닝안군 잘락사나·자파라 지역의 신당바랑·두쿠달렘·치니루 등 3개 마을에 걸친 약 22헥타르 부지에 대규모 생산공장을 건설하고 있으며, 9월 들어 토지 보상금 지급 절차가 본격적으로 진행되고 있는 것으로 확인됐습니다. 현재까지 부지 확보율은 약 50% 수준이며, 지역공간계획(RTRW) 승인, 환경영향평가(AMDAL), 건축허가(PBG) 등 남은 행정 절차가 함께 진행 중입니다. 투자 규모는 약 1조2000억 루피아(약 1000억원)로 알려졌으며, 완공 시 최대 1만1000명을 고용할 수 있는 대형 사업장이 될 것으로 전망됩니다. 공장에서는 산업현장용·군용 고강도 안전화를 중심으로 생산하고, 스포츠화도 제한적으로 함께 생산할 계획입니다. 꾸닝안 군청은 고용노동이주국을 통해 PT 산둑과 협력해 현지 인력 채용 절차를 준비하고 있으며, 인근 지역에는 의류공장을 짓는 또 다른 한국계 기업 PT 한솔도 함께 투자를 검토 중인 것으로 전해졌습니다. 이는 자카르타·반튼 등 기존 산업단지 중심이었던 한국계 노동집약적 제조업 투자가 서자바 내륙 지역으로 확산되고 있음을 보여주는 사례로 평가됩니다. 다만 아직 토지 확보와 인허가 절차가 완전히 끝나지 않은 단계인 만큼, 실제 착공과 가동 시점은 유동적일 수 있습니다. 신발·의류 등 노동집약적 제조업 분야에서 서자바 지역 투자를 검토하는 PT PMA라면, 이번 사례에서 나타난 토지 확보 절차와 인허가 소요 기간, 지방정부와의 고용 협력 방식을 참고할 만합니다.`,
    source:`라다르꾸닝안(Radar Kuningan)`, url:`https://radarkuningan.disway.id/kuningan/read/680745/pabrik-sepatu-sindangbarang-pelunasan-pembayaran-lahan-mulai-dilakukan` },
  { cat:`econ`, date:`2026.10.01 발표`, title:`9월 인플레이션 3.28%로 올해 최고치`,
    desc:`인도네시아 통계청(BPS)은 10월 1일, 9월 소비자물가가 전년 동월 대비 3.28% 상승했다고 발표했습니다. 이는 8월의 3.19%보다 추가로 오른 수치로, 올해 들어 가장 높은 연간 물가상승률입니다. 전월 대비(MtM) 상승률은 0.30%였고, 연초 대비(YTD) 누적 상승률은 2.17%로 집계됐습니다. 물가 상승을 이끈 것은 식품·음료·담배 그룹으로, 이 그룹만 전년 대비 4.37% 올라 전체 물가상승에 가장 크게 기여했으며, 구체적으로는 생선, 닭고기, 생고추, 쌀, 식용유, 담배 등의 가격 상승이 두드러졌습니다. 중앙은행(BI)은 9월 물가가 여전히 통화정책 목표 범위 안에서 관리되고 있다고 평가하면서도, 통화정책과 정부 간 물가관리 공조(TPIP·TPID)가 계속 필요하다는 입장을 밝혔습니다. 식품 가격 상승은 라마단·르바란 성수기가 아닌 시점에 나타난 것이어서, 일부 전문가들은 우기 전환기의 작황 변동이나 유통 비용 상승 등 구조적 요인을 주시해야 한다고 지적하고 있습니다. 물가 상승률 자체는 아직 중앙은행의 관리 목표 범위를 벗어나지 않는 수준이지만, 연속 상승 흐름이 이어지고 있다는 점은 소비 심리와 원가에 영향을 줄 수 있는 변수입니다. 특히 생고추·쌀·식용유 등 가격 상승이 두드러진 만큼, 카페·요식업을 운영하는 PT PMA는 메뉴 원가와 식자재 조달 전략을 다시 한번 점검해둘 필요가 있습니다. 연말 성수기로 접어들면서 수요가 늘어날 경우 식품 가격이 추가로 오를 가능성도 있어, 주요 원재료의 재고·구매 시점을 유연하게 조정하는 것이 바람직합니다.`,
    source:`ANTARA News`, url:`https://www.antaranews.com/berita/5766035/inflasi-tahunan-ri-capai-328-persen-pada-september-2026` },
  { cat:`tip`, date:`상시 의무`, title:`외국인 직원(TKA)도 BPJS 고용·건강보험 가입 필수`,
    desc:`인도네시아에서 최소 6개월 이상 근무하는 외국인 근로자(TKA)는 내국인과 동일하게 사회보장제도인 BPJS 고용보험(Ketenagakerjaan)과 BPJS 건강보험(Kesehatan)에 가입해야 하는 의무 대상입니다. 이는 사회보장제도에 관한 법률(UU BPJS)과 관련 시행규정에 근거한 것으로, PT PMA를 포함한 인도네시아 내 모든 고용주에게 적용되는 기본적인 노무 컴플라이언스 사항입니다. 등록 절차는 통상 외국인력활용계획서(RPTKA) 승인 및 체류·취업허가(KITAS/IMTA) 발급 절차와 연동되어 진행되며, 고용주가 급여에 비례한 분담금을 납부하는 구조입니다. 가입을 누락하거나 분담금 납부를 게을리할 경우 행정제재뿐 아니라, 향후 외국인력 허가 갱신이나 각종 정부 서비스 이용 시 서류상 제동이 걸릴 수 있다는 점이 실무상 가장 큰 리스크로 꼽힙니다. 특히 한국인 주재원이나 기술직 인력을 파견 중인 PT PMA는 신규 발령자의 입국 시점부터 BPJS 등록이 지연되지 않도록 HR 담당자가 체크리스트를 갖춰두는 것이 바람직합니다. 일부 기업에서는 한국 본사에서 이미 4대보험에 가입돼 있다는 이유로 현지 BPJS 가입을 누락하는 경우가 있는데, 이는 인도네시아 현지법상 별도의 의무이므로 본사 보험 가입 여부와 무관하게 현지 등록이 필요합니다. BPJS 고용보험은 산재·실업·노후연금성 급여를 포괄하고, BPJS 건강보험은 의료비 지원을 담당하므로, 외국인 직원 입장에서도 현지 병원 이용이나 유사시 보상 측면에서 실질적인 혜택이 있습니다. 외국인력 관련 인허가를 다루는 현지 대행사나 노무 자문사를 통해 매년 1회 정도 전체 외국인 직원의 BPJS 가입·납부 현황을 일괄 점검해두면 누락 리스크를 줄일 수 있습니다.`,
    source:`Hukumonline`, url:`https://www.hukumonline.com/klinik/a/apakah-tenaga-kerja-asing-wajib-jadi-peserta-bpjs-ketenagakerjaan-lt54d2b4c94b84e/` },
  { cat:`econ`, date:`2026.09.23 보고서(9.28 보도)`, title:`OECD, 인니 2026년 성장률 5.2%로 전망`,
    desc:`경제협력개발기구(OECD)가 9월 23일 발표한 '중간 경제전망' 보고서에서 인도네시아의 2026년 경제성장률을 5.2%로, 2027년에는 5.1%로 각각 전망했다고 9월 28일 국내 경제지가 보도했습니다. 이는 인도네시아 정부 자체 목표치인 5.4%보다는 낮고, IMF·세계은행·아시아개발은행(ADB) 등이 제시한 5.0~5.1% 수준과는 비슷한 범위입니다. OECD는 견조한 내수 소비와 교역조건 개선이 추가적인 투자 확대를 뒷받침할 것으로 분석하면서도, 글로벌 경제의 불확실성을 주요 위험 요인으로 꼽았습니다. 구체적으로는 중동 지역 분쟁에 따른 에너지 공급 차질과 원자재 가격 상승, 그리고 미국 등 주요국의 높은 금리 수준이 가계의 실질 구매력을 떨어뜨리고 성장세를 제약할 수 있다는 점이 지적됐습니다. 이번 전망은 OECD가 중국, 인도 등 다른 주요 신흥국의 성장률도 함께 하향 조정하는 가운데 나온 것으로, 아세안 지역 전반에 대한 보수적 시각이 반영된 결과로 풀이됩니다. 그럼에도 5%대 성장은 선진국 평균을 크게 웃도는 수준으로, 인도네시아가 여전히 아세안 내에서 상대적으로 매력적인 투자처라는 평가에는 큰 변화가 없습니다. 인도네시아에 생산기지나 매장을 운영 중인 PT PMA 입장에서는, 5%대 성장이 유지되는 한 내수 소비 기반 사업의 중장기 전망 자체는 나쁘지 않다고 볼 수 있습니다. 다만 중동 정세나 미국 금리 등 대외 변수에 따라 전망치가 추가로 조정될 수 있는 만큼, 연말·연초 사업계획 수립 시 보수적인 시나리오도 함께 준비해두는 것이 바람직합니다.`,
    source:`파이낸셜뉴스`, url:`https://www.fnnews.com/news/202609281332313095` },
  { cat:`tip`, date:`협의 진행 중`, title:`2027년 최저임금 산정방식, 아직 확정 전`,
    desc:`노동부 야시에를리(Yassierli) 장관은 9월 18일, 2027년 최저임금(UMP·UMK) 인상률을 결정할 산정 공식이 아직 확정되지 않았으며, 국회에서 심의 중인 노동자보호법(RUU Pelindungan Ketenagakerjaan) 제정 결과를 기다리고 있다고 밝혔습니다. 노동부는 적정생계비(KHL) 추정을 위해 통계청(BPS)의 국가사회경제조사(Susenas) 자료를 활용하고 있으며, 주(州) 단위 KHL 데이터는 2025년 말부터 확보돼 있으나 군·시 단위 데이터는 올해 안에 마무리하는 것을 목표로 하고 있다고 설명했습니다. 정부는 당초 관련 논의를 10월 중 마무리하겠다는 목표를 제시한 바 있어, 이번 달 안에 공식 포뮬러가 나올 가능성도 있습니다. 앞서 노동조합총연맹(KSPI)은 9월 17일 2027년 최저임금을 전국 평균 7.5~9.5% 인상해야 한다는 안을 정부에 제시했지만, 이는 노동계의 제안일 뿐 정부의 공식 결정이 아니라는 점을 노동부가 이번에 다시 한번 확인한 셈입니다. 경영자단체 아판도(APINDO)는 지역별 최저임금 격차가 지나치게 커지면 노동력과 투자가 특정 지역에 쏠리는 등 시장 왜곡이 발생할 수 있다는 점을 우려하며, 전국 단위의 격차 완화 방안도 함께 논의돼야 한다는 입장을 밝혔습니다. 최저임금 발표 일정 자체는 기존대로 주 단위(UMP)는 11월 1일, 시·군 및 업종별(UMK)은 11월 10일로 유지될 것으로 보이지만, 산정 공식이 바뀌면 노동계 제안치나 과거 공식 대비 실제 인상률이 달라질 수 있습니다. 인건비 비중이 높은 카페·요식업·서비스업 PT PMA라면 아직 공식이 확정되지 않은 만큼 10월 중 발표될 세부 포뮬러와 11월 초 지역별 발표를 함께 주시하며, 복수의 인상률 시나리오로 2027년 예산을 준비해두는 것이 안전합니다.`,
    source:`CNBC Indonesia`, url:`https://www.cnbcindonesia.com/news/20260918143139-4-769055/ditanya-formula-upah-minimum-2027-menaker-yassierli-jawab-begini` },
];

function renderNews(lang){ const t = T[lang].news; return `
${siteHeader('news', lang)}
${pageHero('news','gold', lang, t.pageEyebrow, t.pageTitle, t.pageDesc)}
<section class="section">
  <div class="wrap">
    <div class="grid-3">
      <div class="news-card">
        <div class="news-ph">${ph(t.c1ph,'coffee')}</div>
        <div class="news-body"><span class="date">${t.c1date}</span><h4>${t.c1title}</h4><p>${t.c1desc}</p></div>
      </div>
      <div class="news-card">
        <div class="news-ph">${ph(t.c2ph,'green')}</div>
        <div class="news-body"><span class="date">${t.c2date}</span><h4>${t.c2title}</h4><p>${t.c2desc}</p></div>
      </div>
      <div class="news-card">
        <div class="news-ph">${ph(t.c3ph,'navy')}</div>
        <div class="news-body"><span class="date">${t.c3date}</span><h4>${t.c3title}</h4><p>${t.c3desc}</p></div>
      </div>
    </div>
    <div class="nl-panel">
      <div class="nl-head">
        <div>
          ${eyebrow(t.nlEyebrow)}
          <h3>${t.nlTitle}</h3>
          <p>${t.nlDesc}</p>
        </div>
        <span class="nl-period">${NEWSLETTER_PERIOD}</span>
      </div>
      <div class="nl-list">
        ${NEWSLETTER_ITEMS.map((n,i)=>{ const c = NL_CATS[n.cat]; return `
        <div class="nl-item">
          <div class="nl-rank">${i+1}</div>
          <div class="nl-body">
            <div class="nl-top"><span class="badge-pill ${c.theme}"><span class="dot"></span>${c.label}</span></div>
            <h4>${n.title}</h4>
            <p>${n.desc}</p>
            <div class="nl-meta">
              <span>${n.date}</span><span class="dot-sep"></span><span>${n.source}</span><span class="dot-sep"></span>
              <a class="nl-src" href="${n.url}" target="_blank" rel="noopener noreferrer">${t.nlSrcLabel}${icon('arrowRight',13)}</a>
            </div>
          </div>
        </div>`; }).join('')}
      </div>
      <p class="nl-note">${t.nlNote}</p>
    </div>
  </div>
</section>
${siteFooter(lang)}`; }

function renderCurrentPage(){
  document.documentElement.lang = currentLang;
  document.title = DOC_TITLE[currentLang] || DOC_TITLE.en;
  app.innerHTML = renderNews(currentLang) + fab(currentLang);
  window.scrollTo(0,0);
}
renderCurrentPage();
</script>
</body>
</html>
