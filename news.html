  { cat:`reg`, date:`2028.10.17로 연기`, title:`할랄 인증 의무화, 전면 2028년으로 연기`,
    desc:`인도네시아 정부가 10월 18일 시행 예정이던 할랄 인증·표시 의무화를 2028년 10월로 전면 연기하기로 했다고 발표했습니다. 경제조정부 사무차관 수시위조노 무기아르소는 10월 16일 온라인 설명회에서 이번 조정이 할랄 생태계의 준비 상황과 업계 단체들의 건의를 반영한 결과라고 밝혔습니다. 법적 근거는 정부규정(PP) 42/2024호를 개정하는 방식으로, 구체적으로는 제160조와 제161조의 단계별 시행 일정을 손질하는 내용입니다. 이에 따라 영세·소규모 사업자(UMK)의 식품·음료·도축물·도축서비스에 대한 할랄 의무화 단계는 2028년 10월 17일까지로 늦춰졌습니다. 해외에서 수입되는 동일 품목(식품·음료·도축물·도축서비스)의 의무화 시작일도 2028년 10월 18일로 조정되었습니다. 이번 조정은 BPOM이 관할하는 천연의약품, 준의약품, 건강기능식품, 화장품, 화학제품 등에도 함께 적용되는 것으로 알려졌습니다. 정부는 이번 연기가 할랄 제품 보장 제도 자체에 대한 정부의 의지 변화를 뜻하지 않는다고 강조했습니다. 함께 발표된 조정안에는 수입 할랄제품 검사에 관한 할랄제품보장청(BPJPH) 규정 4/2026호를 폐지하는 내용도 포함됐습니다. 다만 이번 발표는 정부규정 개정안에 대한 것으로, 10월 19일 현재 개정안 공포 절차는 진행 중인 것으로 보입니다. 식품·화장품·건강식품을 인도네시아에서 유통하는 PT PMA는 당장의 10월 18일 시한 압박에서는 벗어났지만, 2028년까지 할랄 인증 취득을 미리 준비해두는 것이 유리하며, 정식 개정 정부규정 공포 여부를 BPOM·BPJPH 공지로 재확인할 필요가 있습니다.`,

  { cat:`reg`, date:`2026.10.06 하원 통과`, title:`신(新) 노동법 하원 통과, 해고·퇴직금 규제 강화`,
    desc:`인도네시아 하원(DPR)은 10월 6일 본회의에서 새로운 노동자 보호법을 통과시켰습니다. 이번 법은 23개 장(chapter), 313개 조항으로 구성되어 있으며 2020년 제정된 일자리창출법(옴니버스법)이 완화했던 노동 조항 일부를 되돌리는 내용을 담고 있습니다. 노동부 장관은 기존에 통상임금의 절반까지 줄일 수 있도록 허용했던 퇴직금 산정 조항을 삭제했다고 밝혔습니다. 대신 기업이 BPJS(사회보장기구)를 통해 퇴직금 적립금을 마련하도록 해, 정리해고 시 재원을 미리 확보하도록 하는 장치가 신설됐습니다. 효율화(경영상 이유)를 명분으로 한 해고 요건도 한층 엄격해져, 기업이 인력 감축을 단행하기가 이전보다 어려워졌습니다. 기간제 근로계약과 아웃소싱(용역) 활용에 대한 제한도 강화되는 것으로 알려졌습니다. 이번 법은 오토바이 배달원, 플랫폼 노동자 등 비정형 근로자에 대한 보호 범위도 새롭게 포함하고 있습니다. 경영자단체 아판도(APINDO)는 법 시행으로 기업 비용이 늘고 투자 유인이 줄어들 수 있다고 우려를 표명해왔습니다. 다만 법안 세부 조문 전체는 아직 공개되지 않아, 시행령 등 후속 규정에서 구체적인 적용 범위가 정해질 것으로 보입니다. 인력 비중이 높은 제조업·서비스업 PT PMA는 퇴직금 적립 의무, 해고 절차, 기간제·용역 계약 관리 체계를 전반적으로 재점검하고, 시행령 공포 시점에 맞춰 인사·노무 정책을 조정할 필요가 있습니다.`,
    source:`idnfinancials`, url:`https://www.idnfinancials.com/news/69908/indonesia-passes-labour-law-tightens-rules-on-layoffs` },
  { cat:`tip`, date:`2026.10.06 발표`, title:`외국인 KITAS 발급권, 투자부로 이관 추진`,
    desc:`로산 로에슬라니 투자부 장관은 10월 6일 자카르타에서 열린 '인도네시아 국제 지속가능성 포럼(ISF) 2026' 개막식에서 앞으로 두 달 안에 모든 외국인 노동자용 제한체류허가(KITAS)를 투자부가 발급하게 될 것이라고 밝혔습니다. 로산 장관은 신청자가 6일만 기다리면 자동으로 허가가 발급되는 체계를 목표로 한다고 설명했습니다. 이번 개편은 투자부, 노동부, 이민교정부 3개 부처가 9월 9일 체결한 공동결정(SKB)에 근거해 추진되고 있습니다. 통합 대상에는 외국인력활용계획(RPTKA), 제한체류비자(VITAS), 제한체류허가(ITAS), 영주권(ITAP) 절차가 모두 포함됩니다. 시스템적으로는 온라인단일창구(OSS)가 노동부의 SIAPkerja, 이민청의 All Indonesia 애플리케이션과 연계되어 하나의 창구에서 처리되는 구조로 바뀝니다. 기존에는 노동부가 RPTKA를 심사하고 이민교정부가 비자·체류허가를 별도로 처리해 절차가 분산되어 있었습니다. 정부는 앞서 최대 5일 이내 처리를 목표로 2026년 9월 말 시행을 추진했으나, 로산 장관의 이번 발언으로 목표 처리기간이 6일로, 시행 시점은 약 2개월 뒤로 다시 조정된 것으로 보입니다. 이번 개편은 행정 절차를 단순화해 외국인 투자 환경을 개선하려는 취지로 알려졌습니다. 다만 세부 이관 일정과 기존 발급 건의 처리 방식 등은 아직 투자부·이민당국의 공식 시행 공고로 확정되지 않았습니다. 외국인 임직원을 파견하거나 채용 중인 PT PMA는 향후 2개월 내 KITAS 신청·갱신 창구가 바뀔 가능성에 대비해, 투자부와 기존 대행사를 통해 이관 일정과 신청 경로 변경 여부를 수시로 확인하는 것이 안전합니다.`,
    source:`RRI (Voice of Indonesia)`, url:`https://rri.co.id/en/business/2790673/indonesia-fast-tracks-kitas-issuance-to-attract-investment` },
  { cat:`econ`, date:`2026.10.01 발표`, title:`9월 인플레이션 3.28%, 올해 최고치 기록`,
    desc:`인도네시아 중앙통계청(BPS)은 10월 1일 9월 연간(y-on-y) 소비자물가 상승률이 3.28%를 기록했다고 발표했습니다. 이는 2026년 들어 가장 높은 수치이며, 직전 달인 8월의 3.19%보다 소폭 높아진 것입니다. 전월 대비(m-to-m) 물가는 0.30% 올라, 8월의 0.21%보다 상승폭이 커졌습니다. 연초 대비(year-to-date) 누적 물가상승률은 2.17%로 집계됐습니다. 근원물가(core inflation)는 연간 2.84%로, 전월 2.92%보다는 낮아진 모습을 보였습니다. 물가 상승을 주도한 품목은 식품·음료·담배 부문으로, 특히 작은 고추(cabai rawit) 가격이 가장 큰 상승 요인으로 지목됐습니다. 지역별로는 북술라웨시가 연간 7.59%로 가장 높은 물가 상승률을 보였고, 남수마트라가 2.55%로 가장 낮았습니다. 이번 수치는 시장 전망치인 3.3%에는 약간 못 미치는 수준입니다. 물가가 완만하게 오르는 추세는 중앙은행(BI)이 10월 20~21일 통화정책회의에서 기준금리를 결정하는 데 참고 지표가 될 것으로 보입니다. 원부자재나 식품을 다루는 PT PMA는 이번 물가지표를 임금 협상, 가격 정책, 재고 관리 계획에 참고할 수 있으며, 특히 식품·음료 관련 사업장은 원가 상승 압력을 지속적으로 모니터링할 필요가 있습니다.`,
    source:`Investortrust.id`, url:`https://investortrust.id/macro/118018/bps-inflasi-september-2026-tembus-0-30-tahunan-3-28` },
  { cat:`tax`, date:`2026.11.01 시행 예정`, title:`마켓플레이스 PPh 22 징수, 11월 1일부터 재시행`,
    desc:`인도네시아 국세청(DJP)은 토코페디아, 쇼피, 라자다, 블리블리 등 온라인 마켓플레이스가 입점 판매자의 소득에 0.5%의 소득세(PPh 22)를 징수하는 제도를 11월 1일부터 다시 시행한다고 밝혔습니다. 이 제도는 당초 2026년 8월 1일 시행될 예정이었으나, DJP가 공고번호 PENG-46/PJ.09/2026호를 통해 10월 31일까지 시행을 유예했습니다. 유예 조치에 따라 쇼피는 8월 6일 0시(서부인도네시아 시각)부터, 토코페디아는 같은 날 17시부터 판매자에 대한 PPh 22 징수를 중단했습니다. 각 플랫폼은 이미 징수한 세액의 환급 절차도 함께 진행했으며, 토코페디아는 9월 30일까지 환급을 완료하도록 안내했습니다. DJP는 이번 유예가 제도의 시행 시점만 늦춘 것이며, 정책의 본질적인 내용은 바뀌지 않는다고 설명했습니다. 이에 따라 각 플랫폼에 대한 징수의무자 지정도 재발급 절차를 거쳐 11월 1일 시행에 앞서 다시 이뤄질 예정입니다. 연 매출 5억 루피아 이하의 개인사업자는 이번 징수 대상에서 제외됩니다. 국세청은 주요 대형 마켓플레이스가 11월 시행에 맞춰 시스템 준비를 마쳤다고 밝혔으나, 일부 보도에서는 시행 여부가 재무부의 추가 지침에 따라 달라질 수 있다는 신중한 전망도 나오고 있습니다. 토코페디아, 쇼피 등에서 직접 판매하거나 해당 플랫폼을 통해 유통하는 PT PMA는 11월 1일부터 정산액에서 0.5%가 선공제될 수 있다는 점을 염두에 두고 현금흐름과 세금계산서 처리 절차를 미리 점검해야 합니다.`,
    source:`DDTC News`, url:`https://news.ddtc.co.id/berita/nasional/1822566/djp-pemungutan-pph-pasal-22-oleh-marketplace-berlaku-1-november` },
  { cat:`kr`, date:`2026.10.07 준공`, title:`KT&G, 인도네시아 TSPM 공장 증설 완공`,
    desc:`KT&G는 10월 초 인도네시아 현지 자회사 트리삭티 푸르워사리 마크무르(TSPM)의 신규 공장 2곳을 준공하고 가동에 들어갔다고 밝혔습니다. 이번 증설에는 약 4억5300만 달러(약 6100억원)가 투입되었으며, 신규 공장의 연간 생산능력은 약 210억 개비 규모입니다. 기존 생산능력 약 140억 개비와 합산하면 인도네시아 내 총 생산능력은 연간 약 350억 개비로 확대됐습니다. 이번 사업은 2023년 9월 인도네시아 투자부와 투자협약을 체결하고 2024년 4월 착공한 뒤, 2026년 상반기 시험 가동을 거쳐 이번에 준공식을 가진 것입니다. 신규 공장에서 생산되는 물량 중 상당 부분은 수출용으로, 인도네시아 내수 시장뿐 아니라 대만, 몽골, 나이지리아, 인도 등으로 공급될 예정입니다. 방경만 KT&G 사장은 이번 공장을 끝으로 총 2조4000억원 규모로 추진해온 해외 설비투자가 마무리 단계에 들어섰다고 밝혔습니다. 회사는 2028년까지 해외 생산 비중을 60% 이상으로 늘리겠다는 중장기 목표를 제시했습니다. TSPM은 KT&G가 2011년 인수한 이후 지속적으로 생산시설을 확충해 온 인도네시아 제조 거점입니다. 이번 증설로 KT&G는 해외 생산기지 중 최대 규모를 인도네시아에 두게 되었습니다. 제조업 분야에서 인도네시아 현지화·수출 거점을 검토하는 PT PMA라면, 장기간에 걸친 인허가·착공·시험가동 일정 관리와 현지 자회사를 통한 단계적 증설 전략을 참고할 만합니다.`,
    source:`머니투데이방송(MTN)`, url:`https://news.mtn.co.kr/news-detail/2026100716092263139` },
  { cat:`econ`, date:`2026.10.07 발표`, title:`9월 외환보유액 1,463억 달러, 안정적 수준 유지`,
    desc:`인도네시아 중앙은행(BI)은 9월 말 기준 외환보유액이 1,463억 달러로, 8월 말의 1,465억 달러에서 소폭 줄었다고 발표했습니다. 이는 5개월 만에 최고치를 기록했던 8월 수준에서 약간 내려온 것으로, 큰 흐름에서는 안정적인 수준을 유지하고 있다는 평가입니다. BI는 이번 감소가 정부의 대외채무 상환, 세금 및 서비스 수입 유입, 환율 안정화를 위한 시장 개입 등 여러 요인이 복합적으로 작용한 결과라고 설명했습니다. BI 홍보국장 람단 데니 프라코소는 정부의 대외차입금 인출과 세금·서비스 수입이 주된 영향을 미쳤다고 밝혔습니다. 이번 외환보유액은 수입대금 기준 약 5.3개월 치(정부 대외채무 상환분을 포함하면 5.2개월 치)에 해당하는 규모로, 국제적으로 통용되는 적정성 기준인 약 3개월 치를 여유 있게 웃도는 수준입니다. BI는 외환보유액이 충분한 수준을 유지하고 외국인 자본 유입도 이어지고 있어, 대외 건전성이 앞으로도 견고할 것으로 내다봤습니다. 이번 발표는 메트로TV뉴스, 자카르타포스트 등 현지 언론을 통해 10월 7~8일경 보도되었습니다. 외환보유액 수준은 루피아 환율의 안정성과 직결되는 지표로, 원부자재나 설비를 달러로 수입하는 PT PMA의 환리스크 관리에 참고 지표가 됩니다. 달러 결제 비중이 높은 제조업·무역업 PT PMA는 이번 수치를 환헤지 전략이나 자금조달 계획을 재점검하는 계기로 활용할 수 있습니다.`,
    source:`Metro TV News`, url:`https://www.metrotvnews.com/read/NleCqyEM-indonesia-s-foreign-exchange-reserves-hold-steady-at-usd146-3b-in-september` },
  { cat:`tax`, date:`2026.09 발표`, title:`한국기업 인니 부가세 환급 지연 논란`,
    desc:`한국 국세청(NTS)과 인도네시아 국세청(DJP) 간 한-인니 국세청장회의에서 한국 기업들이 겪고 있는 부가가치세(PPN) 환급 지연 문제가 핵심 현안으로 다뤄졌습니다. 임광현 한국 국세청장은 현지에 진출한 한국 기업들과의 간담회에서 가장 큰 애로사항으로 부가세 환급 지급 지연이 꼽혔다고 전했습니다. 임 청장은 이중과세 문제를 신속하게 해결하기 위해 상호합의절차(MAP) 활용을 적극 권장했습니다. 양국 국세청은 이 자리에서 국경을 넘는 자산을 보유한 상습·고액 체납자에 대한 징수 공조를 강화하는 양해각서(MoU)도 함께 체결했는데, 이는 환급 지연 문제와는 별도의 사안입니다. 인도네시아 국세청장 비모 위자얀토는 올해 9월 환급은 반드시 감사를 거쳐 표준절차(SOP)에 따라 지급된다는 입장을 밝혔습니다. 비모 청장은 국세청이 성실납세 업종을 우선적으로 선별해 환급하고, 그 외 업종은 세무조사 대상이 된다고 설명했습니다. 환급 지연은 한국 기업뿐 아니라 인도네시아 상공회의소(Kadin)와 하원에서도 지속적으로 제기해온 문제로 알려져 있습니다. 재무장관 뿌르바야 유디 사데와는 국세청이 환급에 별도의 한도(쿼터)를 두고 있지 않다고 해명했으며, 2016~2025년간 환급 실적에 대해 정부감사원(BPKP)이 감사를 진행 중이라고 밝혔습니다. 인도네시아에서 수출 비중이 높거나 투자 초기 매입세액이 많은 한국계 PT PMA는 부가세 환급 신청 시 서류 완비와 성실신고 이력 관리가 환급 승인 속도에 영향을 줄 수 있다는 점을 염두에 두고, 환급이 지연될 경우 한국 국세청이나 주인도네시아 한국대사관 등 공식 채널을 통한 문제 제기도 검토할 수 있습니다.`,
    source:`DDTC News`, url:`https://news.ddtc.co.id/perusahaan-korsel-masih-hadapi-kendala-restitusi-ppn-1815869` },
  { cat:`kr`, date:`2026.07.31 보도`, title:`K푸드, 할랄 인증으로 20억 무슬림 시장 공략`,
    desc:`국내 식품·외식 기업들이 인도네시아를 비롯한 동남아시아에서 할랄 인증과 현지 생산을 확대하며 중동 등 20억 무슬림 시장 공략에 속도를 내고 있다고 보도되었습니다. 시장조사기관 글로벌인포메이션에 따르면 전 세계 할랄 식품시장은 지난해 1조9759억 달러 규모에서 올해 2조2414억 달러로 성장했고, 2030년에는 3조6694억 달러에 이를 것으로 전망됩니다. CJ제일제당은 2011년부터 햇반, 김, 김치, 간장, 만두, 밀가루 등 100여 개 품목에 대해 할랄 인증을 지속적으로 확보해 왔으며, 동남아에서 쌓은 할랄 생산 경험을 바탕으로 중동 시장 진출을 추진하고 있습니다. 오리온은 초코파이를 비롯한 기존 할랄 인증 제품 외에도 껌, 사탕, 구떼 등으로 할랄 인증 품목을 확대할 계획인 것으로 전해졌습니다. 오리온은 할랄 인증 제품과 비할랄 제품 간 교차오염을 막기 위해 생산 설비와 공정을 별도로 분리 운영하고 있으며, 인증 이후에도 정기 점검과 불시 점검, 수입국 통관 모니터링 등 사후관리를 받고 있습니다. 올해 1~8월 한국의 중동 지역 K푸드 수출은 전년 대비 약 28% 증가한 것으로 집계됐습니다. 이에 따라 국내 기업들은 말레이시아 등에 생산기지를 두고 현지화된 연구개발로 할랄 인증 요건을 충족하는 전략을 취하고 있는 것으로 알려졌습니다. 인도네시아는 세계 최대의 무슬림 인구를 보유한 시장인 만큼, 식품·외식 분야 PT PMA는 국내 식품기업들의 할랄 인증 확대 전략과 교차오염 방지를 위한 생산공정 분리 사례를 참고해, 현지 할랄 인증 취득과 수출 확대 전략을 함께 검토할 필요가 있습니다.`,
    source:`뉴시스(Newsis)`, url:`https://www.newsis.com/view/NISX20260731_0003730819` },
  { cat:`econ`, date:`2026.09.29 통과`, title:`2027년 국가예산(APBN) 통과, 성장률 목표 6%`,
    desc:`인도네시아 하원(DPR)은 9월 29일 본회의에서 2027년도 국가예산법(UU APBN 2027)을 의결했습니다. 2027년 예산안에 따른 국가 지출 규모는 약 4,106조 루피아이며, 재정적자는 국내총생산(GDP)의 2.4%, 약 671조1600억 루피아 수준으로 책정되었습니다. 국가 수입 목표는 약 3,435조1000억 루피아이며, 이 중 조세수입은 약 2,911조9500억 루피아로 합의되었습니다. 이번 예산안의 거시경제 전제는 경제성장률 6%, 물가상승률 2.5%, 환율은 달러당 1만7500루피아로 설정되었습니다. 경제성장률 6% 목표는 2026년 정부 목표치인 5.4%보다 한층 높여 잡은 수치로, 정부의 적극적인 경기부양 의지를 반영한 것으로 해석됩니다. 수아하실 나자라 재무차관은 10월 5일 예산 관련 브리핑에서 2027년 예산이 이미 확정되었으며 정부의 관심은 이제 집행 준비로 넘어갔다고 언급했습니다. 이번 예산안은 핵심광물 다운스트림 산업, 인프라, 디지털 경제 등 정부의 우선 투자 분야에 대한 재정 지원 근거가 되는 것으로 알려졌습니다. 예산안 심의 과정에서 세금 환급 관련 특별 조사·감사 권한 조항이 포함된 것으로 전해져, 세무 당국의 환급 심사가 한층 강화될 가능성도 제기되고 있습니다. 투자 인센티브나 정부 발주 프로젝트에 참여하려는 PT PMA는 2027년 예산의 우선 투자 분야와 재정 정책 방향을 참고해 사업 계획을 조정하는 것이 유리하며, 특히 환급·세무조사 관련 조항의 구체적 시행 내용을 추가로 확인할 필요가 있습니다.`,
    source:`Investortrust.id`, url:`https://investortrust.id/market/117766/tok-dpr-sepakati-uu-apbn-2027-pendapatan-rp-3435-triliun-belanja-rp-4106-triliun-defisit-tetap-sesuai-usulan` },
];

function renderNews(lang){ const t = T[lang].news; return `
${siteHeader('news', lang)}
${pageHero('news','gold', lang, t.pageEyebrow, t.pageTitle, t.pageDesc)}
<section class="section">
  <div class="wrap">
    <div class="grid-3">
      <div class="news-card">
        <div class="news-ph">${ph(t.c1ph,'coffee')}</div>
        <div class="news-body"><span class="date">${t.c1date}</span><h4>${t.c1title}</h4><p>${t.c1desc}</p></div>
      </div>
      <div class="news-card">
        <div class="news-ph">${ph(t.c2ph,'green')}</div>
        <div class="news-body"><span class="date">${t.c2date}</span><h4>${t.c2title}</h4><p>${t.c2desc}</p></div>
      </div>
      <div class="news-card">
        <div class="news-ph">${ph(t.c3ph,'navy')}</div>
        <div class="news-body"><span class="date">${t.c3date}</span><h4>${t.c3title}</h4><p>${t.c3desc}</p></div>
      </div>
    </div>
    <div class="nl-panel">
      <div class="nl-head">
        <div>
          ${eyebrow(t.nlEyebrow)}
          <h3>${t.nlTitle}</h3>
          <p>${t.nlDesc}</p>
        </div>
        <span class="nl-period">${NEWSLETTER_PERIOD}</span>
      </div>
      <div class="nl-list">
        ${NEWSLETTER_ITEMS.map((n,i)=>{ const c = NL_CATS[n.cat]; return `
        <div class="nl-item">
          <div class="nl-rank">${i+1}</div>
          <div class="nl-body">
            <div class="nl-top"><span class="badge-pill ${c.theme}"><span class="dot"></span>${c.label}</span></div>
            <h4>${n.title}</h4>
            <p>${n.desc}</p>
            <div class="nl-meta">
              <span>${n.date}</span><span class="dot-sep"></span><span>${n.source}</span><span class="dot-sep"></span>
              <a class="nl-src" href="${n.url}" target="_blank" rel="noopener noreferrer">${t.nlSrcLabel}${icon('arrowRight',13)}</a>
            </div>
          </div>
        </div>`; }).join('')}
      </div>
      <p class="nl-note">${t.nlNote}</p>
    </div>
  </div>
</section>
${siteFooter(lang)}`; }

function renderCurrentPage(){
  document.documentElement.lang = currentLang;
  document.title = DOC_TITLE[currentLang] || DOC_TITLE.en;
  app.innerHTML = renderNews(currentLang) + fab(currentLang);
  window.scrollTo(0,0);
}
renderCurrentPage();
</script>
</body>
</html>
