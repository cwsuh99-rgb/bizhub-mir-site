  { cat:`econ`, date:`2026.08.27 승인`, title:`印, 데스트리 신임 BI총재 확정...9월1일 공식 취임`,
    desc:`인도네시아 국회(DPR) 11위원회가 8월 27일 내부회의를 통해 데스트리 다마얀티 임시총재를 2026~2031년 임기 인도네시아 중앙은행(Bank Indonesia) 총재로 최종 승인했습니다. 앞서 8월 26일 진행된 인사청문회(적격성 심사)에서 데스트리 후보는 '인도네시아 국민 복지를 위한 붉은색과 흰색의 시너지'라는 주제로 3대 미션과 5대 전략과제를 제시하며 통화정책의 신뢰성과 안정성을 강조했습니다. 같은 날 아이다 부디만 수석부총재 후보도 청문회를 통과해 함께 승인됐고, 솔리힌 M. 주흐로 부총재 후보 등은 다음날인 27일 별도로 심사받았습니다. 데스트리 총재는 지난 7월 25일 사임한 페리 와르지요 전 총재의 뒤를 이어 정식 취임하게 되며, 승인이 확정되면 인도네시아 사상 최초의 여성 중앙은행 총재로 기록됩니다. 위원회 승인은 오는 9월 1일(화) 국회 본회의에서 공식 의결·인준될 예정이며, 이후 대통령이 정식 임명하는 절차를 거칩니다. 데스트리 총재는 6월부터 3개월 연속 기준금리(BI-Rate)를 5.75%로 동결해온 임시총재 체제의 정책 기조를 그대로 이어갈 것으로 시장은 전망하고 있습니다. 이번 인선은 임시총재 체제의 불확실성을 해소하고 통화정책 연속성에 대한 신뢰를 높이는 계기로 평가됩니다. 다만 9월 1일 본회의 인준과 이후 공식 취임식 일정에 따라 향후 첫 통화정책회의(RDG)에서 정책 기조에 관한 공식 메시지가 나올 수 있어 주목할 필요가 있습니다. 루피아 표시 대출이나 배당금 역송금, 대규모 환전을 계획 중인 PT PMA 재무 담당자는 9월 취임 이후 발표되는 정책 방향과 시장 반응을 확인한 뒤 자금 계획을 조정하는 것이 안전합니다.`,

  { cat:`reg`, date:`2026.08.13 발표·시행`, title:`전기차 100만대 인센티브 시행...PPnBM·PPN 감면`,
    desc:`프라보워 수비안토 대통령이 8월 13일 서부자바 브카시 치카랑에 위치한 전기오토바이 제조사 PT 일렉트라 모터 그룹(ALVA) 생산시설에서 국산 전기오토바이 보급 정책을 공식 출범시켰습니다. 이번 인센티브는 국내 생산 전기이륜차 50만 대와 전기승용차 50만 대 등 총 100만 대의 전기차(EV)를 대상으로 하며, 사치품판매세(PPnBM) 최대 100% 면제와 정부가 부가가치세를 대납하는 PPN DTP(정부부담 부가세) 혜택을 조합해 제공합니다. 혜택은 순수 배터리 전기차(BEV)에 한정되며 하이브리드나 플러그인하이브리드(PHEV) 차량은 제외됩니다. 앞서 이 인센티브는 지난 6월 시행 예정이었다가 7월로, 다시 8월로 두 차례 연기됐는데, 재무부 차관 푸르바야는 8월 4일 GIIAS 2026 오토쇼에서 2~3주 내 대통령이 직접 발표할 것이라고 예고한 바 있습니다. 정부는 이번 조치가 수입 석유(BBM) 의존도를 낮추고 국내 전기차 산업의 자립도를 높이기 위한 정책이라고 설명했습니다. 현재도 국내부품사용비율(TKDN) 40% 이상인 전기차에는 부가세 1% 특례가 적용되고 있어, 이번 신규 인센티브는 기존 지원책 위에 추가되는 구조입니다. 배터리·전기차 부품을 인도네시아에서 생산·조달하는 한국 기업(LG에너지솔루션, 현대자동차 등)이나 관련 PT PMA는 TKDN 인정 기준과 적용 대상 차종·부품의 세부 요건을 재무부·산업부 후속 시행규정을 통해 반드시 확인해야 합니다. 로컬 소싱 비율을 이번 인센티브 기준에 맞춰 조정하면 세제 혜택 대상에 포함될 여지가 있는 만큼, 공급망 전략을 조기에 점검하는 것이 유리합니다.`,

  { cat:`kr`, date:`2026.08.24 계약체결`, title:`롯데GRS 엔제리너스, 인니 진출...5년간 10개점 목표`,
    desc:`롯데GRS가 커피 프랜차이즈 브랜드 엔제리너스의 인도네시아 진출을 위해 현지 유통·식음료(F&B) 전문기업 보가자야 그룹과 마스터 프랜차이즈(MF) 계약을 체결했다고 8월 25일 발표했습니다. 계약식은 전날인 8월 24일 서울 롯데월드타워 EBC홀에서 이원택 롯데GRS 대표이사와 부디 우토모 보가자야 대표 등이 참석한 가운데 열렸습니다. 파트너사인 보가자야 그룹은 동부자바 경제 중심지 수라바야를 거점으로 40년 이상 성장해온 기업으로, 인도네시아 주요 공항 내 F&B·리테일 매장 운영에 강점을 갖고 있습니다. 롯데GRS는 연내 1호점 개점과 함께 향후 5년간 10개 매장 운영을 목표로 제시했습니다. 엔제리너스는 보가자야의 공항 입지 선점 능력과 운영 노하우를 활용해 여행객과 비즈니스 고객이 밀집한 수라바야 주안다 국제공항을 시작으로 주요 쇼핑몰과 랜드마크로 매장을 순차 확대할 계획입니다. 이는 인도네시아의 거대한 내수시장과 아세안 핵심시장으로서의 성장성을 겨냥한 결정으로, 롯데GRS는 이번 계약을 글로벌 사업의 새로운 전략 거점 확보로 의미를 부여하고 있습니다. 마스터 프랜차이즈 방식은 현지 파트너가 직접 매장을 운영하고 본사는 브랜드·운영 노하우를 제공하는 구조로, 초기 투자 부담을 낮추면서 시장에 진입할 수 있는 방식입니다. 국내 외식·프랜차이즈 기업이 인도네시아 진출을 검토할 때, 현지 유통망과 공항 등 목 좋은 입지를 확보한 파트너와의 마스터 프랜차이즈 제휴가 대안적 진출 모델이 될 수 있다는 점에서 참고할 만한 사례입니다. 관련 업종의 PT PMA라면 보가자야 그룹과 같은 현지 F&B·리테일 전문기업과의 협업 가능성도 함께 검토해볼 수 있습니다.`,
    source:`뉴스핌`, url:`https://www.newspim.com/news/view/20260825001098` },
  { cat:`kr`, date:`2026.06.23 이사회 의결`, title:`포스코, 印尼 스테인리스 투자 확대...동남아 첫 일관생산`,
    desc:`포스코가 지난 6월 23일 이사회를 열어 인도네시아 스테인리스 상공정(제강·정련) 합작투자 사업을 진행하기로 의결했습니다. 스테인리스 원료를 녹이고 정련해 슬래브·열연코일까지 생산하는 상공정 설비를 현지에 갖춰, 기존의 단순 가공 중심 사업구조를 고부가가치 제품 중심으로 전환하는 것이 목표입니다. 최근 보도에 따르면 포스코는 해외 철강사업에 향후 2년간 총 6조7000억 원을 투입해 현재 약 500만 톤 수준인 해외 조강 생산능력을 2031년까지 1000만 톤으로 두 배 확대할 계획이며, 인도네시아에서는 쇳물 생산부터 자동차강판 가공까지 아우르는 동남아시아 최초의 일관 생산체제를 구축하겠다는 구상을 밝혔습니다. 포스코는 2010년 인도네시아 국영 철강사 크라카타우스틸과 합작해 찔레곤에 '크라카타우포스코' 일관제철소를 설립했으며, 현재 연간 조강 생산량은 약 300만 톤 수준입니다. 이번 스테인리스 상공정 투자와 자동차강판 일관생산 구상은 이 기존 거점을 발판으로 사업을 확장하는 후속 조치로 풀이됩니다. 배경에는 동남아 자동차·가전 시장의 성장에 맞춰 현지에서 고급 철강재를 직접 공급하려는 전략과, 중국산 저가 철강재와의 경쟁 심화에 대응해 해외 생산기지를 다변화하려는 목적이 함께 작용한 것으로 분석됩니다. 구체적인 투자 완료 시점이나 세부 지분 구조는 아직 공식적으로 확정되지 않아 후속 공시를 확인할 필요가 있습니다. 인도네시아 내 자동차·가전·건설 분야에 진출한 한국 PT PMA라면 크라카타우포스코발 현지 강판 공급망 확대가 원자재 조달선 다변화의 기회가 될 수 있는지 주시할 만합니다. 철강 후공정·가공 관련 협력사라면 포스코의 이번 투자 확대에 따른 동반 진출 가능성도 함께 검토해볼 수 있습니다.`,
    source:`헤럴드경제`, url:`https://biz.heraldcorp.com/article/10828974` },
  { cat:`tax`, date:`2026.08 시행`, title:`DJP, 세금납부 절차 개편...PER-8/PJ/2026 발효`,
    desc:`인도네시아 국세청(DJP)이 최근 국세청장 규정 PER-8/PJ/2026호를 발효해 Coretax 시스템 내 세금 납부·정산 관련 규정을 보완했습니다. 이번 개정은 세금 초과납부 환급(kelebihan pembayaran) 절차를 포함해 납부·정산과 관련한 여러 조항을 손질한 것이 핵심입니다. 개정으로 납세자는 결제코드(kode billing)를 취소하는 메커니즘이 마련돼 납부 절차가 한층 유연해졌고, 잘못 납부했을 경우의 처리 절차도 한층 명확해졌습니다. 아울러 최신 Coretax 시스템에 맞춰 세금계정코드(kode akun pajak)와 납부유형코드(kode jenis setoran)도 함께 조정됐습니다. 이와 별도로 국세청은 전자세금계산서(e-Faktur) 메뉴에도 업데이트를 적용했는데, 승인된 상태의 세금계산서를 다시 '승인' 상태로 되돌려 SPT(세금신고서) 정정을 더 쉽게 할 수 있는 '백투어프루브드(back to approved)' 기능이 새로 추가됐습니다. 또한 매출세금계산서(Faktur Pajak Keluaran) 작성 시 거래 상대방의 이메일 주소가 자동으로 노출되지 않도록 하는 등 데이터 보안 조치도 강화됐습니다. 이러한 변경은 2025년 Coretax 전면 도입 이후에도 계속되고 있는 시스템 안정화·보완 작업의 일환으로, 부가가치세(PPN) 행정 실무에 직접 영향을 미칩니다. PT PMA 재무·세무 담당자는 결제코드 취소, 세금계정코드 변경 등 새로운 절차를 사전에 숙지해 사내 세무 처리 매뉴얼을 갱신하고, 매입세액·매출세금계산서 관리 프로세스에도 반영해 신고 오류나 지연을 예방해야 합니다.`,
    source:`Pajakku`, url:`https://pajakku.com/artikel/poin-perubahan-pembayaran-pajak-coretax-dalam-per-8pj2026` },
  { cat:`tax`, date:`2026.10.15 마감`, title:`LKPM 3분기 투자보고, 10월15일까지 제출 의무`,
    desc:`인도네시아 투자조정청(BKPM) 규정 5/2025호 제286조에 따라 중·대형 규모 사업자(대부분의 PT PMA 해당)는 투자활동보고서(LKPM)를 분기마다, 소규모 사업자는 반기마다 OSS 시스템을 통해 제출해야 합니다. 2026년 3분기(7~9월) 실적에 대한 LKPM은 오는 10월 15일까지 제출해야 하며, 이는 이번 뉴스레터 발행 시점으로부터 약 한 달 반 앞으로 다가온 일정입니다. LKPM에는 해당 분기의 투자실현액, 고용창출 인원, 사업 진행 현황 등을 구체적으로 기재해야 하며, 신고 내용은 투자계획 대비 실제 이행 여부를 점검하는 핵심 자료로 활용됩니다. 만약 사업자가 신고한 총 투자계획을 지속적으로 이행하지 못하거나 LKPM 제출을 게을리할 경우, BKPM은 경고 조치는 물론 사업자등록번호(NIB) 일시정지, 심한 경우 투자허가 취소까지 단계적으로 제재를 가할 수 있습니다. 앞선 소규모 사업자의 2026년 상반기 LKPM 제출 마감(7월 15일)에서도 다수 기업이 막판까지 신고를 미루다 시스템 접속 지연 등의 불편을 겪은 사례가 보고된 바 있습니다. 특히 최근 Coretax·OSS 등 정부 전산시스템이 예정된 점검이나 개편으로 간헐적인 접속 장애를 겪고 있는 만큼, 마감일 임박 시 몰아서 신고하는 것은 위험 부담이 큽니다. PT PMA 재무·투자관리 담당자는 지금부터 3분기 투자실현액과 고용 통계를 미리 정리해두고, 10월 15일 마감 전 여유를 두고 OSS 시스템에 신고를 완료하는 것이 바람직합니다. 특히 최소자본금 요건이나 총 투자계획 변경이 있었던 기업이라면 LKPM 작성 시 이를 정확히 반영했는지도 함께 점검해야 합니다.`,
    source:`SmartLegal.id`, url:`https://smartlegal.id/laporan-perusahaan/2026/07/06/lapor-lkpm-2026-cek-7-hal-ini-agar-bebas-sanksi/` },
  { cat:`reg`, date:`2026.06.04 시행중`, title:`수입허가 자동화 규정 시행...미신고 시 자동 제재`,
    desc:`인도네시아 무역부가 지난 6월 3일 제정하고 6월 4일부터 시행에 들어간 무역부장관령 18/2026호(Permendag 18/2026)를 통해 수입허가 발급의 자동화, 기술검증보고서(LS) 요건, 행정제재 부과 메커니즘을 개편했습니다. API-U(일반수입업자식별번호) 자격을 보유한 수입업자는 수입물품 유통실적을 매월 온라인싱글서비스(SINSW)를 거쳐 무역부 인아트레이드(INATRADE) 시스템에 전자보고해야 하며, 제출 마감은 익월 15일입니다. 이번 개정의 핵심은 미신고 시 제재 절차가 자동화됐다는 점으로, 실적보고를 하지 않으면 우선 시스템을 통해 전자경고가 자동 발송되고, 이후 30일 내에도 의무를 이행하지 않으면 별도의 재량적 검토 없이 행정제재가 적용됩니다. 제재 수위는 수입허가 동결, 신규·변경·갱신 허가 발급 중단, 특정 조건에서는 동일 품목에 대한 허가 전면 동결까지 단계적으로 규정돼 있습니다. 수입실적 보고 의무는 실물 수입이 없더라도 '수입 실적 없음'을 반드시 신고해야 하는 것이 원칙이며, 이를 누락해도 동일하게 전자경고 대상이 됩니다. 정부는 이 보고 자료를 무역정책 수립·모니터링·평가를 위한 핵심 수단으로 활용하고 있어, 향후 관련 보고 의무는 더욱 강화될 가능성이 있습니다. 원부자재나 완제품을 한국 등에서 수입해 인도네시아에서 유통·판매하는 PT PMA는 매월 15일 전자보고 마감을 사내 일정에 반드시 반영하고, 수입 실적이 없는 달에도 무보고 상태로 방치하지 않도록 담당자를 지정해 관리해야 합니다. 자동화된 제재 시스템 특성상 한 번 경고가 누적되면 사람의 재량으로 되돌리기 어려운 만큼, 사전 예방이 무엇보다 중요합니다.`,
    source:`SIP Law Firm`, url:`https://siplawfirm.id/resources/permendag-18-2026-kebijakan-impor` },
  { cat:`tip`, date:`2026.06.18 마감 경과`, title:`KBLI 2025 전환 마감 지나...미전환 시 등록 문제 우려`,
    desc:`통계청(BPS) 규정 7/2025호에 따른 신규 표준산업분류 'KBLI 2025'가 지난해 12월 18일부터 기존 KBLI 2020을 대체해 시행되고 있습니다. KBLI 2025는 인공지능(AI), 암호화폐 관련업, 탄소포집·저장(CCS), 클라우드 인프라, 데이터센터, 디지털서비스 등 새로운 산업군을 반영해 분류 체계를 더욱 세분화한 것이 특징입니다. 문제는 여전히 옛 KBLI 2020 코드로 등록돼 있던 기존 사업자들로, 정부는 이들에게 OSS(온라인싱글서브미션) 시스템상 사업자 정보를 KBLI 2025 기준으로 갱신하도록 요구했고 그 마감 기한이 지난 6월 18일이었습니다. 이 마감일이 이미 두 달 이상 지난 현재 시점에서, 아직 전환을 완료하지 못한 PT PMA는 OSS상 사업자등록증(NIB)과 실제 KBLI 2025 코드 간 불일치 문제를 겪을 위험이 있습니다. 외국인 소유 지분 허용 여부나 사업 범위는 광범위한 업종명이 아니라 5자리 KBLI 코드 단위로 결정되기 때문에, 코드 갱신이 누락되면 인허가 갱신이나 신규 라이선스 신청, LKPM 보고 시 시스템 오류나 반려로 이어질 수 있습니다. 특히 최근 신설되거나 세분화된 업종(디지털서비스, 데이터센터 등)을 영위하는 기업일수록 기존 코드와의 매핑이 정확한지 다시 확인할 필요가 있습니다. 아직 KBLI 2020 코드로 남아있는 PT PMA는 OSS 시스템에 로그인해 현재 등록된 KBLI 코드 상태를 즉시 점검하고, 필요시 인허가 대행업체나 노타리스를 통해 KBLI 2025 코드로의 전환 절차를 서둘러 진행해야 합니다. 전환 지연이 길어질수록 향후 정기 점검이나 은행·정부기관 심사 과정에서 예기치 못한 문제로 불거질 가능성이 커집니다.`,
    source:`Cekindo`, url:`https://www.cekindo.com/blog/indonesia-kbli` },
  { cat:`tip`, date:`상시 의무사항`, title:`외국인 근로자도 BPJS 의무가입...6개월 이상 근무 시`,
    desc:`인도네시아 법률 40호(2004) 국가사회보장제도법에 따라 고용주는 인도네시아 국적 여부와 관계없이 모든 근로자를 사회보장제도인 BPJS Kesehatan(건강보장)과 BPJS Ketenagakerjaan(고용사회보장)에 등록해야 할 의무가 있습니다. 인도네시아에서 6개월 이상 근무하는 외국인근로자(TKA) 역시 이 의무의 적용을 받으며, KITAS(제한체류허가) 발급·갱신과도 사실상 연동돼 있어 등록을 소홀히 하면 체류 관련 행정절차에도 지장을 줄 수 있습니다. BPJS Ketenagakerjaan은 노령보장(JHT), 업무상 재해보험(JKK), 사망보험(JKM), 연금보장(JP) 등 네 가지 프로그램으로 구성되며, 보험료는 프로그램별로 산정 기준이 다르지만 상당 부분을 고용주가 부담하는 구조입니다. 미등록이 적발될 경우 고용주는 행정제재나 벌금 대상이 될 수 있으며, 근로자 입장에서도 산재나 사망 등 사고 발생 시 보상을 받지 못하는 위험에 노출됩니다. 최근 노동부가 산업단지를 중심으로 외국인력활용계획서(RPTKA) 위반 단속을 강화하고 있는 흐름과 맞물려, BPJS 미가입 여부도 함께 점검 대상에 포함되는 사례가 늘고 있는 것으로 알려져 있습니다. 즉 RPTKA 승인만 받았다고 노무 관련 의무를 모두 충족한 것이 아니라, BPJS 가입까지 완료해야 비로소 완전한 컴플라이언스 상태로 볼 수 있습니다. 한국인 주재원이나 기술인력을 파견 중인 PT PMA는 전 직원의 BPJS Kesehatan·Ketenagakerjaan 가입 여부와 보험료 납부 상태를 인사팀 차원에서 정기적으로 점검해야 합니다. 특히 신규 부임자의 경우 RPTKA·KITAS 발급 절차와 동시에 BPJS 등록 절차를 진행해 공백 기간이 발생하지 않도록 관리하는 것이 중요합니다.`,
    source:`Procapita`, url:`https://procapita.co.id/our-insights/bpjs-in-indonesia-explained/` },
  { cat:`econ`, date:`2026.08 기준(3분기 누계)`, title:`외국인 포트폴리오 자금 3분기 18억달러 순유입`,
    desc:`인도네시아 중앙은행(Bank Indonesia)에 따르면 외국인 포트폴리오 투자자들은 8월 14일까지 집계된 2026년 3분기 누적 기준으로 18억 달러의 순유입을 기록했습니다. 이는 정부의 글로벌본드 발행과 국채(SBN)·중앙은행증권(SRBI) 매입 수요에 힘입은 결과로 분석됩니다. 같은 기간 루피아화는 강세를 보여 8월 25일 기준 달러당 1만7704루피아, 8월 29일에는 1만7698루피아 수준까지 절상됐습니다. 자카르타종합주가지수(IHSG)는 8월 24~28일 한 주간 6377~6567 포인트의 좁은 밴드에서 등락하며 0.12% 소폭 약세를 보였는데, 이는 큰 방향성 없이 관망하는 투자심리를 반영하는 것으로 풀이됩니다. 이러한 자금 흐름은 데스트리 다마얀티 신임 총재 인준 등 통화당국 체제 전환이 진행되는 가운데서도 대체로 안정적인 투자심리가 유지되고 있음을 보여줍니다. 상반기 전체 투자실현액이 1010조 루피아를 넘어서는 등 실물 투자 지표도 견조한 흐름을 이어가고 있어, 포트폴리오 자금 유입과 함께 인도네시아 경제 전반에 대한 대외 신뢰도가 유지되고 있는 것으로 평가됩니다. 다만 미국 금리 정책이나 중동발 지정학적 리스크 등 대외 변수에 따라 자금 흐름은 언제든 변동성이 커질 수 있어 지속적인 모니터링이 필요합니다. 루피아 강세와 안정적 자금 유입 국면은 PT PMA가 배당금을 달러로 역송금하거나 루피아 표시 차입을 계획할 때 상대적으로 유리한 환경을 제공하지만, 환율 변동성에 대비한 헤지 전략은 여전히 유지하는 것이 바람직합니다.`,
    source:`ANTARA News`, url:`https://en.antaranews.com/news/427719/foreign-investors-post-us18b-net-inflows-in-q3-2026-bank-indonesia` },
];

function renderNews(lang){ const t = T[lang].news; return `
${siteHeader('news', lang)}
${pageHero('news','gold', lang, t.pageEyebrow, t.pageTitle, t.pageDesc)}
<section class="section">
  <div class="wrap">
    <div class="grid-3">
      <div class="news-card">
        <div class="news-ph">${ph(t.c1ph,'coffee')}</div>
        <div class="news-body"><span class="date">${t.c1date}</span><h4>${t.c1title}</h4><p>${t.c1desc}</p></div>
      </div>
      <div class="news-card">
        <div class="news-ph">${ph(t.c2ph,'green')}</div>
        <div class="news-body"><span class="date">${t.c2date}</span><h4>${t.c2title}</h4><p>${t.c2desc}</p></div>
      </div>
      <div class="news-card">
        <div class="news-ph">${ph(t.c3ph,'navy')}</div>
        <div class="news-body"><span class="date">${t.c3date}</span><h4>${t.c3title}</h4><p>${t.c3desc}</p></div>
      </div>
    </div>
    <div class="nl-panel">
      <div class="nl-head">
        <div>
          ${eyebrow(t.nlEyebrow)}
          <h3>${t.nlTitle}</h3>
          <p>${t.nlDesc}</p>
        </div>
        <span class="nl-period">${NEWSLETTER_PERIOD}</span>
      </div>
      <div class="nl-list">
        ${NEWSLETTER_ITEMS.map((n,i)=>{ const c = NL_CATS[n.cat]; return `
        <div class="nl-item">
          <div class="nl-rank">${i+1}</div>
          <div class="nl-body">
            <div class="nl-top"><span class="badge-pill ${c.theme}"><span class="dot"></span>${c.label}</span></div>
            <h4>${n.title}</h4>
            <p>${n.desc}</p>
            <div class="nl-meta">
              <span>${n.date}</span><span class="dot-sep"></span><span>${n.source}</span><span class="dot-sep"></span>
              <a class="nl-src" href="${n.url}" target="_blank" rel="noopener noreferrer">${t.nlSrcLabel}${icon('arrowRight',13)}</a>
            </div>
          </div>
        </div>`; }).join('')}
      </div>
      <p class="nl-note">${t.nlNote}</p>
    </div>
  </div>
</section>
${siteFooter(lang)}`; }

function renderCurrentPage(){
  document.documentElement.lang = currentLang;
  document.title = DOC_TITLE[currentLang] || DOC_TITLE.en;
  app.innerHTML = renderNews(currentLang) + fab(currentLang);
  window.scrollTo(0,0);
}
renderCurrentPage();
</script>
</body>
</html>
