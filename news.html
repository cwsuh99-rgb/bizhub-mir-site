  { cat:`econ`, date:`2026.08.19 발표`, title:`BI, 8월 기준금리 5.75% 동결...데스트리 첫 주재`,
    desc:`인도네시아 중앙은행(Bank Indonesia)이 8월 18~19일 이틀간 진행한 이사회 회의(RDG)에서 기준금리(BI-Rate)를 종전과 같은 5.75%로 동결하기로 결정했습니다. 예금금리(Deposit Facility)는 4.75%, 대출금리(Lending Facility)는 6.50%로 각각 유지됐습니다. 이번 회의는 데스트리 다마얀티 임시총재가 처음으로 주재한 RDG였다는 점에서 시장의 관심이 집중됐습니다. 동결 결정의 배경에는 중동 지역 분쟁 등 대외 불확실성이 커진 가운데 루피아 환율 안정을 우선시하려는 판단이 자리하고 있습니다. 중앙은행은 2026~2027년 물가상승률 목표치인 2.5%±1%를 유지하는 데도 주력하겠다고 밝혔습니다. 아울러 지속가능한 경제성장을 뒷받침하기 위해 외국인 포트폴리오 투자 유입을 늘리는 인센티브 정책을 계속 확대하고, 통화·은행 시장의 유동성도 개선해 나가겠다는 방침을 함께 제시했습니다. 이는 임시총재 체제에서 이어져 온 금리 동결 기조가 데스트리 총재 취임 이후에도 당분간 이어질 것이라는 신호로 해석됩니다. 정책 연속성이 확인되면서 루피아 표시 차입이나 배당금 역송금을 계획 중인 PT PMA 재무 담당자들은 당분간 큰 폭의 금리 변동 없이 자금 계획을 세울 수 있을 것으로 보입니다. 다만 다음 RDG는 9월 중 예정돼 있어, 데스트리 총재 취임 후 첫 정식 통화정책 메시지가 어떻게 나올지 지속적으로 확인할 필요가 있습니다. 환헤지 비용이나 루피아 조달 금리에 민감한 기업이라면 9월 회의 결과를 미리 체크해두는 것이 좋습니다.`,
    source:`ANTARA News`, url:`https://www.antaranews.com/berita/5701356/bi-umumkan-bi-rate-tetap-575-persen-pada-rdg-agustus-2026` },
  { cat:`econ`, date:`2026.09.01 발표`, title:`印尼 8월 물가상승률 3.19%로 상승...식품·금값이 견인`,
    desc:`인도네시아 통계청(BPS) 집계에 따르면 2026년 8월 소비자물가상승률(CPI)은 전년 동월 대비 3.19%를 기록해, 7월의 2.88%에서 한 단계 더 올랐습니다. 상승을 이끈 주요 품목은 식료품 가격과 국제 금값 급등에 따른 금장신구 가격이었습니다. 변동성이 큰 식품·행정물가를 제외한 근원물가상승률(core inflation)은 2.76%로, 38개월 만에 가장 높은 수준까지 뛰어올랐습니다. 이번 8월 수치는 데스트리 다마얀티 신임 총재 취임 이후 처음 발표된 물가지표라는 점에서도 주목받았습니다. 다만 8월 수치는 여전히 Bank Indonesia가 제시한 물가안정 목표범위인 1.5~3.5% 이내에 머물러 있어, 당장 통화정책 방향을 바꿀 정도의 이상 신호로 보기는 어렵다는 평가가 많습니다. 근원물가 상승세가 뚜렷해지고 있다는 점은 소비 심리 회복과 함께 향후 몇 달간 물가 흐름을 주의 깊게 지켜봐야 할 요인으로 꼽힙니다. 인건비·원자재 가격에 물가상승분을 연동해 계약하는 PT PMA라면 최근 상승한 근원물가 흐름을 감안해 납품단가나 임금 협상 시나리오를 미리 점검해두는 것이 바람직합니다. 특히 금 관련 원자재나 식품·요식업을 영위하는 기업은 원가 상승 압박이 커질 수 있어 조달 전략을 재검토할 필요가 있습니다. 물가상승률이 목표범위 상단에 근접할 경우 Bank Indonesia가 향후 금리 정책 기조를 재조정할 가능성도 배제할 수 없어, 관련 동향을 계속 모니터링해야 합니다.`,
    source:`Indonesia Investments`, url:`https://www.indonesia-investments.com/news/todays-headlines/indonesian-inflation-rises-to-3.19-in-august-2026/item10027` },
  { cat:`econ`, date:`2026.07 발표(상반기 실적)`, title:`상반기 투자실현 1010조 루피아...전년比 7.2%↑`,
    desc:`인도네시아 투자부(BKPM)가 발표한 자료에 따르면 2026년 상반기(1~6월) 전국 투자실현액이 1010조6000억 루피아(약 561억 달러)를 기록해 전년 동기 대비 7.2% 증가했습니다. 이는 정부가 설정한 2026년 연간 투자목표 2041조3000억 루피아의 49.5%에 해당하는 수준으로, 상반기 만에 목표치의 절반에 가까운 실적을 달성한 것입니다. 이 기간 국내 직접투자(PMDN)는 254조1000억 루피아(49.6%), 외국인직접투자(PMA)는 257조7000억 루피아(50.4%)를 각각 기록해 외국인 투자 비중이 절반을 소폭 넘어섰습니다. 투자실현 확대에 따라 직접 고용된 인도네시아 근로자 수도 144만8862명으로 전년 대비 15% 늘어난 것으로 집계됐습니다. BKPM은 이러한 성과가 위험기반 사업인허가(OSS-RBA) 체계 개편과 인허가 절차 간소화 등 정부의 지속적인 규제 개혁 노력이 반영된 결과라고 설명했습니다. 특히 하반기에는 다운스트림(원자재 가공·고부가가치화) 산업을 중심으로 한 투자 유치 전략을 강화하겠다는 방침도 함께 밝혔습니다. 이 같은 실적 호조는 인도네시아 투자환경에 대한 대외 신뢰도가 견조하게 유지되고 있음을 보여주는 지표로 해석됩니다. 다만 연간 목표 달성을 위해서는 하반기에도 상반기와 비슷하거나 더 높은 수준의 투자 유치 속도를 유지해야 하는 상황입니다. 신규 진출이나 증자를 검토 중인 한국 PT PMA라면, 정부의 하반기 다운스트림 투자 유치 정책이 자사 업종에 적용되는 인센티브나 우대 조건으로 이어지는지 BKPM 공지사항을 통해 확인해볼 필요가 있습니다.`,
    source:`BKPM(투자부)`, url:`https://www.bkpm.go.id/id/info/siaran-pers/realisasi-investasi-semester-i-2026-tembus-rp-1-010-t-serap-1-4-juta-tenaga-kerja-langsung` },
  { cat:`reg`, date:`2026.10.17 마감`, title:`할랄인증 의무화 10월17일 마감...식품·화장품 수입품 포함`,
    desc:`인도네시아 할랄제품보장청(BPJPH)이 관장하는 할랄인증 의무화 제도가 오는 10월 17일 수입 식품·음료를 포함한 광범위한 소비재로 전면 확대 적용됩니다. 이 날짜는 2024년 정부가 2년간 유예기간을 부여하면서 확정된 마감일로, 미국 농무부(USDA) 해외농업국(FAS)도 최근 이 연장 조치를 공식 확인한 바 있습니다. 마감 대상에는 식품·음료뿐 아니라 화장품, 전통의약품, 화학제품, 생물학적 제제, 유전자변형제품, 각종 소비재까지 폭넓게 포함됩니다. 의약품과 신체에 직접 닿는 의료기기는 이보다 늦은 2029년 10월까지 유예기간이 연장돼 있어 업종별로 적용 시점이 다르다는 점에 유의해야 합니다. 외국 기업은 할랄인증 신청을 직접 할 수 없고, 반드시 인도네시아 현지의 수입업자(수입 명의자) 또는 사업자등록증(NIB)을 보유한 공인 현지 대리인을 통해서만 BPJPH에 신청할 수 있습니다. 일반적인 인증 절차(Path A)는 원료 구성이 단순한 경우에도 3~6개월이 소요되는 것으로 알려져 있어, 올 하반기 중반 이후 신청을 시작하는 기업은 마감 기한 내 인증 취득이 어려울 가능성이 큽니다. 10월 18일부터는 정부가 시장 감시와 단속을 본격화할 예정이며, 인증을 받지 못한 제품은 벌금 부과나 판매 금지 등의 제재를 받을 수 있습니다. 식품·음료·화장품·생활소비재를 인도네시아에 수입·유통하는 한국 PT PMA나 한국산 제품을 현지 유통사를 통해 판매하는 기업은 남은 기간이 많지 않은 만큼, 인증 대상 품목 여부와 현재 진행 상황을 즉시 점검하고 현지 대리인·컨설팅사를 통한 신청 절차를 서둘러야 합니다.`,
    source:`USDA FAS(미국농무부)`, url:`https://www.fas.usda.gov/data/indonesia-indonesia-confirms-extension-mandatory-halal-certification-imported-food-and` },
  { cat:`reg`, date:`상시 단속 강화`, title:`외국인력 무단고용 적발시 거액 과태료...켐나커 단속 강화`,
    desc:`인도네시아 노동부(Kemnaker)는 서부칼리만탄 크타팡 산업단지에서 실시한 불시점검(sidak)에서 외국인력활용계획서(RPTKA) 승인 없이 근무 중이던 외국인근로자(TKA) 164명을 적발했다고 발표했습니다. 노동부는 정부규정(PP) 34/2021호에 근거해 해당 기업(PT BAP)에 총 21억7000만 루피아(약 17만 달러) 규모의 행정과태료를 부과했으며, 이 벌금은 올해 1월 26일 국고에 납부 완료된 것으로 확인됐습니다. 적발된 외국인력들의 실제 근무 기간은 짧게는 1개월에서 길게는 5개월까지 다양했던 것으로 나타났습니다. 노동부는 2026년 한 해 동안 외국인력 활용 실태와 산업안전보건 기준 등에 대한 감독을 지속적으로 강화하겠다고 밝히며, 불시점검과 상시 조사를 통한 단속을 이어가겠다는 방침을 재확인했습니다. 아울러 최근 발효된 노동부 공문(SE No. 3/836/PK.04/I/2026)에 따라 체류허가(ITK)에서 취업허가로 전환하는 RPTKA 연장 신청 시 적격성 심사(HPK) 완료가 의무화됐고, 사업장 이전이나 주재원 정보 변경 이력이 있는 경우 관련 승인 문서를 TKA Online 시스템에 사전 업로드해야 하는 절차도 새로 추가됐습니다. 특히 최초 방문허가의 보증인(guarantor)과 취업허가의 보증인이 반드시 동일해야 한다는 요건도 강화돼, 스폰서 변경 시 각별한 주의가 필요합니다. 원격근무 형태로 12개월 중 60일 이상 인도네시아에 체류하는 외국인 인력도 RPTKA 대상으로 간주되는 추세여서, 단기 출장이나 원격근무 파견이 잦은 한국 기업은 체류일수 관리에 신경 써야 합니다. 한국인 주재원·기술인력을 파견 중인 PT PMA는 RPTKA 승인 현황과 보증인 일치 여부, 지식이전계획(현지 카운터파트 지정) 서류를 인사팀 차원에서 재점검하고, 승인 없는 인력이 한 명도 없는지 정기적으로 자체 감사를 실시하는 것이 중요합니다.`,
    source:`Kementerian Ketenagakerjaan RI(인니 노동부)`, url:`https://www.kemnaker.go.id/news/detail/164-tka-tanpa-rptka-terungkap-kemnaker-denda-perusahaan-rp217-miliar` },
  { cat:`tip`, date:`2025.10.02 시행중`, title:`PT PMA 최소자본금 25억 루피아로 하향...설립요건 완화`,
    desc:`인도네시아 투자부(BKPM) 규정 5/2025호가 지난해 10월 2일부터 시행되면서, 위험기반 사업인허가(OSS-RBA) 체계와 투자실현 절차 전반이 개편됐습니다. 이번 개정에서 실무적으로 가장 큰 변화 중 하나는 외국인투자기업(PT PMA)의 최소 납입자본금 요건이 기존 100억 루피아(약 60만 달러)에서 25억 루피아(약 15만 달러)로 대폭 낮아졌다는 점입니다. 이는 소규모·스타트업 형태로 인도네시아 진출을 검토하던 외국 투자자들의 초기 자본 부담을 크게 줄여주는 조치로 평가됩니다. 다만 최소자본금 완화가 모든 업종에 동일하게 적용되는 것은 아니며, KBLI(표준산업분류) 코드별로 별도의 자본금·투자 규모 요건이 정해져 있는 경우 해당 업종 규정이 우선 적용될 수 있어 사전 확인이 필요합니다. 아울러 이번 규정은 사업 인허가 신청 전 기본요건(공간계획, 환경·건축 승인 등)을 통합 처리하는 하위시스템을 신설하고, BKPM의 사후관리·투자보고 감독 권한도 함께 명확히 했습니다. 자본금 요건 완화로 신규 PT PMA 설립 문턱이 낮아진 만큼, 향후 소규모 외국인투자기업의 신규 설립이 늘어날 것으로 전망됩니다. 이미 설립된 PT PMA 중 기존 최소자본금 기준으로 정관을 작성해둔 기업이라면, 이번 완화가 증자·감자 계획이나 지분 구조 조정에 활용할 여지가 있는지 노타리스나 현지 자문사와 함께 검토해볼 만합니다. 신규 진출을 검토 중인 한국 기업이라면 낮아진 자본금 요건을 활용해 초기 투자 규모를 조정하되, 업종별 KBLI 세부요건과 외국인 지분 한도는 별도로 재확인해야 합니다.`,
    source:`SSEK Law Firm`, url:`https://ssek.com/blog/indonesia-issues-bkpm-regulation-no-5-of-2025-to-implement-updated-risk-based-business-licensing-framework/` },
  { cat:`tax`, date:`2026.09.30 등록마감 임박`, title:`글로벌최저한세 이행규정 시행...9월말 등록마감 임박`,
    desc:`인도네시아 국세청(DJP)이 지난 5월 4일 발효한 PER-6/PJ/2026호를 통해 OECD 필라2(Pillar Two) 글로벌최저한세(GloBE) 규정의 행정·이행 절차를 구체화했습니다. 이는 2024년 발효된 재무부규정(PMK) 136/2024호가 규정한 실효세율(ETR) 산정, 소득산입규칙(IIR), 미과세이익규칙(UTPR), 국내최저보완세(DMTT) 등 필라2 큰 틀을 실제로 이행하기 위한 세부 행정규정입니다. 연결매출액이 일정 기준(통상 7억5000만 유로 상당) 이상인 다국적기업(MNE) 그룹에 속한 인도네시아 내 법인이나 조인트벤처는 'GloBE 납세자 지위'를 국세청 포털을 통해 전자적으로 등록해야 합니다. 등록 신청 기한은 해당 기업의 첫 GloBE 회계연도(2025 회계연도) 종료일로부터 9개월 이내로 규정돼 있어, 12월 결산 법인이라면 2026년 9월 30일이 등록 마감일이 됩니다. 등록 대상 법인이 인도네시아 내에서 적용받는 실효세율이 15%에 미달할 경우, 부족분에 대해 추가 과세(top-up tax)가 부과되는 구조입니다. 조세특례(세제 인센티브)를 적용받고 있는 대규모 다국적기업 계열 PT PMA라면 이번 필라2 규정 시행으로 기존에 누리던 세액감면 효과가 상쇄될 수 있어 특히 유의해야 합니다. 삼성·LG·현대차 등 대규모 해외 매출을 보유한 한국계 다국적기업의 인도네시아 법인은 그룹 연결매출 기준 충족 여부와 실효세율 수준을 시급히 점검하고, 등록 기한 내 GloBE 납세자 지위 신청을 완료해야 합니다. 세무 자문사와 함께 조세특례와 필라2 규정 간 상호작용을 미리 시뮬레이션해 예상치 못한 추가 세부담이 발생하지 않도록 대비하는 것이 중요합니다.`,
    source:`KPMG Indonesia`, url:`https://kpmg.com/id/en/insights/2026/06/tnf-june-2026-per-6-pj2026.html` },
  { cat:`tax`, date:`개인 SPT 신고기한 최대 2개월 연장`, title:`개인소득세 SPT 신고기한 2개월 연장 가능...PER-3/PJ/2026`,
    desc:`인도네시아 국세청(DJP)이 지난 3월 16일부터 시행 중인 PER-3/PJ/2026호를 통해 개인소득세 연간신고서(SPT Tahunan Orang Pribadi) 제출 기한을 최대 2개월까지 연장 신청할 수 있는 절차를 새롭게 규정했습니다. 연장 신청이 가능한 대상은 크게 두 가지로, 사업이나 자유직업 활동을 영위하면서 아직 재무제표 작성을 완료하지 못한 개인 납세자와, 사업·자유직업 활동이 없으면서 고용주로부터 근로소득세(PPh 21) 원천징수증명서(부코티, Bukti Potong)를 아직 받지 못한 개인 납세자입니다. 해당 요건을 충족하는 납세자는 정식 신고기한(통상 3월 31일) 이후 최대 2개월까지 신고를 미룰 수 있으며, 이 기간에는 지연신고에 따른 가산세가 부과되지 않습니다. 이와 함께 국세청은 2026년 신고분에 한해 4월 말까지 지연 가산세와 이자를 면제하는 추가 완화 조치도 병행 적용했습니다. 이 규정은 결산이 늦어지는 개인사업자뿐 아니라, 근로소득 원천징수증명서 발급이 늦어지는 회사에 소속된 근로자 전반에도 적용될 수 있습니다. 인도네시아에서 근무 중인 한국인 주재원이나 현지 채용 외국인 직원이 회사의 부코티 발급 지연 등의 사유로 신고기한을 지키기 어려운 상황이라면, 이번 규정에 따라 정식 연장 신청 절차를 밟아 가산세 부과를 피할 수 있습니다. PT PMA 인사·총무 담당자는 소속 임직원의 부코티 발급 일정을 미리 관리해 불필요한 지연신고 상황 자체를 예방하는 한편, 부득이하게 지연되는 경우에는 이번 연장 규정을 활용하도록 사내에 안내하는 것이 바람직합니다.`,
    source:`Pajak.com`, url:`https://www.pajak.com/pajak/pajak-nasional/per-3-2026-orang-pribadi-kriteria-ini-bisa-ajukan-perpanjangan-waktu-pelaporan-spt-tahunan-hingga-2-bulan/` },
  { cat:`kr`, date:`2026.08.05 승인`, title:`KB국민은행, 인니 금융지주 설립 승인...계열사 재편`,
    desc:`KB국민은행이 인도네시아 금융감독청(OJK)으로부터 현지 금융지주회사 설립 계획을 지난 8월 5일 승인받았다고 8월 18일 밝혔습니다. 국민은행이 지난해 6월 최초 계획안을 제출한 지 약 14개월 만에 나온 승인으로, 인도네시아에 흩어져 있는 KB금융그룹 계열사 지분을 하나의 현지 지주회사 아래로 모으는 지배구조 개편 작업입니다. 구체적으로는 국민은행과 KB데이터시스템이 공동 보유 중인 KB데이터시스템 인도네시아를 지주회사로 전환하고, 이 아래에 KB증권 계열의 KB발부리증권(지분 65%), KB손해보험 계열의 KB인슈어런스인도네시아(70%), KB국민카드 계열의 KB피난시아멀티파이낸스(85%), KB캐피탈 계열의 수린도국민베스트파이낸스(85%), KB자산운용 계열의 KB발부리자산운용(70%) 등 5개 계열사 지분을 이전할 예정입니다. 국민은행이 직접 보유 중인 현지 상업은행 KB뱅크 인도네시아 지분율은 66.88%입니다. 국민은행은 승인일로부터 1년 이내인 2027년 8월까지 지주회사 설립과 계열사 지분 재편 절차를 모두 완료해야 합니다. 이번 조치는 앞서 진출한 다른 한국계 금융그룹들이 추진해온 동남아 통합 지배구조 전략과 궤를 같이하는 것으로, KB금융이 인도네시아를 거점으로 동남아 종합금융 서비스 경쟁력을 강화하려는 행보로 풀이됩니다. 인도네시아에 진출한 한국 PT PMA 입장에서는 KB뱅크를 비롯한 KB금융그룹 계열사들이 하나의 지주회사 체제로 통합되면서, 향후 은행·증권·보험·카드·캐피탈을 아우르는 원스톱 금융서비스 이용이 한층 수월해질 것으로 기대됩니다. 특히 현지화 자금조달이나 무역금융을 KB금융그룹과 거래해온 기업이라면, 지배구조 재편이 진행되는 2026~2027년 사이 계약 주체나 담당 법인이 바뀔 수 있는 만큼 관련 안내를 주의 깊게 확인할 필요가 있습니다.`,
    source:`머니투데이`, url:`https://www.mt.co.kr/finance/2026/08/18/2026081817033878577` },
  { cat:`kr`, date:`2026.09.03~09.06 개최`, title:`무협, 할랄시장 겨냥 K-소비재 200개사 자카르타 전시`,
    desc:`한국무역협회(KITA)가 코엑스와 공동으로 9월 3일부터 6일까지 자카르타 JICC(자카르타국제박람회장)에서 '2026 자카르타 K-프리미엄 소비재전'을 개최했습니다. 올해로 8회째를 맞은 이번 행사는 할랄인증 의무화를 앞둔 인도네시아 시장을 정조준해 'K-할랄·K-소비재'를 주제로 삼았으며, 식품·뷰티·리빙 등 분야의 국내 기업 200여 개사가 300개 부스 규모로 참가했습니다. 인도네시아의 무슬림 인구가 약 2억9000만 명에 달하는 세계 최대 할랄 소비시장이라는 점을 겨냥해, 무역협회는 오는 10월 17일로 예정된 할랄인증 의무화 시행을 앞두고 국내 소비재 기업들의 현지 시장 선점을 지원한다는 취지를 밝혔습니다. 전시회와 별도로 무역협회는 인도네시아 현지에서 43개 매장을 운영 중인 유통업체 K3마트와 협업해, 자카르타 리뽀몰 뿌리 매장에서 국내 기업 20개사의 제품을 판매하는 팝업스토어를 9월 한 달간 운영하기로 했습니다. 이는 전시회 참가만으로 끝나지 않고 실제 오프라인 유통망을 통한 판매 테스트까지 이어지는 구조로, 국내 중소 소비재 기업의 현지 진출 문턱을 낮추려는 시도로 평가됩니다. 다만 할랄인증을 받지 않은 제품은 10월 17일 이후 정식 유통이 제한될 수 있는 만큼, 이번 전시회 참가 기업들도 별도로 할랄인증 취득 절차를 병행해야 실질적인 시장 진입이 가능합니다. 인도네시아 진출을 검토 중인 한국 식품·뷰티·생활용품 기업이라면 이 같은 정부·협회 차원의 지원 프로그램을 활용해 초기 시장조사 비용과 리스크를 줄이는 한편, 할랄인증 절차를 동시에 진행하는 투트랙 전략이 필요합니다.`,
    source:`뉴스핌`, url:`https://www.newspim.com/news/view/20260903001103` },
];

function renderNews(lang){ const t = T[lang].news; return `
${siteHeader('news', lang)}
${pageHero('news','gold', lang, t.pageEyebrow, t.pageTitle, t.pageDesc)}
<section class="section">
  <div class="wrap">
    <div class="grid-3">
      <div class="news-card">
        <div class="news-ph">${ph(t.c1ph,'coffee')}</div>
        <div class="news-body"><span class="date">${t.c1date}</span><h4>${t.c1title}</h4><p>${t.c1desc}</p></div>
      </div>
      <div class="news-card">
        <div class="news-ph">${ph(t.c2ph,'green')}</div>
        <div class="news-body"><span class="date">${t.c2date}</span><h4>${t.c2title}</h4><p>${t.c2desc}</p></div>
      </div>
      <div class="news-card">
        <div class="news-ph">${ph(t.c3ph,'navy')}</div>
        <div class="news-body"><span class="date">${t.c3date}</span><h4>${t.c3title}</h4><p>${t.c3desc}</p></div>
      </div>
    </div>
    <div class="nl-panel">
      <div class="nl-head">
        <div>
          ${eyebrow(t.nlEyebrow)}
          <h3>${t.nlTitle}</h3>
          <p>${t.nlDesc}</p>
        </div>
        <span class="nl-period">${NEWSLETTER_PERIOD}</span>
      </div>
      <div class="nl-list">
        ${NEWSLETTER_ITEMS.map((n,i)=>{ const c = NL_CATS[n.cat]; return `
        <div class="nl-item">
          <div class="nl-rank">${i+1}</div>
          <div class="nl-body">
            <div class="nl-top"><span class="badge-pill ${c.theme}"><span class="dot"></span>${c.label}</span></div>
            <h4>${n.title}</h4>
            <p>${n.desc}</p>
            <div class="nl-meta">
              <span>${n.date}</span><span class="dot-sep"></span><span>${n.source}</span><span class="dot-sep"></span>
              <a class="nl-src" href="${n.url}" target="_blank" rel="noopener noreferrer">${t.nlSrcLabel}${icon('arrowRight',13)}</a>
            </div>
          </div>
        </div>`; }).join('')}
      </div>
      <p class="nl-note">${t.nlNote}</p>
    </div>
  </div>
</section>
${siteFooter(lang)}`; }

function renderCurrentPage(){
  document.documentElement.lang = currentLang;
  document.title = DOC_TITLE[currentLang] || DOC_TITLE.en;
  app.innerHTML = renderNews(currentLang) + fab(currentLang);
  window.scrollTo(0,0);
}
renderCurrentPage();
</script>
</body>
