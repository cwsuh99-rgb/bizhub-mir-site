  { cat:`reg`, date:`2026.09.09 서명, 9월말 가동`, title:`외국인력 허가 통합창구, 이달 말 실제 가동`,
    desc:`9월 9일 투자부(BKPM)·노동부(Kemnaker)·이민청 3개 기관이 서명한 외국인력 허가절차 통합 시스템이 예정대로 9월 말부터 실제 가동에 들어갑니다. 이번 통합의 핵심은 투자부의 온라인단일창구(OSS)를 유일한 진입점으로 삼아, 노동부의 인력채용 플랫폼 SIAPkerja와 이민청의 올인도네시아(All Indonesia) 애플리케이션을 뒤에서 서로 연동시키는 구조입니다. 기업 입장에서는 더 이상 부처별로 따로 로그인해 서류를 중복 제출할 필요 없이 OSS 한 곳에서 외국인력활용계획서(RPTKA) 신청부터 비자·체류허가까지 진행 상황을 확인할 수 있게 됩니다. 소관 기관이 정해진 처리기한 안에 심사를 마치지 못하면 시스템이 자동으로 승인 처리하는 이른바 '긍정적 침묵(fiktif positif)' 방식의 자동승인 장치도 함께 적용돼, 담당 공무원의 재량이나 지연으로 인한 병목이 크게 줄어들 전망입니다. 다만 통합 시스템이 정상적으로 자리 잡기까지는 초기 오류나 데이터 연동 지연이 발생할 가능성이 있어, 정부 스스로도 초기 몇 주간을 안정화 기간으로 보고 있습니다. 특히 RPTKA 최초 신청 내용과 이후 연장 신청 내용 사이에 직책이나 인원 등 정보가 일치하지 않으면 시스템이 이를 자동으로 걸러내 반려하거나 심사를 지연시킬 수 있다는 점이 실무자들 사이에서 주의사항으로 꼽힙니다. 한국인 주재원이나 기술인력을 두고 있는 PT PMA라면, 9월 말 가동 시점을 전후로 로그인 계정 전환이나 기존 서류 이관에 문제가 없는지 미리 확인하고, RPTKA 관련 회사·직책 정보가 최초 등록 당시와 지금 시점에 서로 다르지 않은지 점검해두는 것이 안전합니다. 신규 인력을 파견하거나 기존 인력의 허가를 갱신할 계획이 있다면, 통합 시스템 가동 직후 1~2주는 신청을 서두르기보다 처리 흐름이 안정되는 것을 지켜본 뒤 진행하는 편이 시행착오를 줄이는 방법이 될 수 있습니다.`,
    source:`ANTARA News`, url:`https://www.antaranews.com/berita/5733324/pemerintah-memangkas-proses-perizinan-tka-lewat-integrasi-oss` },
  { cat:`econ`, date:`2026.09.23 발표`, title:`BI, 기준금리 5.75%로 3개월째 동결`,
    desc:`인도네시아 중앙은행(BI)이 9월 22~23일 열린 통화정책회의(RDG)에서 기준금리(BI-Rate)를 5.75%로 동결하며 3개월 연속 같은 수준을 유지했습니다. 함께 발표된 예금창구금리(deposit facility)는 4.75%, 대출창구금리(lending facility)는 6.50%로 각각 그대로 유지됐습니다. 이번 동결의 배경으로는 대외 변동성 속에서도 루피아 환율 안정을 지키려는 의도가 가장 크게 꼽히며, 물가 상승률이 아직 목표 범위 안에 있다는 점도 금리를 서둘러 낮추지 않을 여지를 준 것으로 분석됩니다. 실제로 8월 소비자물가 상승률은 전년 동월 대비 3.19%로, 7월의 2.88%보다는 높아졌지만 여전히 중앙은행의 관리 목표 범위 안에 머물렀고, 근원물가 상승률도 2.92%로 비교적 안정적인 흐름을 보였습니다. 시장에서는 미국 등 주요국의 통화정책 불확실성과 자본유출 압력이 이어지는 상황에서 BI가 성급하게 금리를 내릴 경우 루피아 약세를 자극할 수 있다는 우려가 이번 동결 결정의 주요 논거로 작용했다고 보고 있습니다. 동시에 BI는 국내 경기 회복 흐름 자체는 훼손하지 않기 위해 유동성 공급이나 거시건전성 정책 등 금리 이외의 수단을 함께 활용하겠다는 입장도 밝혔습니다. 기준금리가 3개월째 같은 수준에 머물면서 은행권 대출금리나 예금금리 역시 당분간 큰 변동 없이 안정적으로 유지될 가능성이 높아졌습니다. 루피아 표시 대출을 이용 중이거나 신규 시설투자·운전자금 조달을 검토 중인 PT PMA라면, 이번 동결로 당분간 금리 환경이 예측 가능해진 만큼 자금조달 시점을 계획하는 데 참고할 만합니다. 다만 외부 요인에 따라 루피아 환율 변동성 자체는 여전히 남아 있으므로, 원자재나 설비를 수입에 의존하는 기업이라면 환헤지나 결제통화 다변화 전략을 계속 점검해두는 것이 바람직합니다.`,
    source:`CNN Indonesia`, url:`https://www.cnnindonesia.com/ekonomi/20260923143557-78-1407278/bi-rate-tetap-575-persen-per-september-2026-ditahan-3-bulan-beruntun` },
  { cat:`econ`, date:`2026.09.14 기준 발표`, title:`해외자금 루피아 시장에 140조루피아 순유입`,
    desc:`인도네시아 재무부는 9월 14일 기준 해외 자본의 순유입 규모가 약 140조7000억 루피아에 달한다고 밝혔습니다. 수아하실 나자라 재무차관은 이 같은 자금 유입이 국채(SBN) 시장에서 40조8000억 루피아, 중앙은행이 발행하는 루피아표시 증권(SRBI)에서 171조6000억 루피아 규모로 이뤄졌다고 설명했습니다. 반면 국내 주식시장에서는 여전히 70조7000억 루피아 규모의 자금 순유출이 이어지고 있는 것으로 나타나, 채권·통화안정증권 쪽으로의 자금 쏠림과 주식시장의 상대적 부진이 대조를 이루고 있습니다. 다만 3분기 들어서는 주식시장에서도 부분적으로 순유입 조짐이 나타나기 시작했다는 점이 긍정적으로 평가됩니다. 수아하실 차관은 이러한 흐름이 몇 달 전까지 이어지던 자본유출 국면에서 벗어나 해외 투자자들의 인도네시아 경제 펀더멘털에 대한 인식이 긍정적으로 바뀌고 있다는 신호라고 설명했습니다. 경제개혁센터(CORE)의 이코노미스트는 이번에 유입된 자금이 단기 포트폴리오 투자에 머물지 않고 생산적인 실물 투자로 이어지도록 정책적으로 관리하는 것이 중요하다고 지적했습니다. 해외 자금이 채권·통화안정증권 시장에 집중된다는 것은 단기적으로 루피아 환율 안정에 도움이 되지만, 국제 금리 환경이나 투자심리가 바뀌면 언제든 다시 유출로 돌아설 수 있는 변동성 높은 자금이라는 점도 함께 유의할 대목입니다. 루피아 환율 흐름에 민감한 PT PMA라면 이 같은 단기 자본 유출입 지표를 채권시장·주식시장으로 나누어 함께 살펴보는 것이 환리스크 관리에 도움이 될 수 있습니다. 실물경제 투자 확대로 이어지는지 여부는 향후 발표될 4분기 외국인직접투자(FDI) 통계를 통해 좀 더 뚜렷하게 확인될 것으로 보입니다.`,
    source:`ANTARA News`, url:`https://www.antaranews.com/berita/5754424/menkeu-suahasil-sebut-arus-modal-asing-masuk-ke-ri-rp1407-triliun` },
  { cat:`tip`, date:`2026.04.22 시행`, title:`PT PMA는 UMKM 0.5% 특례세율 적용 대상 아님`,
    desc:`올해 4월 22일부터 시행 중인 정부규정(PP) 20/2026호에 따라, 총매출액 기준 0.5% 최종세율(PPh Final)을 적용받는 UMKM(영세·중소기업) 세제 혜택 대상이 한층 명확하게 좁혀졌다는 점을 다시 짚어볼 필요가 있습니다. 이 규정에 따르면 0.5% 특례세율을 적용받을 수 있는 납세자는 개인사업자, 1인이 설립한 개인회사(PT Perorangan), 그리고 국내 협동조합(코퍼라시)으로 한정되며, 이들의 연간 총매출액이 48억 루피아를 넘지 않아야 합니다. 즉 2인 이상의 주주가 참여하는 일반 유한회사(PT) 형태로 설립되는 PT PMA는 매출 규모와 무관하게 이 0.5% 특례세율을 적용받을 수 없고, 원칙적으로 일반 법인세율(과세소득 기준 22%, 일정 요건 충족 시 중소기업 경감세율 적용)을 따라야 합니다. 이는 흔히 '인도네시아는 매출이 작으면 세율이 0.5%'라고 알고 있는 경우가 많아 신규 설립 단계에서 특히 오해가 잦은 부분입니다. 다만 이번 규정 시행 이전부터 이미 0.5% 특례를 적용받아 온 기존 개인회사·협동조합에 대해서는 남은 혜택 기간 동안 계속 적용받을 수 있도록 경과조치가 마련돼 있습니다. 정부는 이번 개편의 취지가 특례세율 대상을 실제 영세사업자 중심으로 재조정해, 사실상 사업 쪼개기 등을 통해 세제 혜택을 남용하는 사례를 막고 과세 형평성을 높이려는 데 있다고 설명하고 있습니다. 신규로 PT PMA 설립을 검토 중인 한국 기업이라면 사업계획 수립 단계에서부터 0.5% 특례가 아닌 일반 법인세율을 전제로 세부담을 추산해야 자금계획에 착오가 생기지 않습니다. 이미 운영 중인 PT PMA도 혹시 회계·세무 대행사가 관행적으로 0.5% 세율을 적용해오지는 않았는지 이번 기회에 한 번 점검해보는 것이 바람직합니다.`,
    source:`Bisnis.com`, url:`https://ekonomi.bisnis.com/read/20260531/259/1977457/pp-202026-pph-final-umkm-hanya-untuk-pt-perorangan-dan-koperasi` },
  { cat:`tip`, date:`2026.11.01 결정 예정`, title:`2027년 최저임금 7.5~9.5% 인상안 제시`,
    desc:`인도네시아노동조합총연맹(KSPI)과 노동자당(Partai Buruh)이 9월 17일 2027년 최저임금(UMP·UMK)을 전국 평균 7.5~9.5% 인상해야 한다는 안을 정부에 제시했습니다. 노조 측은 정부규정(PP) 49/2026호가 정한 최저임금 산정 공식을 그대로 활용해, 연간 평균 물가상승률과 경제성장률, 그리고 0.5~0.9 범위 안에서 정하도록 돼 있는 조정지수(알파)를 대입하는 방식으로 인상률을 계산했습니다. 통계청(BPS) 자료를 근거로 2025년 10월부터 2026년 8월까지의 평균 물가상승률 3.20%와 평균 경제성장률 5.43%를 사용하고, 조정지수를 허용 범위 상단에 가까운 0.9로 적용해 전국 평균 약 7.7%의 인상률을 도출했다고 밝혔습니다. 여기에 지역별 산업 구조와 생계비 차이를 반영해 최종적으로 7.5~9.5% 범위의 인상안으로 제시한 것입니다. 이는 어디까지나 노동계가 정부에 제출한 제안일 뿐이며, 실제 최종 인상률은 각 주지사가 중앙정부 산정 공식과 지역 노사정 협의를 거쳐 별도로 확정하게 됩니다. 정부 일정에 따르면 주 단위 최저임금(UMP)은 11월 1일, 시·군 단위 최저임금(UMK) 및 업종별 최저임금은 11월 10일 각각 확정·발표될 예정입니다. 최저임금 인상은 인건비 비중이 높은 카페·요식업·서비스업 등을 운영하는 PT PMA에 직접적인 원가 부담으로 작용하는 만큼, 노동계 제안치와 정부 확정치 사이에 상당한 차이가 있을 수 있다는 점을 감안해 2027년 예산을 보수적으로 여러 시나리오로 나눠 준비해두는 것이 안전합니다. 특히 자카르타 등 수도권 지역은 전국 평균보다 높은 인상률이 적용되는 경우가 많았던 만큼, 사업장이 위치한 주(州)별 발표 내용을 11월 초부터 주의 깊게 확인할 필요가 있습니다.`,
    source:`CNBC Indonesia`, url:`https://www.cnbcindonesia.com/news/20260917102615-4-768630/said-iqbal-tiba-tiba-usul-upah-minimum-2027-naik-75-95` },
  { cat:`tax`, date:`2026.09.30 마감`, title:`8월분 부가가치세(PPN) 신고·납부 9월30일 마감`,
    desc:`부가가치세 과세사업자(PKP)로 등록된 PT PMA라면 2026년 8월 과세기간분 월별 부가가치세(SPT Masa PPN) 납부와 신고 마감이 9월 30일이라는 점을 다시 한 번 확인해야 합니다. 인도네시아 세법상 월별 부가가치세는 매입세액과 매출세액을 정산해 다음 달 말일까지 납부와 신고를 모두 마쳐야 하며, 이번 8월분에 이어 9월분은 10월 31일이 마감이 됩니다. 신고와 세금계산서(e-Faktur) 발행은 모두 국세청의 전자시스템인 코레탁스(Coretax)를 통해 이뤄지며, 종이 서류나 별도 오프라인 제출은 인정되지 않습니다. 기한 내에 신고하지 못하면 신고 자체에 대해 50만 루피아의 행정과태료가 부과되며, 세액 납부가 늦어질 경우에는 별도로 연체이자 성격의 가산세가 추가로 부과될 수 있습니다. 코레탁스 시스템이 도입된 이후에도 시스템 접속 지연이나 세금계산서 매칭 오류로 마감일 당일 신고에 어려움을 겪는 사례가 종종 보고되고 있어, 마감 하루 전날 몰아서 처리하기보다는 며칠 여유를 두고 매입·매출 세금계산서 내역을 대사해두는 것이 안전합니다. 특히 매입 측 세금계산서가 거래 상대방에 의해 제때 확정(승인)되지 않으면 매입세액공제 자체가 인정되지 않을 수 있으므로, 주요 매입처의 세금계산서 발행·확정 상태를 신고 마감 전에 미리 점검하는 것이 중요합니다. 카페·리테일 등 최종소비자를 상대로 부가가치세를 직접 징수하는 업종의 PT PMA는 포스(POS) 시스템에서 집계된 매출액과 실제 세금계산서 발행 내역이 일치하는지도 함께 확인해두는 것이 바람직합니다. 회계 인력이 제한적인 소규모 PT PMA라면 매월 반복되는 이 신고 업무를 현지 세무대리인에게 위탁해 기한을 놓치는 리스크 자체를 줄이는 방법도 고려할 만합니다.`,
    source:`Pajakku`, url:`https://pajakku.com/artikel/batas-waktu-penyetoran-dan-pelaporan-spt-masa-ppn-tahun-2026` },
  { cat:`tax`, date:`2026.09.20 발표(8월 누계)`, title:`디지털경제 세수 57.23조루피아 돌파...전자상거래가 견인`,
    desc:`인도네시아 국세청(DJP)은 9월 20일, 2026년 8월 말까지 누적된 디지털경제 관련 세수가 57조2300억 루피아에 달했다고 발표했습니다. 이 가운데 전자상거래 부가가치세(PPN PMSE)가 44조500억 루피아로 전체의 약 77%를 차지해 가장 큰 비중을 차지했고, 나머지는 암호화폐자산 거래세 2조1500억 루피아, P2P 핀테크(대출) 관련 세금 5조2800억 루피아, 정부 전자조달시스템(SIPP)을 통한 세금 5조7500억 루피아 순으로 집계됐습니다. 국세청에 따르면 8월 말 기준 전자상거래 부가가치세 징수의무자로 지정된 마켓플레이스·플랫폼 사업자는 총 277곳이며, 이 가운데 244곳이 실제로 세금을 징수해 국고에 납부까지 마친 상태입니다. 이는 인도네시아 정부가 오프라인 중심이던 과세 기반을 온라인·디지털 거래 영역으로 빠르게 넓혀가고 있음을 보여주는 지표로 평가됩니다. 국세청은 앞으로도 지정 대상 플랫폼을 계속 확대하고, 아직 징수·납부를 시작하지 않은 플랫폼에 대한 점검도 강화하겠다는 방침을 밝혔습니다. 자체 온라인몰을 운영하거나 토코피디아·쇼피 등 대형 마켓플레이스에 입점해 소비재를 판매하는 PT PMA라면, 입점한 플랫폼이 이번에 언급된 277개 지정 사업자에 포함돼 있는지, 그리고 판매대금에서 부가가치세가 올바르게 원천 징수되고 있는지 확인해둘 필요가 있습니다. 플랫폼이 대신 징수한 세액이라 하더라도 궁극적으로는 판매자 본인의 매출·매입 장부와 정합성이 맞아야 추후 세무조사 시 문제가 되지 않으므로, 정산 내역서를 월별로 보관해두는 습관이 중요합니다. 디지털 채널 매출 비중이 계속 커지고 있는 만큼, 관련 세정 변화는 앞으로도 주기적으로 확인해두는 것이 좋습니다.`,
    source:`CNBC Indonesia`, url:`https://www.cnbcindonesia.com/news/20260920104147-4-769299/pajak-ekonomi-digital-ri-tembus-rp5723-triliun-di-agustus-2026` },
  { cat:`kr`, date:`2026.09.13~09.18 실시`, title:`한국중부발전, 인니서 4778만달러 수출상담`,
    desc:`한국중부발전(KOMIPO)이 9월 13일부터 18일까지 인도네시아 자카르타·찌레본·찔레곤 세 도시에서 협력 중소기업 15개사와 함께 '2026년도 제2차 인도네시아 시장개척단'을 운영해 총 166건, 4778만달러 규모의 수출상담 성과를 거뒀습니다. 자카르타에서는 현지 바이어 21개사, 관계자 40명을 초청해 신규 거래선 발굴을 위한 구매 상담회를 열었습니다. 찔레곤에서는 지난해 3월 준공한 수출지원 거점 'KOMIPO FACTORY'를 중심으로 기술교류회와 별도의 수출상담회가 함께 진행됐습니다. 참여기업 중 에코파워텍은 화재 확산 방지 보온재를 현지 기업 HFS에 공급하는 20만5000달러 규모의 실제 계약을 체결했고, 에쓰엔은 인도네시아 국영전력회사(PLN) 계열사인 PLN SC와 업무협약(MOU)을 맺는 성과를 냈습니다. 이번 사절단은 KOMIPO가 발전 공기업으로서 보유한 현지 네트워크와 신인도를 활용해, 개별적으로는 인도네시아 시장에 접근하기 어려운 국내 중소 발전기자재 업체들의 판로 개척을 지원하는 상생협력 사업의 일환으로 추진됐습니다. 인도네시아는 전력 수요 증가와 함께 노후 발전설비 교체·신규 발전소 건설 수요가 꾸준해, 관련 기자재·부품 시장으로서의 잠재력이 계속 주목받고 있습니다. 인도네시아에서 발전설비, 전력기자재, 관련 부품을 조달하거나 현지 발전 프로젝트 납품을 검토 중인 한국계 PT PMA라면, 이번에 계약·MOU를 체결한 기업들의 후속 진행 상황과 KOMIPO FACTORY를 거점으로 한 향후 상담회 일정을 참고할 만합니다. 다만 이번 성과 대부분이 상담·MOU 단계인 만큼, 실제 계약 이행과 통관·인증 절차까지 원활히 마무리되는지는 계속 지켜볼 필요가 있습니다.`,
    source:`비즈니스코리아`, url:`https://www.businesskorea.co.kr/news/articleView.html?idxno=277477` },
  { cat:`kr`, date:`2026.09.03~09.06 개최`, title:`K-프리미엄 소비재전 자카르타 개최...200개사 참가`,
    desc:`한국무역협회(KITA)와 코엑스가 9월 3일부터 6일까지 나흘간 인도네시아 자카르타 JICC 전시장에서 올해로 8회째를 맞는 '2026 자카르타 K-프리미엄 소비재전'을 개최했습니다. 'K-할랄·K-소비재'를 주제로 국내 식품·뷰티·리빙 분야 기업 약 200개사가 300개 부스 규모로 참가했고, 인도네시아와 말레이시아 현지 바이어 330여개사가 방문해 총 1100건의 수출상담이 이뤄졌습니다. 인도네시아는 약 2억9000만 인구 가운데 87%가 무슬림인 세계 최대 규모의 할랄 소비시장으로 꼽히며, 특히 올해 들어 할랄 인증 관련 규제가 새롭게 강화되면서 국내 기업들의 관심이 한층 커진 것으로 나타났습니다. 행사장에서는 팝업스토어를 함께 운영해 국내 소비재 기업 20개사의 제품을 현장에서 실제로 판매하며 현지 소비자 반응을 직접 확인하고, 향후 정식 입점 가능성을 타진하는 기회로 활용했습니다. 개막일에는 한류 스타 팬미팅, 폐막 무렵에는 현지 뮤지션 공연 등 한류 콘텐츠를 접목한 부대행사도 함께 열려 현지 소비자와 바이어들의 관심을 끌었습니다. 이번 행사는 코로나19 이후 위축됐던 한국 소비재의 동남아 수출이 할랄 인증 대응력 강화와 함께 다시 활기를 띠고 있음을 보여주는 사례로 평가됩니다. 인도네시아에서 식품·뷰티·생활용품 등을 취급하거나 향후 진출을 검토 중인 PT PMA라면, 이번 행사에 참가한 기업들의 현지 유통 파트너십 체결 소식과 할랄 인증 대응 사례를 참고할 만하며, 내년도 같은 행사 참가나 협력 기회를 미리 검토해볼 수 있습니다.`,
    source:`헤럴드경제`, url:`https://biz.heraldcorp.com/article/10862071` },
  { cat:`kr`, date:`2026.08.24 계약체결`, title:`롯데GRS 엔제리너스, 인니 커피프랜차이즈 진출`,
    desc:`롯데GRS가 8월 24일 서울 잠실 롯데월드타워에서 인도네시아 유통·F&B 전문기업 보가자야그룹과 커피 브랜드 '엔제리너스'의 마스터 프랜차이즈(MF) 계약을 체결하며 인도네시아 시장 첫 진출을 공식화했습니다. 롯데GRS는 보가자야그룹이 그동안 공항 내 매장 운영에서 쌓아온 경험을 활용해, 연내 자카르타 수카르노하타 국제공항에 인도네시아 1호점을 여는 것을 목표로 하고 있습니다. 이후에는 공항 매장을 발판 삼아 주요 쇼핑몰과 랜드마크 상권으로 출점을 확대해, 향후 5년 안에 인도네시아 내 매장을 총 10개까지 늘린다는 중장기 목표를 제시했습니다. 이번 진출은 엔제리너스뿐 아니라 이디야, 더벤티 등 국내 주요 커피 프랜차이즈들이 성장 잠재력이 큰 동남아시아 시장 공략에 잇따라 나서고 있는 흐름과 궤를 같이합니다. 인도네시아는 젊은 인구 비중이 높고 카페 문화가 빠르게 확산되고 있어, 스타벅스·현지 로컬 브랜드와 함께 한국계 커피 프랜차이즈들도 새로운 성장 시장으로 주목하고 있는 곳입니다. 롯데GRS는 직접 진출 대신 현지 사정에 밝은 보가자야그룹과의 마스터 프랜차이즈 방식을 택해 초기 리스크를 낮추고 현지화 속도를 높이는 전략을 취한 것으로 풀이됩니다. 자카르타에서 카페·F&B 비즈니스를 운영 중이거나 준비 중인 한국계 PT PMA 입장에서는, 이 같은 마스터 프랜차이즈 진출 모델과 공항·쇼핑몰 등 입지 전략이 현지 프랜차이즈 파트너십을 검토할 때 참고할 만한 사례가 될 수 있습니다. 실제 1호점 오픈 시점과 초기 반응은 연말께 구체적으로 확인될 것으로 보입니다.`,
    source:`헤럴드경제`, url:`https://biz.heraldcorp.com/article/10851074` },
];

function renderNews(lang){ const t = T[lang].news; return `
${siteHeader('news', lang)}
${pageHero('news','gold', lang, t.pageEyebrow, t.pageTitle, t.pageDesc)}
<section class="section">
  <div class="wrap">
    <div class="grid-3">
      <div class="news-card">
        <div class="news-ph">${ph(t.c1ph,'coffee')}</div>
        <div class="news-body"><span class="date">${t.c1date}</span><h4>${t.c1title}</h4><p>${t.c1desc}</p></div>
      </div>
      <div class="news-card">
        <div class="news-ph">${ph(t.c2ph,'green')}</div>
        <div class="news-body"><span class="date">${t.c2date}</span><h4>${t.c2title}</h4><p>${t.c2desc}</p></div>
      </div>
      <div class="news-card">
        <div class="news-ph">${ph(t.c3ph,'navy')}</div>
        <div class="news-body"><span class="date">${t.c3date}</span><h4>${t.c3title}</h4><p>${t.c3desc}</p></div>
      </div>
    </div>
    <div class="nl-panel">
      <div class="nl-head">
        <div>
          ${eyebrow(t.nlEyebrow)}
          <h3>${t.nlTitle}</h3>
          <p>${t.nlDesc}</p>
        </div>
        <span class="nl-period">${NEWSLETTER_PERIOD}</span>
      </div>
      <div class="nl-list">
        ${NEWSLETTER_ITEMS.map((n,i)=>{ const c = NL_CATS[n.cat]; return `
        <div class="nl-item">
          <div class="nl-rank">${i+1}</div>
          <div class="nl-body">
            <div class="nl-top"><span class="badge-pill ${c.theme}"><span class="dot"></span>${c.label}</span></div>
            <h4>${n.title}</h4>
            <p>${n.desc}</p>
            <div class="nl-meta">
              <span>${n.date}</span><span class="dot-sep"></span><span>${n.source}</span><span class="dot-sep"></span>
              <a class="nl-src" href="${n.url}" target="_blank" rel="noopener noreferrer">${t.nlSrcLabel}${icon('arrowRight',13)}</a>
            </div>
          </div>
        </div>`; }).join('')}
      </div>
      <p class="nl-note">${t.nlNote}</p>
    </div>
  </div>
</section>
${siteFooter(lang)}`; }

function renderCurrentPage(){
  document.documentElement.lang = currentLang;
  document.title = DOC_TITLE[currentLang] || DOC_TITLE.en;
  app.innerHTML = renderNews(currentLang) + fab(currentLang);
  window.scrollTo(0,0);
}
renderCurrentPage();
</script>
