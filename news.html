  { cat:`reg`, date:`2026.07.21`, title:`인도네시아 국제금융센터(IFC) 설립법, 의회 통과`,
    desc:`인도네시아 국회가 지난 7월 21일 국제금융센터(IFC) 설립법을 통과시켰습니다. 이 법은 상업은행, 투자은행, 자산운용사, 항공기·선박 리스사 등 글로벌 금융기업을 인도네시아로 유치하기 위한 특별경제구역 성격의 법안입니다. 핵심 인센티브는 최대 50년간의 법인세 감면으로, 기존 조세제도와 별도로 운영되는 파격적인 수준입니다. 역외 자금 유치를 위해 센터 내에서는 루피아가 아닌 외화(달러 등) 사용도 허용됩니다. 분쟁이 발생할 경우를 대비해 전담 중재기구와 특별법원을 별도로 설치하는 점도 눈에 띕니다. 의회 재정위원회 부위원장은 법안 통과 당시 "전 세계 부유층 자산의 약 65%가 새로운 거처를 찾고 있다"고 언급하며, 이번 법을 통해 약 3.2조 달러 규모의 글로벌 자산을 유치하겠다는 목표를 제시했습니다. 다만 정부는 아직 센터가 들어설 구체적 위치를 확정하지 않았고, 발리가 유력 후보지 중 하나로 거론되는 단계입니다. 시행령과 세부 인센티브 규정이 뒤따라야 실제 효력이 발생하므로 후속 법령 발표를 지켜볼 필요가 있습니다. PT PMA 입장에서는 직접적인 대상은 아니지만, 국내 금융시장 개방 속도와 외화 규제 완화 흐름을 가늠할 수 있는 신호로 참고할 만합니다. 향후 관련 업종(금융·자산관리·리스업) 투자를 고려 중이라면 시행 세칙을 눈여겨봐야 합니다.`,
    source:`The Edge Malaysia`, url:`https://theedgemalaysia.com/node/811487` },
  { cat:`reg`, date:`2026.05.13 시행`, title:`발리, PT PMA 저위험 업종 KBLI 신규 등록 전면 차단`,
    desc:`인도네시아 투자부가 지난 5월 13일부로 발리주 내 PT PMA의 저위험(Low-Risk) 및 중저위험(Lower-Medium-Risk) KBLI 업종에 대한 신규 활성화를 전면 차단했습니다. 이는 지난 2월 발리 투자허가청(DPMPTSP)이 로컬 상권을 잠식한다는 이유로 7개 KBLI 업종의 폐쇄를 중앙정부에 건의한 데 따른 후속 조치입니다. 그중 경영컨설팅업(KBLI 70209)은 국가 차원의 폐쇄 승인을 받아 OSS 시스템에서 신규 신청 자체가 거부되고 있습니다. DPMPTSP 청장 I Ketut Sukra Negara는 해당 업종들이 대규모 외국자본을 위한 취지가 아님에도 PT PMA가 이를 우회 진입 수단으로 악용해 왔다고 지적했습니다. 다행히 이미 발급된 기존 사업자의 NIB(사업자등록번호)는 그대로 유효해 소급 취소되지는 않습니다. 그러나 실제 영업 내용이 등록된 KBLI 업종과 일치하는지에 대한 현장 점검은 오히려 강화되는 추세입니다. 즉, 등록만 해두고 다른 사업을 영위하는 경우 적발 리스크가 커진 것입니다. 발리 지역에서 카페·컨설팅·소규모 서비스업 형태의 PT PMA를 운영 중이거나 설립을 검토 중인 한국 기업이라면 업종 분류를 다시 확인해야 합니다. 자카르타·자바 등 다른 지역은 이번 조치의 직접 대상이 아니지만, 지방정부 차원의 유사 규제가 확산될 가능성도 배제할 수 없어 예의주시할 필요가 있습니다.`,
    source:`XPND — Bali KBLI Closure 2026`, url:`https://xpnd.co.id/regulatory/bali-kbli-closure-2026/` },
  { cat:`econ`, date:`2026.07.22 발표`, title:`BI, 기준금리 5.75% 동결…환율 방어 우선`,
    desc:`인도네시아 중앙은행(BI)이 7월 21~22일 이틀간 열린 이사회에서 기준금리(BI-Rate)를 5.75%로 동결했습니다. 예금금리(Deposit Facility)는 4.75%, 대출금리(Lending Facility)는 6.50%로 각각 유지됐습니다. 중동發 지정학적 긴장 고조와 루피아 약세 압력이 겹치며 시장에서는 추가 25bp 인상 가능성을 상당 부분 반영하고 있었으나, BI는 예상을 깨고 동결을 택했습니다. 인플레이션은 6월 기준 3.34%로 5월 3.08%에서 상승해 정부 목표 범위(2026~2027년 2.5%±1%)의 상단에 근접한 상태입니다. 5월 기준 신용 성장률은 전년 대비 11.51%를 기록했고, BI는 올해 연간 신용 성장률을 8~12% 범위로 전망하고 있습니다. 유동성 공급을 위해 BI는 3·6·9·12개월 만기의 레포(repo) 경매 창구를 재개했으며, 기준통화(base money) 증가율을 10% 이상으로 유지하겠다는 방침도 밝혔습니다. 은행권의 해외자금조달 여력을 넓히기 위해 은행 자기자본 대비 해외자금조달한도(RPLN)를 기존 35%에서 40%로 상향하는 조치도 7월 1일부로 시행됐습니다. BI는 정책 결정 배경으로 중동 정세發 글로벌 불확실성과 함께, 배당금 해외송금·대외채무 상환 등 계절적 요인에 따른 외환 수요 증가를 주요 리스크로 꼽았습니다. PT PMA 입장에서는 금리 동결로 루피아 차입 비용 급등은 피했지만, 환율 변동성은 당분간 이어질 수 있어 외화 결제·송금 일정 관리에 유의할 필요가 있습니다.`,
    source:`Bank Indonesia 공식 보도자료`, url:`https://www.bi.go.id/en/publikasi/ruang-media/news-release/Pages/sp_2814226.aspx` },
  { cat:`econ`, date:`2026.1분기`, title:`1분기 GDP 전분기 대비 0.77% 역성장…정부는 연 5.4% 목표 유지`,
    desc:`인도네시아의 2026년 1분기 GDP가 전분기 대비 0.77% 감소하며 약 1년 만에 처음으로 분기 기준 역성장을 기록했습니다. 주된 원인은 정부 지출의 급격한 반전과 고정투자(설비·건설 투자)의 위축으로 분석됩니다. 다만 전년 동기 대비 기준으로는 여전히 플러스 성장을 유지하고 있어, 계절적 요인과 재정 집행 시차에 따른 일시적 조정이라는 해석도 나옵니다. 실제로 다른 실물지표들은 비교적 견조한 모습을 보였습니다. 2월 기준 대출 성장률은 전년 대비 9.37%로 전월(9.96%)보다 다소 둔화됐지만 여전히 견조한 수준이었고, BI는 연간 신용 성장률이 8~12% 범위에서 안정적으로 유지될 것으로 내다봤습니다. 같은 달 신차 판매는 전년 대비 12.2% 증가한 81,159대를 기록해 내수 소비 심리가 크게 위축되지는 않았음을 시사합니다. 상반기 비자 서비스 수입도 약 2조8,100억 루피아로 전년 동기 대비 6.4% 늘었습니다. 이런 엇갈린 지표 속에서도 정부는 2026년 연간 경제성장률 목표치 5.4%를 공식적으로 유지하고 있어, 하반기에 재정 집행 속도를 끌어올리는 경기 부양 기조로 전환할지가 관전 포인트입니다. PT PMA를 운영 중인 기업이라면 정부 조달·인프라 관련 매출 비중이 있을 경우 하반기 재정 집행 일정에 따른 매출 변동 가능성을 염두에 둘 필요가 있습니다.`,
    source:`Trading Economics`, url:`https://tradingeconomics.com/indonesia/gdp-growth` },
  { cat:`tip`, date:`2026.04.30 시행`, title:`아웃소싱(인력파견) 허용 업종 6개로 제한`,
    desc:`인도네시아 노동부가 2026년 4월 30일부로 시행한 Permenaker 7/2026 규정에 따라 인력파견(아웃소싱) 활용이 가능한 업종이 청소, 식음료(케이터링), 보안, 운전기사 및 직원수송, 운영지원 서비스, 광업·석유·가스·전력 분야 지원업무 등 6개로 명확히 제한됐습니다. 이전까지 폭넓게 활용되던 아웃소싱 인력 운용 관행에 제동이 걸린 셈입니다. 특히 건설·인테리어 관련 인력은 이번 허용 업종 목록에서 제외되어, 현장 인력을 아웃소싱 방식으로 조달해 온 제조·건설 관련 한국 기업들이 직접적인 영향을 받게 됐습니다. 새 규정은 모든 아웃소싱 계약에 대해 서면 작성과 정부 등록을 의무화하고, 계약서에 근로자 보호 조항(임금, 사회보장, 근로조건 등)을 명시하도록 요구합니다. 미준수 시에는 행정 제재가 부과될 수 있습니다. 다만 급격한 전환에 따른 충격을 완화하기 위해 2028년 4월 30일까지 2년간의 유예기간이 부여됐습니다. 더 주목할 부분은 7월 말 발표된 개정안으로, 허용 업종이 6개에서 4개로 한층 더 축소될 예정이라는 점입니다. 규제가 완화가 아닌 강화 방향으로 계속 움직이고 있다는 신호입니다. 아웃소싱 인력에 의존하는 구조를 가진 PT PMA는 직접고용 전환, 정규직 채용 확대, 또는 허용 업종 내 재조정 등 인력운영 구조를 지금 시점에서 재검토해야 하며, 현지 노무 전문가와 함께 유예기간 내 이행 계획을 수립하는 것이 바람직합니다.`,
    source:`전국인력신문`, url:`https://www.kjob.news/news/507669` },
  { cat:`tip`, date:`2025.10 시행`, title:`PT PMA 최소 납입자본금 25억 루피아로 인하…총투자액 요건은 별도`,
    desc:`인도네시아 투자부(BKPM)가 발령한 규정 5호(2025)가 지난해 10월 2일 시행되면서, PT PMA(외국인투자법인) 설립에 필요한 최소 납입자본금이 기존 100억 루피아에서 25억 루피아(약 15만 달러)로 75% 낮아졌습니다. 이는 인도네시아 정부가 외국인 투자 진입장벽을 낮춰 중소 규모 투자자까지 폭넓게 유치하려는 취지로 해석됩니다. 신규 설립 요건은 최소 주주 2인, 이사 1인 및 감독이사(커미셔너) 1인, 인도네시아 내 등록 사업장 주소, 공증된 정관(Deed of Incorporation) 등입니다. 등록 절차는 OSS-RBA(Online Single Submission) 시스템을 통해 진행되며 통상 4~6주가 소요됩니다. 여기서 반드시 유의해야 할 점은, 자본금 요건 완화가 사업 규모 요건 완화를 의미하지는 않는다는 것입니다. 토지·건물을 제외한 사업 총투자계획 규모는 여전히 100억 루피아를 초과해야 한다는 원칙이 그대로 유지되고 있습니다. 즉 설립 문턱은 낮아졌지만, 사업계획서(Rencana Investasi)상 제시해야 하는 실질 투자 규모 기준은 종전과 같습니다. 이 차이를 혼동해 자본금만 25억 루피아로 맞추고 사업계획을 축소해서 제출했다가 심사 단계에서 반려되는 사례가 실무에서 종종 발생하고 있어 주의가 필요합니다. 신규 법인 설립이나 증자를 준비 중인 한국 기업은 자본금과 총투자계획을 분리해서 검토하고, 필요하다면 현지 컨설팅펌을 통해 사업계획서 작성 단계부터 점검받는 것이 안전합니다.`,
    source:`Business Hub Asia`, url:`https://businesshubasia.com/indonesia-lowers-pt-pma-minimum-capital-to-idr-2-5-billion-what-it-means-for-investors-2/` },
  { cat:`tax`, date:`~10.15 마감`, title:`LKPM 투자실현보고, 3분기(7~9월)분 제출 준비`,
    desc:`인도네시아에서 사업을 영위하는 모든 PT PMA는 투자 규모나 업종에 관계없이 대규모 사업자로 분류되어, 분기마다 예외 없이 LKPM(Laporan Kegiatan Penanaman Modal, 투자실현보고)을 제출해야 합니다. 이 보고서는 OSS(Online Single Submission) 시스템을 통해 온라인으로 접수됩니다. 2026년 2분기(4~6월)분 LKPM은 7월 15일에 마감이 이미 지났으며, 다음 순서인 3분기(7~9월)분은 통상적인 분기별 제출 패턴에 따라 10월 1일부터 15일 사이에 제출해야 합니다. 보고서 작성 시 가장 중요한 부분은 투자 실적을 고정자본(Fixed Capital)과 운전자본(Working Capital) 두 항목으로 명확히 구분해 기재하는 것입니다. 고정자본에는 기계·설비, 생산시설, 건물 리노베이션 비용 등이 포함되고, 운전자본에는 급여, 임차료, 공과금 등 운영성 경비가 해당합니다. 두 항목을 혼동해서 기재하면 실사 과정에서 소명을 요구받을 수 있습니다. 보고 내용은 실제 투자 실현 금액을 기준으로 해야 하며, 사업계획서상 약속한 투자 규모와 지나치게 괴리되지 않도록 관리하는 것이 중요합니다. 정해진 기한 내 미제출 시에는 경고 조치를 시작으로 행정제재가 부과될 수 있으며, 이는 향후 사업 인허가나 확장 절차에도 불리하게 작용할 수 있습니다. 재무·총무 담당자는 매 분기 시작 직후부터 데이터를 정리해 마감일에 임박해 서두르지 않도록 사내 일정表를 미리 마련해 두는 것이 좋습니다.`,
    source:`BKPM 투자부 · Social Expat`, url:`https://www.socialexpat.net/indonesia-sets-july-15-deadline-for-foreign-investors-lkpm-reporting/` },
  { cat:`tax`, date:`역년 기준 4.30`, title:`법인세 연간신고(SPT Tahunan Badan), 회계연도 종료 후 4개월 이내`,
    desc:`PT PMA를 포함한 인도네시아 내 모든 법인은 회계연도 종료 후 4개월 이내에 법인세 연간신고(SPT Tahunan Badan)를 마쳐야 합니다. 대다수 기업이 채택하는 역년(1~12월) 결산 기준으로는 매년 4월 30일이 공식 마감일입니다. 신고 시에는 재무제표(법정 감사 대상 법인의 경우 감사보고서 포함), 세무조정계산서(fiscal reconciliation), 그리고 한 해 동안 납부한 각종 선납세액(원천징수세, 할부납부세 등) 내역을 함께 준비해야 합니다. 인도네시아의 현행 법인세율은 22%로, 이를 기준으로 최종 납부세액과 선납세액의 차액을 정산하게 됩니다. 놓치기 쉬운 부분은 이사(director)의 개인소득세 신고 의무입니다. NPWP(세금등록번호)를 보유한 이사는 별도로 개인소득세 연간신고(SPT Tahunan Orang Pribadi)를 제출해야 하며, 그 마감은 법인세 신고 마감보다 한 달 이른 3월 31일입니다. 즉 이사 개인 신고를 먼저 마친 뒤 법인 신고를 진행하는 순서로 일정을 짜야 합니다. 신고 지연이나 누락은 가산세와 벌금으로 이어질 뿐 아니라, 세무당국의 세무조사 대상으로 선정될 가능성도 높입니다. 회계연도가 역년과 다른 법인(예: 회계연도를 별도로 설정한 경우)은 마감일이 달라지므로 자사의 정관상 회계연도를 다시 한번 확인해야 합니다. 매년 초부터 현지 세무대리인과 함께 신고 일정을 사전 조율해 두는 것이 안전합니다.`,
    source:`Bali Accountants`, url:`https://baliaccountants.com/annual-tax-returns-in-indonesia-what-you-need-to-know/` },
  { cat:`kr`, date:`2026.06.11`, title:`KIND, 인도네시아 국부펀드 INA와 투자 포괄협정 체결`,
    desc:`한국해외인프라도시개발지원공사(KIND)가 지난 6월 11일 자카르타에 위치한 INA(인도네시아 투자관리기구) 본사에서 투자 포괄협정을 체결했습니다. INA는 인도네시아 정부가 지속가능한 경제성장과 전략산업 육성을 목표로 2021년 설립한 국부펀드로, 현재 운용자산 규모는 약 83억 달러에 달합니다. 이번 협정에 따라 양 기관은 공동펀드를 조성해 함께 투자에 나서기로 했으며, 이를 위한 투자협의체를 별도로 구성해 한국 기업들이 추진 중인 인도네시아 사업을 공동으로 검토하기로 했습니다. 협력 분야는 초기에는 인프라·도시개발에 초점을 맞추되, 점차 에너지 분야로도 확장해 나갈 계획입니다. KIND 사장은 협정 체결 자리에서 "인도네시아는 동남아시아 최대 규모의 인프라 시장 중 하나"라고 평가하며, 앞으로 세계 각국의 국부펀드와의 협력을 확대해 국내 기업의 해외 진출을 폭넓게 지원하겠다는 방침을 밝혔습니다. 이번 협정은 한국 기업 단독으로는 조달이 어려운 대규모 인프라 프로젝트에 INA의 현지 네트워크와 공동 투자재원을 활용할 수 있는 길을 열어준다는 점에서 의미가 큽니다. 다만 구체적인 개별 프로젝트나 펀드 규모는 아직 공개되지 않아, 후속 발표를 지켜볼 필요가 있습니다. 인프라·건설·도시개발·에너지 분야에서 인도네시아 진출을 검토 중인 한국 기업이라면 KIND를 통한 정보 창구 활용을 고려해볼 만합니다.`,
    source:`뉴스토마토`, url:`https://www.newstomato.com/ReadNews.aspx?no=1303688` },
  { cat:`kr`, date:`2026.08`, title:`KIND, 인니 국부펀드 다난타라와 폐기물에너지화(WtE) 사업 협력 모색`,
    desc:`KIND가 인도네시아의 또 다른 국부펀드인 다난타라(Danantara)와 맺은 인프라·도시개발 협력 관계를 발판 삼아, 폐기물을 전력으로 전환하는 WtE(Waste-to-Energy) 사업에 한국 기업의 참여를 모색하고 있습니다. WtE는 도시 폐기물을 소각하거나 처리하는 과정에서 발생하는 열·가스를 활용해 전력을 생산하는 환경·에너지 융합 사업으로, 인도네시아 대도시들이 겪고 있는 폐기물 처리 문제와 전력 수요 증가 문제를 동시에 해결할 수 있는 대안으로 주목받고 있습니다. 다난타라는 인프라·도시개발 협력을 매개로 이번 논의를 진행 중이며, KIND는 이를 계기로 협력 범위를 기존 인프라·도시개발에서 환경·에너지 분야로까지 넓혀가는 모습입니다. 아직 구체적인 사업지·사업자·투자 규모가 확정된 단계는 아니며, 참여를 희망하는 한국 기업을 발굴하고 사업성을 검토하는 초기 모색 단계로 파악됩니다. 다만 인도네시아 정부가 폐기물 관리와 신재생에너지 확대를 국가적 과제로 강조하고 있는 만큼, 관련 정책 지원이나 인센티브가 뒤따를 가능성도 있습니다. 환경설비, 소각로, 발전설비, 폐기물 수거·처리 관련 기술을 보유한 한국 기업이라면 KIND를 통한 사업 참여 가능성을 미리 타진해 보는 것도 좋은 전략이 될 수 있습니다. 향후 구체적인 사업 공고나 파트너사 모집 소식이 나오는지 지속적으로 확인할 필요가 있습니다.`,
    source:`더구루`, url:`https://www.theguru.co.kr/news/article.html?no=102918` },
];

function renderNews(lang){ const t = T[lang].news; return `
${siteHeader('news', lang)}
${pageHero('news','gold', lang, t.pageEyebrow, t.pageTitle, t.pageDesc)}
<section class="section">
  <div class="wrap">
    <div class="grid-3">
      <div class="news-card">
        <div class="news-ph">${ph(t.c1ph,'coffee')}</div>
        <div class="news-body"><span class="date">${t.c1date}</span><h4>${t.c1title}</h4><p>${t.c1desc}</p></div>
      </div>
      <div class="news-card">
        <div class="news-ph">${ph(t.c2ph,'green')}</div>
        <div class="news-body"><span class="date">${t.c2date}</span><h4>${t.c2title}</h4><p>${t.c2desc}</p></div>
      </div>
      <div class="news-card">
        <div class="news-ph">${ph(t.c3ph,'navy')}</div>
        <div class="news-body"><span class="date">${t.c3date}</span><h4>${t.c3title}</h4><p>${t.c3desc}</p></div>
      </div>
    </div>
    <div class="nl-panel">
      <div class="nl-head">
        <div>
          ${eyebrow(t.nlEyebrow)}
          <h3>${t.nlTitle}</h3>
          <p>${t.nlDesc}</p>
        </div>
        <span class="nl-period">${NEWSLETTER_PERIOD}</span>
      </div>
      <div class="nl-list">
        ${NEWSLETTER_ITEMS.map((n,i)=>{ const c = NL_CATS[n.cat]; return `
        <div class="nl-item">
          <div class="nl-rank">${i+1}</div>
          <div class="nl-body">
            <div class="nl-top"><span class="badge-pill ${c.theme}"><span class="dot"></span>${c.label}</span></div>
            <h4>${n.title}</h4>
            <p>${n.desc}</p>
            <div class="nl-meta">
              <span>${n.date}</span><span class="dot-sep"></span><span>${n.source}</span><span class="dot-sep"></span>
              <a class="nl-src" href="${n.url}" target="_blank" rel="noopener noreferrer">${t.nlSrcLabel}${icon('arrowRight',13)}</a>
            </div>
          </div>
        </div>`; }).join('')}
      </div>
      <p class="nl-note">${t.nlNote}</p>
    </div>
  </div>
</section>
${siteFooter(lang)}`; }

function renderCurrentPage(){
  document.documentElement.lang = currentLang;
  document.title = DOC_TITLE[currentLang] || DOC_TITLE.en;
  app.innerHTML = renderNews(currentLang) + fab(currentLang);
  window.scrollTo(0,0);
}
renderCurrentPage();
</script>
