  { cat:`reg`, date:`2026.11.06 시한`, title:`노동자보호법 서명 시한 11월6일, 미서명시 자동 발효`,
    desc:`인도네시아 하원(DPR)은 10월6일 본회의에서 노동자보호법(UU Pelindungan Ketenagakerjaan)을 의결했으나, 10월26일 현재까지 프라보워 수비안토 대통령의 서명이 이뤄지지 않아 노동계가 조속한 공포를 촉구하고 있습니다. 인도네시아 헌법에 따라 대통령은 법안 의결 후 30일 이내에 서명해야 하며, 이번 법안의 서명 시한은 11월6일로 임박했습니다. 노동조합총연맹(KSPSI) 안디 가니 네나 위아 회장은 대통령이 11월6일까지 서명하지 않더라도 법은 헌법상 절차에 따라 자동으로 효력을 갖게 된다고 밝혔습니다. 다만 그는 법안 전문이 아직 공식적으로 공개되지 않은 점을 지적하며, 서명이 지연될 경우 2027년으로 시행이 미뤄지거나 조항이 바뀔 수 있다는 우려를 거듭 제기했습니다. 이 법은 헌법재판소가 2023년 168/PUU-XXI/2023 결정을 통해 부여한 입법 시한(10월31일)에 앞서 통과된 것으로, 기존 일자리창출법(Cipta Kerja)에서 노동 조항을 분리해 별도 법으로 제정하라는 요구를 반영한 것입니다. 노동부는 공포 이후 1년의 전환 기간을 두고 2027년 중 본격 시행할 계획이라고 설명했습니다. KSPSI 등 노동계는 특히 2027년도 최저임금(UMP) 협상이 진행되는 가운데 이 법이 조속히 발효돼 임금 결정 과정에 반영돼야 한다고 주장하고 있습니다. 인력을 고용하고 있는 모든 PT PMA는 법안 공포 여부와 정확한 시행일을 관보(Lembaran Negara)나 노동부 공식 채널을 통해 11월 초 반드시 확인하고, 1년 전환 기간 중 발표될 시행령에 따라 근로계약·해고·퇴직금 관련 사내 규정을 정비할 준비를 시작해야 합니다.`,
    source:`Kompas.com`, url:`https://megapolitan.kompas.com/read/2026/10/26/15193781/kspsi-desak-uu-perlindungan-ketenagakerjaan-segera-berlaku-jangan-sampai` },
  { cat:`econ`, date:`2026.11.01 1단계 시행`, title:`BI, 지급준비율(GWM) 2단계 인하 11월 개시`,
    desc:`인도네시아 중앙은행(BI)은 10월20~21일 이사회 회의(RDG)에서 은행권 지급준비율(GWM)을 두 단계에 걸쳐 낮추기로 결정했습니다. 일반 상업은행(BUK)의 루피아 평균 GWM은 기존 9%에서 11월1일 8%로, 12월1일에는 7%로 추가 인하됩니다. 샤리아은행(BUS)과 샤리아사업부(UUS)의 GWM도 기존 7.5%에서 11월1일 6.5%로, 12월1일 5.5%로 함께 낮아집니다. BI는 이와 함께 거시건전성유동성인센티브(KLM) 한도를 12월1일부터 6%에서 5%로 축소하고, 같은 날부터 루피아 평균 GWM의 최대 5%에 대해 은행에 보상(remunerasi)을 지급하기로 했습니다. BI는 지급준비율 1%포인트 인하마다 은행권과 금융시장에 약 90조 루피아의 유동성이 추가로 공급될 것으로 추산했습니다. 이번 조치는 기준금리(BI Rate)를 5.75%로 다섯 번째 연속 동결한 것과 함께 발표됐으며, 금리 인상 대신 유동성 공급을 통해 신용 성장을 뒷받침하려는 전략으로 해석됩니다. BI는 2026년 전체 신용 성장률을 8~12% 수준으로 전망하고 있습니다. 달러화·루피아화 자금을 모두 운용하는 PT PMA는 거래 은행의 대출 여력이 확대되는 만큼 신규 투자금융 조달 여건이 다소 완화될 수 있다는 점을 참고할 수 있습니다. 다만 BI가 지급준비율 인하를 환율·물가 안정과 병행 관리하고 있는 만큼, 루피아 환율 변동성과 금리 동향을 함께 모니터링할 필요가 있습니다. 제조업·서비스업 PT PMA는 거래 은행에 운전자금·설비투자 대출 조건 재협상 여지가 있는지 12월 2단계 인하 이후 다시 확인해 보는 것이 좋습니다.`,
    source:`Bisnis.com`, url:`https://finansial.bisnis.com/read/20261021/11/2014488/suntik-likuiditas-perbankan-bi-turunkan-gwm-konvensional-jadi-7-dan-syariah-55` },
  { cat:`tip`, date:`2026.10.30 보도`, title:`2027년 최저임금 결정 일정 지연, 자카르타 논의 아직 시작 안 돼`,
    desc:`CNBC 인도네시아는 10월30일 수도 자카르타(DKI Jakarta)의 2027년도 지방최저임금(UMP) 인상 논의가 아직 시작되지 않았다고 보도했습니다. 노동부 장관 야시에를리는 2027년 UMP에 대한 초기 논의를 11월 마지막 주까지 노동부 차원에서 마무리하겠다는 목표를 제시했습니다. 다만 실제 최종 금액은 중앙정부가 아니라 각 주지사가 주별 임금위원회(Dewan Pengupahan Provinsi)의 권고를 반영해 결정하는 구조여서, 지역마다 발표 시점이 달라질 수 있습니다. 보도에 따르면 주별 최저임금(UMP)과 업종별 최저임금 발표 시한을 11월21일로 보는 자료가 있는 반면, 다른 자료는 지방정부별 UMK(시·군 최저임금) 발표 시한을 11월25일에서 11월30일 사이로 제시해 자료 간에도 다소 차이가 있습니다. 법적 근거는 2025년 제정된 정부규정(PP) 49/2025가 그대로 적용됩니다. 노동조합총연맹(KSPI)과 노동당은 앞서 7.5%에서 9.5% 수준의 인상을 요구했으며, 남수마트라주 임금위원회는 7~10% 인상을 제안한 것으로 전해졌습니다. 자카르타 등 다수 지역에서 논의가 본격화되지 않은 상태인 만큼, 실제 인상률과 발표 시점은 11월 한 달 동안 지역별로 유동적일 가능성이 큽니다. 인건비 비중이 높은 자카르타·서부자바 등지에 사업장을 둔 PT PMA는 11월 한 달간 해당 지역 주정부의 임금위원회 발표를 수시로 확인하고, 2027년도 인건비 예산안을 복수 시나리오로 준비해 둘 필요가 있습니다.`,
    source:`CNBC Indonesia`, url:`https://www.cnbcindonesia.com/news/20261030130804-4-780910/kenaikan-ump-2027-jakarta-belum-dibahas-kapan-diputuskan` },
  { cat:`reg`, date:`2026.10.06 의결`, title:`신 노동법, 기간제근로(PKWT) 최대 4년·퇴직금 신설`,
    desc:`10월6일 하원을 통과한 노동자보호법은 기간제 근로계약(PKWT)에 대한 규정을 기존보다 엄격하게 바꿨습니다. 콤파스(Kompas)에 따르면 최초 계약 기간은 최장 2년으로 제한되며, 이후 1년 단위로 최대 두 차례까지만 연장할 수 있어 전체 계약 기간은 최장 4년으로 묶이게 됩니다. 이는 계약 연장을 포함해 최장 5년까지 허용했던 기존 노동법 시행령(PP 35/2021)보다 짧아진 것입니다. 가장 큰 변화는 기간제 근로자에게도 처음으로 퇴직금(페상곤) 수급권이 명시적으로 인정됐다는 점입니다. 노동계 대표 사이드 이크발(KSPI·노동당)에 따르면 퇴직금은 근속 1년당 1개월치 임금으로 계산되며, 이에 따라 최장 계약자는 최대 4개월치 임금 상당의 퇴직금을 받을 수 있게 됩니다. 다만 이 수치는 노동계 발표를 인용한 것으로, 정확한 산정 공식은 법 전문과 시행령을 통해 재확인이 필요합니다. 용역(아웃소싱) 인력뿐 아니라 직접 고용한 기간제 근로자에게도 퇴직금 지급 의무가 확대되는 만큼, 생산직·사무직에 기간제 계약을 광범위하게 활용하는 PT PMA는 인건비 예산에 미치는 영향을 미리 추산해야 합니다. 노동부는 법 공포 후 1년의 전환 기간을 거쳐 시행한다고 밝혔으며, 세부 시행 방법은 추후 정부규정(PP)으로 구체화될 예정입니다. 기존에 5년 가까운 장기 PKWT 계약을 운용 중인 PT PMA는 계약 갱신 시점마다 4년 한도 초과 여부를 점검하고, 퇴직금 적립을 위한 재무 계획을 선제적으로 준비할 필요가 있습니다.`,
    source:`Kompas.com`, url:`https://money.kompas.com/read/2026/10/12/101300426/poin-penting-uu-ketenagakerjaan-baru-kontrak-maksimal-2-tahun-hingga-jaminan?page=all` },
  { cat:`econ`, date:`2026.10.19 폐막`, title:`TEI 2026 폐막, 거래 229.4억 달러로 목표 131% 초과`,
    desc:`인도네시아 무역부가 주최한 제41회 무역박람회(Trade Expo Indonesia, TEI 2026)가 10월14~18일 탕으랑에서 열린 뒤 10월19일 폐막했습니다. 무역부 장관 부디 산토소는 폐막사에서 이번 박람회의 거래 성사 규모가 약 229.4억 달러(약 414조 루피아)에 달해, 당초 목표였던 175억 달러의 131%를 넘어섰다고 밝혔습니다. 이 중 박람회 첫날 체결된 양해각서(MOU) 168건의 가치가 132억 달러로 전체의 약 58%를 차지한 것으로 집계됐습니다. 국가별로는 인도가 가장 큰 거래 상대국으로 집계됐고, 네덜란드도 상위권에 이름을 올렸습니다. 중소기업(UMKM)의 거래 성사액은 5억1,079만 달러로 전년 대비 약 7.6% 늘었으나, 전체 거래의 약 2.2%에 그쳐 비중은 여전히 작았습니다. 같은 기간 함께 열린 국내 식품박람회 '판간누사 엑스포'의 거래 잠재액 3억2,777만 달러도 전체 수치에 포함됐습니다. 다만 무역부가 발표한 수치는 최종 확정된 거래 실적이 아니라 '잠재 거래 가치'이므로, 실제 수출·계약 이행 여부는 추후 확인이 필요합니다. 인도네시아 수출 바이어 발굴이나 현지 유통망 구축을 검토하는 PT PMA는 이번 박람회에서 두드러진 인도·네덜란드 등 거래국 동향과 UMKM 참여 확대 추세를 참고해 자사 공급망·협력사 네트워크를 점검해볼 수 있습니다.`,
    source:`RCTI+`, url:`https://www.rctiplus.com/news/detail/idxchannel/5496814/lampaui-target--transaksi-trade-expo-indonesia--tei--2026-tembus-rp414-triliun` },
  { cat:`tip`, date:`2026.10.18 시행`, title:`식품·화장품 할랄 인증 의무화 전면 시행`,
    desc:`인도네시아 할랄제품보증청(BPJPH)은 식품·음료·도축물·화장품·의약품 등 일상 소비재에 대한 할랄 인증 의무화(Wajib Halal)가 10월18일부터 전면 시행됐다고 확인했습니다. 이는 2024년 정부규정(PP) 42/2024에 근거한 단계적 시행 계획의 마지막 단계로, 중소·마이크로 사업자(UMK)에 대한 유예 기간이 10월17일로 종료되면서 다음날부터 모든 사업자에게 일괄 적용됩니다. BPJPH 청장 하이칼 하산은 올해 6월 하원 상임위(Komisi VIII) 회의에서 추가 연기 없이 10월 시행을 그대로 밀고 나가겠다고 거듭 확인했으며, 9월 보도에서도 정부가 일정을 바꾸지 않을 것이라고 재확인했습니다. 할랄 인증을 받지 못한 제품은 할랄 표시가 없는 제품으로 취급돼 유통·판매 과정에서 회수 조치나 벌금 등 행정제재 대상이 될 수 있으며, 레스토랑·요식업의 경우 영업 일시정지로까지 이어질 수 있다고 보도됐습니다. 다만 제재는 처벌보다 계도 중심으로 단계적으로 적용될 방침이라고 BPJPH는 밝혔습니다. 정부는 약 50만~135만 개에 달하는 영세 UMKM을 대상으로 할랄 인증 비용을 무상 지원하는 프로그램도 함께 운영하고 있습니다. 수입 식품·화장품에도 동일하게 할랄 인증 의무가 적용되므로, 한국에서 원재료나 완제품을 수입해 유통하는 PT PMA는 공급업체의 할랄 인증 보유 여부를 즉시 재확인해야 합니다. 카페·레스토랑·식품가공업을 운영하는 PT PMA는 메뉴에 사용되는 원재료·소스까지 포함한 전체 공급망의 할랄 인증 현황을 점검하고, 미인증 품목이 있다면 BPJPH 인증 절차나 대체 공급처 확보를 서둘러야 합니다.`,
    source:`Kontan`, url:`https://industri.kontan.co.id/news/bpjph-tegaskan-tak-ada-lagi-penundaan-wajib-halal-oktober-2026` },
  { cat:`tax`, date:`2026.10.01 시행`, title:`Coretax SPT 정정 방식, '델타'에서 '교체'로 환원`,
    desc:`인도네시아 국세청(DJP)은 2026년9월28일 제정한 세무총국장규정(Perdirjen) PER-12/PJ/2026을 통해 10월1일부터 코어택스(Coretax) 상의 세금신고서(SPT) 정정 방식을 변경했습니다. 기존 PER-11/PJ/2025가 도입한 '델타' 방식(정정 전후 차이분만 반영)이 폐지되고, 이전에 사용되던 '교체' 방식, 즉 정정 신고서가 이전 신고서 전체를 대체하는 방식으로 환원됩니다. 이번 변경은 PPh 21·26 원천징수 신고, PPh 통합신고(Unifikasi), 부가가치세(PPN)·특별소비세(PPnBM) 신고뿐 아니라 법인·개인 SPT 연차신고(SPT Tahunan)에도 모두 적용됩니다. 정정 신고 시 시스템은 이전에 이미 이뤄진 납부액과 과다납부 환급액(SKPPKP 등)을 자동으로 함께 반영하도록 설계됐습니다. 예를 들어 과다납부액이 1억 루피아였다가 이후 2천만 루피아의 초과환급 결정을 받은 법인 납세자의 경우, 정정 시 이 두 금액이 함께 계산에 반영됩니다. 또한 과다납부금 처리 방식도 정정 신고를 통해 환급(restitusi)에서 차기 이월공제(kompensasi)로, 또는 그 반대로 변경할 수 있게 됐습니다. 다만 이 변경은 조세기본법(UU KUP) 129A조에서 정한 기한을 넘기지 않은 경우에만 허용됩니다. 새 규정은 2026년10월1일 이후 제출되는 2025년 과세연도 이후분 정정 신고에 적용되며, 그 이전에 이미 제출돼 처리 중인 정정 신고는 기존 PER-11/PJ/2025를 그대로 따릅니다. 연차 법인세 신고(SPT Tahunan Badan)를 정정할 일이 있는 PT PMA는 10월1일 이후 제출 건부터 '교체' 방식이 적용된다는 점을 숙지하고, 세무 담당자·회계사와 함께 정정 신고서 작성 시 이전 신고 전체 내용을 다시 검토해야 합니다.`,
    source:`DJP(pajak.go.id)`, url:`https://pajak.go.id/en/node/120654` },
  { cat:`tax`, date:`2026.10.02 시행`, title:`PMK 71/2026, 조세 이의신청·제재 규정 개정`,
    desc:`인도네시아 재무부는 9월29일 재무부규정(PMK) 71/2026을 제정해 10월2일부터 시행에 들어갔습니다. 이번 규정은 기존 PMK 118/2024를 개정한 것으로, 세금 이의신청(keberatan) 및 제재(sanksi) 관련 행정 절차를 보완하는 내용을 담고 있습니다. 대표적으로 토지·건물세 중 농장·임업·광업 부문 세목인 PBB-P5L에 대한 벌금 감면 또는 면제 신청 제도가 새로 도입됐습니다. 해당 감면 신청은 PMK 71/2026 시행일로부터 2년 이내에 제기할 수 있도록 기한이 정해졌습니다. 이와 함께 세금 납부액을 과세평가서(SKP)·세금청구서(STP) 등에 먼저 반영하는 산정 순서를 규정한 조세기본법 시행세칙 23조 6·7·9항도 함께 손질됐습니다. 이는 이의신청이나 정정 과정에서 이미 납부된 금액이 본세(pokok pajak)에 우선 반영되도록 명확히 한 것으로 풀이됩니다. 이번 개정은 올해 DJP가 잇따라 내놓은 세무대리인(쿠아사 와집 파작) 자격 요건 강화(PMK 44/2026, PMK 55/2026) 등 일련의 행정 정비 작업의 연장선으로 평가됩니다. 플랜테이션·임업·광업 분야에 토지를 보유한 PT PMA는 PBB-P5L 관련 과거 제재가 있었다면 이번 감면 제도를 활용할 수 있는지 2년의 신청 기한 내에 검토해볼 필요가 있습니다. 다른 업종의 PT PMA라도 세금 이의신청이나 정정 절차를 진행 중이라면, 납부액 반영 순서가 달라진 점을 세무 대리인과 함께 다시 확인하는 것이 안전합니다.`,
    source:`DDTCNews`, url:`https://news.ddtc.co.id/berita/infografis/1823321/enam-poin-perubahan-ketentuan-pajak-dalam-pmk-712026` },
  { cat:`kr`, date:`2026.10.13 출범`, title:`신한금융, 한국계 최초로 인니 금융지주사 출범`,
    desc:`신한금융그룹은 10월13일 현지시간 자카르타에서 열린 출범식을 통해 '신한금융그룹인도네시아(Shinhan Financial Group Indonesia)'를 공식 출범시켰다고 밝혔습니다. 코리아타임스에 따르면 이는 한국 금융그룹이 인도네시아에 현지 금융지주회사 구조를 세운 첫 사례입니다. 이번 개편으로 신한인도네시아은행(Bank Shinhan Indonesia)은 기존 은행업을 유지하면서 동시에 현지 계열사들을 거느리는 사업지주회사 겸 금융지주회사 역할을 맡게 됩니다. 신한인도네시아은행은 신한카드와 신한투자증권으로부터 신한인도파이낸스(Shinhan Indo Finance)와 신한증권인도네시아(Shinhan Sekuritas Indonesia)의 지배지분(각 50%+1주)을 넘겨받아 자회사로 편입했습니다. 이번 구조 개편은 2024년12월 인도네시아 금융당국이 일정 규모 이상의 금융그룹에 현지 금융지주사 설립을 의무화한 규정에 따른 것으로, 인도네시아 금융당국은 2025년9월 신한 측의 지주사 전환 계획을 승인했습니다. 진옥동 신한금융그룹 회장을 비롯한 그룹 주요 경영진과 현지 금융당국 관계자들이 출범식에 참석한 것으로 전해졌습니다. KB금융그룹과 하나금융그룹 등 다른 한국계 금융그룹도 비슷한 현지 지주회사 전환을 추진 중인 것으로 알려져, 인도네시아 내 한국계 금융사의 현지화 경쟁이 본격화되는 양상입니다. 인도네시아에서 금융 서비스를 이용하거나 자금 조달을 검토하는 PT PMA는 신한 계열의 은행·카드·증권 서비스가 하나의 지주 구조 아래 통합 운영되면서 종합금융서비스 접근성이 높아질 수 있다는 점을 참고할 수 있습니다.`,
    source:`The Korea Times`, url:`https://www.koreatimes.co.kr/business/banking-finance/20261013/shinhan-becomes-1st-korean-financial-group-to-establish-holding-company-in-indonesia` },
  { cat:`kr`, date:`2026.10.26 보도`, title:`한국의 바탐 투자, 전년 대비 34배 급증한 1.175조 루피아`,
    desc:`자카르타포스트는 10월26일 바탐경제특구청(BP Batam)이 집계한 자료를 인용해 2026년 상반기 한국의 바탐(Batam) 투자 실현액이 약 6,510만 달러(약 1조1,750억 루피아)에 달해 한국이 바탐 내 3위 외국인 투자국으로 올라섰다고 보도했습니다. 이는 바탐 전체 외국인투자의 약 6.6%에 해당하는 규모입니다. BP Batam은 이 수치가 투자조정청(BKPM)의 투자활동보고(LKPM) 자료를 근거로 한 것이라고 밝혔으며, 이는 2025년 한 해 실현액(약 344억1천만 루피아)의 약 34배에 달하는 급증세라고 설명했습니다. 2025년 한국 자본은 주로 수산업, 운송장비, 기계·전자, 화학·제약 분야에 투입됐습니다. BP Batam의 투자담당 부청장 파리 제미 프란시스는 10월21일 서울에서 열린 '코리아 에어로 서밋 2026'에 참석하고 주한인도네시아대사관 관계자들과 면담하며 바탐 투자 유치 활동을 벌였습니다. 이 자리에서 바탐 측은 확장 가능성이 있는 한국 기업을 발굴해 비즈니스 미팅을 중개하고, 잠재 투자자들의 바탐 현지 방문을 유도하는 데 주력했다고 전해졌습니다. BP Batam은 바탐이 자유무역지대(FTZ)이며 4개의 경제특구(KEK)와 31개 산업단지를 갖추고 있다는 점을 투자 유치 포인트로 제시하고 있습니다. 바탐 지역에 생산기지나 물류거점을 검토하는 한국 기업 및 PT PMA는 자유무역지대로서의 관세·통관 혜택과 기존 한국계 투자 업종의 집적 효과를 함께 참고할 수 있습니다.`,
    source:`The Jakarta Post`, url:`https://www.thejakartapost.com/business/2026/10/26/south-korean-investment-in-batam-reaches-us65-1-million-as-bp-batam-seeks-opportunities` },
];

function renderNews(lang){ const t = T[lang].news; return `
${siteHeader('news', lang)}
${pageHero('news','gold', lang, t.pageEyebrow, t.pageTitle, t.pageDesc)}
<section class="section">
  <div class="wrap">
    <div class="grid-3">
      <div class="news-card">
        <div class="news-ph">${ph(t.c1ph,'coffee')}</div>
        <div class="news-body"><span class="date">${t.c1date}</span><h4>${t.c1title}</h4><p>${t.c1desc}</p></div>
      </div>
      <div class="news-card">
        <div class="news-ph">${ph(t.c2ph,'green')}</div>
        <div class="news-body"><span class="date">${t.c2date}</span><h4>${t.c2title}</h4><p>${t.c2desc}</p></div>
      </div>
      <div class="news-card">
        <div class="news-ph">${ph(t.c3ph,'navy')}</div>
        <div class="news-body"><span class="date">${t.c3date}</span><h4>${t.c3title}</h4><p>${t.c3desc}</p></div>
      </div>
    </div>
    <div class="nl-panel">
      <div class="nl-head">
        <div>
          ${eyebrow(t.nlEyebrow)}
          <h3>${t.nlTitle}</h3>
          <p>${t.nlDesc}</p>
        </div>
        <span class="nl-period">${NEWSLETTER_PERIOD}</span>
      </div>
      <div class="nl-list">
        ${NEWSLETTER_ITEMS.map((n,i)=>{ const c = NL_CATS[n.cat]; return `
        <div class="nl-item">
          <div class="nl-rank">${i+1}</div>
          <div class="nl-body">
            <div class="nl-top"><span class="badge-pill ${c.theme}"><span class="dot"></span>${c.label}</span></div>
            <h4>${n.title}</h4>
            <p>${n.desc}</p>
            <div class="nl-meta">
              <span>${n.date}</span><span class="dot-sep"></span><span>${n.source}</span><span class="dot-sep"></span>
              <a class="nl-src" href="${n.url}" target="_blank" rel="noopener noreferrer">${t.nlSrcLabel}${icon('arrowRight',13)}</a>
            </div>
          </div>
        </div>`; }).join('')}
      </div>
      <p class="nl-note">${t.nlNote}</p>
    </div>
  </div>
</section>
${siteFooter(lang)}`; }

function renderCurrentPage(){
  document.documentElement.lang = currentLang;
  document.title = DOC_TITLE[currentLang] || DOC_TITLE.en;
  app.innerHTML = renderNews(currentLang) + fab(currentLang);
  window.scrollTo(0,0);
}
renderCurrentPage();
</script>
</body>
</html>
