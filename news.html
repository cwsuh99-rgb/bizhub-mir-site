  { cat:`reg`, date:`2026.08 준비중`, title:`2026년 조세감면(택스홀리데이) 연장…글로벌최저한세 정합 추진`,
    desc:`인도네시아 재무부가 조세감면(Tax Holiday) 인센티브를 2026년에도 연장하기 위한 새 재무부령(PMK) 제정을 준비하고 있습니다. 현행 조세감면 제도는 PMK 69/2024호에 근거하며 2025년 12월 만료를 앞두고 있어, 투자 모멘텀 단절을 막기 위해 후속 규정이 시급한 상황입니다. 기존 제도는 파일럿(선도) 산업 또는 경제특구(KEK)·신수도 누산타라(IKN) 등 전략지역에 최소 1000억 루피아(약 600만 달러) 이상을 신규 투자하는 법인에 대해 법인세를 최대 100% 감면해 주는 내용입니다. 감면 대상 업종에는 제약, 전기차, 석유화학, 로봇공학, 신재생에너지 등이 포함되며, 투자 규모에 따라 5년에서 최장 20년까지 세제 혜택이 부여됩니다. 이번 개정의 핵심 배경은 OECD가 주도하는 글로벌 최저한세(Global Minimum Tax, 필라2) 규범입니다. 필라2 규범 하에서는 인도네시아가 감면해 준 세액을 투자자 본국이 대신 추가 과세할 수 있어, 자칫 인도네시아의 재정 혜택이 고스란히 해외로 이전될 위험이 있습니다. 이에 재무부는 세제 혜택의 실효성을 유지하면서도 필라2 규범과 충돌하지 않도록 제도를 재설계하는 작업을 진행 중입니다. 구체적인 신규 PMK의 발효 시점과 세부 조건은 아직 확정 발표되지 않았습니다. 대규모 신규 투자나 증설을 계획 중인 PT PMA, 특히 제조업·에너지 분야 한국 기업은 조세감면 신청 시점을 신규 PMK 발효 이후로 조정하거나, 현지 세무 전문가를 통해 필라2 적용 여부를 사전에 점검할 필요가 있습니다.`,

  { cat:`reg`, date:`2026.08.10 현재`, title:`국부펀드 다난타라, 증권거래소(IDX) 지분 인수 추진`,
    desc:`인도네시아 국부펀드 다난타라(Danantara)가 인도네시아증권거래소(IDX)의 주식회사 전환(demutualization) 과정에서 지분 인수를 추진하고 있다고 8월 10일 밝혔습니다. 이번 demutualization은 2026년 제정된 금융부문 개발·강화법(P2SK법, Law No. 4/2026)에 근거해 추진되는 것으로, 회원제 협동조합 형태였던 IDX를 주식회사 구조로 전환하는 작업입니다. 다난타라는 자회사인 PT Danantara Investment Management를 통해 지분을 인수할 계획이며, 구체적인 인수 지분율은 아직 확정되지 않아 추후 발표될 예정입니다. IDX 측은 이번 demutualization 과정에서 다난타라 외에도 여러 잠재 투자자들의 관심을 받고 있다고 밝혔습니다. 다난타라는 이와 별도로 향후 6~12개월 내에 여러 국영기업(SOE)의 기업공개(IPO)도 추진하겠다는 계획을 발표한 바 있습니다. 이는 다난타라가 단순 국부펀드를 넘어 인도네시아 자본시장 구조 자체에 직접 관여하는 핵심 플레이어로 부상하고 있음을 보여줍니다. 거래소 지배구조 변화는 상장 절차, 공시 규정, 시장감독 체계에도 연쇄적 영향을 줄 수 있어 자본시장 접근을 고려하는 외국 기업들은 예의주시할 필요가 있습니다. 다만 8월 중순 현재까지는 지분 인수가 공식 완료된 단계는 아니며, 규제당국 승인 등 후속 절차가 남아 있습니다. 인도네시아 증시 상장이나 M&A를 검토 중인 PT PMA라면 IDX 지배구조 개편이 상장 규정이나 심사 절차에 미칠 영향을 지속적으로 확인해야 합니다.`,
    source:`ANTARA News`, url:`https://en.antaranews.com/news/426416/danantara-prepares-to-acquire-shares-in-indonesia-stock-exchange` },
  { cat:`econ`, date:`2026.08.07`, title:`다난타라, 브라질 JBS와 25억 달러 단백질 합작사 설립`,
    desc:`인도네시아 국부펀드 다난타라가 지난 8월 7일(금) 세계 최대 육류가공업체인 브라질 JBS와 25억 달러 규모의 합작법인(JV) 설립에 합의했다고 JBS 측이 발표했습니다. 다난타라는 계약 종결 시점에 8억 달러를 우선 납입하고, 나머지 17억 달러는 향후 3년에 걸쳐 순차 납입할 예정입니다. 다난타라는 이번 합작법인의 지분 25%를 보유하게 되며, 합작법인에는 JBS의 기존 호주·뉴질랜드 사업이 포함됩니다. 신설 합작법인은 동남아시아, 호주, 뉴질랜드 지역의 단백질(육류) 판매 사업에 주력할 계획입니다. 합작법인은 이와 별도로 최대 25억 달러 규모의 은행 추가 대출 한도도 확보했으며, 조달 자금은 인도네시아·동남아·호주·뉴질랜드 지역의 인수합병 및 신규 설비투자(그린필드)에 사용될 예정입니다. 양측은 계약 체결 후 6년 이내 기업공개(IPO)를 추진하겠다는 목표도 함께 밝혔으며, 만약 IPO가 성사되지 않을 경우 다난타라는 일정 조건 하에 JV 지분을 JBS 본사 지분으로 교환할 권리를 갖게 됩니다. 이번 발표 직후 뉴욕 증시에서 JBS 주가는 한때 4.3%까지 상승했습니다. 이는 다난타라가 자원·에너지 중심이던 기존 투자 포트폴리오를 식품·단백질 산업으로 확장하는 신호로 해석됩니다. 인도네시아 식품가공, 축산, 콜드체인 물류 분야에 관심 있는 한국 기업이라면 향후 합작법인의 구체적 투자 계획과 협력사 모집 소식을 주시할 필요가 있습니다.`,
    source:`Asia Asset Management`, url:`https://www.asiaasset.com/sovereign-wealth-fund/indonesia-wealth-fund-danantara-invests-us2-5-billion-for-25-in-joint-venture-with-brazil-meat-processor-jbs/` },
  { cat:`tip`, date:`2025.10.02 시행 · 계속 적용`, title:`PT PMA 납입자본금, 예치 후 12개월간 인출 제한`,
    desc:`인도네시아 투자부 규정 5호(2025)에 따라 PT PMA 설립 시 예치하는 납입자본금(25억 루피아 이상)에 새로운 12개월 락업(lock-up) 규정이 적용되고 있습니다. 이 규정은 지난해 10월 2일 시행된 이후 계속 유효하며, 최소 납입자본금이 기존 100억 루피아에서 25억 루피아로 인하된 조치와 함께 도입됐습니다. 핵심 내용은 회사 은행계좌에 예치된 납입자본금을 예치일로부터 최소 12개월간 계좌 밖으로 이체하거나 인출할 수 없다는 것입니다. 다만 모든 인출이 전면 금지되는 것은 아니며, 자산 구매, 건물 신축·인테리어 공사비, 검증 가능한 운영비 지출 등 실제 사업 운영 목적의 사용은 예외적으로 허용됩니다. 즉 계좌에 자본금을 넣어두고 곧바로 모회사나 개인 계좌로 재이체하는 방식의 편법 설립은 원천적으로 차단된 셈입니다. 이는 자본금 요건 완화가 자칫 페이퍼 컴퍼니식 설립 남발로 이어지지 않도록 하려는 투자부의 견제 장치로 해석됩니다. 이미 기존에 발급된 라이선스를 보유한 회사는 일반적으로 갱신 시점까지 신규 요건 적용을 유예받는 경과조치(grandfathering) 원칙이 적용됩니다. 신규로 PT PMA를 설립하거나 증자를 계획 중인 한국 기업은 초기 자본금을 예치한 뒤 최소 1년간은 해당 자금이 묶인다는 점을 자금 계획에 반드시 반영해야 합니다. 특히 초기 운영자금을 별도로 확보하지 않고 납입자본금에만 의존해 설립을 준비하는 경우, 락업 기간 중 유동성 부족에 처할 수 있어 법인 설립 전 현지 회계·법무 자문을 통해 자본금 사용 계획과 운영비 조달 방안을 미리 구분해 설계하는 것이 안전합니다.`,
    source:`Herbert Smith Freehills Kramer`, url:`https://www.hsfkramer.com/insights/2025-11/new-indonesian-investment-rules-2025` },
  { cat:`tip`, date:`2026.01 회람 발령`, title:`외국인력 활용계획(RPTKA) 절차, 회람으로 일부 간소화`,
    desc:`인도네시아 노동부(Kemnaker)가 외국인력 활용계획(RPTKA, Rencana Penggunaan Tenaga Kerja Asing) 심사 절차를 정비하기 위해 회람(Surat Edaran) 제3/836/PK.04/I/2026호를 발령해 시행하고 있습니다. RPTKA는 정부 규정 34/2021에 근거해, 외국인을 채용하려는 모든 고용주가 사전에 노동부 승인을 받아야 하는 필수 절차입니다. 신청은 OSS-RBA(위험기반 온라인 단일창구) 시스템을 통해 이뤄지며, 승인 후에는 외국인력활용부담금(DKP-TKA)으로 외국인 1인당 월 100달러를 별도 납부해야 합니다. 이번 회람에서 특히 주목할 부분은 하나의 RPTKA를 여러 고용주가 공유하는 복수직위(multiple-position) 갱신 절차입니다. 두 번째, 세 번째 고용주가 갱신을 신청할 경우 주(主) 고용주로부터 받은 공식 승인서를 첨부해야 하며, 추가 고용주 각각도 자체 RPTKA를 별도로 보유해야 한다는 요건이 명확해졌습니다. 정부 규정 34/2021 제26조에 따라 외국인 근로자 1인마다 인도네시아인 상대 인력(tenaga kerja pendamping)을 배치해 기술·노하우 이전이 이뤄지도록 해야 하는 원칙도 그대로 유지됩니다. 노동부는 올해 초 RPTKA 미승인 상태로 외국인 164명을 근무시킨 한 기업에 21억7000만 루피아의 행정제재를 부과한 바 있어, 절차 위반 단속 강도는 오히려 강화되는 추세입니다. 한국인 주재원이나 기술직을 다수 채용 중인 PT PMA는 RPTKA 신규 신청 및 갱신 시 이번 회람의 서류 요건 변경 사항을 인사·총무팀에 사전 공유해야 합니다. 특히 그룹 계열사 간에 동일 인력을 공유해 활용하는 경우, 주 고용주 승인서 누락으로 갱신이 반려되지 않도록 미리 점검하는 것이 바람직합니다.`,
    source:`XPND`, url:`https://xpnd.co.id/regulatory/rptka-extension-2026-compliance/` },
  { cat:`tax`, date:`2025.01.01 시행 · 계속 적용`, title:`부가가치세(PPN), 사치품 12%·일반재화 11% 이원구조 유지`,
    desc:`인도네시아의 부가가치세(PPN, Pajak Pertambahan Nilai)는 법정 세율이 12%로 인상됐음에도 불구하고, 실제로는 일반 재화·용역에 대해 11%의 실효세율이 적용되는 이원적 구조로 운영되고 있습니다. 이는 법정 12% 세율에 11/12로 조정된 과세표준을 곱해 산출하는 방식으로, 결과적으로 실효세율이 종전과 동일한 11% 수준에 머무르도록 설계된 것입니다. 프라보워 수비안토 대통령이 2025년 1월 1일 시행을 불과 몇 시간 앞두고 이 같은 조정안을 발표하면서, 완전한 12% 세율은 사치품(luxury goods)에 대해서만 적용되는 것으로 최종 정리됐습니다. 국내 사업자는 연간 매출액 48억 루피아를 초과하는 시점부터 PPN 사업자등록 의무가 발생하며, 해외 디지털 사업자(PMSE)는 연매출 6억 루피아 또는 이용자 1만2000명을 초과하면 PMSE VAT Collector로 지정돼 자체적으로 세금을 징수·납부해야 합니다. 수출품은 영세율(0%)이 적용되고, 생필품·의료·교육·금융서비스는 면세 대상으로 분류됩니다. 소프트웨어 등 SaaS(서비스형 소프트웨어) 역시 PMSE 제도 하에서 실효세율 11%로 과세되며, 주요 글로벌 SaaS 업체 다수가 이미 조세청(DJP) 공식 징수의무자 명단에 등재돼 있습니다. PT PMA는 거래처와의 계약서·견적서에 PPN 세율을 재화 성격(일반 대 사치품)에 맞게 정확히 구분해 명시해야 하며, 오분류 시 가산세 부과나 매입세액 불공제 리스크가 있습니다. 한국 본사와의 거래나 SaaS 라이선스 계약이 있는 기업은 PMSE 징수의무자 지정 여부를 다시 한번 점검할 필요가 있습니다.`,
    source:`Atmo Tax Guide`, url:`https://tax.atmo.co.id/en/guide/vat-12-percent-guide-2026` },
  { cat:`tax`, date:`매월 15일 마감 · Coretax 필수`, title:`모든 법인 세무신고, 2026년부터 Coretax 시스템으로 일원화`,
    desc:`인도네시아 조세총국(DJP)이 기존 e-Faktur, e-SPT, e-Billing 등 개별적으로 운영되던 세무 시스템들을 지난해 12월 31일부로 전면 폐지하고, 이를 단일 플랫폼인 Coretax로 통합했습니다. 2026년부터는 부가가치세 세금계산서 발행, 원천세·법인세 신고, 세금 납부(e-Billing)까지 모든 절차가 Coretax 한 곳에서만 이뤄집니다. 특히 2025 회계연도(2025년 12월 31일 결산 법인)에 대한 법인세 연간신고(SPT Tahunan)부터 Coretax를 통한 제출이 의무화되어, 지난 4월 30일 마감된 신고 역시 이 시스템을 거쳐 처리됐습니다. Coretax의 가장 큰 변화는 실시간성입니다. 모든 결제, 세금계산서, 세무기록이 국세청의 납세자계정관리(Taxpayer Account Management) 원장을 통해 실시간으로 조회·대조되기 때문에, 기존처럼 사후 정산하던 관행이 사실상 상시 모니터링 체계로 전환됐습니다. 월별 세무 일정도 재무부령(PMK) 81/2024호에 따라 표준화되어, 원천세(PPh)와 부가가치세(PPN) 등 대부분의 정기 세목은 매달 다음 달 15일까지 신고·납부하는 것으로 통일됐습니다. 예를 들어 7월분 세금은 8월 15일까지 마감되며, 이번 주(8월 중순)는 바로 그 신고·납부 시한이 걸려 있는 시기입니다. Coretax 도입 초기 잦은 시스템 오류와 접속 지연으로 실무 현장의 혼란이 컸던 만큼, 마감일 임박 시 시스템 접속이 몰려 지연되는 상황에 대비해 미리 여유를 두고 신고를 완료하는 것이 안전합니다. 세무 담당자가 부재중이거나 교체된 PT PMA는 Coretax 계정 접근 권한(권한위임) 설정이 최신 상태인지도 함께 점검해야 합니다.`,
    source:`Acclime Indonesia`, url:`https://indonesia.acclime.com/news/coretax-mandate-corporate-fillings/` },
  { cat:`kr`, date:`2026.07.16 보도`, title:`KAI, 인도네시아에 KF-21 최대 48대 수출 협상 본격화`,
    desc:`한국항공우주산업(KAI)이 인도네시아 정부와 한국형 초음속 전투기 KF-21 보라매의 완제품 수출을 위한 실무 협상을 구체화하고 있다고 지난 7월 16일 보도됐습니다. KAI 유럽·중남미실장은 초도 물량 16대 도입을 두고 인도네시아 측과 깊이 있는 논의를 진행 중이며 최종적으로 총 주문량은 48대에 달할 수 있다고 밝혔습니다. 인도네시아는 그동안 KF-21 공동개발 파트너국 지위였으나, 재정난으로 인해 약속한 분담금 납부를 지연시켜 온 전력이 있습니다. 이번 협상 과정에서 방위사업청과 KAI는 인도네시아의 미납 분담금 규모를 기존 1조6000억원에서 6000억원으로 대폭 감액하는 데 최종 합의했습니다. 자카르타 당국의 당장의 자금 부담을 덜어주는 대신, 기술이전 항목과 공동 실무개발 범위를 축소 조정하는 방식으로 절충안이 마련된 것으로 알려졌습니다. 이는 인도네시아가 사실상 공동개발국에서 완제품 구매국(고객)으로 지위를 전환하는 흐름으로 해석됩니다. 업계에서는 이번 조정을 계기로 인도네시아와의 관계를 안정화하고, 향후 동남아·중남미 등 제3국 수출 협상에서도 KF-21의 실전 검증된 수출 실적으로 활용할 수 있을 것으로 기대하고 있습니다. 다만 계약 규모, 인도 시기, 최종 기종 사양 등 세부 조건은 아직 확정 발표되지 않아 추가 협상 결과를 지켜봐야 합니다. 방산·항공 관련 부품·정비(MRO) 협력사를 운영 중인 한국 기업이라면, 향후 KF-21 인도네시아 인도 일정에 맞춰 현지 정비 인프라나 부품 공급망 참여 기회를 미리 검토해볼 만합니다.`,
    source:`글로벌이코노믹`, url:`https://www.g-enews.com/article/Global-Biz/2026/07/202607160711167271fbbec65dfb_1` },
  { cat:`kr`, date:`2026.08.02 보도`, title:`포스코, 인도네시아 철강사업에 6.7조원 투자 확대`,
    desc:`포스코홀딩스가 지난 7월 30일 공개한 기업가치 제고 계획을 통해 미국, 인도와 함께 인도네시아를 해외 철강사업의 핵심 성장축으로 삼아 투자를 대폭 확대하겠다고 밝힌 소식이 8월 2일 상세 보도됐습니다. 포스코그룹은 2026년부터 2028년까지 총 29조1000억원을 투자할 계획이며, 이 중 해외 철강사업에는 가장 큰 규모인 6조7000억원을 배정했습니다. 목표는 현재 약 500만톤 수준인 해외 조강 생산능력을 2031년까지 1000만톤으로 두 배 확대하는 것입니다. 인도네시아에서는 2010년부터 현지 국영 철강사 크라카타우스틸과 합작해 운영해 온 크라카타우포스코(PT.KP)를 통해, 열연·후판 위주였던 생산 구조를 자동차 강판까지 아우르는 일관생산 체제로 확장할 계획입니다. 이는 동남아시아 최초로 쇳물 생산부터 자동차용 강판 생산까지 한 곳에서 처리하는 통합 생산기지를 인도네시아에 구축하겠다는 의미입니다. 이에 앞서 지난 4월에는 포스코홀딩스가 크라카타우포스코 2단계 사업을 위해 43억 달러 규모의 추가 투자를 추진한다는 소식도 전해진 바 있습니다. 크라카타우포스코는 2014년 말 준공 이후 연간 열연 150만톤, 후판 150만톤 규모의 생산·판매 체제를 유지해 왔습니다. 이번 증설이 완료되면 동남아 최대 자동차 시장 중 하나인 인도네시아 현지에서 완성차용 강판을 직접 조달할 수 있는 공급망이 구축되어, 현대차·LG에너지솔루션 등 이미 진출한 다른 한국 기업들과의 시너지도 기대됩니다. 철강·자동차부품·2차전지 소재 분야에서 인도네시아 현지 조달을 검토 중인 한국 기업이라면, 포스코의 증설 일정에 맞춰 협력사 등록이나 공급 계약 논의를 준비해볼 만합니다.`,
    source:`Daum(비즈360)`, url:`https://v.daum.net/v/20260802070216187` },
  { cat:`kr`, date:`2026 보도 · 진행중`, title:`SK이노베이션 등, 한·인니 국경간 CCS 프로젝트 공동연구`,
    desc:`SK이노베이션, SK어스온(자원개발 계열사), 미국 엑손모빌, 인도네시아 국영 에너지기업 페르타미나 4개사가 한국에서 배출된 이산화탄소를 포집해 인도네시아 아스리 분지(Asri Basin)의 탄소포집·저장(CCS) 허브로 운송·저장하는 국경 간(cross-border) 프로젝트의 사업 타당성 공동연구 협약을 체결했다고 보도됐습니다. 아스리 분지는 최대 30억 톤(3기가톤) 규모의 이산화탄소를 저장할 수 있는 잠재 용량을 보유한 것으로 평가받고 있습니다. CCS 허브 전체 개발에는 최대 20억 달러 규모의 투자가 필요할 것으로 추산되고 있어, 한국 기업들의 참여 방식과 지분 구조가 향후 관전 포인트입니다. 이 프로젝트는 한국 내 산업 부문 탄소배출을 국내에서 전량 처리하기 어려운 현실을 감안해, 인접국의 저장 용량을 활용하는 국경 간 CCS 협력 모델의 대표 사례로 주목받고 있습니다. 앞서 한국석유공사 역시 현대건설이 주관하는 동남아 해상 부유식 CCS 기술 연구에 페르타미나와 함께 참여하는 등, 한국 에너지·건설 기업들의 인도네시아 CCS 분야 진출이 다각도로 확대되는 추세입니다. 인도네시아 정부는 자국을 동남아 CCUS(탄소포집·활용·저장)의 최적지로 육성하겠다는 정책 방향을 밝혀 온 바 있어, 관련 인허가나 인센티브 제도가 향후 추가로 정비될 가능성이 있습니다. 아직 이번 협약은 사업 타당성 조사 단계로, 실제 투자 결정이나 최종 계약 체결까지는 추가 절차와 시일이 필요합니다. 정유·화학·건설·엔지니어링 분야에서 탄소중립 관련 신사업을 모색 중인 한국 기업이라면, 이번 협약을 계기로 형성되는 인도네시아發 CCS 밸류체인 참여 기회를 미리 살펴볼 만합니다.`,
    source:`더구루`, url:`https://www.theguru.co.kr/news/article.html?no=102198` },
];

function renderNews(lang){ const t = T[lang].news; return `
${siteHeader('news', lang)}
${pageHero('news','gold', lang, t.pageEyebrow, t.pageTitle, t.pageDesc)}
<section class="section">
  <div class="wrap">
    <div class="grid-3">
      <div class="news-card">
        <div class="news-ph">${ph(t.c1ph,'coffee')}</div>
        <div class="news-body"><span class="date">${t.c1date}</span><h4>${t.c1title}</h4><p>${t.c1desc}</p></div>
      </div>
      <div class="news-card">
        <div class="news-ph">${ph(t.c2ph,'green')}</div>
        <div class="news-body"><span class="date">${t.c2date}</span><h4>${t.c2title}</h4><p>${t.c2desc}</p></div>
      </div>
      <div class="news-card">
        <div class="news-ph">${ph(t.c3ph,'navy')}</div>
        <div class="news-body"><span class="date">${t.c3date}</span><h4>${t.c3title}</h4><p>${t.c3desc}</p></div>
      </div>
    </div>
    <div class="nl-panel">
      <div class="nl-head">
        <div>
          ${eyebrow(t.nlEyebrow)}
          <h3>${t.nlTitle}</h3>
          <p>${t.nlDesc}</p>
        </div>
        <span class="nl-period">${NEWSLETTER_PERIOD}</span>
      </div>
      <div class="nl-list">
        ${NEWSLETTER_ITEMS.map((n,i)=>{ const c = NL_CATS[n.cat]; return `
        <div class="nl-item">
          <div class="nl-rank">${i+1}</div>
          <div class="nl-body">
            <div class="nl-top"><span class="badge-pill ${c.theme}"><span class="dot"></span>${c.label}</span></div>
            <h4>${n.title}</h4>
            <p>${n.desc}</p>
            <div class="nl-meta">
              <span>${n.date}</span><span class="dot-sep"></span><span>${n.source}</span><span class="dot-sep"></span>
              <a class="nl-src" href="${n.url}" target="_blank" rel="noopener noreferrer">${t.nlSrcLabel}${icon('arrowRight',13)}</a>
            </div>
          </div>
        </div>`; }).join('')}
      </div>
      <p class="nl-note">${t.nlNote}</p>
    </div>
  </div>
</section>
${siteFooter(lang)}`; }

function renderCurrentPage(){
  document.documentElement.lang = currentLang;
  document.title = DOC_TITLE[currentLang] || DOC_TITLE.en;
  app.innerHTML = renderNews(currentLang) + fab(currentLang);
  window.scrollTo(0,0);
}
renderCurrentPage();
</script>
</body>
</html>
