const NEWSLETTER_ITEMS = [
  { cat:`tip`, date:`2026.10.18 시행`, title:`할랄 인증 의무화 D-6, 비할랄 표시·분리진열 전면 적용`,
    desc:`인도네시아 할랄제품보장법에 따른 할랄 인증·표시 의무화가 2024년 10월부터 단계적으로 시행된 가운데, 수입 소비재와 중소기업 제품에 부여됐던 최대 2년의 유예기간이 2026년 10월 18일로 종료됩니다. 이에 따라 10월 18일부터는 식품·음료·건강식품·화장품 등 소비재 전반에 대해 할랄 또는 비할랄 여부를 제품 라벨에 의무적으로 표시해야 하며, 인증을 받지 않은 수입 식음료·건강식품은 'Non-Halal' 표시가 붙어 유통매장에서 별도 구역에 분리 진열됩니다. 할랄 인증 취득에는 통상 3~5개월이 소요되는 것으로 알려져, 아직 인증을 시작하지 않은 제품은 시행일 이전에 인증을 마치기 어려운 상황입니다. 한국 식품의약품안전처는 7월 20~22일 인도네시아 방문 중 할랄제품보장청(BPJPH)과 양자 협의를 갖고, 무슬림 슈퍼바이저를 구하기 어려운 비무슬림국가 인증기관의 애로를 해소하기 위해 BPJPH가 인정하는 교육과 자격을 갖춘 인력도 '할랄 슈퍼바이저'로 일할 수 있도록 하는 데 합의했습니다. 양측은 또한 이미 할랄 인증을 받은 화장품 제조소에 대해서는 신청자가 여럿이더라도 현장실사를 면제하기로 했고, 규정 개정 전이라도 공문을 통해 우선 적용하기로 했습니다. 인도네시아 식약청(BPOM)은 시행일 이전에 통관돼 이미 유통 중인 제품에 대한 유예기간을 늘리는 방향으로 규정을 손질하고 BPJPH와 추가 협의하겠다고 밝혔으나, 아직 확정된 내용은 아닙니다. 식약처는 9월 18일 제5차 할랄 서밋에서 BPJPH와 할랄 제품 인증 협력을 위한 양해각서를 체결하고 정보 공유와 기술협력을 이어가기로 했습니다. 식품·화장품·건강식품을 인도네시아에 수입·유통하는 PT PMA라면 10월 18일 시행을 앞두고 취급 제품의 할랄 인증 상태를 즉시 점검하고, 인증이 준비되지 않은 품목은 비할랄 라벨로 먼저 전환해 통관·유통이 막히지 않도록 대비해야 합니다. 한국 인증기관을 통한 교차인증 활용을 검토하는 기업은 이번에 완화된 슈퍼바이저 요건이 실제 적용되는 시점을 현지 대행사·인증기관과 함께 확인하는 것이 안전합니다.`,
    source:`씨엔씨뉴스(CNC News)`, url:`https://www.cncnews.co.kr/mobile/article.html?no=11130` },
  { cat:`reg`, date:`2026.10.15 마감(3분기)`, title:`LKPM 미보고 시 2단계 자동제재, NIB 취소로 이어져`,
    desc:`온라인단일창구(OSS)는 투자부·BKPM 규정 5/2025호에 근거해 투자활동보고서(LKPM)를 연속 2개 보고 기간 동안 제출하지 않는 사업자에게 단계적이고 자동적인 행정제재를 부과하고 있다고 다시 한번 안내했습니다. 중소형 이상 사업자는 분기마다(2026년 3분기분 마감 10월 15일), 소규모 사업자는 반기마다 보고해야 하는 의무는 그대로이며, 이번 안내는 미보고 시 제재가 실제로 어떻게 단계적으로 진행되는지를 구체적으로 설명하고 있습니다. 규정 제374조와 제375조에 따르면 제재는 1차 경고부터 시작해 사업활동 임시정지, 행정벌금 부과, 그리고 최종적으로 사업허가(Perizinan Berusaha) 취소, 즉 사업자등록번호(NIB) 취소로까지 이어질 수 있습니다. 다만 제재가 자동으로 영구화되는 것은 아니며, 사업자가 임시정지 기간 중 뒤늦게라도 보고 의무를 이행하면 제재가 해제될 수 있다는 점도 함께 안내됐습니다. 구체적으로는 사업활동 임시정지 통지를 받은 뒤 30일 이내에 보고 의무를 이행하지 않거나 소명하지 않으면 사업허가 취소 절차로 넘어가는 구조입니다. 이 제재 체계는 매출이 전혀 없는 설립 초기 PT PMA에도 예외 없이 적용되며, 실현투자액이 0이더라도 '투자실현 0'으로 보고하는 것 자체가 의무라는 점이 실무상 가장 많이 간과되는 부분으로 지적되고 있습니다. 보고를 깜빡해 1차 경고를 받은 PT PMA라면 당장 사업에 지장이 없다고 안심하지 말고, 다음 보고 기한까지 연속해서 누락하지 않도록 관리해야 합니다. 특히 사업확장이나 신규 인허가, 금융기관 대출 심사 등에서 NIB와 LKPM 이력이 함께 조회되는 경우가 많아, 제재 이력 자체가 향후 사업활동에 불리하게 작용할 수 있습니다. 회계·법무 인력이 제한적인 소규모 PT PMA는 이번 3분기 보고를 계기로 현지 대행사에 분기별 LKPM 보고를 위탁해 연속 누락 리스크를 원천적으로 차단하는 방법도 고려할 만합니다.`,
    source:`Prolegal.id`, url:`https://prolegal.id/?p=36978` },
  { cat:`tax`, date:`2026.10.01 시행`, title:`DJP, 코어택스 원천징수 세금코드 8종 신설`,
    desc:`인도네시아 국세청(DJP)은 코어택스(Coretax) 시스템을 통한 PPh·PPN·PPnBM·인지세 신고 절차를 규정한 PER-11/PJ/2025호를 개정하는 PER-12/PJ/2026호를 발표하고 2026년 10월 1일부터 시행에 들어갔습니다. 이번 개정의 핵심은 원천징수세(PPh) 증빙서식에 총 8개의 신규 세금대상코드(KOP)를 추가한 것으로, 일반 근로소득세 증빙서식(BP21)에 1개, 통합원천징수증빙서식(Bupot PPh Unifikasi)에 7개가 새로 생겼습니다. BP21 신규 코드(21-100-39)는 각종 경진대회 참가자에게 지급하는 상금 등 보상금에 대한 원천징수를 다루기 위해 마련됐습니다. Bupot 통합서식에 추가된 7개 코드는 주로 도서 인세(royalti) 지급과 국영기업(BUMN) 및 그 자회사의 구조조정 관련 거래에서 발생하는 원천징수를 세분화해 포착하기 위한 것입니다. 코어택스는 신고·납부·조사·징수를 하나의 시스템으로 통합해 운영하는 만큼, 세금코드 분류가 정교해질수록 납세자가 입력 단계에서 올바른 코드를 선택하는 것이 더욱 중요해집니다. 해외 모회사나 라이선서에 인세(royalty)를 지급하는 PT PMA, 특히 소프트웨어·콘텐츠·브랜드 라이선스 계약을 체결한 기업이라면 이번에 신설된 Bupot 코드가 자사의 원천징수 신고에 적용되는지 회계팀과 함께 점검해야 합니다. 코드를 잘못 선택하거나 구코드를 그대로 사용할 경우 코어택스 상에서 데이터 불일치로 처리되어 국세청의 해명 요청(SP2DK)으로 이어질 수 있습니다. 이번 개정은 세율이나 과세 대상 자체를 바꾸는 것이 아니라 보고 양식을 세분화하는 성격이므로, 당장 세부담이 늘어나는 것은 아니지만 매월 원천징수 신고 업무를 담당하는 실무자는 최신 코드표를 반드시 확인해야 합니다. 외부 회계대행사를 이용하는 PT PMA도 대행사가 신규 코드를 코어택스 입력에 반영하고 있는지 다음 신고 전에 확인해두는 것이 안전합니다. 세부 코드 목록은 국세청 공식 공지와 코어택스 시스템 내 업데이트를 통해 확인할 수 있습니다.`,
    source:`DDTC News`, url:`https://news.ddtc.co.id/berita/infografis/1823039/djp-tambah-8-kode-objek-pajak-baru-dalam-per-12pj2026` },
  { cat:`tax`, date:`2026.10.02 시행`, title:`조세 이의신청 규정 개정, DJP 해외정보교환 권한 확대`,
    desc:`인도네시아 재무부는 2026년 9월 29일 재무부장관규정(PMK) 71/2026호를 제정하고 10월 2일부터 시행에 들어갔습니다. 이 규정은 세금 정정, 이의신청(keberatan), 감면·면제, 취소 절차를 규율하던 기존 PMK 118/2024호를 개정하는 것으로, 과세당국의 이의신청 조사 권한을 한층 강화하는 내용을 담고 있습니다. 가장 눈에 띄는 변화는 국세청(DJP)이 이의신청을 심사하는 과정에서 조세조약이나 정보교환협정을 체결한 상대국의 과세당국과 직접 정보를 교환할 수 있는 권한을 명시적으로 부여한 것으로, PMK 118/2024호 제14조 제2항 h호를 개정하는 방식으로 이뤄졌습니다. 이는 국경을 넘는 거래나 이전가격(transfer pricing) 관련 이의신청에서 국세청이 해외 자료를 직접 확보해 사실관계를 검증할 수 있게 됐다는 의미입니다. 이 외에도 국세청은 이의신청 조사 과정에서 납세자에게 장부·기록·자료의 제출을 요구하거나, 제3자에게 진술과 증빙을 요청하거나, 납세자를 직접 소환해 설명을 요구할 수 있는 권한도 함께 명시됐습니다. 토지건물세(PBB-P5L) 관련해서는, 부과가 잘못됐다며 감면이나 취소를 신청하려면 원칙적으로 이의신청을 제기하지 않았거나 제기했더라도 심사 대상에서 제외된 경우에만 가능하도록 절차가 정비됐습니다. 정부는 이번 개정의 목적이 과세의 공정성과 법적 확실성을 높이고 납세자의 편의를 개선하는 데 있다고 설명했습니다. 모회사나 계열사와의 거래에 대해 이전가격 문서화 의무를 지고 있는 PT PMA, 특히 과거에 이의신청을 제기했거나 향후 제기할 가능성이 있는 기업은 국세청이 해외 자료를 요청할 수 있다는 점을 염두에 두고 관계사 거래 자료를 평소에 정리해 두는 것이 안전합니다. 세무 분쟁이 있는 PT PMA는 현지 세무대리인과 함께 개정된 절차를 사전에 숙지해두는 것이 바람직합니다.`,
    source:`Pajakku`, url:`https://pajakku.com/artikel/poin-perubahan-keberatan-dan-sanksi-pajak-dalam-pmk-712026` },
  { cat:`econ`, date:`2026.10.14-18`, title:`제41회 무역박람회 TEI 2026, 반텐서 개막`,
    desc:`인도네시아 상공부는 10월 14일부터 18일까지 반텐주 땅으랑 ICE BSD시티에서 제41회 무역박람회(Trade Expo Indonesia, TEI) 2026을 개최합니다. 이번 행사의 주제는 'The Ultimate Hub for Global Sourcing'으로, 상공부는 전년도 실적(목표 165억 달러 대비 실제 228억3000만 달러 거래)을 넘어서는 175억 달러 규모의 거래 성사를 목표로 제시했습니다. 부디 산토소 상공부장관은 2월 26일 사전 설명회에서 이 목표치를 공식 발표했으며, 전년보다 약 6% 높은 수준이라고 밝혔습니다. 상공부는 행사 전 바이어-판매자 매칭(business matching), 행사 기간 중 거래 확정, 행사 이후 계약 이행 모니터링까지 3단계 전략을 운영하며, 해외 주재 인도네시아 무역관들이 사전에 바이어와의 미팅을 주선하는 방식으로 지원하고 있습니다. 10월 초 배포된 자료에 따르면 113개국의 바이어가 참가 등록을 마쳤고, 중소기업을 포함한 1,533개의 인도네시아 기업이 전시 참가업체로 등록했습니다. TEI는 기본적으로 수출 진흥을 위한 무역 박람회이지만, 인도네시아 현지에서 조달·유통망을 구축하려는 PT PMA에게는 현지 공급업체 발굴과 바이어 네트워크 구축의 기회로 활용할 수 있는 행사입니다. 특히 소비재·식품·생활용품을 취급하는 PT PMA라면 이번 행사를 통해 신뢰할 수 있는 현지 협력사나 유통 파트너를 탐색해볼 수 있습니다. 참가 등록이나 바이어 매칭 지원은 인도네시아 상공부 및 각국 주재 인도네시아 무역관을 통해 신청할 수 있습니다. 행사 기간이 이번 주와 겹치는 만큼, 자카르타 인근에 사업장을 둔 PT PMA는 교통 혼잡 등 간접적인 영향도 함께 고려할 필요가 있습니다.`,
    source:`Investortrust.id`, url:`https://investortrust.id/business/95594/trade-expo-indonesia-2026-siap-digelar-transaksi-ditargetkan-capai-rp-293-triliun` },
  { cat:`tip`, date:`2026.11.01 UMP 발표`, title:`2027년 최저임금 공식 재확인, 알파지수 0.5~0.9`,
    desc:`인도네시아 노동부는 10월 6일, 2027년 최저임금(UMP·UMK) 산정에 아직 심의 중인 노동자보호법 전면개정안이 아니라 기존 정부규정(PP) 49/2025호가 그대로 적용된다고 공식 확인했습니다. 노동부 산업관계·사회보장국장 인다 앙고로 뿌뜨리는 이번 산정에 적용되는 공식이 경제성장률에 알파(α) 지수를 곱한 뒤 물가상승률을 더하는 방식이며, 알파 지수는 0.5에서 0.9 사이에서 지방정부가 지역 여건에 맞게 결정한다고 설명했습니다. 이는 2025년 말 발표된 임금 인상 공식의 틀을 그대로 유지하는 것으로, 노동자보호법 개정이 늦어지는 상황에서도 임금 발표 일정 자체는 차질 없이 진행된다는 의미입니다. 노동조합총연맹(KSPI)과 노동자당은 9월 18일, 가장 높은 알파 지수인 0.9를 적용해 전국 평균 7.5~9.5% 인상을 요구하는 안을 정부에 제출한 바 있으나, 이는 노동계의 희망안일 뿐 확정된 수치는 아니라는 점이 이번에 다시 한번 확인됐습니다. 경영자단체 아판도(APINDO)는 지역별 알파 지수 격차가 지나치게 벌어지면 투자와 노동력이 특정 지역으로 쏠리는 시장 왜곡이 생길 수 있다고 우려하며, 전국적인 격차 완화 방안도 함께 검토돼야 한다는 입장을 밝혔습니다. 발표 일정은 기존과 동일하게 주 단위 최저임금(UMP)은 11월 1일, 시·군 및 업종별 최저임금(UMK)은 11월 10일로 예정돼 있습니다. 노동부는 적정생계비(KHL) 산정을 위한 통계청의 사회경제조사(Susenas) 자료 중 군·시 단위 데이터를 올해 안에 마무리하는 것을 목표로 하고 있다고 덧붙였습니다. 인건비 비중이 높은 카페·요식업·제조업 PT PMA는 알파 지수가 지방정부별로 다르게 적용될 수 있다는 점을 감안해, 사업장이 위치한 주·시의 알파 지수 발표를 11월 1일과 10일 전후로 반드시 확인하고 복수의 인상률 시나리오로 내년도 인건비 예산을 준비해야 합니다.`,
    source:`Katadata`, url:`https://katadata.co.id/berita/nasional/6ac4aed0a235f/kemenaker-upah-minimum-2027-masih-mengacu-pp-bukan-uu-ketenagakerjaan-terbaru` },
  { cat:`econ`, date:`2026.10.20-21 회의 예정`, title:`BI, 9월까지 기준금리 3연속 동결…차기 회의 예고`,
    desc:`인도네시아 중앙은행(BI)은 9월 22~23일 열린 통화정책회의(RDG)에서 기준금리(BI-Rate)를 5.75%로 유지하기로 결정했습니다. 이는 7월, 8월 18~19일에 이은 세 번째 연속 동결로, 디스티 다마야티 BI 부총재는 대외 압력이 여전히 강한 상황이라는 점을 동결 배경으로 설명했습니다. 예금시설금리(Deposit Facility)는 4.75%, 대출시설금리(Lending Facility)는 6.50%로 함께 유지됐습니다. BI는 올해 들어 누적 100bp의 금리 인상을 단행한 뒤 7월부터 긴축 기조를 일시 중단한 상태이며, 6월 마지막 인상(25bp, 5.50%→5.75%) 이후로는 추가 인상 없이 금리를 묶어두고 있습니다. BI는 루피아 환율 안정을 최우선 과제로 삼고 있으며, 중동 지역 분쟁에 따른 글로벌 불확실성과 미국의 높은 국채금리가 신흥국 통화 전반에 가하는 압력을 동결 결정의 핵심 배경으로 꼽았습니다. BI는 다음 통화정책회의를 10월 20~21일로 예정하고 있으며, 시장은 추가 동결 또는 소폭 조정 가능성을 주시하고 있습니다. 달러화 대출을 보유했거나 수입 원부자재 대금을 달러로 결제하는 PT PMA는 10월 20~21일 회의 결과에 따라 환율과 조달금리 환경이 달라질 수 있는 만큼 이 일정을 미리 확인해두는 것이 바람직합니다. 루피아 표시 대출을 검토 중인 PT PMA라면 기준금리가 5%대 중후반에서 유지되고 있는 현재 상황이 당분간 이어질 가능성이 높다는 점도 자금 조달 계획에 참고할 수 있습니다. 금리 환경 변화는 소비자 대출과 모기지 수요에도 영향을 미치는 만큼, 내수 소비 비중이 높은 카페·서비스업 PT PMA도 간접적인 영향권에 있다고 볼 수 있습니다.`,
    source:`idnfinancials`, url:`https://www.idnfinancials.com/news/69301/bi-holds-rate-at-5-75-for-third-time-to-support-rupiah` },
  { cat:`kr`, date:`2026년 4분기 가동 목표`, title:`SK플라즈마 인니 혈액제 공장, 4분기 가동 목표 임박`,
    desc:`SK플라즈마가 인도네시아 서자바 카라왕 산업단지에 건설 중인 혈장분획센터가 2026년 4분기 가동을 목표로 마무리 단계에 들어간 것으로 전해졌습니다. 이 프로젝트는 2025년 11월 SK플라즈마가 인도네시아 국부펀드 다난타라(Danantara)와 혈액제제 생산 인프라 투자를 위한 업무협약(MOU)을 체결하면서 본격화됐으며, 완공 시 연간 60만 리터 규모의 혈장을 처리해 알부민·면역글로불린 등 혈액제제를 생산할 수 있는 시설이 됩니다. 이 프로젝트는 2026년 5월 국제 프로젝트 파이낸스 전문매체가 수여하는 'IJGlobal 어워드 2025' 사회인프라 부문을 수상했으며, 국내 제약사가 이 상을 받은 것은 이번이 처음이라고 보도됐습니다. SK플라즈마는 공장이 완공되기 전까지는 인도네시아산 혈장을 안동 공장으로 들여와 위탁생산(CMO) 방식으로 처리한 뒤 다시 인도네시아에 공급하는 임시 체제를 운영하며 공급 공백을 최소화하고 있습니다. 이 사업은 2023년 3월 한-인니 수교 50주년을 기념해 양국 보건당국이 참석한 가운데 공동선언서를 발표하며 시작됐고, 이후 완공 목표 시점이 2025년 중반에서 2026년 4분기로 조정된 바 있습니다. 인도네시아 국부펀드가 직접 지분투자 형태로 참여하는 보건·바이오 분야 협력은, 현지 정부와의 관계 구축이 중요한 산업에서 한국 기업이 활용할 수 있는 협력 모델 사례로 평가됩니다. 의약품·바이오 분야에서 인도네시아 진출을 검토하는 PT PMA라면, 이번 프로젝트에서 나타난 현지 국부펀드와의 합작투자 구조, 그리고 완공 전 임시 공급망 운영 방식을 참고할 만합니다. 다만 공장의 실제 가동 개시 여부와 정확한 일정은 아직 공식적으로 확정되지 않았으므로, 확정 발표가 나오는 대로 추가 확인이 필요합니다.`,
    source:`헤럴드경제(Heraldk)`, url:`https://www.heraldk.com/article/2026050718221659509` },
  { cat:`kr`, date:`2026.07.30 공시`, title:`포스코, 2028년까지 29조원 투자…인니 철강 확대 핵심축`,
    desc:`포스코홀딩스는 7월 30일 공개한 '기업가치 제고 계획'을 통해 국내 철강사업의 본원 경쟁력을 강화하는 동시에 미국·인도와 함께 인도네시아를 핵심 해외 성장 투자처로 삼겠다고 공시했습니다. 포스코그룹은 2026년부터 2028년까지 총 29조1000억원을 투자할 계획이며, 세부 항목 중 가장 큰 6조7000억원을 해외 철강사업에 배정했습니다. 그룹은 현재 약 500만톤 수준인 해외 조강능력을 2031년까지 1000만톤으로 두 배로 늘리는 중장기 목표를 제시했습니다. 인도네시아에서는 현지 국영 철강사 크라카타우스틸과 합작해 운영 중인 크라카타우포스코의 생산능력을 확대하고, 쇳물 생산부터 자동차강판까지 일괄 생산하는 동남아시아 최초의 통합 생산체제를 구축한다는 구상이 제시됐습니다. 이는 2022년 7월 인도네시아 정부·크라카타우스틸과 체결한 35억 달러 규모의 공동투자 양해각서(제2고로·냉연공장 신설)의 연장선에 있는 계획으로 풀이됩니다. 포스코는 이를 통해 고성장·고수익이 기대되는 해외 사업 비중을 늘려 국내 철강 수요 둔화에 대응하겠다는 전략을 밝혔습니다. 자동차강판 생산까지 포함하는 통합 생산체제가 구축되면, 인도네시아에 진출한 완성차·부품 PT PMA의 현지 조달 선택지가 넓어질 수 있습니다. 특히 완성차 업체의 현지 생산 확대와 맞물려, 국산화율(TKDN) 요건을 충족해야 하는 자동차 관련 PT PMA라면 크라카타우포스코의 증설 일정과 생산 품목을 지속적으로 주시할 필요가 있습니다. 다만 이번 계획은 중장기 공시 단계로, 실제 착공이나 증설 일정은 아직 구체적으로 확정되지 않았습니다.`,
    source:`이데일리(비즈360)`, url:`https://v.daum.net/v/20260802070216187` },
  { cat:`reg`, date:`2026년 적용 중`, title:`정부, 2026년에도 조세홀리데이 인센티브 유지 방침`,
    desc:`인도네시아 정부는 2026년에도 선도산업에 대한 법인세 면제 혜택인 조세홀리데이(Tax Holiday) 인센티브를 계속 운용하겠다는 방침을 재확인했습니다. 아이르랑가 하르타르토 경제조정장관은 외국인 투자 유치를 위해 조세홀리데이, 조세감면(Tax Allowance), 투자감면(Investment Allowance), 특별세액공제(Super Tax Deduction) 등 기존 재정 인센티브 체계를 2026년에도 계속 제공한다고 밝혔습니다. 다만 정부는 OECD가 주도하는 15% 글로벌 최저한세(Global Minimum Tax) 도입에 따라 조세홀리데이의 매력이 크게 줄어들 수 있다는 점을 동시에 경고했습니다. 조세홀리데이는 현재 실효세율을 0%까지 낮출 수 있는 구조인데, 글로벌 최저한세가 적용되는 다국적기업 계열사라면 인도네시아에서 받은 감면분만큼 본국이나 다른 관할권에서 추가로 과세될 수 있어 실질적인 혜택이 상쇄될 수 있습니다. 조세홀리데이가 법인세 22% 전액 면제가 아니라 최소 15%는 납부하도록 하는 방향으로 손질되고, 줄어드는 혜택분을 대체할 새로운 형태의 인센티브를 마련 중이라는 보도도 나왔으나 이는 아직 초안 단계로 확정된 내용은 아닙니다. 스리 물야니 재무장관은 다수의 투자자들이 조세홀리데이를 요청하고 있다며, 재정당국이 세수 손실을 일정 부분 감내하면서도 투자 유치 효과를 함께 고려하고 있다고 설명했습니다. 조세감면·수입관세 면제·특별세액공제 등 조세홀리데이 외의 인센티브는 글로벌 최저한세의 영향을 비교적 적게 받을 것으로 정부는 평가하고 있습니다. 대규모 선도산업 투자를 계획 중인 PT PMA, 특히 모회사가 다국적기업으로서 글로벌 최저한세 적용 대상인 경우라면 조세홀리데이를 신청하기 전에 본사 세무팀과 함께 실질적인 세부담 절감 효과를 재계산해볼 필요가 있습니다. 인센티브 체계가 유동적인 만큼, 신규 투자 인허가를 신청하는 PT PMA는 BKPM과 재무부의 최신 공고를 통해 적용 가능한 인센티브 종류와 조건을 확인하는 것이 바람직합니다.`,
    source:`DDTC News`, url:`https://news.ddtc.co.id/berita/nasional/1815597/gaet-investor-airlangga-masih-ada-insentif-tax-holiday-pada-2026` },

function renderNews(lang){ const t = T[lang].news; return `
${siteHeader('news', lang)}
${pageHero('news','gold', lang, t.pageEyebrow, t.pageTitle, t.pageDesc)}
<section class="section">
  <div class="wrap">
    <div class="grid-3">
      <div class="news-card">
        <div class="news-ph">${ph(t.c1ph,'coffee')}</div>
        <div class="news-body"><span class="date">${t.c1date}</span><h4>${t.c1title}</h4><p>${t.c1desc}</p></div>
      </div>
      <div class="news-card">
        <div class="news-ph">${ph(t.c2ph,'green')}</div>
        <div class="news-body"><span class="date">${t.c2date}</span><h4>${t.c2title}</h4><p>${t.c2desc}</p></div>
      </div>
      <div class="news-card">
        <div class="news-ph">${ph(t.c3ph,'navy')}</div>
        <div class="news-body"><span class="date">${t.c3date}</span><h4>${t.c3title}</h4><p>${t.c3desc}</p></div>
      </div>
    </div>
    <div class="nl-panel">
      <div class="nl-head">
        <div>
          ${eyebrow(t.nlEyebrow)}
          <h3>${t.nlTitle}</h3>
          <p>${t.nlDesc}</p>
        </div>
        <span class="nl-period">${NEWSLETTER_PERIOD}</span>
      </div>
      <div class="nl-list">
        ${NEWSLETTER_ITEMS.map((n,i)=>{ const c = NL_CATS[n.cat]; return `
        <div class="nl-item">
          <div class="nl-rank">${i+1}</div>
          <div class="nl-body">
            <div class="nl-top"><span class="badge-pill ${c.theme}"><span class="dot"></span>${c.label}</span></div>
            <h4>${n.title}</h4>
            <p>${n.desc}</p>
            <div class="nl-meta">
              <span>${n.date}</span><span class="dot-sep"></span><span>${n.source}</span><span class="dot-sep"></span>
              <a class="nl-src" href="${n.url}" target="_blank" rel="noopener noreferrer">${t.nlSrcLabel}${icon('arrowRight',13)}</a>
            </div>
          </div>
        </div>`; }).join('')}
      </div>
      <p class="nl-note">${t.nlNote}</p>
    </div>
  </div>
</section>
${siteFooter(lang)}`; }

function renderCurrentPage(){
  document.documentElement.lang = currentLang;
  document.title = DOC_TITLE[currentLang] || DOC_TITLE.en;
  app.innerHTML = renderNews(currentLang) + fab(currentLang);
  window.scrollTo(0,0);
}
renderCurrentPage();
</script>
