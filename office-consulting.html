<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>창업 컨설팅 | 2F 오피스 | BizHub Mir</title>
<meta name="description" content="인도네시아 진출 초기 겪는 법인 설립·행정 절차의 어려움을 현지 신뢰 네트워크로 해결합니다.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/core.css">
</head>
<body>
<div id="app"></div>
<script src="assets/core.js"></script>
<script>
const DOC_TITLE = { ko:`창업 컨설팅 | 2F 오피스 | BizHub Mir`, en:`Startup Consulting | 2F Office | BizHub Mir` };

T.ko.officeConsulting = {
  pageEyebrow:`2F 오피스 · 창업 컨설팅`, pageTitle:`낯선 제도, 혼자 부딪히지 않아도 됩니다`, pageDesc:`인도네시아 진출 초기 겪는 법인 설립·행정 절차의 어려움을 현지 신뢰 네트워크로 해결합니다.`,
  servicesEyebrow:`Foreign Services`, servicesTitle:`외국인 창업자 전용 서비스`,
  s1t:`법인설립 서비스`, s1d:`법인설립을 위한 복잡한 절차를 현지 최신 규정에 맞게 설명해 드리고, 각 단계별로 필요한 서비스를 믿을 수 있는 곳으로 연결해 드립니다.`,
  s2t:`OSS · Coretax 신고 서비스`, s2d:`OSS 시스템 인허가 신청부터 Coretax 세무 신고까지, 정기 신고·행정 절차를 정확한 일정에 맞춰 지원합니다.`,
  s3t:`법무, 노무, 노타리 연계`, s3d:`검증된 현지 법무법인·노무사·Notary와 연계해 설립부터 운영까지 안전하게 지원합니다.`,
  benefitTitle:`입주사 전용 혜택`, benefitDesc:`2F 오피스 입주사는 1F 카페 10% 할인, 3F 골프피팅 할인 등 통합 멤버십 혜택을 받습니다.`, benefitLink:`멤버십 자세히 보기 →`,
  consultEyebrow:`Consultation`, consultTitle:`창업 상담 신청`,
  formCompany:`회사명 / 예정 회사명`, formCompanyPh:`예: PT. Sample Indonesia`,
  formStage:`설립 단계`, stage1:`검토 중`, stage2:`설립 진행중`, stage3:`설립 완료`,
  formServices:`필요 서비스`, svc1:`법인설립 서비스`, svc2:`OSS/Coretax 신고 서비스`, svc3:`법무·노무·노타리 연계`,
  formContact:`연락처`, formContactPh:`WhatsApp 번호 또는 이메일`,
  formSubmit:`창업 상담 신청하기`,
  sideText:`인니 문화·제도에 대한 지식과 경험이 부족해도 괜찮습니다. BizHub Mir는 인프라가 갖춰진 공간에서 준비된 파트너와 함께 시작할 수 있도록 돕습니다.`,
  sideBtn:`WhatsApp으로 바로 문의`,
};
T.en.officeConsulting = {
  pageEyebrow:`2F Office · Startup Consulting`, pageTitle:`You don't have to navigate unfamiliar regulations alone`, pageDesc:`We solve the company-registration and administrative hurdles of entering Indonesia through a trusted local network.`,
  servicesEyebrow:`Foreign Services`, servicesTitle:`Services for Foreign Founders`,
  s1t:`Incorporation Service`, s1d:`We walk you through the complex incorporation process according to the latest local regulations, and connect you with trusted providers for whatever each step requires.`,
  s2t:`OSS · Coretax Filing Service`, s2d:`From OSS licensing applications to Coretax tax filings, we keep every periodic submission on schedule.`,
  s3t:`Legal, HR & Notary Referral`, s3d:`Connects you with vetted local law firms, HR/labor consultants, and Notaries for safe setup and ongoing operations.`,
  benefitTitle:`Tenant-Only Benefits`, benefitDesc:`2F office tenants get 10% off at 1F Café, discounts on 3F Golf Fitting, and more through the integrated membership.`, benefitLink:`See membership details →`,
  consultEyebrow:`Consultation`, consultTitle:`Request a Startup Consultation`,
  formCompany:`Company Name / Planned Name`, formCompanyPh:`e.g. PT. Sample Indonesia`,
  formStage:`Registration Stage`, stage1:`Considering`, stage2:`In Progress`, stage3:`Registered`,
  formServices:`Services Needed`, svc1:`Incorporation Service`, svc2:`OSS/Coretax Filing`, svc3:`Legal/HR/Notary Referral`,
  formContact:`Contact`, formContactPh:`WhatsApp number or email`,
  formSubmit:`Request Consultation`,
  sideText:`It's okay if you're new to Indonesian culture and regulations. BizHub Mir helps you get started with a ready-made space and a prepared partner.`,
  sideBtn:`Message us on WhatsApp`,
};

function renderOfficeConsulting(lang){ const t = T[lang].officeConsulting; return `
${siteHeader('office-consulting', lang)}
${pageHero('office-consulting','', lang, t.pageEyebrow, t.pageTitle, t.pageDesc)}
<section class="section">
  <div class="wrap">
    ${eyebrow(t.servicesEyebrow)}
    <h2 class="sec-h2">${t.servicesTitle}</h2>
    <div class="grid-3" style="margin-top:22px;">
      <div class="card icon-top card-clickable" onclick="navigate('consulting-pt')"><div class="ic">${icon('building',24)}</div><h4>${t.s1t}</h4><p>${t.s1d}</p></div>
      <div class="card icon-top card-clickable" onclick="navigate('consulting-report')"><div class="ic">${icon('clock',24)}</div><h4>${t.s2t}</h4><p>${t.s2d}</p></div>
      <div class="card icon-top"><div class="ic">${icon('shield',24)}</div><h4>${t.s3t}</h4><p>${t.s3d}</p></div>
    </div>
  </div>
</section>
<section class="section">
  <div class="wrap">
    <div class="diff-banner">
      <div class="ic">${icon('gift',30)}</div>
      <div><h4>${t.benefitTitle}</h4><p>${t.benefitDesc} <a onclick="navigate('membership')" style="color:var(--gold-soft); font-weight:700; text-decoration:underline; cursor:pointer;">${t.benefitLink}</a></p></div>
    </div>
  </div>
</section>
<section class="section">
  <div class="wrap">
    ${eyebrow(t.consultEyebrow)}
    <h2 class="sec-h2">${t.consultTitle}</h2>
    <div class="grid-2" style="margin-top:22px;">
      <div class="form-mock">
        <div class="f-row"><label>${t.formCompany}</label><div class="f-fake">${t.formCompanyPh}</div></div>
        <div class="f-row"><label>${t.formStage}</label><div class="f-chips"><span class="f-chip sel">${t.stage1}</span><span class="f-chip">${t.stage2}</span><span class="f-chip">${t.stage3}</span></div></div>
        <div class="f-row"><label>${t.formServices}</label><div class="f-chips"><span class="f-chip sel">${t.svc1}</span><span class="f-chip">${t.svc2}</span><span class="f-chip">${t.svc3}</span></div></div>
        <div class="f-row"><label>${t.formContact}</label><div class="f-fake">${t.formContactPh}</div></div>
        <button class="btn btn-navy btn-block">${t.formSubmit}</button>
      </div>
      <div>
        <p style="font-size:13.6px; color:var(--ink-soft); line-height:1.8;">${t.sideText}</p>
        <a class="btn btn-line" onclick="navigate('contact')">${icon('chat',16)} ${t.sideBtn}</a>
      </div>
    </div>
  </div>
</section>
${siteFooter(lang)}`; }

function renderCurrentPage(){
  document.documentElement.lang = currentLang;
  document.title = DOC_TITLE[currentLang] || DOC_TITLE.en;
  app.innerHTML = renderOfficeConsulting(currentLang) + fab(currentLang);
  window.scrollTo(0,0);
}
renderCurrentPage();
</script>
</body>
</html>
